<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Issue SpotBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --bg:#FDF5F6; --panel:#FFFFFF; --ink:#1C0A0E; --muted:#8A676D; --rule:#F0D5DA; --accent:#A01F3E; --accent-soft:#FCEAED; --user:#A01F3E; --user-ink:#FFFFFF; --err:#C0392B;
  --radius-card:22px; --radius-btn:12px;
  --f-ui:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1A0508; --panel:#26090F; --ink:#F5E8EA; --muted:#B08890; --rule:#3D1520; --accent:#E07090; --accent-soft:#3D1520; --user:#E07090; --user-ink:#1A0508; --err:#FF8A93; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui)}
.app{display:flex;flex-direction:column;height:100%}
header.bar{position:relative;z-index:20;flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:2px solid var(--accent);background:var(--panel);box-shadow:0 2px 12px color-mix(in srgb,var(--accent) 12%,transparent)}
.brand{font-weight:800;font-stretch:85%;font-size:20px;line-height:1;margin:0 auto 0 0;white-space:nowrap;color:var(--accent)}
.brand small{display:block;font:600 10px var(--f-ui);font-stretch:100%;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.barbtn{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--f-ui);color:var(--ink);background:var(--bg);border:1.5px solid var(--rule);border-radius:999px;padding:8px 13px;cursor:pointer;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis;min-height:38px}
.barbtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.barbtn .chev{font-size:10px;opacity:.7}
.barbtn.icon{padding:8px 11px}
.barbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#thinkLabel{overflow:hidden;text-overflow:ellipsis}
.pop{position:absolute;top:100%;right:12px;margin-top:6px;width:min(340px,calc(100vw - 24px));max-height:min(70vh,560px);overflow-y:auto;background:var(--panel);border:1px solid var(--rule);border-top:2px solid var(--accent);border-radius:14px;box-shadow:0 12px 36px rgba(80,5,20,.14);padding:12px 14px}
.lab{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.linkbtn{background:none;border:0;color:var(--accent);font:600 12px var(--f-ui);cursor:pointer;padding:2px 4px}
.thinkers{list-style:none;padding:0;margin:8px 0 0}
.thinkers li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--rule)}
.thinkers input{margin-top:3px;accent-color:var(--accent);width:17px;height:17px;flex:none}
.thinkers label{cursor:pointer;display:flex;flex-direction:column;flex:1}
.thinkers .n{font-weight:600}
.thinkers .d{font-size:12px;color:var(--muted)}
.settings{display:flex;flex-direction:column;gap:8px}
.settings input,.settings select{font:14px var(--f-ui);padding:7px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.note{font-size:12px;color:var(--muted);margin:0}
.keystate{font-size:12px;color:var(--accent)}
main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.thread{flex:1;overflow-y:auto;padding:22px 16px 12px}
.inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.empty h2{font:800 28px/1.15 var(--f-ui);font-stretch:85%;margin:0 0 8px;text-wrap:balance;color:var(--accent)}
.empty p{color:var(--muted);margin:0 0 18px;max-width:58ch;font-size:15px}
.starters{display:flex;flex-direction:column;gap:9px}
.starters button{text-align:left;font:15px/1.45 var(--f-read);background:var(--panel);color:var(--ink);border:1.5px solid var(--rule);border-radius:14px;padding:12px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.starters button:hover{border-color:var(--accent);box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 14%,transparent)}
.msg.user{align-self:flex-end;max-width:85%;background:var(--user);color:var(--user-ink);padding:11px 16px;border-radius:18px 18px 4px 18px;font:15px/1.5 var(--f-read);white-space:pre-wrap;box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 22%,transparent)}
.msg.user .who{display:block;font:600 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;opacity:.65;margin-bottom:2px}
.msg.bot{padding:2px 0;font:16.5px/1.65 var(--f-read)}
.msg.bot h2{font:800 20px/1.2 var(--f-ui);font-stretch:85%;margin:22px 0 6px;padding-top:16px;border-top:1px solid var(--rule)}
.msg.bot h2:first-child{margin-top:0;padding-top:0;border-top:0}
.msg.bot h3{font:700 12px var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:14px 0 4px}
.msg.bot p{margin:0 0 10px;max-width:68ch}
.msg.bot ul{margin:0 0 10px;padding-left:20px;max-width:66ch}
.msg.bot li{margin-bottom:4px}
.msg.bot strong{font-weight:600;background:var(--accent-soft);padding:0 3px;border-radius:3px}
.msg.bot blockquote{margin:6px 0 12px;padding:4px 0 4px 12px;border-left:3px solid var(--rule);color:var(--muted);font-style:italic}
.msg.bot .tools{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.status{font:13px var(--f-ui);color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:p 1s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.err{color:var(--err);font:14px var(--f-ui)}
/* thinker matrix */
.mx-head{font:600 12px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.mx-head b{color:var(--ink);text-transform:none;letter-spacing:0;font:600 15px var(--f-read)}
.matrix{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-auto-flow:dense;gap:10px}
@media (max-width:520px){.matrix{grid-template-columns:1fr 1fr;gap:8px}}
.bub{--fg:var(--c);--soft:color-mix(in srgb,var(--c) 10%,var(--panel));position:relative;text-align:left;font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:22px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0;transition:transform .18s cubic-bezier(.25,1,.5,1),border-color .18s,box-shadow .18s}
@media (prefers-color-scheme: dark){.bub{--fg:color-mix(in srgb,var(--c) 55%,white);--soft:color-mix(in srgb,var(--c) 20%,var(--panel))}}
.bub:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:0 4px 16px color-mix(in srgb,var(--c) 20%,transparent)}
.bub .nm{font:700 15px var(--f-ui);color:var(--fg);padding-right:24px}
.bub .hl{font:14px/1.4 var(--f-read);color:var(--ink)}
.bub .sub{font:600 11.5px/1.3 var(--f-ui);color:var(--muted);margin-top:-2px}
.info{border:0;background:none;color:inherit;font:600 14px var(--f-ui);cursor:pointer;padding:0 4px;margin-left:2px;opacity:.7;vertical-align:0}
.info:hover{opacity:1}
.term{border:0;font:inherit;color:inherit;cursor:pointer;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);padding:0 2px;margin:0;line-height:inherit;border-radius:3px;text-decoration:underline dotted 1px;text-underline-offset:3px}
.term:hover{background:color-mix(in srgb,var(--c,var(--accent)) 28%,transparent)}
.tip{position:fixed;z-index:70;width:max-content;max-width:min(380px,calc(100vw - 24px));background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-top:3px solid var(--tc,var(--accent));border-radius:12px;box-shadow:0 12px 32px rgba(10,15,30,.22);padding:11px 14px 12px;font:14.5px/1.55 var(--f-read)}
.tip h5{font:700 11.5px var(--f-ui);letter-spacing:.07em;text-transform:uppercase;margin:0 0 4px;color:var(--tc,var(--accent))}
.tip p{margin:0}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,15,30,.5);overflow-y:auto;padding:20px 12px 40px}
.paper{max-width:780px;margin:0 auto;background:var(--panel);border-radius:14px;padding:22px 24px 30px;box-shadow:0 20px 50px rgba(10,15,30,.3)}
.paper .top{display:flex;align-items:center;gap:8px;position:sticky;top:-20px;background:var(--panel);padding:8px 0 10px;z-index:1}
.paper .top h2{font:800 26px/1.1 var(--f-ui);font-stretch:80%;margin:0 auto 0 0}
.paper .top h2 small{display:block;font:600 10.5px var(--f-ui);font-stretch:100%;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.toc button{font:600 12px var(--f-ui);border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.gcard{--fg:var(--c);border-top:1px solid var(--rule);padding:20px 0 6px;scroll-margin-top:60px}
@media (prefers-color-scheme: dark){.gcard{--fg:color-mix(in srgb,var(--c) 50%,white)}}
.gcard h3{font:800 23px/1.15 var(--f-ui);font-stretch:85%;color:var(--fg);margin:0}
.gcard .src{font:italic 14px var(--f-read);color:var(--muted);margin:2px 0 0}
.gcard .sb{font:700 11.5px var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink);margin:8px 0 8px}
.gcard .core{font:16px/1.65 var(--f-read);margin:0 0 12px;max-width:68ch}
.gcard h4{font:700 11.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);margin:0 0 6px}
.voc{margin:0;display:grid;gap:7px}
.voc div{font:15px/1.5 var(--f-read);padding-left:10px;border-left:3px solid color-mix(in srgb,var(--c) 40%,transparent)}
.voc b{font-family:var(--f-ui);font-weight:700}
.thinkers .rd{flex:none;align-self:center}
.gopen{margin-top:10px;border-top:1px solid var(--rule);padding-top:8px}
@media print{
  html,body{height:auto;background:#fff}
  .app,.tip{display:none!important}
  .sheet{position:static;background:none;padding:0;overflow:visible}
  .paper{box-shadow:none;padding:0;max-width:none;border-radius:0}
  .paper .top{position:static}.no-print{display:none!important}
  .gcard{break-inside:auto}.voc div{break-inside:avoid}
  .gcard+.gcard{break-before:page}
}
.bub .more{font:600 11px var(--f-ui);color:var(--muted);letter-spacing:.04em;margin-top:2px}
.bub.open{grid-column:1/-1;order:99;cursor:default;padding:18px 22px;border-color:var(--c);border-width:2px;transform:none;box-shadow:0 6px 24px color-mix(in srgb,var(--c) 18%,transparent);animation:grow .28s cubic-bezier(.25,1,.5,1)}
@keyframes grow{from{opacity:.4;transform:scale(.98)}to{opacity:1;transform:none}}
.bub.open .hl{font-size:16px;font-weight:600;margin-bottom:6px}
.bub .close{position:absolute;top:10px;right:12px;border:0;background:none;color:var(--muted);font:20px var(--f-ui);cursor:pointer;padding:2px 6px}
.det{display:flex;flex-direction:column;gap:2px;font:16px/1.62 var(--f-read)}
.det h4{font:700 11.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);margin:12px 0 2px}
.det p{margin:0;max-width:68ch}
.det ol{margin:2px 0 0;padding-left:20px;max-width:66ch}.det li{margin-bottom:4px}
.det strong,.shared strong{font-weight:600;background:color-mix(in srgb,var(--c) 16%,transparent);padding:0 2px;border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font:600 13px var(--f-ui);border:1.5px solid color-mix(in srgb,var(--c2) 55%,transparent);background:color-mix(in srgb,var(--c2) 10%,var(--panel));color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .ty{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--c2);background:color-mix(in srgb,var(--c2) 22%,var(--panel))}
.slot:empty{display:none}
.shared{position:relative;margin-top:12px;border-radius:22px;padding:2px;background:linear-gradient(120deg,var(--c),var(--c2))}
.shared .in{background:var(--panel);border-radius:20px;padding:14px 18px;font:16px/1.6 var(--f-read)}
.shared .ttl{font:700 13px var(--f-ui);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.shared .ttl .a{color:var(--fgA)}.shared .ttl .b{color:var(--fgB)}
.shared .ttl .ty{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:4px}
.shared .ttl2{font:600 15px var(--f-read);margin:0 0 4px}
.shared.merged{animation:merge .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes merge{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.flyer{position:fixed;z-index:50;pointer-events:none;margin:0;box-shadow:0 10px 30px rgba(10,15,30,.25)}
@media (prefers-reduced-motion:reduce){.bub.open,.shared.merged{animation:none}}
.composer{border-top:1px solid var(--rule);background:var(--panel);padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px color-mix(in srgb,var(--accent) 6%,transparent)}
.composer .inner{flex-direction:row;gap:10px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;font:16px/1.45 var(--f-read);padding:11px 14px;border:1.5px solid var(--rule);border-radius:14px;background:var(--bg);color:var(--ink);max-height:200px;transition:border-color .15s}
textarea:focus{border-color:var(--accent);outline:none}
.btn{font:700 14px var(--f-ui);border:none;background:var(--accent);color:#fff;padding:11px 18px;border-radius:12px;cursor:pointer;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rule);font-weight:600;font-size:12px;padding:6px 11px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{max-width:760px;margin:5px auto 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){
  .brand small{display:none}
  .brand{font-size:18px}
  .barbtn{padding:7px 10px;font-size:12px;min-height:36px}
  .barbtn.primary{padding:7px 12px}
  .thread{padding:14px 12px 8px}
  .inner{gap:14px}
  .msg.bot{font-size:16px}
  .msg.user{max-width:94%;font-size:14px}
  .empty h2{font-size:24px}
  .starters button{font-size:14px;padding:11px 14px}
  .matrix{grid-template-columns:1fr 1fr;gap:8px}
  .bub{padding:12px 13px;border-radius:18px}
  .bub .nm{font-size:14px}
  .bub .hl{font-size:13px}
  textarea{font-size:16px;padding:10px 12px}
  .btn{padding:10px 14px;font-size:13px}
  .composer{padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px))}
  .pop{right:8px;width:calc(100vw - 16px)}
  .det{font-size:15px}
}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea:focus-visible{outline:none}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <p class="brand">Issue SpotBot<small>CEED 5050 · Fordham</small></p>
    <button class="barbtn" id="thinkBtn" aria-expanded="false" aria-controls="thinkPop"><span id="thinkLabel">All thinkers</span><span class="chev">▾</span></button>
    <button class="barbtn icon" id="setBtn" aria-expanded="false" aria-controls="setPop" aria-label="Settings" title="Settings">⚙</button>
    <button class="barbtn primary" id="newChat" title="Start a new conversation">New</button>
    <div class="pop" id="thinkPop" hidden>
      <div class="row"><span class="lab">Thinkers to analyze</span><span><button class="linkbtn" id="all">All</button><button class="linkbtn" id="none">None</button></span></div>
      <ul class="thinkers" id="thinkers"></ul>
      <div class="gopen"><button class="linkbtn" id="openGuide">Open the full study guide</button></div>
    </div>
    <div class="pop settings" id="setPop" hidden>
      <div class="row"><span class="lab">Settings</span><span class="keystate" id="keystate"></span></div>
      <div id="codeBox" hidden>
        <label class="note" for="code">Access code</label>
        <input id="code" type="password" autocomplete="off" placeholder="Your access code">
        <div class="row" style="margin-top:6px"><button class="btn ghost" id="saveCode">Save code</button><button class="btn ghost" id="forgetCode">Forget code</button></div>
        <p class="note" style="margin-top:6px">Saved in this browser so you only enter it once per device.</p>
      </div>
      <label class="note" for="model">Model</label>
      <select id="model">
        <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (fast)</option>
        <option value="claude-opus-5-5">Claude Opus 5.5 (deeper)</option>
        <option value="claude-haiku-5-5">Claude Haiku 5.5 (quickest)</option>
      </select>
    </div>
  </header>
  <main>
    <div class="thread" id="thread"><div class="inner" id="msgs"></div></div>
    <div class="composer">
      <div class="inner">
        <textarea id="input" rows="1" placeholder="Describe a situation, or ask a follow-up..."></textarea>
        <button class="btn" id="send">Ask</button>
      </div>
      <p class="hint" id="hint"></p>
    </div>
  </main>
</div>

<script>
const GUIDE = [{"id":"anderson15","short":"Anderson","tag":"Moral bias & pragmatism","cls":"Four elements of moral reasoning (empirical data, explicit moral arguments, intuitions, actions), all shaped by your epistemic resources. Her critique of a priori theorizing and reflective equilibrium: stripping away identity and experience makes us worse at answering how to live well together, and ignores how power warps judgment (the abolitionist case; philosophy's own unrepresentativeness). Her two pragmatist methods: bias correction and experiments in living, both tied to empirical evidence and contentious politics alongside the marginalized groups most affected. Read in class as a contrast to Shelby.","name":"Elizabeth Anderson","source":"Elizabeth Anderson, \"Moral Bias and Corrective Practices: A Pragmatist Perspective\" (2015)","summary":"Anderson asks how we actually get better at moral reasoning. Every moral question involves empirical facts, explicit moral arguments, intuitions, and actions, and all of them are shaped by our own epistemic resources: identity, culture, and experience. Philosophy's dominant methods, a priori theorizing and reflective equilibrium, try to strip those resources away to find principles true in all possible worlds. Anderson argues this backfires. It ignores how power and injustice warp our judgments, and it leaves out the people most affected. Her test case is American slavery: white abolitionists' abstract arguments barely moved slaveholders, because racism shaped both sides' intuitions. What changed minds was contentious politics and enslaved and free Black people resisting and demanding respect. She proposes two pragmatist methods instead: bias correction and experiments in living.","ex":{"s":"A company's leadership team, all from similar backgrounds, holds a retreat to write a new code of ethics. They imagine how each policy would feel from an employee's point of view and agree it's fair.","r":"Anderson would say this is the abolitionists' mistake. Imagining yourself in someone else's place corrects for self-interest, but not for the blind spots of your social position. The fix isn't better thought experiments. It's bringing frontline workers into the process, watching how the policies actually play out (experiments in living), and taking it seriously when employees push back collectively rather than treating it as disruption."},"links":"Anderson and Shelby were read together as two answers to how to reason under injustice: Anderson distrusts starting from ideal principles, while Shelby says we need them. Her emphasis on including marginalized voices anticipates Dotson and Medina, and her account of why arguments fail parallels Nguyen.","core":"Anderson argues that moral reasoning goes wrong when it strips away context, and gets better when it's tested in practice with the people most affected. Philosophy's usual method, a priori theorizing, sets aside the facts of who we are and where we stand to find principles true in any possible world. But every moral judgment is shaped by identity, culture, and experience. Stripping those away doesn't remove bias. It hides it. Power makes this worse. People in power tend to confuse what they want with what is right, as long as they can enforce it, and their society's shared intuitions are built to justify their position. That's why abolitionists' rigorous arguments, including table-turning ones, failed: slaveholders always had a ready answer. What changed minds was resistance by enslaved and free Black people and collective political pressure. Anderson's fix is practical: challenge biased norms, include the people affected, and test conclusions by living them out.","terms":[["A priori theorizing","reasoning from the armchair toward principles true in all possible worlds, by stripping away the specific facts of a situation and the identities of the people in it. Anderson's main target."],["Reflective equilibrium","philosophy's standard method. You go back and forth between general principles (\"lying is wrong\") and gut reactions to specific cases (\"lying to protect someone from a killer seems fine\"), adjusting each until they fit. Anderson's worry is that if your gut reactions are biased, the method just turns that bias into a tidy theory."],["Table turning","imagining yourself in the place of the people your action affects, as in the Golden Rule. It's the standard check on self-interest. Anderson says it isn't enough: abolitionists used it, and slaveholders simply answered that social ranks are natural, so the bias survived."],["Veil of ignorance","Rawls's device for designing principles of justice without knowing your own race, class, talents, or position in society, meant to force impartiality. Anderson treats it as table turning extended to every social position. It blocks self-interest, but not bias in favor of your own group."],["Epistemic resources","the identity, culture, and experience that shape how each of us reasons. They can't be stripped away, only examined."],["Moral bias","distortions in moral judgment, especially from power and privilege. Those on top tend to mistake what benefits them for what is right."],["Bias correction","challenging and uprooting the norms and intuitions that keep an injustice in place, especially the ones that feel like common sense."],["Experiments in living","testing moral conclusions by living them out and seeing the results, the way abolition and emancipation tested the claim that freedom would cause chaos."],["Contentious politics","collective action that disrupts unjust practices, from petitions to strikes. It forces the powerful to hear claims they would otherwise brush aside."],["Inclusion","moral inquiry is only reliable when the people most affected take part, because they can see what the powerful are positioned to miss."]],"sub":"Correcting moral bias in practice"},{"id":"shelby","short":"Shelby","tag":"Ideal theory & corrective justice","cls":"'Different principles for different goals.' Ideal theory gives evaluative standards for judging when rectification is called for, and helps when things are complicated. The four kinds of principle: reform and revolution, rectification, penal principles, and political ethics (how should a person respond to injustice). Political ethics was a class focus. Shelby's account includes action, but splits up when it happens and keeps a bird's-eye view. Read in class as a contrast to Anderson.","name":"Tommie Shelby","source":"Tommie Shelby, \"Racial Realities and Corrective Justice: A Reply to Charles Mills\" (2013)","summary":"Shelby defends using ideal theory, the theory of what a perfectly just society would look like, to address racial injustice. Charles Mills argued that ideal theory ignores the history of white supremacy. Shelby replies that we need different principles for different goals, and that ideal theory is what tells us when something is unjust in the first place. It gives us the standards for judging when repair is called for. He divides nonideal theory into four kinds of principle: reform and revolution (what structures we need for a more just society), rectification (how to make amends to those wronged), penal principles (how society should respond to wrongdoing), and political ethics (how an individual should respond to injustice). These answer different questions and shouldn't be collapsed into one.","ex":{"s":"A city that redlined Black neighborhoods for decades now has a large racial wealth gap. Residents ask what justice requires.","r":"Shelby would sort the question. Reform: what institutions would give children equal prospects regardless of neighborhood, like fair school funding? Rectification: are residents owed reparations for what was taken? Political ethics: what should an individual resident or bystander do now, protest, organize, refuse to comply? Fixing future opportunity doesn't settle the reparations claim, and both depend on an ideal standard of what equal treatment would have looked like."},"links":"Shelby is Anderson's counterpart: both take injustice seriously, but Shelby keeps ideal principles as the measuring stick. His political ethics, how a person should respond to injustice, connects to Medina's claim that everyone has a duty to resist.","core":"Shelby argues that ideal and nonideal theory aren't rivals. They are two parts of one theory of justice, and the nonideal part depends on the ideal part. Charles Mills charged that ideal theory, which pictures a perfectly just society in the abstract, is a privileged group's ideology. In his view it hides real oppression and offers no help repairing actual racial injustice, so it should be dropped for nonideal theory, which starts from the unjust world as it is. Shelby replies that you can't call anything unjust without a standard of justice it falls short of, just as you can't call an argument a fallacy without rules of valid logic. Ideal theory supplies that standard. Nonideal theory then asks four separate questions: what structures should change, how past victims should be repaired, how wrongdoers should be treated, and what individuals should do. Shelby concedes that ideal theory says almost nothing about repair, so Mills has a point there. But he holds that this makes ideal theory incomplete, not useless.","terms":[["Ideal theory","working out the principles a perfectly just society would follow. It's the measuring stick, not a description of any real society."],["Nonideal theory","working out how to respond to injustice in the world as it actually is: how to move toward justice, repair past harms, and act under unjust conditions."],["Mills's critique","Charles Mills's charge that ideal theory is ideology. It looks neutral but serves a privileged group, hides oppression by abstracting away from it, and is useless for repairing racial injustice."],["Injustice as deviation","an injustice is defined as falling short of ideal principles, the way a fallacy is a departure from valid logic. Without the ideal, there's no way to say what counts as unjust."],["Evaluative standards","ideal principles serve as the standard for judging when real arrangements are unjust and when repair is called for."],["Principles of reform and revolution","how to move unjust institutions toward more just ones. Ideal theory gives real direction here."],["Principles of rectification","how a society should make amends to people harmed by past injustice. This is Mills's central concern, and the place where ideal theory gives almost no direction."],["Penal principles","how a society should respond when individuals break just rules, such as punishment or detention. Ideal theory gives some limited guidance."],["Political ethics","what individuals owe, and are allowed to do, while living under unjust conditions. Ideal theory gives real direction here."],["Forward- vs. backward-looking","building a fairer future (reform) vs. repairing a specific past wrong (rectification). Shelby insists the two not be confused."]],"sub":"Ideal and nonideal theory"},{"id":"mill","short":"Mill","tag":"Utilitarianism","cls":"Framed against Bentham, for whom pleasure is pleasure (only a matter of degree) and everything morally relevant reduces to pleasure. Mill differs three ways: a long-run standard, not an individual calculation; he cares about things beyond utility, like character and secondary principles; and pleasures differ in kind (higher and lower). Utilitarianism was considered a philosophy of equality in its time. Omelas was the class test case.","name":"John Stuart Mill","source":"John Stuart Mill, Utilitarianism, Chapter 2: \"What Utilitarianism Is\" (1863)","summary":"Mill builds on Bentham's utilitarianism, which judges actions by whether they maximize pleasure and minimize pain. Mill keeps the Greatest Happiness Principle: actions are right as they tend to promote happiness and wrong as they tend to produce the reverse, counting the happiness of everyone affected equally. But he changes it in three ways. First, it's a long-run standard, not a calculation you run before every act; humanity has already learned which kinds of actions tend to help or harm, and those lessons become secondary principles. Second, he cares about things beyond utility, like character. Third, pleasures differ in kind as well as amount: the higher pleasures of the mind and feeling are worth more, as judged by people who have experienced both. Better to be Socrates dissatisfied than a fool satisfied.","ex":{"s":"Omelas: a city of genuine, mature happiness depends entirely on one child kept in misery in a basement. Freeing the child would end the city's happiness.","r":"A Bentham-style tally favors keeping the child there: thousands of happy lives outweigh one miserable one. Mill's version complicates this. He counts everyone's happiness impartially, cares about character, and treats higher goods like dignity and sympathy as weightier than comfort. A city whose joy depends on cruelty corrupts the character and higher pleasures of everyone in it. Still, it's not clear Mill can fully reject the bargain, which is why Omelas is a pressure test for utilitarianism."},"links":"Harsanyi formalizes Mill's secondary principles into rule utilitarianism. Kant is Mill's opposite: Kant judges actions by the principle behind them, Mill by their effects on happiness.","core":"Mill starts from Jeremy Bentham's utilitarianism: the right action is the one that produces the most pleasure and the least pain, and a pleasure only differs from another in amount. Mill keeps the core idea. Actions are right as they tend to promote happiness for everyone affected, counted equally, and wrong as they tend to produce the reverse. His biggest change is adding quality. Some pleasures, like those of thought, feeling, imagination, and moral sense, are worth more than bodily ones, and a person who has known both would never trade the higher for any amount of the lower. Mill also doesn't want a calculation before every choice. Humanity's long experience has already produced reliable rules of thumb, like keeping promises, the way sailors carry ready-made navigation tables instead of working out astronomy before each voyage. And he keeps two questions apart: whether an act is right depends on its results, while whether the person deserves praise depends on their motive and character.","terms":[["Bentham's utilitarianism","the starting point Mill revises. Maximize pleasure and minimize pain, where pleasures differ only in quantity, so a simple bodily pleasure can count as much as a deep one if it's intense enough."],["Greatest Happiness Principle","actions are right in proportion as they promote happiness (pleasure and the absence of pain) and wrong as they produce the reverse, counting everyone affected, not just the person acting."],["Higher and lower pleasures","pleasures differ in kind, not just amount. Pleasures of the mind and moral feeling can outweigh much larger amounts of purely bodily ones."],["Competent judges","the test for which pleasure is higher. Ask people who have truly experienced both. If they disagree, the majority decides. Someone choosing the lower pleasure out of temporary weakness of will doesn't count as preferring it."],["Socrates dissatisfied","\"better to be Socrates dissatisfied than a fool satisfied.\" A fuller human life beats mere contentment, because people who know their higher abilities won't give them up."],["Impartiality","everyone's happiness counts equally, including your own, judged as a disinterested spectator would. Mill ties this to the Golden Rule."],["Secondary principles","everyday moral rules (don't lie, don't steal, keep promises) that carry humanity's experience of what helps and harms. They guide most choices so you don't have to calculate. When two of them conflict, the Greatest Happiness Principle decides between them."]],"sub":"Greatest happiness, judged by quality"},{"id":"harsanyi","short":"Harsanyi","tag":"Rule utilitarianism","cls":"Act utilitarianism aims at local optimality; rule utilitarianism follows the rule with the highest expected social utility if all morally motivated people followed it, aiming at global optimality. Arguably more consistent than Mill, but raises questions: other non-moral human values exist that we shouldn't override, and moral values are tied to long-term utility. Harsanyi criticized Rawls's maximin principle as irrational and argued that aggregating everyone's utility is the better guide. Omelas was the class test case.","name":"John C. Harsanyi","source":"John C. Harsanyi, \"Rule Utilitarianism, Equality, and Justice\" (1985)","summary":"Harsanyi defends rule utilitarianism. Act utilitarianism says the right act is whichever produces the most utility in the situation at hand, which he calls local optimality. Rule utilitarianism says the right act follows the moral rule that would produce the most utility if everyone followed it in similar situations, which is global optimality. The difference matters. An act utilitarian would let the government take your home or let you break a promise whenever the gain is slightly larger than the loss. A society with firm rules protecting rights, promises, and family obligations does far better overall. Harsanyi also holds that equality isn't valuable in itself; more equal distributions are usually better only because money helps poor people more. Morality serves other human values like love, work, and knowledge. He also criticized Rawls, arguing that maximizing average utility is more rational than Rawls's focus on the worst-off.","ex":{"s":"Omelas again. Should the city keep the rule that no one may help the child?","r":"Harsanyi asks what rule, publicly known, would produce the most utility if everyone followed it. 'Keep one person in total misery so everyone else can thrive' is a rule people would have to live under knowing anyone could be sacrificed, and a society with strong rights protections does better overall. That gives him a way to reject Omelas that act utilitarianism lacks. But if the terms really are fixed and the benefits are enormous, his framework may still struggle, because rights are only as strong as the utility they produce."},"links":"Harsanyi develops Mill into a rule-based theory. Kant's Universal Law formula also asks about rules everyone follows, but Kant tests for logical contradiction while Harsanyi tests for best results, and Harsanyi calls Kant's no-exceptions approach 'rule worship'.","core":"Harsanyi argues that utilitarians should judge rules, not individual acts. The question isn't \"which act is best here?\" (local optimality) but \"which rule produces the most good if everyone follows it?\" (global optimality). The difference matters because many valuable practices, like promises, property rights, and honest speech, are only valuable if people can rely on them. An act utilitarian would break a promise whenever breaking it produced slightly more good this one time. A society that did that would lose trust in promises altogether, which costs far more. This separates Harsanyi from Mill. Mill also relies on rules, but when they conflict, he goes back to judging the single case. Harsanyi judges the rule itself, and a rule that bends whenever a case seems to call for it stops being a rule. On equality, he says utilitarianism already counts everyone's interests equally, but equal outcomes have no value in themselves. Helping the poor usually does more good only because an extra dollar means more to them.","terms":[["Act utilitarianism","the right act is whichever available act produces the most good in this specific situation, judged case by case."],["Rule utilitarianism","the right act follows the rule that would produce the most good if everyone in similar situations followed it. Harsanyi's view."],["Local optimality","the best single act, judged on its own, ignoring what happens to a rule or practice if everyone acts that way. What act utilitarianism chases."],["Global optimality","the best outcome judged by a rule's overall effect when generally followed. What rule utilitarianism chases, and why it produces more good overall even when one act looks worse in isolation."],["Rule worship","the objection that rule utilitarianism means blindly following a rule even when breaking it would clearly do more good. Harsanyi's reply: the rule was chosen because of its overall effect, and a rule that allows exceptions whenever someone thinks a case demands one collapses back into act utilitarianism."],["Moral rights and obligations","justified because a society that reliably respects them does better. For example, a firm rule of fair compensation when the government takes land protects everyone's security."],["Equal consideration vs. equal outcomes","utilitarianism gives everyone's interests the same weight from the start, but that doesn't make equal outcomes valuable in themselves."],["Diminishing marginal utility","an extra dollar means more to a poor person than to a rich one. This is the only reason redistribution helps: it does more total good, not because equality matters on its own."],["Statement A","Harsanyi's label for the view that benefits to the poor or disadvantaged should always be prioritized over benefits to the better-off, simply because of their relative position. He argues against it with the lifesaving-drug case and the university-admissions case."],["Moral fanaticism","treating your moral convictions as so absolute that any cost is acceptable in pursuing them. His example is Robespierre and the Terror of the French Revolution. Utilitarianism resists this because it always has to count the costs."]],"sub":"Judge the rule, not the act"},{"id":"dotson","short":"Dotson","tag":"Epistemic injustice","cls":"People have different access to epistemic resources that help us make sense of the world. Knowledge can be overweighted (credibility excess) or underweighted (credibility deficit) because of prejudice. Ignorance is inevitable; we can't perfectly avoid these wrongs, but we can minimize them. Class treated Dotson's three injustices (testimonial, hermeneutical, contributory) as the consequences of epistemic vices.","name":"Kristie Dotson","source":"Kristie Dotson, \"A Cautionary Tale: On Limiting Epistemic Oppression\" (2012)","summary":"Dotson studies epistemic oppression: unfair exclusions that damage people's ability to contribute to what a society knows. People have different access to epistemic resources, the concepts and frameworks we use to make sense of the world. Building on Miranda Fricker, she lays out three kinds of epistemic injustice, each needing a deeper fix. Testimonial injustice: prejudice makes someone less believed. Hermeneutical injustice: a society's shared concepts leave a gap, so someone can't make sense of their own experience. Contributory injustice, Dotson's addition: marginalized people can explain their experience perfectly well, but listeners willfully stick to frameworks that can't take it in. Her warning is that ignorance is inevitable and even theories of injustice can exclude people, so the goal is to minimize the harm and keep our concepts open.","ex":{"s":"Three people try to be heard. A woman reports harassment and isn't believed because 'women exaggerate.' In 1970, a woman can't explain what's happening at work because the term 'sexual harassment' doesn't exist yet. A patient community has precise language for their chronic illness, but doctors stick to their own framework and won't learn it.","r":"The first is testimonial injustice: fix how credibility is judged. The second is hermeneutical: society needs a new concept. The third is contributory: the patients can explain themselves, but the doctors refuse to engage their framework. Fixing it requires the doctors to learn to move between frameworks, which is the hardest change of all."},"links":"In class, Dotson's three injustices were treated as the consequences of Medina's epistemic vices: arrogance and closed-mindedness in listeners produce these harms. Contributory injustice is close to Medina's active ignorance.","core":"Some people are unfairly shut out of what a society knows, and fixing that means looking past individual prejudice to the shared frameworks we use to understand each other. The harm comes in three layers, each harder to fix. Testimonial injustice: someone isn't believed because of who they are. Hermeneutical injustice: society lacks the concepts for someone to make sense of their own experience. Contributory injustice: the person can explain it perfectly well, but listeners refuse to take up the frameworks that would let them hear it. Ignorance can't be eliminated, so the goal is to minimize the harm and keep our concepts open.","terms":[["Epistemic resources","the concepts and frameworks people use to make sense of the world"],["Epistemic oppression","exclusions that harm people's ability to take part in producing knowledge"],["Testimonial injustice","a credibility deficit caused by identity prejudice"],["Hermeneutical injustice","a gap in shared concepts leaves someone unable to understand their experience"],["Contributory injustice","listeners willfully use biased frameworks, so marginalized knowers can't contribute"],["Willful hermeneutical ignorance","refusing to learn the frameworks others use"],["Open vs. closed concepts","offering an account, not the account, so other harms aren't ruled out"]],"sub":"Three layers of epistemic injustice"},{"id":"medina","short":"Medina","tag":"Epistemic virtue & vice","cls":"Epistemic vice: corrupted attitudes and dispositions that get in the way of knowledge (potential to wrong others as knowers). Epistemic virtue: attitudes and dispositions that help acquire and share knowledge (an epistemic advantage for the knower and those around them). What separates a vice or virtue from just being human is habit. Three vices: arrogance, laziness, closed-mindedness. Remedy: principles of epistemic friction, a kaleidoscopic perspective (search for alternatives, acknowledge them, engage them, seek equilibrium), with individual responsibility (empathy, open-mindedness, humility in testimony) and collective responsibility (uncovering histories of exclusion that made people invisible).","name":"José Medina","source":"José Medina, The Epistemology of Resistance (selections) (2013)","summary":"Medina gives an account of epistemic virtues and vices under oppression. An epistemic virtue is a set of attitudes and habits that help a person gain and share knowledge; a vice is a set of corrupted attitudes and habits that get in the way of knowledge. What makes something a virtue or vice, rather than just being human, is habit. Privileged people are especially prone to three vices: arrogance, laziness, and closed-mindedness, which together produce active ignorance. Oppressed people often develop the opposite virtues, humility, curiosity, and open-mindedness, because they have to understand both their own position and that of those in power. Medina's remedy is epistemic friction: seek out perspectives that challenge you, acknowledge them, and engage them. This is a responsibility for individuals, in how we listen and testify, and for communities, in uncovering whose voices have been made invisible.","ex":{"s":"Employees of color tell their manager they're repeatedly passed over for promotion. The manager replies, 'I don't see color. I treat everyone the same.'","r":"Medina would call this active ignorance. The manager is arrogant (assumes there's nothing to see), lazy (doesn't look into the pattern), and closed-minded (shuts down the reports). Because these are habits, not one-off mistakes, they're vices. The employees likely see what he can't. The remedy is friction: he should seek out and engage their perspective. Individually, that means listening differently; collectively, the company should examine whose experiences its processes have made invisible."},"links":"Medina's vices are the causes and Dotson's injustices are the consequences. Closed-mindedness is a close relative of Nguyen's echo chambers, and Medina's call for friction echoes Anderson's insistence on including those affected.","core":"Medina argues that healthy communities of knowers, especially democratic ones, need friction rather than consensus: ongoing challenge and dissent between people in different social positions. Knowledge is social, and bad habits of knowing keep people ignorant of others' lives. A habit of mind becomes a virtue or a vice when it's repeated, not when it happens once. People with privilege are especially prone to arrogance, laziness, and closed-mindedness, because their position shields them from being challenged. Together these vices keep their ignorance going. People facing oppression often develop humility, curiosity, and open-mindedness, because surviving requires understanding both their own view and the dominant one. These are tendencies, not guarantees. The remedy is epistemic friction: acknowledging and engaging every perspective you encounter, and keeping them in balance so no single voice drowns out the others. This responsibility belongs to individuals and to whole communities.","terms":[["Epistemic virtue","habits and attitudes that help us gain and share knowledge, like humility, curiosity, and open-mindedness."],["Epistemic vice","corrupted habits and attitudes that get in the way of knowledge, like arrogance, laziness, and closed-mindedness."],["Habit","what separates a virtue or vice from an occasional lapse. One careless moment isn't a vice. A pattern is."],["Epistemic arrogance","treating your own view as so authoritative that you never check it against others. It grows from rarely having your authority questioned."],["Epistemic laziness","a lack of curiosity about things your position lets you avoid knowing, like how the work that supports your life gets done."],["Closed-mindedness","a built-in, not occasional, refusal to update your thinking in light of certain evidence or perspectives. Saying \"I don't see race\" is Medina's example."],["Active ignorance","ignorance a person helps maintain through their own habits, as opposed to simply not knowing."],["Subversive lucidity","the clear-sightedness oppressed people often develop from having to understand both their own perspective and the dominant one. It lets them see the limits of mainstream ways of seeing."],["Perplexity","the discomfort of having your usual understanding challenged by an unfamiliar experience. Medina treats it as a useful trigger for learning, not something to avoid."],["Epistemic friction","productive challenge between different perspectives. Medina treats it as the engine of shared knowledge, not a problem to smooth over."],["Beneficial vs. detrimental friction","friction that pushes someone to justify or rethink their beliefs vs. friction that shuts people down, like censorship or silencing."],["Principle of acknowledgment and engagement","every perspective you encounter must be acknowledged and, where possible, engaged with, even if only critically."],["Principle of epistemic equilibrium","keep the many forces on your thinking in balance, so no single influence, inside or outside you, becomes unchecked."],["Kaleidoscopic perspective","seeking out, acknowledging, and engaging many alternative perspectives at once, and seeing society as many shifting viewpoints rather than one fixed one."],["Epistemic responsibility","the duty to know yourself and others well enough to avoid harm. It's shared and social, not just individual."]],"sub":"Friction over consensus"},{"id":"nguyen","short":"Nguyen","tag":"Bubbles & echo chambers","cls":"Class compared bubbles and echo chambers on three questions. How created: bubbles from an agent's habit of seeking agreeing info or from externalities like algorithmic filtering; echo chambers need core beliefs for membership plus credential isolation and a disagreement-reinforcement mechanism. Harms: bubbles cause bootstrapped corroboration (treating dependent people as independent); echo chambers are self-sustaining, assign credibility by strategy rather than merit, and can be used to continue oppression. Disruption: bubbles are easy (exposure); echo chambers are hard (members are prepared to distrust outside sources). Class case: when, if ever, is being in a bubble, or regularly using LLMs, an epistemic vice?","name":"C. Thi Nguyen","source":"C. Thi Nguyen, \"Echo Chambers and Epistemic Bubbles\" (2020)","summary":"Nguyen separates two things people often blur together. An epistemic bubble forms when other voices are left out, either because we seek out people who agree with us or because outside forces, like algorithms, filter what we see. Its main harm is bootstrapped corroboration: we feel more confident because everyone around us agrees, even though they aren't independent sources. A bubble is easy to pop with exposure to new information. An echo chamber is different: it requires a set of core beliefs for membership and actively discredits outsiders while inflating insiders' credibility. Its disagreement-reinforcement mechanism means outside challenges get absorbed as confirmation. Exposure doesn't break an echo chamber and can strengthen it. What helps is rebuilding trust with someone outside.","ex":{"s":"A student uses an AI chatbot for all their research. It tends to agree with how they phrase questions, and they rarely check other sources.","r":"This looks like a bubble: other perspectives are being left out, and the chatbot's agreement creates false confidence, a form of bootstrapped corroboration. It's fixable by exposure: checking sources and asking the question from other angles. It becomes an echo chamber only if the student starts treating outside sources as untrustworthy because they disagree with the chatbot. Whether relying on it is an epistemic vice depends, following Medina, on whether it has become a habit that blocks learning."},"links":"Nguyen explains why simply presenting evidence often fails, as Anderson found with abolitionist arguments. Echo chambers manipulate credibility on purpose, while Dotson's testimonial injustice deflates it through prejudice, and Medina's closed-mindedness is a related defensive structure.","core":"Not every closed information world is the same. A bubble just leaves other voices out, while an echo chamber teaches its members to distrust outsiders. Bubbles form through habit or through algorithms filtering what we see, and they make us overconfident because agreement from people who share our sources feels like independent proof. Exposure to new information pops a bubble. An echo chamber discredits outside sources and inflates insiders, so contrary evidence gets read as more proof the group was right. Exposure can make it stronger. The way out is rebuilding trust with someone outside.","terms":[["Epistemic bubble","outside voices are left out, by habit or by filtering"],["Echo chamber","outside voices are actively discredited"],["Selective exposure","our ordinary habit of seeking out like-minded sources. Friends make good company but poor guarantees of balanced information."],["Algorithmic filtering","personalization that narrows what we see without our knowledge"],["Bootstrapped corroboration","treating agreement from dependent sources as independent confirmation"],["Credential isolation","discrediting outsiders and inflating insiders' credibility"],["Disagreement-reinforcement mechanism","reframing contrary evidence so it confirms core beliefs"],["Trust repair","the route out of an echo chamber"],["Social epistemic reboot","temporarily suspending trust in all your usual sources and rebuilding your web of trust from scratch, as Derek Black did through a patient friendship with a classmate."]],"sub":"Bubbles vs. echo chambers"},{"id":"kant","short":"Kant","tag":"Deontology","cls":"Kant locates morality in our ability to reason, not in the divine. Hypothetical imperative: good only as a means to something else. Categorical imperative: necessary for a will that conforms to reason. Universal Law formula: act as though your maxim would become a universal law of nature; if universalizing it produces a contradiction, you have a perfect duty not to act on it. Humanity formula: treat rational beings never as a mere means; the difference between 'means' and 'mere means' is critical. Class contrasted Universal Law with Harsanyi's rule utilitarianism, noted the debate over whether Kant is an inconsistent egalitarian or a consistent inegalitarian, and used Noah's 'Lying to Parents' case.","name":"Immanuel Kant","source":"Immanuel Kant, Groundwork for the Metaphysic of Morals (excerpts) (1785)","summary":"Kant locates morality in our capacity to reason, not in God, feelings, or consequences. Only a good will is good without qualification, and an act has moral worth when it's done from duty, because it's right. He distinguishes hypothetical imperatives, which tell you what to do if you want something ('study if you want to pass'), from the categorical imperative, which commands unconditionally. Its two main formulas: Universal Law says to act only on a maxim, the rule behind your action, that you could will to become a universal law; if universalizing it creates a contradiction, you have a duty not to act on it. The Humanity formula says to treat people, including yourself, always as ends and never merely as means. Using someone as a means is normal, like hiring a plumber; using them as a mere means, through deception or coercion, is wrong.","ex":{"s":"Noah, 21, drinks a few beers at parties. His religious parents believe drinking is abhorrent, pay his tuition, and might cut him off. They ask him directly whether he drinks.","r":"Noah's maxim would be 'lie to people I love when the truth would cost me.' Universalized, no one could trust anyone's answers, so lying defeats itself, and Kant holds a strict duty not to lie. Lying would also treat his parents as mere means, managing them rather than respecting them as rational agents. So Kant says Noah shouldn't lie, even at great cost. He could decline to answer, but he can't deceive. The case shows why critics find Kant rigid when love and consequences are at stake."},"links":"Kant's Universal Law formula looks like Harsanyi's rule utilitarianism, since both ask about everyone following a rule, but Kant tests for contradiction while Harsanyi tests for the best outcomes. Grimké was read in class as an application of the Humanity formula. Mill is Kant's opposite on whether consequences decide right and wrong.","core":"Morality comes from reason. Act only on rules you could will for everyone, and never treat a person merely as a tool. Consequences and feelings don't decide what's right. What matters is the will behind the act, and whether you do the right thing because it's right. To test an action, state the personal rule behind it and imagine everyone following it. If that rule would defeat itself, you must never act on it. And while we use each other all the time, as with hiring a plumber, using someone through deception or coercion treats them as a mere means, which is always wrong.","terms":[["Good will","the only thing good in itself, regardless of results"],["Acting from duty","doing the right thing because it's right"],["Maxim","the personal rule or reason behind an action"],["Hypothetical imperative","\"Do X if you want Y\""],["Categorical imperative","an unconditional moral command that binds every rational being"],["Universal Law formula","act only on a maxim you could will as a universal law"],["Perfect duty","a duty with no exceptions, from maxims that contradict themselves when universalized"],["Humanity formula","treat people always as ends, never merely as means"],["Means vs. mere means","using someone with their consent vs. using them as a tool"]],"sub":"Reason, duty, and respect for persons"},{"id":"grimke","short":"Grimké","tag":"Human rights not founded on sex","cls":"Read in class as an application of Kant's Humanity formula: the doctrine of masculine and feminine virtues turns woman into a 'mere appendage' and instrument of man's convenience, a mere means rather than a moral being and equal.","name":"Angelina Grimké","source":"Angelina E. Grimké, Letter XII: \"Human Rights Not Founded on Sex\" (1838)","summary":"Writing to Catharine Beecher, Grimké argues that rights come from our moral nature, and since men and women share the same moral nature, they have the same rights. Sex is a 'mere circumstance' of the body and can't justify different rights or duties: 'whatever it is morally right for man to do, it is morally right for woman to do.' She learned this from the antislavery movement, which taught her that rights can be denied but never truly taken away. The doctrine of separate masculine and feminine virtues has made men stern and tyrannical and turned women into dolls, pets, or drudges, harming both. Women have been treated as mere appendages of men, instruments of their convenience. They therefore have a right to a voice in every law that governs them, in church and state.","ex":{"s":"A church lets women preach but gives them no vote on the rules that govern the congregation.","r":"Grimké would say the church has missed the point. If rights come from being a moral being, and women are equally moral beings, then if it's right for a man to help make the rules, it's right for a woman. Letting women preach because of their 'spiritual gifts' while denying them a vote treats them as useful instruments, not as equals. In Kant's terms, it uses them as mere means."},"links":"Grimké's argument is a real-world application of Kant's Humanity formula: women treated as 'mere appendages' and instruments are being used as mere means. Anderson notes that most abolitionists refused to extend their arguments to women; Grimké is the clear exception.","core":"Rights come from being a moral being, so anyone with the same moral nature has the same rights, regardless of sex. Sex is a physical circumstance, not a moral one: whatever is right for a man to do is right for a woman to do. Separate \"masculine\" and \"feminine\" virtues harm both sexes. They make men domineering and reduce women to ornaments or instruments of men's convenience. Rights can be denied but never truly taken away, so women have a right to a voice in every law and institution that governs them.","terms":[["Rights from moral nature","rights belong to every moral being and can't be alienated"],["Sex as \"mere circumstance\"","a physical difference that can't ground different rights"],["Masculine and feminine virtues","the doctrine she rejects for harming both sexes"],["Mere appendage","woman treated as an instrument of man's convenience"],["Human rights","\"I recognize no rights but human rights\""],["Voice in governance","the right to help make the laws one lives under"]],"sub":"Rights come from moral nature"}];
const CHUNKS = [{"r":"anderson15","p":1,"t":"Moral Bias and Corrective Practices: A Pragmatist Perspective Author(s): Elizabeth Anderson Source: Proceedings and Addresses of the American Philosophical Association , NOVEMBER 2015, Vol. 89 (NOVEMBER 2015), pp. 21-47 Published by: American Philosophical Association range of content in a trusted digital archive. We use information technology and tools to increase productivity and access to Proceedings and Addresses of the American Philosophical Association 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":2,"t":"Moral Bias and Corrective Practices: A Pragmatist Perspective Elizabeth Anderson UNIVERSITY OF MICHIGAN-ANN ARBOR Presidential address delivered at the one hundred twelfth Central Division m the American Philosophical Association in St. Louis, Missouri , on February 1. SOME PRAGMATIST DOUBTS ABOUT DOMINANT METHODS IN MORAL PHILOSOPHY My topic for this lecture is the epistemology of morality. Here, morality in the narrow sense of what we owe to each other.1 It to infer the implicit moral epistemology of analytic moral phi from its dominant methods. I am particularly interested in the social epistemology of analytic moral philosophy. Philosophers that they can learn what we owe to each other under the social in which we practice moral philosophy. These presumptions can be tested. We can investigate histor in which society implemented moral philosophy's dominant and see whether they yielded satisfactory moral conclusions. We can consider whether alternative practices have done a better job, and why they might have done so. To adopt more effective practices of moral inquiry in light of such testing in experience is to adopt pragmatism as a moral methodology. I will argue that to do so is a more promising path forward for moral philosophy than to continue our currently dominant methods. Let's first consider some dominant methods in moral philosophy today. I'll focus on two: the ascent to the a priori , and reflective equilibrium."},{"r":"anderson15","p":2,"t":"The ascent to the a priori purports to yield *fact free\" moral principles fundamental moral principles that are true in all possible worlds. G. A. Cohen spelled out the method as follows. Suppose we begin with a moral principle that depends on a fact. We ask what makes that fac 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":3,"t":"PROCEEDINGS AND ADDRESSES OF THE APA, VOLUME 89 morally relevant. The answer will have to be a normative principle that does not depend on that fact. If it, in turn, depends on some other fact, we can iterate the process of abstraction from facts. Each new principle functions as a stepping stone that takes us further away from contingent facts, ultimately ascending to a domain of fundamental moral principles that are true regardless of the facts true in all possible worlds.2 Here is a slight modification of Cohen's example. Suppose someone advances a principle of freedom of religion, justified by the fact that religion is important to people. We ask: Why care about what is important to people? The advocate might answer: Because people merit respect. Again, we ask what justifies this principle and receive another appeal to fact: people are rational beings. We now ask what makes that fact morally relevant and receive the answer that any rational being merits respect. That principle depends on no further facts. It is true in all possible worlds, and so counts as a fundamental moral principle. The method of reflective equilibrium is even more dominant.3 Here we move between intuitively appealing general moral principles and intuitions about particular cases. We use each to modify the others until we arrive at a set of principles that accounts for our moral judgments of all particular cases."},{"r":"anderson15","p":3,"t":"Carried to its logical conclusion, this method can also lead to moral principles for all possible worlds, as long as we entertain thought experiments about sufficiently bizarre cases to elicit intuitions against which to modify our general principles. These do not exhaust the methods used in contemporary moral philosophy. However, they are illustrative of a common aspiration embodied in its most important methods. This is to seek fundamental principles of morality that could, in principle, settle all moral problems (at least of a particular structure e.g., regarding saving lives, or distributing goods) in all circumstances. I have a pragmatist doubt about this aspiration. Our subject is principles of moral right, which tell us what we owe to each other. These principles have a function. They are tools for solving moral problems problems that arise from the facts that people need to live together, and need each other's assistance and cooperation, to survive and realize nearly everything worthwhile in life. Because of these facts, we regularly make claims on one another to act or avoid acting in various ways, and call upon one another to affirm and enforce these claims by applying moral sanctions and expressing moral sentiments by praising, blaming, punishing, and by expressing outrage, disgust, resentment, and other moral sentiments. The claims we make on each other frequently conflict. 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":4,"t":"PRESIDENTIAL ADDRESS - CENTRAL DIVISION Morality supplies principles for adjudicating those conflicts, and for fairly and impartially evaluating and revising other tools, such as laws, nonmoral social norms, and bargaining, that we have developed for managing them. Given that our conflicts are rooted in empirical realities that differ across societies and ages, there is no particular reason to think that there is any single fundamental moral tool that would settle all our conflicts, or even all conflicts of a particular structure, everywhere. That is no more plausible than to suppose that there is one ultimate tool that will perform every task needed to build a shelter, no matter the climate, economic, and social conditions. If the quest for ultimate, fact-free, or at least highly general and abstract principles of moral rightness is dubious, how else can we advance moral inquiry? Pragmatists argue that we should replace the quest for ultimate or highly general principles with methods for intelligently updating our current moral beliefs. There are two basic types of intelligent updating. The first is bias correction. We can empirically investigate whether certain biases thought tendencies that we have reason to reject for purposes of adjudicating moral differences have distorted our moral thinking. Such investigation may also discover methods for blocking or counteracting these biases."},{"r":"anderson15","p":4,"t":"Implementation of these methods may then yield different beliefs, which are more trustworthy for avoiding the biases in question. A model of this type of strategy may be found in double-blind, placebocontrolled, clinical trials of medical treatments. Blinding and placebo controls block the effects of wishful thinking on observation. When neither the patient nor the clinician knows whether the patient has received a drug, their hope that the treatment works will not distort observations of actual health outcomes. While clinical trials are hardly guaranteed to generate accurate causal knowledge, we have much greater reason to trust the evidence generated from double-blind, placebo-controlled trials than from other types of evidence in medicine. Conclusions drawn from less biased methods of inquiry are likely to be better. The second basic method for intelligent updating of moral beliefs consists in experiments in living. We act in accordance with new moral principles, and see whether doing so solves the problem we wanted it to solve, better than the old principles, with side effects we can live with. I have discussed experiments in living elsewhere.4 Here I focus on bias correction. Some dominant methods of moral philosophy incorporate a 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":5,"t":"PROCEEDINGS AND ADDRESSES OF THE APA, VOLUME 89 limited recognition of the need for bias correction, to bar the distorting effects of self-interest on moral judgment. Philosophers typically use two explicit techniques to correct this bias. (1) In a table-turning exercise, we regard an action under our consideration not only from our own point of view, as the agent, but from the point of view of those likely to experience its effects. We do this through a thought experiment: we imagine that we are someone other than the agent who is affected by it and simulate our responses to the action and its effects. The Golden Rule, which tells us to do unto others as we would be done by, in effect directs us to avoid any actions that we would reject in such a simulation.5 (2) In the veil of ignorance, we consider the impact of general principles of justice on the assumption that we don't know our own identities or social position.6 The veil of ignorance generalizes the thought experiment of the Golden Rule by asking us to simulate our responses to the proposed principle from every social position. Let's turn our attention to the social conditions of the practice of moral philosophy. While it is doubtful whether these have been designed to counteract biases, in practicing moral inquiry under these conditions, philosophers presuppose that those conditions are not themselves distorting our moral thinking."},{"r":"anderson15","p":5,"t":"Philosophers engage in moral reflection in the \"cool hour,\" at points and sometimes on whole matters in which we do not have immediate stakes. Often, philosophers undertake moral reflection monologically, or simulate dialogue in their own minds. Even when dialogue is actual, it typically takes place around a seminar table or classroom composed of largely relatively privileged people faculty and college students who have leisure to reflect, and who are overwhelmingly white, male, and middle class. The dominant methods appear to presuppose either that the social position of philosophers doesn't matter, or that whatever biases social position imparts are easily correctable by the table-turning and veil of ignorance thought experiments. If moral inquiry were like mathematical inquiry, these conditions might make sense. With respect to mathematics, it is plausible to suppose that the social identities of inquirers are irrelevant to how we think about the subject matter. This idea is harder to credit with respect to moral inquiry. Moral reasoning is supposed to help diverse people live together, come to terms with their differences, and promote peaceful cooperation on fair terms by supplying mutually acceptable principles for adjudicating the conflicting claims they make on each other, and for coordinating our moral sentiments to fit the demands of living together. We should expect that people's social positions affect the claims they regard as intuitively legitimate, as well as their moral sentiments. 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":6,"t":"PRESIDENTIAL ADDRESS - CENTRAL DIVISION These reflections suggest several questions about dominant philosophical methodologies. First, why should anyone place confidence in the moral intuitions they have in thought experiments that are very remote from experience? To generate moral principles that claim to apply in all possible worlds, or at least at a high level of abstraction from facts, philosophers often consider bizarre thought experiments. For example, in exploring the morality of abortion, Thomson appeals to moral intuitions about scenarios in which people reproduce by means of \"people seeds'' that embed themselves in one's carpets.7 Yet, if this were how people reproduced, all of the other conditions of social life would be radically different. Why trust our ability to legislate morals for creatures like that? Why think that what would be reasonable for them would be equally reasonable for us? Even thought experiments that seem closer to home, such as ticking time bomb scenarios or trolley problems, tend to presuppose degrees of certainty that are never encountered in real life, and omit consideration of how other people would react to actors in these scenarios. These doubts about the reliability of moral intuitions about bizarre cases are reinforced by considering intuitions from a naturalistic point of view."},{"r":"anderson15","p":6,"t":"The standard case in which we entertain moral intuitions arises in deliberation.8 In every act of deliberation, we conduct a thought experiment in which we imagine the consequences of actions open to us, and simulate our evaluative responses to these actions and their consequences, with a view toward choosing one of the alternatives. When philosophers elicit moral intuitions about particular cases in thought experiments, they simulate deliberation, only without immediate stakes or intention to choose an action on the basis of the simulation. Such speculation is less serious than planning, since it is often undertaken merely for the sake of argument. Deliberation is more reliable when it stays close to past experience. This is not simply because of difficulties in predicting the objective consequences of actions. It is also because we are often surprised by our and others' moral reactions to actions and their consequences once they are performed. Simulation does not always track reality, which is why we often feel regret even when we follow our best judgment at the time. Intuitions elicited in philosophical thought experiments therefore cannot be more reliable than deliberation, which is not more reliable than intuitions elicited in actual experiments in living, when we experience real consequences, and actual moral reactions to them. A second question that can be raised about philosophical intuitions is, why rely on the intuitions of philosophers over the intuitions of the folk? Experimental philosophers have raised this challenge with 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":7,"t":"PROCEEDINGS AND ADDRESSES OF THE APA, VOLUME 89 respect to nonmoral normative intuitions.9 It applies with special force to intuitions about what we owe to each other. Public opinion polling consistently finds that people's views about justice and public policy are affected by their social identities in particular, by ethnocentric bias in favor of groups they affiliate with independently of the impact of these principles and policies on their personal self-interest.10 We also have theoretical reasons for thinking that important challenges to morality arise from group interests and perspectives defined by social hierarchy, independent of self-interest.11 Bias correction techniques for blocking self-interest need not work against ethnocentric biases. This matters for philosophy because philosophers, as already noted, are demographically unrepresentative of humanity at large, overwhelmingly drawn from advantaged social groups. Their professional situation mostly insulates them from the challenges faced by less privileged groups, and professional norms promote emotional detachment from the issues they contemplate. Research-active philosophers enjoy a leisure to contemplate that the less privileged lack. Various rationales for this exclusion and narrowness are suspect."},{"r":"anderson15","p":7,"t":"The traditional Aristotelian view that leisure is needed for rational reflection may be challenged by the thought that direct experience of manual labor and economic necessity makes salient the importance of certain claims of justice that the privileged are liable to ignore, dismiss, or misunderstand.12 Philosophers' emotional detachment their confidence that reflection in the \"cool hour\" yields better understanding looks suspect in view of the fact that this was a traditional rationale for excluding the propertyless from the franchise, who were thought to be too upset about their poverty. We see the same view reflected in complaints that people of color are \"hypersensitive\" about racial insults. Cognitive science suggests rather that emotions help us focus on normatively relevant features of urgent problems,13 and that the lack of emotion of the privileged may reflect their indifference to the plight of others.14 Against the thought that having practical stakes in the outcome biases moral thinking, I suggest that lacking stakes the typical condition of philosophers when they undertake speculative thought experiments may make moral reasoning irresponsible and unaccountable to those to whom the outcomes matter."},{"r":"anderson15","p":7,"t":"A third question that may be raised about dominant methodologies is a follows: Why think our moral intuitions are reliable now when past one were clearly prejudiced? Consider this intuition advanced by Hastin Rashdall, the distinguished Oxford philosopher and utilitarian theorist xx[P]robably no one will hesitate [to agree that] . . . the lower Well-bein . . . of countless Chinamen or Negroes must be sacrificed that a higher 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":8,"t":"PRESIDENTIAL ADDRESS - CENTRAL DIVISION life may be possible for a much smaller number of white men.\" not a good start for a moral epistemology that purports to deliv reflection on intuitions, moral principles true in all possible wor A fourth closely related question is this: Why think our moral i are reliable now when they have changed quite radically over time? Consider the recent dramatic changes in Euro-American views about the morality of LGBT sexuality, divorce, and premarital sex. About a century ago, beliefs about the morality of killing for honor also changed. I do not draw skeptical conclusions about the possibility of moral knowledge from such doubts about the reliability of our moral intuitions. N
