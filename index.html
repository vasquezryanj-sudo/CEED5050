temic vices that privileged subjects are more likely to develop than underprivileged subjects. | will not provide an exhaustive list of such vices, but I will identify a few central ones with large consequences that affect most aspects of one’s socially mediated cognitions. Epistemic vices (such as epistemic arrogance) are flaws that are not incidental and transitory, but structural and systematic: they involve attitudes deeply rooted in one’s personality and cognitive functioning. Epistemic vices are composed of attitudinal structures that permeate one’s entire cognitive life: they involve attitudes toward oneself and others in testimonial exchanges, attitudes toward the evidence available and one’s assessment of it, and so on."},{"r":"medina","p":15,"t":"These vices affect one’s capacity to learn from others and from the facts; they inhibit the capacity of self-correction and of being open to correc tions from others (which requires some amount of epistemic humility and open-mindedness). In short, these vices are deep and serious flaws in epistemic character that limit the subject’s learning capacities and contributions to the pursuit of knowledge, and therefore they also damage the social knowledge available and harm the chances for epistemic improvement of the subject's community. Epistemic arrogance is one of the obvious ways in which the powerful and privileged can be spoiled and come to exhibit a cognitive immaturity that—in some radical cases—can even become pathological, namely, when the subject becomes absolutely incapable of acknowledging any mistake or limitation, in dulging in a delusional cognitive omnipotence that prevents him from learning from others and improving. Although the pathological version of ep istemic arrogance in this extreme form is perhaps rare, it does indeed exist and it can provide a paradigmatic example of this vice. It can be found, for example, in Alexis de Tocqueville’s vivid psychological picture of the US slaveholders of the 1830s.* Epistemic arrogance, I contend, is an important brushstroke of this powerful psychological picture."},{"r":"medina","p":15,"t":"Tocqueville (1990) tells us how, from early infancy, the white Southerner learns to become “a domestic dic tator, and that “the first habit which he contracts is that of ruling without resistance” (p. 394; my emphasis).> An important part of this “ruling without resistance” is not being called into question in one’s opinions, that is, having ‘ Tocqueville's racial discussions and psychological pictures of the master and slave mentalities have been discussed by contemporary race theorists, See Sullivan (2006), pages 25-27, and Lucius Out Sullivan and Tuana (2007). analysis called my attention to this passage. See her reading in Sullivan (2006), page 26. law's essay ir Sullivan's"},{"r":"medina","p":16,"t":"a es Sole Orel eS an undisputed cognitive authority, Thinking whatever one wants to think, without resistance, does not lead to the development of good epistemic habits. In the extreme case, reality in its entirety can be perceived by the subject as being at his disposal and at his will, as of his own making. ‘This arrogant and narcissistic perspective can even be linked to an interesting version of skepticism about the external world: a version in which the external world has been swallowed up by the all-encompassing perspective of the arrogant subject who does not recognize any other authoritative perspective. But less dramatically, letting one’s perspective go unchecked results in an unavoidable, mundane accumulation of oversights, errors, biased stereotypes, and distortions. In this way, racist and sexist biases become undetectable and incorrigible blind spots, for when the subjects who have inherited them become insensitive to contrary evidence and to alternative viewpoints, they are unequipped to detect and correct those biases in their perspective. Enjoying too much cognitive esteem—having an unquestioned epistemic reputability—results in one’s epistemic perspective and agency becoming so slanted that one has effectively given up the pursuit of knowledge for lack of impartiality and objective access to the world."},{"r":"medina","p":16,"t":"When whatever one says, goes—because one’s word is the law or the truth others are bound to uphold and abide by—there is a complete lack of resistance from the world and from others that gets in the way of knowledge acquisition, that is, in the way of discovering facts without prejudging, of articulating and justifying one’ claims properly, of responding to objections responsibly, of being genuinely open to contrary evidence, and so on. In short, becoming immune to contestation and, therefore, epistemically arrogant is not good cognitive policy. But the powerful can be spoiled not only by enjoying in a disproportionate way the privilege of knowing (or, rather, of being assumed to know), but also by having the privilege of not knowing or of not needing to know. Sometimes there are entire domains that those in a position of privilege do not need to familiarize themselves with. For example, traditionally, members of the upper classes as well as men of all classes (at least until recently) did not have to concern themselves with the minutiae of the domain of domesticity. Not having to do much about housecleaning, meal preparation, the care of children, and so on certainly freed people's time and Cognitive energy so that they could do other things, learn other things, and familiarize themselves with other domains."},{"r":"medina","p":16,"t":"But this epistemic neglect for the domestic also produced some cognitive limitations and cognitive dependencies on others when it came to the domestic aspects of daily life. These cognitive dependencies and limitations have been investigated by feminist theorists and race theorists.§ ‘To an important extent, ° These theorists have also emphasized the corresponding epistemic advantages accrued by those who are forced to do housework and come to develop interesting forms of domestle expertise that can have important ramifications for what one can know in many areas of one’s life, See Allison Wylie (2003), FLGTEVE SRTEUTERTICE, LV IOLC Tey VERT ay Mette Gaerne eee = TPR ENTe i i se re » control of subjects who, how things were done in the household were out of the con ain ” jaber’ no matter how powerful, ignored the details of domestic arrangeme Another area that is also sometimes put out of the cognitive reach of powerfu elites is the domain of the mechanisms of oppression that create marginaliza tion, subjugation, and social death’ —including physical beatin Peseta “ 7 the case of genocide. Although the machinery in charge of the discipline ans punishment of the oppressed is certainly in the hands of those in power, its day-to-day operations—and sometimes even the machinery Steel ane ut always rendered visible to all who occupy a position of power."},{"r":"medina","p":16,"t":"In fact, i ey cases, especially those in which the oppressive mechanisms are particu athe violent (as in systematic torture or genocide), the machinery of oppression is rendered invisible: it is literally put out of sight to protect some members of the privileged class, either because they are depicted as unable to handle it, or ve to spare them unnecessary “troubles.” Thus, despite their greater access id q ‘ facts of social life, privileged subjects often ignore the most violent and hard to-swallow aspects of social confrontation. Those with enormous amounts of power can sometimes be quite ignorant of the violence committed to neat i their privilege, and can be quite genuinely surprised when they find out sn about the oppression of which they are the main beneficiaries. But it is not spe these particular bodies of ignorance that I am interested in Ganoring : he domestic, or ignoring social violence, for example). Rather, I am interested in exposing the cognitive attitudes that support these forms of privileged rotl rance, the epistemic vices that privileged subjects develop to protect t em selves. And the main epistemic vice that results from the privilege of “\" needing to know is a lack of curiosity about those areas of life or those seins domains that one has learned to avoid or not to concern oneself with. ir socially produced and carefully orchestrated lack of curiosity is what I will call epistemic laziness."},{"r":"medina","p":16,"t":"ct a We all feel lazy on occasion; we can all lack the motivation to find ou ci certain things—in fact, only a superhuman knower could be always sith y ‘ embark on every possible discovery journey that comes her way. But epistemic laziness can become a serious problem. It can be said to bea blameworthy rs nitive problem when it becomes a habit. A habitual lack of cabana atrophies one’s cognitive attitudes and dispositions. Continual epistemic neg wi creates blinders that one allows to grow around one’s epistemic perspective, constraining and slanting one’s vantage point. As we shall see, responsible os) stemic agency requires a minimum of diligence, because knowledge a work and its acquisition will not happen without the active participation of the 5 efer avery, servitude, I borrow the notion of social death from Orlando Patterson (1982) to refer to slavery, servit r e’s status as a social actor and a ind other ways of curtailing rights that diminish and even destroy one’s status as a social acto full member of society."},{"r":"medina","p":17,"t":"M4 The Epis tenarogy of ies tstance knower. Becoming lazy is letting oneself go epistemically; and it damages the objectivity of one’s perspective and limits one’s epistemic agency. 'Ihese are also the immediate consequences of epistemic arrogance I just highlighted. ‘The epistemic vice of laziness converges with that of arrogance in seriously compromising one’s learning potential and contributions to knowledge. Like epistemic arrogance, epistemic laziness also has a negative impact not only on the subject’s cognitive perspective, but also on the cognitive perspectives of those around the subject and on the social knowledge that becomes available or unavailable to the relevant communities. Arrogance and laziness support and reinforce each other, individually contributing to the deterioration of the epistemic character of the subject and jointly producing epistemic injustices that ultimately affect all members of society. We need to add a third element to this preliminary sketch of the central vices of the socially spoiled and unvirtuous epistemic agent. Social agents can be ignorant in many ways. As we just saw, sometimes there is ignorance out of luxury—when one does not need to know. But sometimes there is also ignorance out of necessity—when one needs not to know.* There is not needing to know and there is needing not to know."},{"r":"medina","p":17,"t":"‘The cognitive predicament of the privileged involves, in some cases, a not needing to know that leads to epistemic laziness, but it also involves, in other cases, a needing not to know that creates blind spots of a different kind: not just areas of epistemic neglect, but areas of an intense but negative cognitive attention, areas of epistemic hiding—experiences, perspectives, or aspects of social life that require an enormous amount of effort to be hidden and ignored. Ignorance in these cases functions as a defense mechanism that is used to preserve privilege. This kind of avoidance mechanism leads to the third central epistemic vice that can often be found among the privileged: closed-mindedness. In our epistemic lives, we all have things we would rather avoid: things that are hard to hear, things that are difficult to accept or even to acknowledge. We are all closed-minded on occasion; and it would be inhuman to expect that people be open-minded in every respect and in an absolute way. But when one’s mental processing remains systematically closed to certain phenomena, experiences, and perspectives, come what may, and that closed-mindedness erodes reliability, epistemic trust, and one’s general capacity to learn, closed-mindedness has become an epistemic vice, that is, a structural and systematic flaw of one’s * There are indeed many other forms of ignorance that could be added here."},{"r":"medina","p":17,"t":"For example, we could talk about the ignorance that arises out of desire, that is, when one simply wishes or chooses not to know. A volitional element may be involved in the ignorance motivated by need (i.¢,, wanting to ignore) or by lack of need (i.e., not wanting to know); but certain volitions (independently of particular epistemic needs) may also give rise to a distinctive kind of ignorance. Be this as it may, in this discussion I am only interested in the contrast between the ignorance that a ses from epistemic needs (needing not to know) and the ignorance that arises from lack of epistemic need (not needing to know) wore ay ee i ipi ae vdness can be very narrowly epistemic character. Epistemic closed-mindedness can y y focused, targeting very specific experiences and perspectives that one’s mind becomes closed off to. But it usually in i range (no matter how broad or narrow) of experiences and viewpoints that can destabilize (or create trouble for) one’s own perspective. Among the obvious examples of closed-mindedness, we can mention the white supremacist who has deemed the voices and perspectives of members of other racial groups as unworthy of epistemic respect and, therefore, is not open to listen to them and to learn from them; or the sexist man who systematically undermines the epistemic authority of women, gives them no credibility and patholagizes their perception, reasoning, and testimony (depicting them as irrational or hysterical, for example)."},{"r":"medina","p":17,"t":"But closed-mindedness can be an epistemic vice that becomes narrowly circumscribed in a much more specific way: for example, having one’s mind closed off to the evidence surrounding a particular historical event (such as a genocide), or a particular set of experiences (such as the suffering of victims of date rape). The blindness to practices of social violence (such as torture or genocide) mentioned above can in some cases be produced out of epistemic laziness, but it can also be produced out of closed-minded ness: asa result of an active effort not to see, no matter what the evidence may be; as a result of a constant distortion and redescription that leads the subject to be open only to the denial of the phenomenon in question. It is the latter form of blindness that we typically have in mind when we talk about subjects and groups being “in denial” about certain things—such as, for example, the Armenian genocide, the systematic practices of torture during the Bush administration, the cruel exploitation of illegal immigrants along the Southern border of the United States, and so on."},{"r":"medina","p":17,"t":"Is closed-mindedness more likely to appear among the privileged? Does it find a particular form of genesis in the processes of socialization of the upper classes?? As a defense mechanism, those in a position of privilege are often encouraged to hide their heads in the sand like ostriches with respect to cé ij tain aspects, presuppositions, or consequences of the 2 baraian that sustallf their privilege. They need to ignore certain social realities. They need to live without having certain truths present in their minds. They need to avail themselves of blinders so that they do not have to take into account certain things and certain perspectives. This form of cognitive self-protection that constitutes closed-mindedness is typically not erected openly and consciously: that volves the lack of openness to a whole ° John Dewey was among those philosophers who argued that, at the social level, there is a mie form of closed-mindedness that appears in the shape of a natural tendency to fear the foreign bts unfamiliar (“the distinctive aversion of mankind to what is new and unusual”). He linked this natural ism, For an illuminating discussion of Dewey's view and for argu owth of this native tendency, see Sullivan (2006), tendency” to xenophobia and r ments against the analysis of racism as a mere outgr pages 33-43."},{"r":"medina","p":18,"t":"ae is, people do not tell themselves “Let us make ourselves blind to this or that” or “Let us ignore these uncomfortable truths that can undermine out privi lege.” Closed-mindedness as an avoidance strategy is typically an unconscious defense mechanism. It does not result from a decision or a conscious effort to ignore, but from a socialization that leads one to be insensitive to certain things and immune to certain considerations. One of the central goals of this book is to explore the implicit attitudes and unconscious habits that support the kind of closed-mindedness that protects privilege. But interestingly, this kind of closed-mindedness has become an explicit part of the social and political strategies to deal with oppression. An illustration can be found in the liberal strategies with respect to racial and sexual differences in American culture and politics: I am referring to the ideologies of color-blindness® and gender-blindness. T will not focus on the legal, sociopolitical, and institutional aspects of ideologies of color-blindness\" and gender-blindness. Rather, I will focus on the interpersonal dimension of color-blindness and gender-blindness, that is, on how this alleged blindness figures in face-to-face interactions and on its cognitive and affective aspects."},{"r":"medina","p":18,"t":"It is interesting to find so much social encouragement not to pay attention to skin color and gender in a culture that seems obsessed with the racial signifiers of the body and the markers of masculinity and femininity. What does it mean today (or worse yet, in the 1980s and 1990s) not to perceive color or gender in one’s social interactions? And why should anybody think that such blindness constitutes a cognitive and ethical achievement? Consider the following claims: “When I look at you, I do not see gender: T do not see a woman.” “When I look at you, I do not see color: I do not see a black person.’ Is that a compliment? It appears to be more a reflexive remark about the perceiver than a remark about the object perceived. But although ” The ideology of color-blindness has been recently discussed by prominent race theorists such as Linda Alcoff (2006) and Patricia Williams (1997). It will be discussed in later chapters, esp. in 5.2. “ Color-blindness has figured prominently in discussions of racial issues in legislation, social policy, and institutional arrangements (such as the educational system). From Frederick Douglass to Martin Luther King, key African-American thinkers have argued that the ideal of color-blindness can play an important role in the struggle for racial justice."},{"r":"medina","p":18,"t":"From Justice Marshall Harlan to David Hollinger, liberal thinkers have thought of color-blindness as required by procedural conceptions of justice according to which justice must be administered blindly, that is, by treating everybody equally irrespective of gender, race, ethnicity, and so on. For a rich discussion of the different ideologies of colorblindness in the United States, see chapter 2 of Ronald Sundstrom (2008). More recently, Anderson (2011) has discussed color-blindness both as an ideal and as a policy, showing that it is conceptually confused (when different concepts of race are taken into account), empirically misguided (when we consider the evidence about the role of racial differences in our actual lives), and lacks a morally coherent rationale (see chapter 8), Anderson acknowledges that color-blindness can be “a valid ideal? but her arguments persuasively show that this ideal “has no dir application in our nonideal world,” and that it may even be the case that the best way to achieve that ideal would be “to adopt race-conscious integrative policies” (2011, p. 156)."},{"r":"medina","p":18,"t":"Pp STE Y SPE INEBINANCE ACTIVE ISHOPARCE, L:PISteIiitt AEC TS) (ETERS MApEEBE Err eEE 2 7 EREESITS wf , svelop ep there is indeed a certain amount of reflexivity in this attempt to develop epi stemic appreciation for one’s blindness, there is also a distinctive lack of reflec tion: the subject disregards the presuppositions of his or her own perspective and its relation to the perspective of others as genderized and racializec sub jects. Colorand gender-blindness require being actively and proudly ignorant of social positionality, which involves a double epistemic failure: a nionhe self-knowledge and a failure in the knowledge of others with whom one is in timately related. These two failures go together because the lack of fami iarity and critical awareness of one’s social positionality involves not knowing one self in relation to one’s relevant others, that is, not knowing how one’s perspec tive in the world positions itself vis-a-vis differently situated others and their Pathe Teak at you, I do not see color or gender.” What kind of claim is this? And could it ever be made proudly? If so, under what conditions could someone become convinced that blindness is a cognitive or ethical achieve ment of some sort? Perhaps the blind subject who takes pride in not seeing color or gender in others could be calling attention to aspects of social percep tion that we are better off witho"},{"r":"medina","p":18,"t":"ut because they distort interpersonal relations: “Others see you through racial or gender stereotypes; I do not.” Racist sande ist prejudices operate in such a way that people who see through them perceive others as inferior in particular respects. We are certainly better off without such prejudices; but unfortunately they do not disappear by fiat. And note ~ the complete refusal to see color or gender in a racist or sexist society ee implicitly the refusal to acknowledge the force of racist and sexist prejud x and their insidious impact on interpersonal dynamics: “I do not see you as affected by these prejudicial stereotypes, and my social perceptions aed tonite relations are unaffected by them” In other words, the disavowal of racialized or genderized perception involves distancing oneself from the social reality of racism and sexism, and failing to properly acknowledge their influence on social cognition.” nig a Colorand gender-blindness often function as naive disavowals of sexism and racism. Their naiveté consists in assuming that racism and sexism are ide ologies that can be simply rejected by choosing what we see, as if our sabre ized and racialized habits of seeing gender and racial markers could simply be rejected by a volitional act that goes against personal training histories si cultural tendencies."},{"r":"medina","p":18,"t":"It is very telling that “I do not see gender” typically means, “{ do not see you as a woman,’ and “I do not see race” typically means, “I do i erely negative social perceptions. Ag ” Of course racial and gendered seeing involves more than merely negative social perception aie ide »x interpretative horizons that Alcoff (2006) suggests, racial and gender identities provide complex interpretative Hale ; las : se of their experlences ¢ at o| embodied subjectivities use to navigate the world and make sense of their experiences and th others,"},{"r":"medina","p":19,"t":"—<——not see you j ‘ rity.” Wi i “ was a racial minority.’ We would be dealing with a different scenario and ¢ re / ics i > color ; ; different dynamics if the colorand gender-blindness were directed at a srivileged subject: “ 5 » “« “s privileged subject: “I do not see you as a man’, or “I do not see you as white” In this case the object of epistemic hiding would be privilege. It is not acci dental that the proud proclamation of colorand gender-blindnes is offes used with respect to oppressed genderized and racialized subjects for it is used as a denial or disavowal of negative bias and prejudice, that is, to Setanee on self from racist and sexist ideologies and social dliserintetian, But ee ably those who do not see gender and racial differences do not see iva and racial privilege either; and, therefore, their blindness is a form of inten ness not only to social stigmatization, but also to privilege: they do not see (or fail to pay attention to) how masculinity and whiteness can operate 1 of privilege in their lives or that of others. é tg Genderand color-blindness are forms of active ignorance supported b the epistemic vices we have discussed. Genderand color-blind subjects a to arrogantly assume that there is nothing to see, that those aspects of identit can play no role or have no significance, no matter what others see."},{"r":"medina","p":19,"t":"These ar jects also become epistemically lazy, because their pronouncements about what is there to see are prior to and independent of empirical findings a they express an attitude that blocks questions and empirical explorations, Avid finally, these subjects become closed-minded: they close their minds to eeatat possibilities no matter how strong the social and subjective evidence for th relevance of these considerations happens to be. : : What kind of position does the subject occupy while treating others as genderless and colorless subjects? What kind of relationality does shefhe/(t?) enact? Is the subject genderless and colorless? The idea of a genderless d colorless subject remains a social fiction® today and one that runs one our social practices. This fiction seems to be particularly dangerous in a. ciety (such as the United States) in which the mechanisms of social recognition (our social perceptions and imaginings) are so heavily genderized ae racialized. This fiction seems to be doing a lot of ideological work, a lot of covering-up and blocking of social scrutiny. Even now that a culture af recognizing and celebrating differences seems to be flourishing, there are still thee who congratulate themselves for their coloror gender-blindness as an acco: ee plishment others should aspire to achieve."},{"r":"medina","p":19,"t":"But what does that mean? What does this “blindness” involve? Is it a pretend-blindness in which dane what one sees, or a genuine blindness resulting from having been trained not to see? And why should anyone feel proud of having this blindness, of not ® Much more wi said i rc baat ore will be said in later chapters about how social fictions and the social imaginary func in rela sive Nladoaaid eamati MeL. i Vek a to social knowledge and social ignorance, sometimes enabling us to see and hear things. It very often prec tal es set i f h : if y often precluding us from seeing and hearing certain things (see especially the discussi ‘ f social resistances to know in chapters 2, 3, and 5) ji “reek mite seeing certain things—are they not there (at least in some sense)? What does this pride tell us of the subject who proc laims it and of the culture that promul gates it? According to my analysis, the phenomena of colorand gender-blindness occur as part of a larger cultural phenomenon: the phenomenon of the nor malizing and homogenizing tendencies of a privileged perspective that pro tects itself by blocking our recognition of differences. More will be said later about different forms of insensitivity or “blindness”, and about the active ignorance of social positionality that they involve."},{"r":"medina","p":19,"t":"I only want to point out now that these forms of gender and racial blindness involve the three epi stemic vices associated with privilege I have highlighted: they involve arro gance, insofar as the subject presumes to know all there is to know from his own racial and gender perspective (often without realizing that she or he has one); they involve laziness, insofar as there is a clear lack of effort and moti vation to find out more about how racial or gender differences might have an impact on people's experiences and standpoints; and they involve closedmindedness, insofar as there is a lack of cognitive openness to the relevance and importance of racialized or genderized experiences and perspectives. I am interested in exploring the convergence of these epistemic vices not only in the cognitive functioning of colorand gender-blindness, but more gener ally and importantly, in the formation of a particular epistemic character: that of the actively ignorant subject. The epistemic vices of arrogance, laziness, and closed-mindedness greatly contribute to the production of a particular form of ignorance: active igno rance, an ignorance that occurs with the active participation of the subject and with a battery of defense mechanisms, an ignorance that is not easy to undo and correct, for this requires retraining—the reconfiguration of epistemic atti tudes and habits—as well as social change. Those who are epistemically arro gant, lazy, and closed-minded are actively ignorant."},{"r":"medina","p":19,"t":"Actively ignorant subjects are those who can be blamed not just for lacking particular pieces of knowledge, but also for having epistemic attitudes and habits that contribute to create and maintain bodies of ignorance. These subjects are at fault for their complicity (often unconscious and involuntary) with epistemic injustices that support and contribute to situations of oppression. We need to investigate how this form of active ignorance relates to social justice. For example, is ignorance the cause of racial injustice, as Dewey and the early Du Bois, among others, suggested? Or is active ignorance a mere consequence or side effect of a more basic form of injustice and oppression, as classic Marxists would argue? Fol lowing pragmatist race theorists (especially Sullivan), I will defend a transac tional view according to which epistemic injustices are neither the unidirectional cause of social injustices nor their consequence. My overall ar gument in this book aims at providing a more nuanced account of the relation ship between epistemic and social injustices."},{"r":"medina","p":20,"t":"Before we proceed with that argument, a few general remarks and caveats are in order. In the first place, as already pointed out, belonging to the dominant classes is not a necessary condition for having any particular epistemic vice. ‘The vices I have identified as likely to be found among the privileged are not exclusive to this group; they can be found in all corners of the social spectrum— including among the oppressed—but they take different shapes and exhibit different sociogeneses. The starting point of my analysis is simply that the social positionality of agents does matter for the development of their epistemic character, and that particularly extreme and damaging forms of epistemic vices (such as arrogance, laziness, and closed-mindedness) can be found in the privileged classes. In the second place, membership in the privileged classes is not a sufficient condition for the epistemic vices I discuss either. These vices are not universal and automatic features of the cognitive psychology of the privileged: not all members of privileged classes have them, and those who come to belong to these classes do not develop them automatically just by virtue of their membership in this social group. Finally, it is also worth pointing out that, although I take a developmental approach to epistemic virtues and vices, I do not discard genetic factors playing an important role."},{"r":"medina","p":20,"t":"My account is neutral to the presence of genetic influences and predispositions that can affect social cognition and the development of attitudes and habits that compose one’s epistemic character. My discussion will focus on social positionality and habit-forming processes of socialization, but without denying that different subjects may respond quite differently to the same social exposure as a result of their particular genetic predispositions. 1.2. Lucidity and the Epistemic Virtues of the Oppressed. It would be a mistake to romanticize the predicament of the oppressed, or to underestimate the gravity of the cognitive obstacles they have to endure. ‘There is no reason to think that oppressed subjects are at all likely to develop impeccable epistemic characters: epistemic vices of all sorts are definitely possible outcomes of a socialization under conditions of oppression; but, moreover, some epistemic vices are indeed more likely to be found among oppressed subjects, for example (and most prominently), epistemic insecurity or lack of self-confidence on cognitive matters. Accounts of the “Negro mind” from the nineteenth century can be used as an illustration. The other side of Tocqueville's psychological picture of the white Southerner in the 1830s United States is his account of the slave mentality that is produced by an ongoing intellectual subjugation through processes of socialization and control."},{"r":"medina","p":20,"t":"As Tocqueville's provocative thesis at the time suggested, an enslavement that resorts not only to physical violence but also to mental and intellectual violence is much more powerful and lasting than a purely and exclusively physical subjugation.\" There were all sorts of training processes and cultural practices that carefully crafted the slave's manners, attitudes, disposition, and mental habits. ‘The slave mentality that ‘Tocqueville observed during his travels was created through the slave's internalization of the master’s judg ments and expectations. A crucial part of this mindset was the underestima tion of one’s cognitive powers and abilities to the point of an utter lack of self-confidence and epistemic self-trust. ‘Thankfully, the oppressions we still live with today tend to take a much milder form, but they also have an epistemic side; and among the cognitive consequences for marginalized subjects is the feeling of intellectual inferiority, a poor self-assessment of one’s cognitive assets and capacities, which has many ramifications and an overall negative impact on one’s daily life (the way one speaks or thinks; the way one envisions goals as legitimate and feasible, the way one responds to challenges, and so on)."},{"r":"medina","p":20,"t":"In this respect we can think of the feminist research that denounces the epistemic side of the subjugation of women, detailing and elucidating the negative cognitive effects that sexism (along with the wide array of cultural practices that support it) can have for women.\" Since oppression involves corrupted and distorted forms of social relationality, it is not surprising to find that it produces epistemic biases in the form of unfair compar ative judgments that operate implicitly in social interactions and become internalized, with privileged subjects feeling cognitively superior and oppressed subjects feeling cognitively inferior. Sometimes these epistemic biases are internalized to the point of leading to inferiority and superiority complexes.” If, as mentioned above, the thought of being in full cognitive control of reality can illustrate an extreme form of epistemic arrogance of privileged subjects, the analogous illustration of an extreme form of epistemic humility (even self-humiliation) of oppressed subjects can be found in the thought of having no cognitive control whatsoever, even to the point of thinking of oneself as aving no cognitive power or no mind at all."},{"r":"medina","p":20,"t":"In this sense, the particular brand of skepticism that can be most peculiar of the predicament of the oppressed is not skepticism about the external world or about other minds, for indeed oppressed subjects cannot help but feel, often painfully, the resistance of the “It is of course doubtful that there could be enslavement based purely on brute force and without mental subjugation of some sort. But there could be a more superficial and external form of slavery that does not produce a slave mentality that is internalized by the slaves themselves. It is this slave mentality that Tocqueville identified in the United States as being the basis of a particularly powerful and resilient form of enslavement. As he put it, white Southerners had created “intellectual securities for the duration of their power,” employing “their despotism and their power against the human mind” (1990, p. 379). 'S See, for example, Alcoff (2006), © For a brilliant and influential discussion of these complexes and the processes of internalization that cause them, see Fanon (1967)"},{"r":"medina","p":21,"t":"world and the resistance of those subjects who subjugate them.” If there is a form of skepticism that is characteristic of the oppressed, it is ego skepticism: a skepticism about the self, about its capacities and even about its very existence. An internalized lack of appreciation and a constant self-questioning can lead toa poor self-esteem, a lack of self-confidence, and even an inferiority comp e ee Anda skeptical self-questioning can go to the extreme of no longer having any certainty about one’s status as a real person with a mind with full cognitive powers, that is, about one’s status as a subject of knowledge, about one’s humanity and mentality. Charles Mills (1998) has explained this point masterfully. As he puts it, as a result of the “intellectual domination” inflicted by those in a position of power and authority, the oppressed subject may be “frequently assailed by self-doubts, doubts about whether he is a real person who deserves their respect or perhaps an inferior being who deserves the treatment he has received” (p. 9).\"* But besides the possibility of falling into radical skepticism or developing a cognitive pathology (such as an inferiority complex), oppressed subjects will often face more mundane epistemic problems and disadvantages that are constitutive of their oppression (such as lack of access to information and education, and so on). Nothing in what follows tries to deny this or to minimize its importance."},{"r":"medina","p":21,"t":"But, for the purposes of my analysis of the epistemic virtues and vices that can be found in situations of oppression and can be exploited to fight against it, 1 want to call attention to the positive epistemic features we can find in oppressed subjects. Those who grow and live under conditions of oppression are exposed to practices and processes that erode their epistemic character. And yet some epistemic advantages and even some distinctive epistemic virtues have been argued to be characteristic of oppressed subjects in race theory and feminist theory. Following this literature, I want to highlight here three epistemic virtues: humility, curiosity/diligence, and open-mindedness. As they appear among the oppressed, these epistemic virtues are the mirror-image of the epistemic vices of the privileged identified above (arrogance, laziness, and closed-mindedness); and, as I will begin to explain in the next section, they exhibit a parallel underlying epistemic structure. The same caveats I issued with respect to the ” As Charles Mills (1998) puts it, “Only those most solidly attached to the world have the luxury of doubting its reality, whereas those whose attachment is most precarious, whose existence is dependent on the goodwill or ill temper of others, are those compelled to recognize that it exists... ."},{"r":"medina","p":21,"t":"If your daily existence is largely defined by oppression, by forced intercourse with the world, it is not going to occur to you that doubt about your oppressor’s existence could in any way be a serious or pressing philosophical problem; this idea will simply seem frivolous, a perk of social privilege” (p. 8). 8 Mills uses Ralph Ellison's Invisible Man as a powerful illustration of this point. As Ellison’s nameless narrator vividly puts it, “You often doubt if you really exist ... You ache with the need to convince yourself that you do exist in the real world, that you're part of all the sound and anguish, and you strike out with your fists, you curse and you swear to make them recognize you. And, alas, it’s seldom successful” (1952, pp. 3-4) epistemic vices of the privileged apply also to the epistemic virtues of the oppressed; (1) these virtues are not exc lusive to this group (they can be found imong members of other groups); (2) they are not universal features of the epistemic character of oppressed subjects (there are oppressed subjects who lack these virtues); and (3) they are not automatic features (they are not had by ubjects just by virtue of their membership in a social group).” But lam inter ested in elucidating the particular shape that these epistemic virtues can acquire among oppressed subjects and their distinctive genesis under condi (ions of oppression."},{"r":"medina","p":21,"t":"I will now provide a brief introduction of these virtues before I start discussing their formation, functioning, and underlying struc ture in more detail. When not taken to the extreme, attentiveness to one’s cognitive limitations and deficits can indeed be a virtue: the virtue of epistemic humility. When it does not undermine one’s confidence and erode one’s character (that is, when sm tie | it does not become pathological), epistemic humility can afford great benefits. ' Having a humble and self-questioning attitude toward one’s cognitive reper 1 toire can lead to many epistemic achievements and advantages: qualifying one’s beliefs and making finer-grained discriminations; identifying one’s cognitive gaps and what it would take to fill them; being able to formulate ques- ; tions and doubts for oneself and others; and so on. Insofar as humility involves epistemic attitudes and habits conducive to the identification of cognitive lacunas, it can facilitate learning processes and one’s overall cognitive improvement. In this sense, epistemic humility can be seen as a close ally of another epistemic virtue that I want to characterize in a hybrid way in order to capture both its motivational and its performative elements. I will refer to this second epistemic virtue by the name of intellectual curiosity/diligence."},{"r":"medina","p":21,"t":"Intellectual curiosity is more likely to be found among those who come to recognize what they do not know than among arrogant subjects (know-it-alls) who are not well attuned—sometimes even blind—to the cognitive deficits of i their perspective. But of course not all subjects who identify what they cannot i claim to know are automatically motivated to know it; not all such subjects feel an intellectual curiosity that motivates them to fill in their cognitive gaps and to overcome their cognitive limits. And even when subjects are so motivated, it is often the case that, under conditions of oppression, social arrangements and circumstances get in the way of these subjects doing the requisite work to achieve the relevant knowledge: in some cases because they may not have the time or opportunity; in other cases because they may be forbidden from doing so. But at the same time, at least in some areas of life, the intellectual curiosity ” ‘The last two points demand that we build fallibility into our epistemic analysis of standpoints, for no matter how lucid a standpoint may be compared to others, it is always possible for those who hold that standpoint to be in error, The particular brand of standpoint theory that I defend contains an error component, which I hope will become clear throughout the book,"},{"r":"medina","p":22,"t":"PIS DP PSCeT gy OT WROSTSTAnCe and diligence of oppressed subjects often receive some special incentives: these subjects often find themselves in need of certain bodies of knowledge in order to escape punishment or stigmatization, sometimes even to survive, ( )ppressed subjects frequently find themselves forced to acquire deep familiarity with certain domains, developing forms of expertise than no one else has. They often need to know more than they are supposed to—sometimes more than their oppressors. ‘They are often forced to anticipate outcomes and moves in the social game; and sometimes they are also forced to hide this knowledge and render it invisible. Relations of oppression create certain cognitive needs: in order to satisfy one’s master, one needs to learn how to, and this involves knowing the master’s desires and expectations as well as (or better than) the master himself—knowing the details, processes, and procedures concerning the ways in which demands can be satisfied. In other words, the dynamics of oppression creates cognitive disparities that, epistemically speaking, go in the favor of the oppressed because they are the recipients of a surplus of intellectual curiosity and diligence. This is not to be found everywhere, of course, but mainly in those places and areas of social life where privileged subjects do not dwell or dwell only through the mediation of underprivileged subjects (which creates an interesting kind of cognitive dependence)."},{"r":"medina","p":22,"t":"The enhanced intellectual curiosity/diligence of oppressed subjects constantly takes them beyond the confines of their parochial perspective or the standpoint of their own group. ‘his directly relates to a third epistemic virtue: open-mindedness. Oppressed subjects tend to feel the need of being more attentive to the perspectives of others. They have no option but to acknowledge, respect, and (to some extent) inhabit alternative perspectives, in particular the perspective of the dominant other(s). They are often encouraged and typically even forced to see reality not only through their own eyes, but also through the eyes of others whose perspectives and social locations matter more. In this way oppressed subjects accomplish the epistemic feat of maintaining active in their minds two cognitive perspectives simultaneously as they perform various tasks. This is what in race theory, following Du Bois, has been called having a “double consciousness”, The epistemic perspective of oppressed subjects often exhibits a characteristic kind of hybridity, inclusivity, and open-mindedness, whereas the cognitive functioning of privileged elites tends to be more parochial and one-sided, often operating in complete disregard of alternative standpoints."},{"r":"medina","p":22,"t":"My pluralistic account of oppressed and privileged perspectives and their complex relations will complicate this a bit, so that we need to talk about a kaleidoscopic consciousness (rather than a merely dual one) as the proper outcome of epistemic open-mindedness. In the same way that the three vices of privileged subjects converged in what I called active ignorance, the three virtues of oppressed subjects also have a con verging point: a special kind of lucidity, subversive lucidity, which can take dif ferent forms, including critical and experiential lucidity. Epistemic ally humble, aot = ben Active Ignorance, Epistemic Others, anit Ppistemte Uriction 45 curious/diligent, and open-minded subjects are likely to detect and overcome blind spots and to develop new forms of luc idity that can enrich social cognition, If we add to that kind of virtuous character the experience of oppression, of not fitting, of having an alternative viewpoint, then the lucidity of the virtuous sub ject can have a subversive character, having the potential to question widely held assumptions and prejudices, to see things afresh and redirect our perceptual habits, to find a way out or an alternative to epistemic blind alleys, and so on. ‘The characteristic form of lucidity that can be found outside the main stream, in the alternative cognitive perspectives of marginalized subjects, relates to the recent literature that has emphasized the epistemic advantages of the oppressed."},{"r":"medina","p":22,"t":"But should nondominant or underprivileged perspectives enjc vy a prima facie presumption of epistemic superiority, as some have argued? In general, I will contend that this is not the case, because the social distortions and epistemic obstacles created by conditions of oppression affect all subjects, both oppressors and the oppressed, and no one can adjudicate to a particular group a cognitive perspective that is in principle epistemically superior to that of others, claiming to be untainted or to possess some kind of cognitive inno cence. However, differently situated subjects are affected differently by condi tions of oppression; they often accumulate different sets of experience and, as 4 group, they can collectively develop a distinctive repertoire of cognitive as sets and cognitive deficits. We cannot generalize and talk about the epistemic perspective of the oppressed or the epistemic perspective of the oppressor. Such rigid and homogeneous categorizations of social groups lead to nothing but stereotypes, bad sociology, and bad epistemology. There are many hetero geneous perspectives that can coexist in a group or social location, for a social location can be inhabited in many different ways; one can belong to a social group and participate in the life of the group in many different ways."},{"r":"medina","p":22,"t":"We cannot determine in advance, just by virtue of the social location the subject occupies, what his or her epistemic character is and how it compares to that of differently situated subjects. That is, we cannot make such determinations prior to the examination of the subject's trajectory and of the epistemic charac ter the subject has developed. But we can examine individual trajectories and epistemic characters of socially situated subjects, and we can find distinctive epistemic resources and advantages among the members of a group (even if only particular members of that group actually have them). Therefore, although | will depart from those strong positions that attribute some kind of epistemic Superiority to oppressed groups, I will defend the claim that there are distinc live epistemic advantages that can be found among oppressed subje are some critical and demystifying experiences with important consequences for the epistemic character of those who have them, which can only be found s: there in subordinate groups; and there is a special kind of lucidity with a particular subversive force, which can be found among members of those groups. In this sense, I take my qualified position to be close to that of Charles Mills,"},{"r":"medina","p":23,"t":"ay The Epistermotogy of Resistance In his judicious critical review of feminist and race theor y (1998, pp, 21-39), Mills divides the arguments for the epistemic privilege of subordinate groups into two kinds: essentialist arguments from biological causation and construc tivist arguments from social causation. The former have been heavily questioned in recent years because the biological differences between men and women or among members of different races do not seem to constitute the foundation of cognitive differences, at least not independently of how those differences are taken up by particular cultures in particular ways.” On the other hand, constructivist arguments for the epistemic privilege of subordinate groups have also been criticized, especially when they offer a unified or even universal account of how social structures or locations cause epistemic benefits, as Marxist theorists and standpoint theorists sometimes have done. However, while accepting that universal accounts of oppression and homogeneous notions of social locations as unitary perspectives are unsatisfactory, Mills also acknowledges the lessons from black Marxism” and socialist feminism” and insists that much can be learned from an examination of racism and sexism as lived experiences."},{"r":"medina","p":23,"t":"Although there is no universal and unified kind of epistemic privilege that subordinate groups enjoy, I will argue, following Mills, that oppressed groups do have a distinctive set of experiences and that they are better positioned and better equipped for a particular kind of epistemic subversion: what Mills and others have called “the inversion of perspectives.” As Mills puts it, “Hegemonic groups characteristically have experiences that foster illusory perceptions about society's functioning, whereas subordinate groups characteristically have experiences that (at least potentially) give rise to more adequate conceptualizations” (p. 28). Although oppressed subjects can indeed fall victim to socially generated illusions, they often have more resources to undo these illusions, they have a richer (or more heterogeneous) experiential life that they can use to dismantle the accepted description of reality that rules the day. Members of subordinate groups typically have experiences that from the point of view of the dominant ideology or hegemonic perspective are considered alien. As Mills puts it, these experiences are alien because they are “outside the hegemonic framework” and “they redraw the map of what was thought to be already explored territory” (Ibid.)."},{"r":"medina","p":23,"t":"Alien experiences of this sort do not fit in the dominant perspective; they call for a redrawing of conceptual boundaries, for a rearticulation of epistemic norms; and this is not simply a mere adjusting of our perspective, but a radical questioning of assumptions and taken-for-granted descriptions, a challenging in 20 \"This said fe i i This could be said, for example, about the experience of pregnancy, which may belong exclusively to a particular biological group but nonetheless contain inextricably bound biological and cultural elements, s culturally mediated and, as lived experience, may *! See Orlando Patterson (1982) and Cedric Robinson (1983). * See Alison Jaggar (1983) and Sandra Harding (1983), él Active Ignorance, Epistemic Others, and Ppistemic Priction Ay fundamental ways of available frameworks—-in short, an inversion of perspec tives, ‘This not-fitting, this call for a deep transformation, this inversion of per spective, typically has the experiential character of a surprise: it is surprising to the experiential subject who has this experience for the first time, as well as to the rest of society. Mills explains that “the shock arises not merely from the sim ply alien but from the alienated familiar, the presentation of the old from a new angle” (Ibid.)."},{"r":"medina","p":23,"t":"People (including the experiencing subject) may not be ready to accept these alien experiences as genuine experiences, and they may not answer the call for a radical rearticulation or inversion of perspective; instead, their reaction may be to dismiss the experience and block any alternative descriptions of social realities that may result from it. This is to be expected, since we all de velop resistances to accept alternative descriptions of our experienced reality; and typically the more invested people are in those accepted descriptions, the more reluctant they will be to accept alternative ones. But this is all the more reason to be attentive to alien experiences and their critical and transformative potential. This is the core of Mill's argument for alternative epistemologies: those that take into account non-hegemonic perspectives and thus provide an alterna tive to the abstract (decontextualized and dehistoricized) ways of framing epistemological discussions that have dominated the Western philosophical tra dition and have been too complicit with dominant or hegemonic standpoints, As I will discuss in chapter 5, the main cognitive asset of epistemically vir tuous subjects among oppressed groups is their meta-lucidity: their capacity to see the limitations of dominant ways of seeing."},{"r":"medina","p":23,"t":"This meta-lucidity has a critical and subversive potential: it provides insights into the functioning of perspec tives that makes it possible to redraw our cognitive maps, to redescribe our experiences, and to reconceptualize our ways of relating to others. Lucid expe riences of oppression can yield new insights that trigger struggles for the rede scription of the relevant experiences—the cognitive side of social struggles. In the women’s movement, for example, there have been many experiences that have led to the rethinking of sexual norms and the rearticulation of concepts such as that of sexual abuse. These experiences of course encountered resistances of all sorts; and they themselves, on the other hand, became part of a struggle and, therefore, of a way of resisting hegemonic conceptions and the form of oppression supported by those conceptions. It is in this sense that Sandra Harding talks about “the struggle we have had to get women’s testimony about rape, wife battering, sexual harassment, and incest experiences accepted as reliable by police, psychiatrists, other men and women, etc.” (1987, p. 77). Social struggles of this sort draw on the lucid experiences of oppressed subjects and involve a fight against different forms of insensitivity and epistemic resistance. My examination of the cognitive side of these struggles will include an analysis of the subversive lucidity that motivates critique and cog nitive transformation, a lucidity that in order to do its transformative work and produce social change must be supported by epistemic virtues such as"},{"r":"medina","p":24,"t":"48 ‘The Hpistemolopy of Resistance humility, intellectual curiosity/diligence, and open-mindedness. In the next section I will sketch my proposal for a unified analysis of the active ignorance and the subversive lucidity that can be found in contexts of oppression. 1.3. Resistance, Epistemic Responsibility, and the Regulative Principles of “Epistemic Friction” Of the “experiential space” in which a subject leads his or her cognitive life and develops habits, attitudes, and an epistemic character, Charles Mills has said that it is not a homogeneous space, the same for all, but rather, a distinctively social space “full of structured heterogeneities and discontinuities” (1998, p. 27). This is why, Mills argues, we can talk about a “differential group experience” In contrast with the frictionless experiential space of the abstract and universal subject of traditional epistemology, Mills explains the differential experiential perspective of socially situated subjects in terms of resistances: Far from its being the case, then, that an asocial Cartesian knower can move freely along all axes of this space, certain resistances linked specifically to one’s social characteristics and group membership will determine, at least tendentially, the kinds of experiences one is likely to have and the kinds of concepts one is accordingly likely to develop. (1998, p. 28) Resistances can be a good and a bad thing, epistemically speaking. ‘The resistances of your cognitive life keep you grounded."},{"r":"medina","p":24,"t":"As Wittgenstein would put it, in order to have a real (and not simply delusional) cognitive life, “we need friction, we need to go “back to the rough ground.” But there are also resistances that function as obstacles, as weights that slow us down or preclude us from following (or even having access to) certain paths or pursuing further certain questions, problems, curiosities. As a good Aristotelian would say, “resistance” can be predicated in many ways. Without falling into equivocation, we should pay attention to the interrelated senses of resistance that have epistemic relevance. “Resist” comes from the Latin resistere, to take a stand. Its dictionary definition includes both an active and a passive meaning: to exert oneself so as to counteract or defeat; and to withstand the force or effect of. But what would it mean to talk about active or passive resistance epistemically? Can we talk about countering or withstanding epistemic forces? It may seem peculiar to talk about “force” in a cognitive context. We are used to talking about forces in affective contexts, in relation to desires and emotions."},{"r":"medina","p":24,"t":"But what does it mean to talk about forces in relation to beliefs and belief systems? What ordinary ways of talking can help us make sense of force in a cognitive sense? What are the epistemic forces that our everyday and philosophical discourses seem to recognize? We do talk about being cognitively moved, that is, haying motivation to | | ee AQUA) OP a ———— = helleve or not to believe. In this sense, William James, for one, offered a pro voeative account of “the will to believe” (see “The Will to Believe” in his \\Hl96/1992). We also do talk about cognitive influences that play a role in the formation of beliefs. Beliefs can be understood as propositional attitudes that (ve open to influences of all sorts, coming, from all angles. There is a complex et of cognitive influences that impinge upon one from the inside and from the outside, External cognitive influences are typically the focus of attention in discussions of persuasion. Internal cognitive influences are discussed in ac counts of the subject’s cognitive tendencies and predispositions to believe. So, \\ least in these two senses, it seems intuitive to talk about cognitive for 1S cognitive motivations and as cognitive influences. But note that when we talk \\hout resistance, we need to talk about forces in the plural, that is, about the interaction of forces contending with each other. To talk about “resistance” is (o talk about opposing forces."},{"r":"medina","p":24,"t":"When we talk about the resisting subject ina passive way, we focus on the forces that impinge upon her or him, but, if only indirectly, we also talk about the subject's force as reactive. When we talk about the resisting subject in an active way, we call attention to the force that propels the subject’s cognitive trajectory, but, if only indirectly, we also talk about external forces as the background against which the subject steers a course and forms beliefs, the external forces now appearing as reactive, that is, as reacting (o the subject’s trajectory. “Resistance” has a strong reactive meaning: it involves the interplay of forces reacting against each other. The term resistance is often defined in terms of “opposing or retarding forces.’ In its biological meaning, (he term refers to “the inherent ability of an organism to resist harmful influ ences (as disease, toxic agents, or infection)."},{"r":"medina","p":24,"t":"In psychoanalytic theory, resis tance is “a psychological defense mechanism wherein the patient rejects, denies, or otherwise opposes the therapeutic efforts of a psychotherapist.” In political terms, resistance typically refers to “an underground organization of \\ conquered or nearly conquered country engaging in sabotage and secret op erations against occupation forces and collaborators.” Since my account of ep istemic resistances will be grounded in the social positionality and relationality of embodied agents, the sociopolitical, psychological, and even biological meanings of resistance are not entirely irrelevant and will indeed be echoed and used to enrich my account of contextualized epistemic relations; but my focus will be on the epistemic, and the other senses of resistance will remain secondary. What are the different kinds of epistemic resistance that subjects exert or endure in their cognitive lives? There are both internal and external epistemic resistances and each of them can be positive or negative. For example, an » Merriam-Webster also defines resistance as “the capac rain of microorganism to survive exposure to a toxic agent (as a drug) formerly effective against it”"},{"r":"medina","p":25,"t":"50 The Tpistemotoyy of Resistince opposing internal force that counteracts external epistemic influences can be positive insofar as it is critical, unmasks prejudices and biases, reacts to bodies of ignorance, and so on; but it can also be negative insofar as it involves a reluctance to learn or a refusal to believe—the kind of stubbornness that gets in the way of knowledge. On the other hand, the external epistemic resistances one encounters can be positive insofar as they offer beneficial epistemic friction, forcing one to be self-critical, to compare and contrast one’s beliefs, to meet justificatory demands, to recognize cognitive gaps, and so on; but they can also be negative insofar as they produce detrimental epistemic friction, censoring, silencing, or inhibiting the formation of beliefs, the articulations of doubts, the formulation of questions and lines of inquiry, and so on. As Bernard Williams and others have argued,” there is such a thing as epistemic luck: people can be more or less lucky in the epistemic environments they find themselves in; they can be lucky or unlucky in being exposed to beneficial or detrimental resistances. But individuals as well as groups also have to take responsibility for the epistemic environments and the forms of resistance that they contribute to create and to perpetuate. I propose two guiding principles for the epistemology of resistance, principles that will facilitate our analyses of cognitive forces and their interplay."},{"r":"medina","p":25,"t":"‘These are regulative principles that will enable us to dissect and assess different forms of epistemic friction and to navigate our cognitive lives through them. They are the principle of acknowledgement and engagement, and the principle of epistemic equilibrium. The former dictates that all the cognitive forces we encounter must be acknowledged and, insofar as it becomes possible, they must be in some way engaged (even if in some cases only a negative mode of engagement is possible or epistemically beneficial). The latter principle lays out the desideratum of searching for equilibrium in the interplay of cognitive forces, without some forces overpowering others, without some cognitive influences becoming unchecked and unbalanced. In particular, as we shall see, it is important to aim at equilibrium between the internal and the external, or between the perspective of the subject and that of others. This will become tricky because, given processes of internalization and externalization (i.e., of introjection and projection), there is no hard and fast boundary between the inner and the outer, or between the individual subjects and the social groups in which they are embedded."},{"r":"medina","p":25,"t":"Nonetheless, without presupposing any autonomous inner core of the subject untainted by the external and the social, or any social outside unaffected by the individuals composing it, we can elucidate the transactional traffic between the subjective and the intersubjective as mutually constituting and interdependent domains that have to acknowledge and engage each other ' See B., Williams (1993) and (1995). See also Fricker (2007), especially pages 1ol-4 j ' ACTIVE ISMOTUTCe, IPC OE ——————————<—<— yf a 2 | equilibrium and work together toward maintaining some sort of epistemic eqt (no matter how tenuous, fragile, and perfectible), In fact, the principles I ablishing separate and autonomous domains, just mentioned, far from est constitutive interrelations strongly encourage the recognition of the between the individual and the social, and between the inner and the outer. [he acknowledgment of and engagement with cognitive influences and the epistemic equilibrium among them are of the utmost importance, because our cognitive lives are a constant tour de force among a variety of cognitive powers and authorities, of perspectives of varying force, of cognitive impulses and com pulsions. In this tour de force that is our cognitive life, epistemic resistances of all sorts, internal and external, have to be acknowledged and, insofar as it is possible, engaged. We need such resistances, and we need to be attuned to their operations and their effects."},{"r":"medina","p":25,"t":"The absence or denial of internal or external epi stemic resistances will lead to epistemic disequilibria and, over time, to bad ep istemic habits and attitudes, that is, to epistemic vices. Thus, the absence of or insensitivity to external resistances is heavily implicated in the constitution and maintenance of the epistemic vices characteristic of some privileged subjects mentioned above: arrogance, laziness, and closed-mindedness. On the other hand, the absence of or insensitivity to internal resistances is heavily implicated in other epistemic vices that will not be the focus of this book, such as naive credulity and conformism, the lack of epistemic autonomy (ie, not being an independent thinker, not having a criterion of one’s own), and the lack of self-confidence. By contrast, being attuned to the epistemic resistances In ones life can have beneficial consequences in the formation of one’s epistemic charac ter, Being sensitive to the presence and influence of cognitive forces is crucial for the achievement of epistemic virtues. Indeed, as emphasized above, the willi ng ness to put one’s cognitive perspective in relation to that of others—calibrating the different cognitive forces, impulses, and compulsions one is exposed to—is the path to the epistemic virtues that take a characteristic shape among oppress subjects."},{"r":"medina","p":25,"t":"It is mainly because of their special attunement to external epistemic resistances that such subjects exhibit open-mindedness (attentiveness to the perspectives of others, to cognitive and interpretative differences); pepe diligence (answering cognitive calls to find out, to face epistemic challenges head-on, to meet cognitive demands, etc.); and humility (recognizing their cog nitive limitations and gaps, qualifying their claims, etc.). My discussions in subsequent chapters will try to elucidate epistemic vir tues and vices under conditions of oppression in terms of epistemic resistances and their absence. I will argue that the absence of or insensitivity to epistemic resistances promotes active ignorance and the epistemic vices that support it, whereas the acknowledgment of and engagement with epistemic resistances facilitate the achievement of epistemic virtues and, under some conditions, can also produce a subversive luc idity that can have an enormous critical and transformative impact on the epistemic community and its environments."},{"r":"medina","p":26,"t":"7” ATE DE PESTO TORY OF POS ISTANCE A recurrent theme in the discussions that follow will be the epistentic responsi bility that individual subjects and communities have in theit dealings with epistemic resistances: responsibility for the resistances they contribute to maintain or to eradicate, for the ways these resistances are acknowledged or ignored, engaged or failed to be engaged, and for the epistemic equilibriums or disequilibria they contribute to establish and sustain. Before we start with more detailed analyses, I offer a preliminary discussion of epistemic responsibility to give the reader a sense of how this notion will function within the framework of my epistemology of resistance. ‘The ensuing discussions of knowledge and ignorance will be couched in terms of epistemic activities and epistemic forms of inaction. The epistemological framework of this book is a performative and pragmatist one, influenced by Ryle, Wittgenstein, James, and Dewey, among others. According to this framework, knowing is mainly a matter of doing, that is, of engaging in epistemic actions and participating in epistemic practices. My account of epistemic agency in terms of resistances offers a new concept of epistemic responsibility: the responsibility of subjects qua knowers or epistemic agents is, first and foremost, the responsibility to confront internal and external resistances."},{"r":"medina","p":26,"t":"I will argue that individual epistemic responsibility cannot be understood independently of shared epistemic responsibility, for the former is intrinsically social, consisting of our epistemic orientation toward ourselves and toward others, that is, in our responsivity to our own epistemic attitudes (often socially generated or socially mediated) and to the epistemic attitudes of others. On the other hand, in my view, the responsibility of an epistemic community also involves the obligation to confront internal and external resistances, that is, resistances that can be found in the inner workings of the community and resistances that can be found in the interactions between the community in question and other communities (actual or possible). As we will see, any discussion of collective epistemic responsibility should be tied, directly or indirectly, to the individual agents who have the capacity to engage in epistemic transactions, but at the same time, the analysis of the epistemic responsibility of agents cannot disregard the social groups in which these agents are formed. In order to capture this interdependence between the epistemic responsibilities of individuals and communities, I propose an interactionist view of epistemic agency and, following Iris Marion Young (2006, 2011), a social connection model of responsibility which focuses on shared (rather than merely individual or collective) responsibility."},{"r":"medina","p":26,"t":"The capacity for * As in the case of the individual, both internal and external resistances can be either positive or negative, becoming epistemic resources or epistemic obstacles. But this will be elucidated later when we discuss prejudices and critical friction. ** This model will be explicitly discussed in chapter 4 ie Ae = ah ia Rings * An ENN onto. ES a ee eee ere ee i x sd responsibility for patterns of epistemic responsivity and for taking shared respot y | epistemic interaction is developed socially. “4 e € stemi sharacter OF a As a long Aristotelian tradition has argued, the epistemic character ization and training the subject has ubject results from the processes of soc ia =a es received, Epistemic sensibilities are formed through processes of acculturation ind habituation. These sensibilities are typically tacit, implicit, and uncon cious. In their daily transactions, agents are typically not conscious of their istemic attitudes, dispositions, and sensibilities. That is, they are not criti ally aware of their own epistemic character and how it affects their epistemic ransactions (of claim-making, assessing, questioning, doubting, etc.)."},{"r":"medina","p":26,"t":"Naas eless, epistemic agents are responsible for the cognitive actions, poeta nd products that their psychological structures produce or centeale i pt ? uce; and they are (at least partially) responsible for their attitudes, disposi tions, and sensibilities as such—that is, for their epistemic character— when ey are (or can be) challenged or called into question. It will be a very denis ssue when a subject and a community can be said to be ina position to awe ritically aware of their epistemic pitfalls and to start seeing things ge # ys oing things differently, and in short learning and improving. Issues of histor ical contingency, situatedness, and epistemic luck will be in play. Determining what counts as relevant epistemic alternatives will become crucial; and this calls also for an elucidation of the role of the imagination in our epistemic life. Clearly we are not responsible for the family, community, or culture ie which we are born, but we do bear a certain amount of responsibility (share si responsibility) for the marks left on us by different social groups, eas vhs i sustaining the influence of those groups in our acts and in our lives. We are no responsible for the ethical attitudes and norms of our family, sided pA culture; but, to some degree, we are responsible for the influence that those ethical attitudes and norms have had on us, in our character, in our actions, in our lives."},{"r":"medina","p":26,"t":"The same is true for epistemic attitudes and epistemic a some point in one’s life one must take responsibility for the epistemic ch sbi : one has developed and its component parts (particular attitudes, habits, bi sensibilities). As I will argue, this involves becoming aware of who one biy where one is, and where one comes from, that is, understanding one’s soc if trajectory and social positionality. In this sense, responsible agency a t i understanding oneself (at least minimally), which, in turn, requires baie standing others—understanding social positionality and social wg nces for people can become aware of who they are and where they cme rom e y in relation to different social groups and social locations: the groups they fe belonged to and currently belong to, as well as those groups they tee ay d : not, and perhaps will not belong to; and the locations they have bind currently occupy, and the locations they have Not, do not, and aonansa ah cupy. The kind of self knowledge that is required for responsi ale epi If in relation to those significant ever 0¢ stemic agency involves understanding, onese"},{"r":"medina","p":27,"t":"am le) tL) BM ' by others who are similar and different to oneself in various respects,” under standing how one relates to them and who these others are, Responsible epi stemic agency requires both self-knowledge and knowledge of others, simultaneously. ‘That epistemic responsibility (as well as responsible agency more generally) is intimately tied to self-knowledge is an idea that has become familiar to us through Donald Davidson (1984 and 1986) and some of his followers, such as Akeel Bilgrami (1992 and 1998). But I will argue that the same is true of our knowledge of others: responsible agency (including epistemic agency) requires (minimal) knowledge of those social others with whom we interact. A particular subcategory within epistemic responsibility is testimonial responsibility, which includes all the epistemic obligations we have in giving and receiving testimony. Miranda Fricker (2007) has articulated a concept of testimonial responsibility that converges with the social view of epistemic responsibility I am sketching. Fricker focuses on the receiver's side of testimonial responsibility and analyzes it in terms of the obligations we have as hearers to give adequate credibility assessments to speakers who give testimony."},{"r":"medina","p":27,"t":"In testimonial exchanges, hearers who give less credibility than deserved to speakers commit an epistemic injustice, and a systematic one if their unfair credibility assessments are motivated (or simply mediated) by identity prejudices that amount to structural biases against members of certain groups. As Fricker argues, in testimonial exchanges epistemic justice is mainly a matter of corrective virtues, requiring a set of capacities that enables hearers to overcome biases, correct unfair credibility assessments, and become virtuous listeners. Avoiding testimonial injustices requires that subjects examine their social positions and memberships in social groups and their relations to other groups. As Fricker insists, nothing short of a critical awareness of one’s social positionality and social relationality can correct identity prejudices. To avoid epistemic injustices and to become epistemically virtuous, agents need to understand (if only intuitively) how identity power functions in their society, and how epistemic appraisals (such as credibility assessments) and testimonial exchanges are mediated and colored by social perceptions and stereotypes. ‘Therefore, Fricker argues, “Testimonial responsibility requires a distinctly reflexive critical social awareness” (p. 91; my emphasis)."},{"r":"medina","p":27,"t":"Those who are not critically aware of their own social identity and that of others, those who are not sensitive and responsive to the epistemic consequences of social positionality and relationality, cannot correct biases and achieve (or contribute to the achievement of) epistemic justice. In a similar vein, I will argue that epistemic respon
