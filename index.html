ccurred, because the “ideally just” society would have no injustices in its past. Here I can be brief, as Mills’s interpretation of Rawls is clearly mistaken, particularly in light of my argument regarding the complementary relationship between ideal and nonideal theory. As far as I can tell, Rawls uses the phrase “ideally just” only once in A Theory of Justice, and there he clearly means “well-ordered.”20 In a well-ordered society, the basic structure is regulated by a shared conception of justice and its members know that they share the same principles of justice and that their society instantiates them; and they are willing to freely abide by these principles without the incentive of sanctions.21 In a well-ordered society, members have a common basis for determining when violations of justice have occurred. I see no reason to believe that Rawls thought a well-ordered society could never be created out of an unjust one."},{"r":"shelby","p":14,"t":"Indeed, had he thought that, it would not have made sense to explicitly put forward his two principles as fundamental bases for social criticism and guides to social reform: “Viewing the theory of justice as a whole, the ideal part presents a conception of a just society that we are to achieve if we can. Existing institutions are to be judged in light of this conception and held to be unjust to the extent that they depart from it without sufficient reason.”22 In fact, instead of “ideally just,” Rawls more often speaks of “perfectly just,” and in those contexts it is clear that he believes it is possible to move from an unjust social scheme to a perfectly just one.23 Fair Equality of Opportunity and Corrective Justice Finally, I would like to address Mills’s criticisms of my discussion of the fair equality of opportunity principle (FEO). He claims, “Shelby’s strategy for addressing these matters [corrective racial justice], as detailed in part 5 of his article, is to use FEO as the crucial Rawlsian principle” (6). If by “corrective racial justice” Mills means principles of reform and revolution, then his interpretation of me is basically correct, as I see the realization of FEO as an aim of social reform. However, I do not view FEO as a principle of rectification (i.e., as a matter of compensatory justice), contrary to what CPR 1.2_01_Shelby.indd 157 08/08/13 3:08 PM"},{"r":"shelby","p":15,"t":"158 ■ critical philosophy of race Mills says: “[Shelby] is using FEO as if it were a principle of rectificatory justice authorizing wealth transfer” (15; emphasis in original). What I actually say is the following (and Mills quotes the passage): The racially disparate distribution of income, wealth, and ­opportunities that currently obtains in the United States, for example, can be partly explained by the cumulative impact of this history of racial violence and domination. Past racism has led to the development of a class structure in which the members of certain racial minorities (e.g., Native Americans and African Americans) are disproportionately located in its lowest ranks. (1710–11; emphasis added) Notice that I explicitly say I am talking about the “class structure” that was created, in part, by past racial injustice. It is the unfair material disadvantage that was my focus. I was not conflating racial injustice with economic injustice. I was simply pointing out that racial injustices sometimes cause economic inequities. I then go on to say, “Given that ideal theory does not directly address matters of compensatory justice, how, if at all, can Rawls’s theory be useful for addressing this injustice?” (1711; emphasis added) Notice the qualification: I explicitly say that ideal theory does not deal with compensatory justice. And, as has been noted, Rawls does not offer principles of compensatory justice."},{"r":"shelby","p":15,"t":"I then say this: “This principle [FEO], were it to be institutionally realized in a well-ordered society in which the basic liberties were secure and their fair value guaranteed, would mitigate, if not correct, these race-based disadvantages by insuring that the life prospects of racial minorities are not negatively affected by the economic legacy of racial oppression” (1711; emphasis added). The key point is that these socioeconomic disadvantages could be mitigated so that members of historically oppressed racial groups were not materially disadvantaged in the competition for opportunities and valued positions in society. This is not the same as calling for compensation for past wrongs. It would be a forward-looking measure used to bring society closer to the ideal of a well-ordered society. It would not replace the need to make amends for or acknowledge past racial injustice. Nor was I assuming that economic disadvantages are the only unfair disadvantages racial minorities suffer from. As I emphasize, “My main point here, though, is that a basic structure that provided fair equality of opportunity for all citizens regardless of race would remove many of the socioeconomic burdens that racial minorities presently shoulder because of the history of racial CPR 1.2_01_Shelby.indd 158 08/08/13 3:08 PM"},{"r":"shelby","p":16,"t":"159 ■ tommie shelby injustice” (1711; emphasis added). I was not therefore confusing ­distributive justice with compensatory justice. In fact, I have elsewhere emphasized the importance of just this distinction.24 I end my discussion like this: In this way, the fair equality of opportunity principle addresses one of the most urgent concerns of members of the least favored races, namely, to insure that their life prospects are not unfairly diminished by the economic inequalities that have been created by a history of racism. Were this principle institutionally realized and widely recognized, it might also have the effect of sharply reducing the resentment for past racial injustice that some members of disadvantaged racial groups harbor, maybe even leading them to reconsider their insistence on claims to reparations.” (1712; emphasis added) Note that I say it could reduce this resentment. I do not say it would or should eliminate it. Moreover, my point was that some might not press their claim for reparations. I did not mean to imply that, with FEO realized, their claim would no longer be valid or justified. We sometimes have rights to things that we decide, for whatever reason, not to claim. Like financial loans, moral debts can be forgiven. My point was that were FEO instantiated in society, then historically oppressed racial minorities would not be nearly as materially disadvantaged as they are now."},{"r":"shelby","p":16,"t":"FEO requires an equitable distribution of wealth, as the equally talented and ambitious would not have equal prospects in life if there were great disparities in wealth. And a progressive tax scheme that keeps wealth widely dispersed and prohibits large intergenerational wealth transfers within families is, I take it, perfectly compatible with private property. The claim of racial minorities on material reparations for past injustice would thus be less practically urgent and, because of this, they might drop it altogether. Mills rightly insists that the rectification of racial injustice must not be sidestepped or re-described to make redress more palatable to those who oppose it. As he says, “Advocates of reparations, for example—the variety of rectificatory justice for black Americans most discussed over the past decade— would contend that justice has not been done unless the circumstances make a particular description appropriate” (13; emphasis in ­original). I agree with this and, in fact, have insisted on the point in another ­context.25 Nor would I deny the place of “truth and reconciliation ­commissions, ­acknowledgments of wrongdoing, apologies, genuine repentance, ­community repair, ­restoration CPR 1.2_01_Shelby.indd 159 08/08/13 3:08 PM"},{"r":"shelby","p":17,"t":"160 ■ critical philosophy of race of civic trust” in a general theory of corrective justice (13). Even if members of historically oppressed racial groups relinquished their claim for material reparations, they could still justly demand such symbolic efforts. If my argument is sound, then material reparations for past racial injustice should be regarded as less central to the project of corrective racial justice than Mills assumes. Many black radicals are of course skeptical about the prospects for meaningful social change in racist societies, and so they often advocate emigration, secession, or internal separation over reform or revolutionary efforts. Consequently, they often prioritize the fight for material reparations over the protracted struggle for a well-ordered society. But even here (and leaving aside which is more feasible), the question of the internal institutional structure of black self-determination would remain and thus also the questions ideal theory addresses. The fundamental normative question for the members of historically oppressed groups still living in the midst of societal injustice should not be “Are we due reparations for our injuries” but “What kind of society would merit our allegiance and is therefore worth fighting for?” Conclusion I am not opposed to abandoning an old paradigm when its limits have been demonstrated and a better approach emerges."},{"r":"shelby","p":17,"t":"If important questions cannot be answered within the old framework, we should of course revise the framework, choose another, or devise a new one. But I also think we should be careful to avoid reinventing the wheel (particularly when the reinvention is likely to work less well). I continue to think Rawls’s rich and well-developed theoretical framework is amenable to developing a nonideal theory of racial justice and so does not require “radical revision” on that score. And though I have learned much from, and am generally sympathetic to, Mills’s provocative writings on racial justice, I have yet to see a convincing argument from him that leads me to reconsider my stance on the value of Rawlsian liberalism for thinking about racial justice. notes For helpful comments on an earlier draft of this article, I’m grateful to Derrick Darby and Brandon Terry. 1. Charles W. Mills, The Racial Contract (Ithaca, NY: Cornell University Press, 1997). 2. \u0007See Charles W. Mills, “‘Ideal Theory’ as Ideology,” Hypatia 20, no. 3 (2005): ­165–84; Charles W. Mills, “Racial Liberalism,” PMLA 123, no. 5 (2008): 1380–97; and CPR 1.2_01_Shelby.indd 160 08/08/13 3:08 PM"},{"r":"shelby","p":18,"t":"161 ■ tommie shelby Charles W. Mills, “Rawls on Race/Race in Rawls,” in “Race, Racism, and Liberalism in the Twenty-First Century,” ed. Bill E. Lawson, supplement, Southern Journal of Philosophy 47 (2009): 161–84. 3. \u0007See Charles W. Mills, “Retrieving Rawls for Racial Justice? A Critique of Tommie Shelby,” Critical Philosophy of Race 1, no. 1 (2013): 1–27; and Tommie Shelby, “Race and Social Justice: Rawlsian Considerations,” Fordham Law Review 72, no. 5 (2004): 1697–1714. Subsequent page references to these two articles will appear in the main body of the text. 4. J\u0007 ohn Rawls, A Theory of Justice, rev. ed. (Cambridge, MA: Harvard University Press, 1999), 8 and 309. 5. S \u0007 ee, for example, Bernard R. Boxill, “The Morality of Reparation,” Social Theory and Practice 2, no. 1 (1972): 113–23; Bernard R. Boxill, “A Lockean Argument For Black Reparations,” Journal of Ethics 7 (2003): 63–91; Howard McGary, Race and Social Justice (Malden, MA: Blackwell, 1999), chaps. 6–7; and Howard McGary, “Achieving Democratic Equality: Forgiveness, Reconciliation, and Reparations,” Journal of Ethics 7 (2003): 93–113. For treatments of compensatory justice beyond but including the rectification of racial injustice, see the essays in Injustice and Rectification, ed. Rodney C. Roberts (New York: Peter Lang, 2002). 6. Mills, “‘Ideal Theory’ as Ideology,” 166. 7. Ibid., 172 (emphasis in original). 8. \u0007See my “Is Racism in the ‘Heart’?” Journal of Social Philosophy 33, no."},{"r":"shelby","p":18,"t":"3 (2002): 411–20; and “Ideology, Racism, and Critical Social Theory,” The Philosophical Forum 34, no. 2 (2003): 153–88. 9. Rawls, A Theory of Justice, 215–16. 10. Ibid., 118–23. 11. Ibid., 7–8. 12. Ibid., 15–19. 13. Mills, “Racial Liberalism,” 1390. 14. \u0007I rather doubt this, though. In the United States today, for example, there is much disagreement over what constitutes racism and racial discrimination, whether ­racial profiling is always unjust, and whether racial disparities in wealth are unfair. Ideal theory can, I believe, help to illuminate these issues. 15. \u0007The distinction is illuminatingly discussed in A. John Simmons, “Ideal and N­onideal Theory,” Philosophy and Public Affairs 38, no. 1 (2010): 5–36; and ­Zophia Stemployska and Adam Swift, “Ideal and Non-Ideal Theory” in The Oxford ­Handbook of Political Philosophy, ed. David Estlund (Oxford: Oxford University Press, 2012), 373–89. 16. \u0007See, for example, my We Who Are Dark: The Philosophical Foundations of Solidarity (Cambridge, MA: Harvard University Press, 2005); “Justice, Deviance, and the Dark Ghetto,” Philosophy and Public Affairs 35, no. 2 (2007): 126–60; “The Ethics of Uncle Tom’s Children,” Critical Inquiry 38, no. 3 (2012): 513–32; and “Justice, Work, and the Ghetto Poor,” Law and Ethics of Human Rights 6, no. 1 (2012): 70–96. CPR 1.2_01_Shelby.indd 161 08/08/13 3:08 PM"},{"r":"shelby","p":19,"t":"162 ■ critical philosophy of race 17. \u0007The language of “ideals of justice” in this paragraph should not be construed as suggesting that the members of any actual society, including those in the United States, are already committed, even in principle, to these ideals. Nor should the ideals in question be thought of as a codification or systemization of the norms of any actual society, again including the United States. Rawls, though an American, is not putting forward the United States as a place that approximates a well-ordered society. Nothing should be more obvious than that American society does not come close to realizing Rawls’s second principle (even without the demanding difference principle), and that violations of the first principle (even after the fall of Jim Crow) are not infrequent. 18. \u0007It might be possible to use the device of the original position and the veil of ignorance (perhaps within the four-stage sequence of application) to answer some of these questions. But I won’t pursue this possibility here. 19. Mills, “Rawls on Race” (emphasis in original). 20. Rawls, A Theory of Justice, 417. 21. Ibid., 49, 275, and 397. 22. Ibid., 216. 23. Ibid., 215–16. 24. \u0007See the discussion of Lawrie Balfour’s treatment of reparations in my “Reparations, Leadership, and Democracy: A Comment on Balfour and Gooding-Williams,” Du Bois Review 8, no. 2 (2011): 395–99. 25. S \u0007 ee my “Justice and Racial Conciliation: Two Visions,” Daedalus (Winter 2011): 95–107. CPR 1.2_01_Shelby.indd 162 08/08/13 3:08 PM"},{"r":"mill","p":1,"t":"UTILITARIANISM by John Stuart Mill (1863) Chapter 2 What Utilitarianism Is. … The creed which accepts as the foundation of morals, Utility, or the Greatest Happiness Principle, holds that actions are right in proportion as they tend to promote happiness, wrong as they tend to produce the reverse of happiness. By happiness is intended pleasure, and the absence of pain; by unhappiness, pain, and the privation of pleasure. To give a clear view of the moral standard set up by the theory, much more requires to be said; in particular, what things it includes in the ideas of pain and pleasure; and to what extent this is left an open question. But these supplementary explanations do not affect the theory of life on which this theory of morality is groundednamely, that pleasure, and freedom from pain, are the only things desirable as ends; and that all desirable things (which are as numerous in the utilitarian as in any other scheme) are desirable either for the pleasure inherent in themselves, or as means to the promotion of pleasure and the prevention of pain. Now, such a theory of life excites in many minds, and among them in some of the most estimable in feeling and purpose, inveterate dislike."},{"r":"mill","p":1,"t":"To suppose that life has (as they express it) no higher end than pleasureno better and nobler object of desire and pursuitthey designate as utterly mean and grovelling; as a doctrine worthy only of swine, to whom the followers of Epicurus were, at a very early period, contemptuously likened; and modern holders of the doctrine are occasionally made the subject of equally polite comparisons by its German, French, and English assailants. When thus attacked, the Epicureans have always answered, that it is not they, but their accusers, who represent human nature in a degrading light; since the accusation supposes human beings to be capable of no pleasures except those of which swine are capable. If this supposition were true, the charge could not be gainsaid, but would then be no longer an imputation; for if the sources of pleasure were precisely the same to human beings and to swine, the rule of life which is good enough for the one would be good enough for the other. The comparison of the Epicurean life to that of beasts is felt as degrading, precisely because a beast's pleasures do not satisfy a human being's conceptions of happiness. Human beings have faculties more elevated than the animal appetites, and when once made conscious of them, do not regard anything as happiness which does not include their gratification. I do not, indeed, consider the Epicureans to have been by any means faultless in drawing out their scheme of consequences from the utilitarian principle."},{"r":"mill","p":1,"t":"To do this in any sufficient manner, many Stoic, as well as Christian elements require to be included. But there is no known Epicurean theory of life which does not assign to the pleasures of the intellect, of the feelings and imagination, and of the moral sentiments, a much higher value as pleasures than to those of mere sensation. It must be admitted, however, that utilitarian writers in general have placed the"},{"r":"mill","p":2,"t":"superiority of mental over bodily pleasures chiefly in the greater permanency, safety, uncostliness, etc., of the formerthat is, in their circumstantial advantages rather than in their intrinsic nature. And on all these points utilitarians have fully proved their case; but they might have taken the other, and, as it may be called, higher ground, with entire consistency. It is quite compatible with the principle of utility to recognise the fact, that some kinds of pleasure are more desirable and more valuable than others. It would be absurd that while, in estimating all other things, quality is considered as well as quantity, the estimation of pleasures should be supposed to depend on quantity alone. If I am asked, what I mean by difference of quality in pleasures, or what makes one pleasure more valuable than another, merely as a pleasure, except its being greater in amount, there is but one possible answer. Of two pleasures, if there be one to which all or almost all who have experience of both give a decided preference, irrespective of any feeling of moral obligation to prefer it, that is the more desirable pleasure."},{"r":"mill","p":2,"t":"If one of the two is, by those who are competently acquainted with both, placed so far above the other that they prefer it, even though knowing it to be attended with a greater amount of discontent, and would not resign it for any quantity of the other pleasure which their nature is capable of, we are justified in ascribing to the preferred enjoyment a superiority in quality, so far outweighing quantity as to render it, in comparison, of small account. Now it is an unquestionable fact that those who are equally acquainted with, and equally capable of appreciating and enjoying, both, do give a most marked preference to the manner of existence which employs their higher faculties. Few human creatures would consent to be changed into any of the lower animals, for a promise of the fullest allowance of a beast's pleasures; no intelligent human being would consent to be a fool, no instructed person would be an ignoramus, no person of feeling and conscience would be selfish and base, even though they should be persuaded that the fool, the dunce, or the rascal is better satisfied with his lot than they are with theirs. They would not resign what they possess more than he for the most complete satisfaction of all the desires which they have in common with him. If they ever fancy they would, it is only in cases of unhappiness so extreme, that to escape from it they would exchange their lot for almost any other, however undesirable in their own eyes."},{"r":"mill","p":2,"t":"A being of higher faculties requires more to make him happy, is capable probably of more acute suffering, and certainly accessible to it at more points, than one of an inferior type; but in spite of these liabilities, he can never really wish to sink into what he feels to be a lower grade of existence. We may give what explanation we please of this unwillingness; we may attribute it to pride, a name which is given indiscriminately to some of the most and to some of the least estimable feelings of which mankind are capable: we may refer it to the love of liberty and personal independence, an appeal to which was with the Stoics one of the most effective means for the inculcation of it; to the love of power, or to the love of excitement, both of which do really enter into and contribute to it: but its most appropriate appellation is a sense of dignity, which all human beings possess in one form or other, and in some, though by no means in exact, proportion to their higher faculties, and which is so essential a part of the happiness of those in whom it is strong, that nothing which conflicts with it could be, otherwise than momentarily, an object of desire to them. Whoever supposes that this preference takes place at a sacrifice of happiness – that the superior being, in anything like equal circumstances, is not happier than the"},{"r":"mill","p":3,"t":"inferiorconfounds the two very different ideas, of happiness, and content. It is indisputable that the being whose capacities of enjoyment are low, has the greatest chance of having them fully satisfied; and a highly endowed being will always feel that any happiness which he can look for, as the world is constituted, is imperfect. But he can learn to bear its imperfections, if they are at all bearable; and they will not make him envy the being who is indeed unconscious of the imperfections, but only because he feels not at all the good which those imperfections qualify. It is better to be a human being dissatisfied than a pig satisfied; better to be Socrates dissatisfied than a fool satisfied. And if the fool, or the pig, are a different opinion, it is because they only know their own side of the question. The other party to the comparison knows both sides. It may be objected, that many who are capable of the higher pleasures, occasionally, under the influence of temptation, postpone them to the lower. But this is quite compatible with a full appreciation of the intrinsic superiority of the higher. Men often, from infirmity of character, make their election for the nearer good, though they know it to be the less valuable; and this no less when the choice is between two bodily pleasures, than when it is between bodily and mental. They pursue sensual indulgences to the injury of health, though perfectly aware that health is the greater good."},{"r":"mill","p":3,"t":"It may be further objected, that many who begin with youthful enthusiasm for everything noble, as they advance in years sink into indolence and selfishness. But I do not believe that those who undergo this very common change, voluntarily choose the lower description of pleasures in preference to the higher. I believe that before they devote themselves exclusively to the one, they have already become incapable of the other. Capacity for the nobler feelings is in most natures a very tender plant, easily killed, not only by hostile influences, but by mere want of sustenance; and in the majority of young persons it speedily dies away if the occupations to which their position in life has devoted them, and the society into which it has thrown them, are not favourable to keeping that higher capacity in exercise. Men lose their high aspirations as they lose their intellectual tastes, because they have not time or opportunity for indulging them; and they addict themselves to inferior pleasures, not because they deliberately prefer them, but because they are either the only ones to which they have access, or the only ones which they are any longer capable of enjoying. It may be questioned whether any one who has remained equally susceptible to both classes of pleasures, ever knowingly and calmly preferred the lower; though many, in all ages, have broken down in an ineffectual attempt to combine both. From this verdict of the only competent judges, I apprehend there can be no appeal."},{"r":"mill","p":3,"t":"On a question which is the best worth having of two pleasures, or which of two modes of existence is the most grateful to the feelings, apart from its moral attributes and from its consequences, the judgment of those who are qualified by knowledge of both, or, if they differ, that of the majority among them, must be admitted as final. And there needs be the less hesitation to accept this judgment respecting the quality of pleasures, since there is no other tribunal to be referred to even on the question of quantity. What means are there of determining which is the acutest of two pains, or the intensest of two pleasurable sensations, except the general suffrage of those who are familiar with both? Neither pains nor pleasures are homogeneous, and pain is always heterogeneous with pleasure. What is there to decide whether a particular pleasure is worth purchasing at the cost of a particular"},{"r":"mill","p":4,"t":"pain, except the feelings and judgment of the experienced? When, therefore, those feelings and judgment declare the pleasures derived from the higher faculties to be preferable in kind, apart from the question of intensity, to those of which the animal nature, disjoined from the higher faculties, is suspectible, they are entitled on this subject to the same regard. … I must again repeat, what the assailants of utilitarianism seldom have the justice to acknowledge, that the happiness which forms the utilitarian standard of what is right in conduct, is not the agent's own happiness, but that of all concerned. As between his own happiness and that of others, utilitarianism requires him to be as strictly impartial as a disinterested and benevolent spectator. In the golden rule of Jesus of Nazareth, we read the complete spirit of the ethics of utility. To do as you would be done by, and to love your neighbour as yourself, constitute the ideal perfection of utilitarian morality."},{"r":"mill","p":4,"t":"As the means of making the nearest approach to this ideal, utility would enjoin, first, that laws and social arrangements should place the happiness, or (as speaking practically it may be called) the interest, of every individual, as nearly as possible in harmony with the interest of the whole; and secondly, that education and opinion, which have so vast a power over human character, should so use that power as to establish in the mind of every individual an indissoluble association between his own happiness and the good of the whole; especially between his own happiness and the practice of such modes of conduct, negative and positive, as regard for the universal happiness prescribes; so that not only he may be unable to conceive the possibility of happiness to himself, consistently with conduct opposed to the general good, but also that a direct impulse to promote the general good may be in every individual one of the habitual motives of action, and the sentiments connected therewith may fill a large and prominent place in every human being's sentient existence."},{"r":"mill","p":4,"t":"If the, impugners of the utilitarian morality represented it to their own minds in this its, true character, I know not what recommendation possessed by any other morality they could possibly affirm to be wanting to it; what more beautiful or more exalted developments of human nature any other ethical system can be supposed to foster, or what springs of action, not accessible to the utilitarian, such systems rely on for giving effect to their mandates. The objectors to utilitarianism cannot always be charged with representing it in a discreditable light. On the contrary, those among them who entertain anything like a just idea of its disinterested character, sometimes find fault with its standard as being too high for humanity. They say it is exacting too much to require that people shall always act from the inducement of promoting the general interests of society. But this is to mistake the very meaning of a standard of morals, and confound the rule of action with the motive of it. It is the business of ethics to tell us what are our duties, or by what test we may know them; but no system of ethics requires that the sole motive of all we do shall be a feeling of duty; on the contrary, ninety-nine hundredths of all our actions are done from other motives, and rightly so done, if the rule of duty does not condemn them."},{"r":"mill","p":4,"t":"It is the more unjust to utilitarianism that this particular misapprehension should be made a ground of objection to it, inasmuch as utilitarian moralists have gone beyond almost all others in affirming that the motive has nothing to do with the morality of the action, though much with the worth of the agent. He who saves a fellow creature from drowning does what is morally right, whether his motive be duty, or the hope of being paid for his trouble; he who"},{"r":"mill","p":5,"t":"betrays the friend that trusts him, is guilty of a crime, even if his object be to serve another friend to whom he is under greater obligations. But to speak only of actions done from the motive of duty, and in direct obedience to principle: it is a misapprehension of the utilitarian mode of thought, to conceive it as implying that people should fix their minds upon so wide a generality as the world, or society at large. The great majority of good actions are intended not for the benefit of the world, but for that of individuals, of which the good of the world is made up; and the thoughts of the most virtuous man need not on these occasions travel beyond the particular persons concerned, except so far as is necessary to assure himself that in benefiting them he is not violating the rights, that is, the legitimate and authorised expectations, of any one else. The multiplication of happiness is, according to the utilitarian ethics, the object of virtue: the occasions on which any person (except one in a thousand) has it in his power to do this on an extended scale, in other words to be a public benefactor, are but exceptional; and on these occasions alone is he called on to consider public utility; in every other case, private utility, the interest or happiness of some few persons, is all he has to attend to. Those alone the influence of whose actions extends to society in general, need concern themselves habitually about large an object."},{"r":"mill","p":5,"t":"In the case of abstinences indeedof things which people forbear to do from moral considerations, though the consequences in the particular case might be beneficialit would be unworthy of an intelligent agent not to be consciously aware that the action is of a class which, if practised generally, would be generally injurious, and that this is the ground of the obligation to abstain from it. The amount of regard for the public interest implied in this recognition, is no greater than is demanded by every system of morals, for they all enjoin to abstain from whatever is manifestly pernicious to society. The same considerations dispose of another reproach against the doctrine of utility, founded on a still grosser misconception of the purpose of a standard of morality, and of the very meaning of the words right and wrong. It is often affirmed that utilitarianism renders men cold and unsympathising; that it chills their moral feelings towards individuals; that it makes them regard only the dry and hard consideration of the consequences of actions, not taking into their moral estimate the qualities from which those actions emanate."},{"r":"mill","p":5,"t":"If the assertion means that they do not allow their judgment respecting the rightness or wrongness of an action to be influenced by their opinion of the qualities of the person who does it, this is a complaint not against utilitarianism, but against having any standard of morality at all; for certainly no known ethical standard decides an action to be good or bad because it is done by a good or a bad man, still less because done by an amiable, a brave, or a benevolent man, or the contrary. These considerations are relevant, not to the estimation of actions, but of persons; and there is nothing in the utilitarian theory inconsistent with the fact that there are other things which interest us in persons besides the rightness and wrongness of their actions. The Stoics, indeed, with the paradoxical misuse of language which was part of their system, and by which they strove to raise themselves above all concern about anything but virtue, were fond of saying that he who has that has everything; that he, and only he, is rich, is beautiful, is a king. But no claim of this description is made for the virtuous man by the utilitarian doctrine. Utilitarians are quite aware that there are other desirable possessions and qualities besides virtue, and are perfectly willing to allow to all of them their full worth. They are also aware that a right action does not necessarily indicate a virtuous character, and that actions which are blamable, often proceed from qualities entitled to praise. When this is apparent in any particular case, it modifies their estimation, not certainly of the act, but of the agent. I grant that they are, notwithstanding, of"},{"r":"mill","p":6,"t":"opinion, that in the long run the best proof of a good character is good actions; and resolutely refuse to consider any mental disposition as good, of which the predominant tendency is to produce bad conduct. This makes them unpopular with many people; but it is an unpopularity which they must share with every one who regards the distinction between right and wrong in a serious light; and the reproach is not one which a conscientious utilitarian need be anxious to repel. … We not uncommonly hear the doctrine of utility inveighed against as a godless doctrine. If it be necessary to say anything at all against so mere an assumption, we may say that the question depends upon what idea we have formed of the moral character of the Deity. If it be a true belief that God desires, above all things, the happiness of his creatures, and that this was his purpose in their creation, utility is not only not a godless doctrine, but more profoundly religious than any other. If it be meant that utilitarianism does not recognise the revealed will of God as the supreme law of morals, I answer, that a utilitarian who believes in the perfect goodness and wisdom of God, necessarily believes that whatever God has thought fit to reveal on the subject of morals, must fulfil the requirements of utility in a supreme degree."},{"r":"mill","p":6,"t":"But others besides utilitarians have been of opinion that the Christian revelation was intended, and is fitted, to inform the hearts and minds of mankind with a spirit which should enable them to find for themselves what is right, and incline them to do it when found, rather than to tell them, except in a very general way, what it is; and that we need a doctrine of ethics, carefully followed out, to interpret to us the will God. Whether this opinion is correct or not, it is superfluous here to discuss; since whatever aid religion, either natural or revealed, can afford to ethical investigation, is as open to the utilitarian moralist as to any other. He can use it as the testimony of God to the usefulness or hurtfulness of any given course of action, by as good a right as others can use it for the indication of a transcendental law, having no connection with usefulness or with happiness. … Again, defenders of utility often find themselves called upon to reply to such objections as thisthat there is not time, previous to action, for calculating and weighing the effects of any line of conduct on the general happiness. This is exactly as if any one were to say that it is impossible to guide our conduct by Christianity, because there is not time, on every occasion on which anything has to be done, to read through the Old and New Testaments. The answer to the objection is, that there has been ample time, namely, the whole past duration of the human species."},{"r":"mill","p":6,"t":"During all that time, mankind have been learning by experience the tendencies of actions; on which experience all the prudence, as well as all the morality of life, are dependent. People talk as if the commencement of this course of experience had hitherto been put off, and as if, at the moment when some man feels tempted to meddle with the property or life of another, he had to begin considering for the first time whether murder and theft are injurious to human happiness. Even then I do not think that he would find the question very puzzling; but, at all events, the matter is now done to his hand. It is truly a whimsical supposition that, if mankind were agreed in considering utility to be the test of morality, they would remain without any agreement as to what is useful, and would take no measures for having their notions on the subject taught to"},{"r":"mill","p":7,"t":"the young, and enforced by law and opinion. There is no difficulty in proving any ethical standard whatever to work ill, if we suppose universal idiocy to be conjoined with it; but on any hypothesis short of that, mankind must by this time have acquired positive beliefs as to the effects of some actions on their happiness; and the beliefs which have thus come down are the rules of morality for the multitude, and for the philosopher until he has succeeded in finding better. That philosophers might easily do this, even now, on many subjects; that the received code of ethics is by no means of divine right; and that mankind have still much to learn as to the effects of actions on the general happiness, I admit, or rather, earnestly maintain. The corollaries from the principle of utility, like the precepts of every practical art, admit of indefinite improvement, and, in a progressive state of the human mind, their improvement is perpetually going on. But to consider the rules of morality as improvable, is one thing; to pass over the intermediate generalisations entirely, and endeavour to test each individual action directly by the first principle, is another. It is a strange notion that the acknowledgment of a first principle is inconsistent with the admission of secondary ones. To inform a traveller respecting the place of his. ultimate destination, is not to forbid the use of landmarks and direction-posts on the way."},{"r":"mill","p":7,"t":"The proposition that happiness is the end and aim of morality, does not mean that no road ought to be laid down to that goal, or that persons going thither should not be advised to take one direction rather than another. Men really ought to leave off talking a kind of nonsense on this subject, which they would neither talk nor listen to on other matters of practical concernment. Nobody argues that the art of navigation is not founded on astronomy, because sailors cannot wait to calculate the Nautical Almanack. Being rational creatures, they go to sea with it ready calculated; and all rational creatures go out upon the sea of life with their minds made up on the common questions of right and wrong, as well as on many of the far more difficult questions of wise and foolish. And this, as long as foresight is a human quality, it is to be presumed they will continue to do. Whatever we adopt as the fundamental principle of morality, we require subordinate principles to apply it by; the impossibility of doing without them, being common to all systems, can afford no argument against any one in particular; but gravely to argue as if no such secondary principles could be had, and as if mankind had remained till now, and always must remain, without drawing any general conclusions from the experience of human life, is as high a pitch, I think, as absurdity has ever reached in philosophical controversy."},{"r":"mill","p":7,"t":"The remainder of the stock arguments against utilitarianism mostly consist in laying to its charge the common infirmities of human nature, and the general difficulties which embarrass conscientious persons in shaping their course through life. We are told that a utilitarian will be apt to make his own particular case an exception to moral rules, and, when under temptation, will see a utility in the breach of a rule, greater than he will see in its observance. But is utility the only creed which is able to furnish us with excuses for evil doing, and means of cheating our own conscience? They are afforded in abundance by all doctrines which recognise as a fact in morals the existence of conflicting considerations; which all doctrines do, that have been believed by sane persons. It is not the fault of any creed, but of the complicated nature of human affairs, that rules of conduct cannot be so framed as to require no exceptions, and that hardly any kind of action can safely be laid down as either always obligatory or always condemnable. There is no ethical creed which does not temper the rigidity of its laws, by giving a certain latitude, under the moral responsibility of the agent, for accommodation to peculiarities of circumstances; and under every creed, at the opening thus made, self-deception and dishonest casuistry"},{"r":"mill","p":8,"t":"get in. There exists no moral system under which there do not arise unequivocal cases of conflicting obligation. These are the real difficulties, the knotty points both in the theory of ethics, and in the conscientious guidance of personal conduct. They are overcome practically, with greater or with less success, according to the intellect and virtue of the individual; but it can hardly be pretended that any one will be the less qualified for dealing with them, from possessing an ultimate standard to which conflicting rights and duties can be referred. If utility is the ultimate source of moral obligations, utility may be invoked to decide between them when their demands are incompatible. Though the application of the standard may be difficult, it is better than none at all: while in other systems, the moral laws all claiming independent authority, there is no common umpire entitled to interfere between them; their claims to precedence one over another rest on little better than sophistry, and unless determined, as they generally are, by the unacknowledged influence of considerations of utility, afford a free scope for the action of personal desires and partialities. We must remember that only in these cases of conflict between secondary principles is it requisite that first principles should be appealed to. There is no case of moral obligation in which some secondary principle is not involved; and if only one, there can seldom be any real doubt which one it is, in the mind of any person by whom the principle itself is recognised."},{"r":"harsanyi","p":1,"t":"Social Philosophy & Policy 2:2 Spring 1985 ISSN 0265-0525 $2.00 RULE UTILITARIANISM, EQUALITY, AND JUSTICE Joun C. Harsanyi Utilitarianism and the Concept of Social Utility In this paper I propose to discuss the concepts of equality and justice from a rule utilitarian point of view, after some comments on the rule utilitarian point of view itself.’ Let me start with the standard definitions. Act utilitarianism is the theory that a morally right action is one that in the existing situation will produce the highest expected social utility. (I am using the adjective “expected” in the sense of mathematical expectation.) In contrast, rule utilitarianism is the theory that a morally right action is simply an action conforming to the correct moral rule applicable to the existing situation. The correct moral rule itself is that particular behavioral rule that would yield the highest expected social utility if it were followed by all morally motivated people in all similar situations. It is clear from these definitions that utilitarianism, in either version of it, is a very simple theory because it tries to derive all moral values from one basic principle, that of social utility. Yet, the history of utilitarian theory shows that interpretation of this principle gives rise to some far-from-simple conceptual problems — and also to many disagreements among utilitarians. But this is really not surprising."},{"r":"harsanyi","p":1,"t":"Moral problems are notoriously complex and difficult; and any philosophic theory that makes a serious attempt to come to grips with them cannot fail to reflect these complexities. More specifically, interpretation of the principle of social utility poses problems of three different sorts. First, it poses some technical problems about how to define social utility and, more fundamentally, how to define individual utilities. Second, it poses some specifically moral problems about the definition of social utility. Finally, it poses the problem of how to apply the principle of social utility and, in particular, whether its application should follow the act utilitarian or the rule utilitarian approach.” ' The author wants to thank the National Science Foundation for supporting this research through grant SES77-06394-A02, administered by the Center for Research in Management, University of California, Berkeley. 2 Any moral decision, under either version of utilitarianism, is a constrained maximization problem, with social utility as the maximizand. But the actual constraints of maximization are different under the two versions of utilitarianism. An act utilitarian must try to maximize"},{"r":"harsanyi","p":2,"t":"116 JOHN C. HARSANYI Under the first heading, we have to decide whether individual utilities are cardinal and interpersonally comparable quantities so as to make their sum and/or their arithmetic mean mathematically well-defined. We have also to decide whether to define a person’s utility function in terms of his preferences, or of his feelings of pleasure and pain, or of his mental states of “intrinsic worth,”> or any other criteria. All of these are technical problems which raise no difficult moral issues.* More difficult are the specifically moral problems posed by the concept of social utility. For example, how much weight should we give to people’s patently irrational and/or antisocial preferences? Indeed, how much weight should we give to their socially very desirable altruistic preferences? (If we assign positive weight to people’s preferences for other people’s welfare, then we give unfair advantage to individuals with many friends and relatives, who wish them well, over individuals who lack such support.) How much weight should we give to the preferences of people unable to find out whether their preferences have been met or not — such as dead people or, in general, people who cannot monitor the situation, for whatever reason? Is it ever morally permissible to do what we like to do, even if our action does not yield the highest possible social utility? Notice that thes"},{"r":"harsanyi","p":2,"t":"e moral problems are important, not only for utilitarian theory, but also for any other moral theory — even though utilitarian theory does bring them more clearly out into the open, simply because it operates at a higher level of analytical precision than most nonutilitarian theories do. Of course, it is all to the good that utilitarianism forces us to face up to these problems: we learn a lot about the nature of morality by trying to answer them. Rule Utilitarianism vs Act Utilitarianism Even though all of these are important problems, in my opinion the most important internal problem for utilitarian theory is the choice between act utilitarianism and rule utilitarianism. No doubt, act utilitarianism is the social utility under the assumption that the strategies of all other utilitarians are simply given, independent of his own strategy. In contrast, a rule utilitarian must try to maximize social utility under the assumption that ail utilitarians will always use the same strategy. See J. C. Harsanyi, “Rule Utilitarianism and Decision Theories,” Erkenntnis 11 (1977), pp. 44-48. As a result, the alternatives will also be different under the two utilitarian theories. Under act utilitarianism, they will be alternative individual acts. Under rule utilitarianism, they will be alternative moral rules; in fact, as closer analysis would show, they are alternative comprehensive moral codes. 3 G.E. Moore, Principia Ethica (London: Cambridge University Press, 1903), p. 17."},{"r":"harsanyi","p":2,"t":"* For a discussion of these problems, see my Rational Behavior and Bargaining Equilibrium in Games and Social Situations (Cambridge: Cambridge University Press, 1977), Chapter 4; and “Rule Utilitarianism and Decision Theory,” pp. 27-30."},{"r":"harsanyi","p":3,"t":"RULE UTILITARIANISM, EQUALITY, AND JUSTICE 117 simpler one of the two versions of utilitarianism. But rule utilitarianism seems to be closer to common sense morality and to our basic moral intuitions. Moreover, much more importantly, I will try to show that by following the rule utilitarian moral code, society will achieve a much higher level of social utility than it could achieve by following the act utilitarian approach. To be sure, act utilitarianism has no difficulty in dealing with the moral problem of benevolence. Surely, it is obvious enough that we can increase social utility by helping other people or at least by not causing them needless harm. Yet, it seems to me that act utilitarianism cannot deal adequately with the moral problem of justice and with many related issues because it cannot deal adequately with the problems of moral rights and of moral obligations. For instance, suppose the government wants to take away my home in order to build a freeway through my property. Is this a morally justified action? (Note that I am not asking here about the constitutionality or the legality of such an action. I am asking about its morality.) According to act utilitarianism, it is morally justified if it creates more utility than disutility. The government’s action will create positive utility for the prospective users of the freeway, and for the workers and their employers who will build it."},{"r":"harsanyi","p":3,"t":"It will create a negative utility for me and my family, who will lose our home, and for the taxpayers who will have to pay for the new freeway, etc. According to act utilitarian theory, taking away my home is justified if the benefits accruing to the first group will exceed, however slightly, the sacrifices imposed on the second group. Yet, this conclusion is clearly inconsistent with common sense morality, according to which the government’s action violates my individual rights, and more specifically, violates my property rights to my home. (It also violates my personal freedom to live my private life without government interference.) Therefore, even if the government offered me reasonable compensation, expropriation of my home could be justified only if the balance of the resulting total utility over the resulting total disutility were quite substantial. If the government were unable to pay proper compensation, then only extreme social emergencies could possibly justify expropriation. What position should a utilitarian take on this? Obviously, any moral code protecting individual rights will generate both social benefits and social costs. Therefore, a utilitarian must try to compare the benefits people will obtain on occasions when this moral code protects their individual rights, with the inconvenience they will suffer on occasions when this moral code restricts their freedom of action by protecting other people’s rights against them. I think it is very clear that, by any reasonable standard, the social benefits of such a moral code will greatly outweigh the undeniable social costs. That is to say, most of us will strongly prefer to live in a society whose moral code"},{"r":"harsanyi","p":4,"t":"118 JOHN C. HARSANYI gives clear protection to individual rights, and does not permit violation of these rights, except possibly in some rare and rather special cases. In my opinion, this fact is the basic argument for rule utilitarianism. The situation is much the same with respect to our moral obligations. According to common sense morality, we have some special obligations resulting from our family roles, our occupations, our friendships, and our other special social relationships. These special obligations will, most of the time, take precedence over other moral obligations. But a consistent act utilitarian must deny this. For example, suppose I have to decide whether to spend a given amount of money on my own children’s education or on supporting some other children in urgent need of financial help. According to common sense morality, I must spend this money on my own children’s education — unless denying the money to the second group of children would create very extreme hardship. In contrast, an act utilitarian would have to say that I should give the money to the second group of children if their need for the money were slightly greater, however slightly greater, than my own children’s needs were — that is, I should give it to this group of children if they could be expected to derive slightly more utility, However slightly more utility, than my own children would derive from it. Once more, a rule utilitarian must, by and large, side with traditional morality."},{"r":"harsanyi","p":4,"t":"In all known societies, there is a division of labor among adults in looking after the children of the community. This division of labor has considerable social utility because, if all adults had to look after all children, it would be virtually impossible for them to find out the various children’s individual needs, and it would be virtually impossible for them to develop close emotional ties with individual children.* The specifics of this division of labor are different in different socictics. For example, in some societies, the mother’s oldest brother is the principal person in charge of the children. Of course, in our own society looking after children is normally a responsibility of the two parents. But, in any case, the special relationship between a group of children and the relevant adults can be preserved only if this relationship normally takes precedence over most other social obligations. In contrast, if we followed the act utilitarian approach and permitted other — in some sense, perhaps momentarily more urgent — moral obligations to take precedence, this special relationship could not survive. To put it differently, we must distinguish between local optimality, in the sense of maximizing social utility by each individual action we may take, and 5 Harsanyi, “Rule Utilitarianism, Rights, Obligations, and the Theory of Rational Behavior,” Theory and Decision 12 (1980), p. 128."},{"r":"harsanyi","p":5,"t":"RULE UTILITARIANISM, EQUALITY, AND JUSTICE 119 global optimality, in the sense of maximizing social utility by the moral code we adopt and by the entire system of moral rights and moral obligations this moral code brings into existence. Act utilitarianism focuses on local optimality, whereas rule utilitarianism focuses on global optimality, In some situations, local and global optimality pull in the same direction. But in all situations where they pull in different directions, we have to give preference to global optimality, which means adopting the rule utilitarian approach. To put it still another way, the main difference between rule utilitarianism and act utilitarianism lies in the fact that the former recognizes, while the latter denies, the logical dependence of justice on the existence of suitable moral rules that define people’s moral rights and moral obligations, Unlike some contemporary act utilitarians, John Stuart Mill clearly understood this relationship. After arguing that justice first meant conformity to positive legal tules, he wrote that later . the sentiment of justice became attached, not to all violations of law, but only to violations of such laws as ought to exist, including such as ought to exist, but do not.® Mill here obviously refers to moral laws. Let me illustrate the actual working of the rule utilitarian approach in more specific terms, using the example of promise-keeping."},{"r":"harsanyi","p":5,"t":"Suppose that A promises B to do X for him but does not deliver on his promise. According to act utilitarianism, this breach of promise will be morally wrong only if it creates more total disutility than total utility. Of course, the main utility created by the broken promise is the utility A derives from not implementing a presumably burdensome obligation. In contrast, the main disutilities created by A’s action are: (1) The disutility to B of losing the promised physical benefit, and the extra disutility to him of having his expectations of obtaining this benefit utterly disappointed. (2) The disutility to society as a result of decreased public confidence in future promises when people learn about this breach of promise by A. Note that normally disutility (2) will be negligibly small because one act of promise-breaking is unlikely to have any noticeable effect on public confidence in promises. Consequently, for an act utilitarian, the basic question is whether A’s utility gain by breaking his promise exceeds B’s utility loss. If it does, ® John Stuart Mill, “Utilitarianism,” Utilitarianism, Liberty, and Representative Government, ed. Ernest Rhys (New York; Everyman's Library, E. P. Dutton and Co., 1926), pp. 43-44, quoted ine Narveson, Morality and Utility (Baltimore: Johns Hopkins University Press, 1967), p. 1"},{"r":"harsanyi","p":6,"t":"120 JOHN C. HARSANYI however slightly, then A’s breach of promise is morally justified. In contrast, a rule utilitarian must ask the question, “Which particular moral rule about promise-keeping would yield the highest social utility?” Note that a rule utilitarian must judge the social-utility implications of any proposed moral rule on the assumption that, if this moral rule were adopted, this would automatically become public knowledge.’ Therefore, in judging any proposed moral rule, he must always ask the question, “What would be the effects on people’s expectations, incentives, and behavior, if they knew that this was the moral rule adopted for a given class of situations?” Consequently, under rule utilitarianism, the moral rule about promisekeeping must be chosen in such a way that it will maximize social utility by striking the right balance between two classes of social interests. On the one hand, there is the interest of the promisee in obtaining the promised performance and in avoiding disappointment of his expectations by nonperformance. There is also the interest of society in maintaining public confidence in promises. If the proposed moral rule permitted too many easy exceptions from promise-keeping, the promisee’s interests would receive insufficient protection. Moreover, public confidence in promises would be significantly impaired (because people would know how lax this moral rule about promise-keeping actually was)."},{"r":"harsanyi","p":6,"t":"This would be very undesirable because a good deal of social cooperation crucially depends on the credibility of promises — in fields ranging from commercial credit transactions to private agreements about where and when to meet, etc. On the other hand, consideration must be given also to the promisor’s interest in being morally released from his promise, when fulfilling it would cause him undue hardship. If the moral rule about promise-keeping permitted too few exceptions, the promisor would too often be saddled with excessively burdensome obligations. Presumably, there will be a moral rule maximizing social utility by permitting just the right set of exceptions from promise-keeping. To be sure, it will often be a matter of difficult personal judgment whether a given situation does or does not represent a permissible exception under the rule utilitarian criterion. As I have argued elsewhere,® in practice it is often quite difficult to decide what specific moral rule, with what particular list of exceptive cases would in fact maximize social utility. Hence, the best course of action for a rule utilitarian moral decision maker will often be to defer 7 Presumably, under any moral theory, we would have to assume that moral rules will be made publicly known to enable people to comply with them. But under rule utilitarian theory there is an additional reason for assuming that moral rules will be publicly known. For, in principle, every individual can compute what set of moral rules will yield the highest social utility. 8 J. C. Harsanyi, “Some Epistemological Advantages of the Rule Utilitarian Position in Ethics,” Midwest Studies in Philosophy 7 (1982), pp. 395-396."},{"r":"harsanyi","p":7,"t":"RULE UTILITARIANISM, EQUALITY, AND JUSTICE 121 to the social customs existing in his social environment (for example, as to permissible exceptions from promise-keeping) — unless he has strong reasons to believe that such conformity to these social customs would be definitely contrary to social utility. Yet, even though there may often be practical difficulties in deciding what specific list of permissible exceptions to a given moral rule would in fact maximize social utility, I think it is very important from a philosophic standpoint that rule utilitarianism does provide at least a conceptually clear theoretical criterion for the set of morally permissible exceptions. Let me draw three general philosophic conclusions from this discussion. First, in many cases rule utilitarianism and act utilitarianism will yield very different practical moral implications. In particular, as we have seen, rule utilitarianism will protect people’s moral rights and their special moral obligations in a much wider range of cases, and will permit their infringement in many fewer exceptional situations, than act utilitarianism will. By the same token, rule utilitarianism will permit many fewer exceptions to the moral obligation of keeping our promises — or to that of gratitude to a benefactor, or to that of telling the truth, etc. — than act utilitarianism will."},{"r":"harsanyi","p":7,"t":"This should finally put to rest the surprising claim, sometimes made even by very distinguished moral philosophers,’ that rule utilitarianism and act utilitarianism are equivalent as to their practical moral implications. Second, it is not true, as some act utilitarian philosophers have claimed,!° that rule utilitarianism amounts to “rule worship,” in the sense of irrationally requiring observance of a moral rule even in cases where deviating from this rule would yield higher social utility. (At least, this is certainly not true about the version of rule utilitarianism that I am defending.) To the contrary, as we have seen, rule utilitarianism requires us to choose that particular set of permissible exceptions to any given moral rule that will maximize social utility. The only important moral philosopher who can be justly accused of “rule worship” is Kant, who denied that there were any morally justified exceptions to our basic moral rules. Finally, society will reach a much higher level of social utility by following the rule utilitarian moral code than it would reach by following the act utilitarian approach. As we have seen, this is so because it will be much better to live in a society in which all people, or at least all morally motivated members of society, respect other people’s individual rights and their own ° See Richard B. Brandt, “Toward a Credible Form of Utilitarianism,” Morality and the Language of Conduct, H. N. Castafieda and G, Nakhnikian, eds."},{"r":"harsanyi","p":7,"t":"(Detroit: Wayne University Press, 1963), pp. 120-123; D. Lyons, The Forms and Limits of Utilitarianism (London: Oxford University Press, 1965), passim; R. M. Hare, Freedom and Reason (Oxford: Oxford University Press, 1963), pp. 130-136. © J.J. C. Smart, “An Outline of Utilitarian Ethics,” Utilitarianism, For and Against (London: Cambridge University Press, 1973), p. 10."},{"r":"harsanyi","p":8,"t":"122 JOHN C. HARSANYI institutional obligations, keep their promises, tell the truth on important matters, etc. (unless they have exceptionally important reasons not to do so). Such a society would be preferable to an act utilitarian society where people will disregard other people’s rights and their own moral obligations whenever this is likely to yield slightly greater total utility than total disutility. To put it differently, rule utilitarianism places itself on the high middle ground between act utilitarianism and various deontological theories. Like the latter, it takes the view that we cannot define a morally right action merely in terms of social expediency, which, by itself, would necessarily lead to a super-Machiavellian morality. Rather, the pursuit of social expediency must always be constrained by the deontological requirements of morality, such as observance of rationally chosen moral rules, and respect for a rational system of moral rights and moral obligations. On the other hand, rule utilitarianism agrees with act utilitarianism, that ultimately the rational justification of these moral rules, moral rights, and moral obligations must lie in their undeniable social utility. In fact, rule utilitarianism is the only moral theory that can provide a rational explanation and justification for these deontological components of morality."},{"r":"harsanyi","p":8,"t":"Act utilitarianism cannot do so because the limitations of its conceptual framework prevent it from recognizing these deontological concepts as relatively autonomous elements of morality. On the other hand, deontological theories, of course, fully recognize their importance, but cannot provide any rational justification for them. For example, Prichard and Ross based their theories on the concept of moral duty but they could not explain where these moral duties are supposed to come from and why a rational person should care to discharge them. Likewise, Nozick built his theory on the concept of “entitlements,” but never explained their logical basis and their morally binding force.\" Finally, contractarians like Locke, Rousseau, and Rawls tried to explain our moral and legal rules in terms of a hypothetical prehistoric social contract. But this social contract is obviously pure fiction and, therefore, cannot possibly explain real-life moral obligations. Indeed, even if this social contract had been a real contract concluded by our very remote ancestors many thousand years ago, it could hardly be morally binding, now, on the present members of our society. But the decisive objection to this social-contract theory is that it is irredeemably circular. The hypothetical social contract, like any contract, would derive all of its moral binding force from the moral rule that contracts should, be kept. Therefore, we cannot without circularity claim that this H. A. Prichard, Moral Obligation (Oxford: Oxford University Press, 1968); W. D. Ross, Foundations of Ethics (Oxford: Clarendon Press, 1939); R. Nozick, Anarchy, State, and Utopia (New York: Basic Books, 1974)."},{"r":"harsanyi","p":9,"t":"RULE UTILITARIANISM, EQUALITY, AND JUSTICE 123 moral rule itself, and all other moral rules, owe their moral justification to this social contract in the first place. Moral Values vs Other Human Values Kant took the view that morality is the highest value of human life. A consistent utilitarian cannot share this view.!2 The basic task of morality is to induce people to help other people in achieving their own objectives, which are in most cases nonmoral objectives, such as economic well-being, a good social position, health, friendship, love, knowledge, artistic experiences, etc. Thus, in an important sense, morality is primarily a servant of many other human values, rather than itself the highest value. Moreover, even though no person can have a rich and well-balanced life without strong moral commitments, these moral commitments are less likely to occupy the center of the stage for him than are his work, his family and friends, and his intellectual, cultural, social, and political interests. Of course, our moral duties must always take precedence over any other considerations. But this is true only in the trivial sense that we would not call anything our moral duty simpliciter had we not already decided that it has an overriding moral claim upon us. In contrast, our prima facie moral duties do not always take precedence over our nonmoral interests. For example, if I make a promise, I will obviously have a prima facie moral duty to keep it."},{"r":"harsanyi","p":9,"t":"Yet, if breaking my promise would not cause any serious harm to the promisee, but keeping my promise would cause me a very substantial financial loss that I could not have foreseen when I made the promise, then it might be morally permissible for me to break my promise. This means that I might be morally free to give precedence to my financial interests over a prima facie moral obligation. Likewise, a utilitarian cannot regard very high degrees of moral devotion always as unmixed blessings. Even less can he so regard high degrees of morally motivated devotion to idealistic political objectives. Great devotion to one’s moral values requires a willingness to make great sacrifices for them. Yet, as experience shows, people who are willing to make great sacrifices for their moral values are often equally willing to sacrifice other people to them. The unfortunate fact is that great devotion to high moral and political ideals may not be very far away from socially disastrous moral and political fanaticism, Robespierre was no doubt a man devoted to the highest moral principles. 12 My argument in this section has greatly benefited from Professor Narveson’s discussion of these topics (J. Narveson, Morality and Utility, pp. 34-37). But he may not agree with all that T will say."},{"r":"harsanyi","p":10,"t":"124 JOHN C. HARSANYI Utilitarianism and Equality As has often been pointed out, there are many different types of equality and of inequality. I will discuss only two: equal consideration for the interests of different individuals, and equality of social benefits for different individuals in terms of income, wealth, status, power, etc., which can also be described as economic and social equality. The principle of equal consideration is a rather undemanding principle. All it requires is that, in dealing with different people, we should not provide rationally unjustifiable favorable treatment or unfavorable treatment for any one of them. This principle has a fundamental role in any version of utilitarian theory because it enters into the very definition of social utility: whether we define social utility as the sum or as the arithmetic mean of individual utilities, we must give equal weight to all individuals’ utilities. The principle of equal consideration is a direct corollary of one of the most basic general principles of rationality, viz., the principle of sufficient reason. Therefore, we may be tempted to conclude that the principle of equal consideration is morally binding on all human action. I do not think this is the case. For in some decisions we may have virtually unlimited moral discretion, and may be under no moral obligation to follow any objective criteria at all."},{"r":"harsanyi","p":10,"t":"For example, it seems to me that if I pay my secretary out of my own private funds, and need a new secretary, I will be morally free to follow my own preferences in choosing among alternative candidates for the job. I will have no real moral obligation to give all candidates “equal consideration,” or to use any specific criteria in order to select the “most deserving” candidate ~ though, of course, it will be morally praiseworthy if I do so. In contrast, if I am acting as a public official, or even as an official of a large, or at least a moderately large, social organization, I will be morally obliged to make any major decision on general and rationally defensible criteria (even if I am under no /egal obligation to do so). This is so because such officials are, in an important sense, agents of society as a whole and ought to follow the standards of fairness and of rationality of society in all major decisions, even in situations where a private citizen would not be positively required to do so. I now propose to discuss economic and social equality. It seems to me that, for a consistent utilitarian, economic and social equality is not an intrinsic moral value. To be sure, other things being equal, a more equal distribution of economic and noneconomic benefits is always preferable to a less equal distribution. But the main reason for this lies in the law of diminishing marginal utility of money and of most other good things in life. Thus, greater economic equality is morally desirable mainly because a poor man, who is"},{"r":"harsanyi","p":11,"t":"RULE UTILITARIANISM, EQUALITY, AND JUSTICE 125 likely to spend any extra money on important necessities, is also likely to derive a much higher utility from an extra $100 than will a rich man, who is likely to spend any extra money on relatively unimportant luxuries. For this reason, a utilitarian will favor government policies for a moderate redistribution of income and wealth. But he will have to counsel moderation, because society has a vital interest in maintaining people’s incentives for hard work, for enterprise, and for developing their talents. Some redistributive policies may increase poor people’s incomes by a few percentage points but may decrease the rate of growth in national income, possibly making these poor people actually much worse off a few years later than they would have been in the absence of these policies. On the other hand, there are strong utilitarian reasons for opposing both extreme poverty and extreme wealth, especially extreme levels of inherited wealth. Extreme poverty not only causes physical hardships, but also tends to paralyze the intellectual and cultural life of its victims, and tends to poison their moral attitudes. Surprisingly enough, the intellectual, cultural, and moral effects of extreme wealth, especially of very great inherited wealth, are often much the same."},{"r":"harsanyi","p":11,"t":"In many societies, children of very rich families are seldom conspicuous by their intellectual, cultural, and moral accomplishments, nor by their ability to lead a happy and well-balanced life. Moreover, extremes of poverty and of wealth also tend to hinder proper operation of our democratic political institutions. No doubt, many moral philosophers take issue with the utilitarian view that economic and social equality is not an intrinsic moral value. But if these philosophers were right, this would mean that, in a distribution of social benefits, a poor person (or an otherwise disadvantaged person) should be given priority over a rich person (or an otherwise more fortunate person) even if, for a given benefit, the former is not expected to derive a higher utility than the latter is. For easier reference, I will describe the moral value judgment contained in this last sentence as statement A. I now propose to show in two examples that statement A would be an utterly unacceptable moral value judgment. I will need examples involving noneconomic benefits because, in a distribution of economic benefits, owing to the law of diminishing marginal utility, a poor person will almost always derive a higher utility from any given benefit. Consider a distribution of a scarce lifesaving drug, or a distribution of scarce university admissions, when the available supply of either falls very much short of existing demand."},{"r":"harsanyi","p":11,"t":"Suppose that, in the case of the drug, we have to choose between a rich patient and a poor patient, both of whom badly need this drug. Suppose, also, that the rich patient is definitely expected to benefit more from the drug. Or suppose that, in the university admissions example, we have to choose between a rich candidate and a poor candidate,"},{"r":"harsanyi","p":12,"t":"126 JOHN C. HARSANYI both of whom have the qualifications required for admission. Suppose, also, that the rich candidate is clearly better qualified and can derive a greater benefit from university education. Then, statement A would imply that we should give the lifesaving drug or the university admission to the poorer person, even though the richer person would derive a greater benefit from it — except, perhaps, if this richer person would derive a very much greater benefit from the lifesaving drug or from the university admission. Yet, even if the richer person is expected to derive only a moderately greater benefit from the drug or from the university admission, he will have a stronger moral claim to it. It would be morally unjustifiable discrimination against him if he were denied the drug or, the university admission merely because he happens to be rich. Thus, I conclude that statement A is a completely unacceptable moral value judgment."},{"r":"harsanyi","p":12,"t":"Utilitarian theory is right to take the view that economic and social inequality is not an intrinsic moral value, and that it is morally wrong to discriminate against a rich or an otherwise fortunate person in order to reduce the difference between him and the poorer or otherwise less fortunate members of society.!> Utilitarianism and Justice As I have argued earlier, society has a very important interest in having its members respect each other’s basic rights and institutional obligations — in other words, in having its members observe the basic standards of justice. Yet, this coin also has another side. Preoccupation with minor violations of our rights, real or apparent, and the widespread passion for litigation so prevalent now in the United States, are highly counterproductive social practices. Indeed, not only is it often socially preferable if people put up with minor injustices, instead of engaging in endless litigation, it is often socially desirable to have social institutions whose very success depends on having some “unfair” practices built into them. For instance, the effectiveness of the free enterprise system (and even that of a socialist system) crucially depends on the fact that a successful business executive will be promoted and an unsuccessful one demoted. Yet, this is often “unfair,” because this success or failure may be unrelated to the business executive’s own effort and ability, and may be a matte
