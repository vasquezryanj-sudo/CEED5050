plaining the epistemic superiority of democracy over technocracy; it is a substantial improvement over s model, and it seems well equipped to accommodate the first two features of democracy: diversity and interaction (although the latter seems the first consens confined to in-group communication, without the communicative interaction"},{"r":"medina","p":3,"t":"a7 ——eE—————<— across groups playing any significant role). But, as Anderson argues, by fo cusing on the convergence or consensus of diverse groups, the DAI theorem does not properly accommodate the dynamism of democratic life and the learning processes required for the epistemic functioning of democracy: “the DAT theorem does not model the epistemic functions of periodic elections and other feedback mechanisms designed to change the course of collective decisions in light of information about their consequences” (2006, p. 13). As an alternative to the two consensus models of democracy that Anderson criticizes, she finds a better epistemic model in John Dewey's experimentalism. Dewey's experimentalist account of the epistemic powers of democracy epitomizes what I call a resistance model, given the central role that dissent and contestation play in this model. As Anderson argues, when compared with the consensus models of democratic interaction, Dewey's experimentalism is the only model in which dissent is epistemically productive. And following Dewey, Anderson offers “an account of the multiple epistemic roles of dissent at different points in democratic decision-making” (2006, p. 9)."},{"r":"medina","p":3,"t":"It is the role of dissent in democratic epistemic practices that gives us a rationale for valuing diversity, interaction, and dynamism: it is because we want to exploit the benefits of productive dissent that we need to recognize and take advantage of the heterogeneous situated knowledge of diverse agents; that we want all agents and groups to be in communication and to interact epistemically, so that they can interrogate each other and cooperate; and that we want diverse experiences and reactions to be used for critically revisiting and perfecting decisions and policies. It is especially the third feature—dynamism—that according to Anderson gives Dewey’s experimentalism an advantage with respect to the other epistemic models of democracy. As Anderson puts it, Dewey’s experimentalist model helps us see the epistemic import of democratic institutions that make dynamic social learning and self-correction possible: free press, protests, public discussion of the policies and performances of administrative agencies, periodic elections, and so on. “In Dewey’s model, these are mechanisms of feedback and accountability that function to institutionalize fallibilism and an experimental attitude with respect to state policies” (2006, p. 14)."},{"r":"medina","p":3,"t":"I want to emphasize that the Deweyan experimentalist model involves not only an experiential approach, but also an imaginative approach, for the kind of democratic communication needed to accommodate epistemic diversity, adequate interaction, and dynamism requires imagination. Democratic communication is the communication of diverse experiences and diverse imaginations: it is aimed at putting our practices and institutions in syne with the heterogeneous experiences of diverse members of society, but also with the heterogeneous imaginations that individuals and groups can exercise. Following Dewey, Anderson argues that we should think of democratic deliberation as a kind of thought experiment, in which we rehearse proposed solutions to problems in imagination, trying to foresee the consequences of implementing them, including our favorable or unfavorable reactions to them’ (2006, p. 13). ‘The epistemology of resistance | articulate and defend in what follows revolves around resistant experiences and resistant imaginations, that is, around the beneficial epistemic friction that significant differences in experiences and imagination can produce. Experience and imagination are the two poles of the feedback loop needed for democratic processes of social learning."},{"r":"medina","p":3,"t":"Our experiences are expanded and critically assessed in and through the imagination, which enables us to connect our actual experiences with possible ones, extending and projecting them into alternative pasts, presents, and futures. But at the same time, as suggested by Anderson’s emphasis on the importance of revisiting decisions and policies in the light of the experience of their consequences, our imagination has to be constantly interrogated by the actual experiences of those affected by the practices and institutions we set up; and the continuation and correction of those practices and institutions should be the result of the collective responsiveness to the experiences and imaginations of all members of society. ‘The aim of the epistemic interaction in which resources are pooled and experiences and imaginations are shared, compared, and contrasted is both practical and epistemic: democratic epistemic interactions aim at perfecting not only our practices but also our sensibilities. Democratic sensibilities require free and equal epistemic interaction among the heterogeneous groups that are part of society. This is what I call the democratic Imperative of Epistemic Interaction, which is an epistemic version—with minor modifications—of the “imperative of integration” that Anderson has argued for so persuasively in her 2011 book."},{"r":"medina","p":3,"t":"In The Imperative of Integration Anderson argues that a critical democratic failure of contemporary US society is the de facto segregation that survives decades after segregation was legally abolished.’ Anderson contends that, in order to become truly democratic and guarantee freedom and equality, American society and its publics have the obligation to integrate in all areas of social life: housing, schooling, marriage, cultural expression, and so on. Although in general I agree with Anderson’s arguments and conclusions, I want to relax her imperative of integration to allow for social spaces and practices that are intended primarily (if not exclusively) for the members of minority groups that struggle to achieve self-empowerment or to preserve their distinctiveness. Such social spaces and practices do not have to be separatist in a strong sense, but they do not need to be committed to integration in a strong ' The most surprising finding of Anderson's rich analysis of the empirical data is that the de facto segregation of today is in fact worse than the legal segregation of the first half of the twentieth century in many areas of social life. When it comes to housing and education, for example, neighborhoods and schools are less mixed today as a result of voluntary segregation than they were when segregation was legal and enforced by state agencies, Anderson's analysis converges with mine in chapters 4 and 5 when | discuss the ideology of color-blindness that obscures these realities and protects racial ignorance,"},{"r":"medina","p":4,"t":"sense either. In particular contexts, practices and institutions designed to pro vide a safe and nurturing space for underprivileged groups can have great democratic value. Under specific conditions, such practices and institutions may be precisely what are required for the self-empowerment of oppressed groups, or for the articulation of a public whose formation has so far been blocked. Anderson is certainly right that real racial desegregation in the United States has not yet been achieved and remains a key democratic challenge for the accomplishment of real equality. But, as Anderson’s own analysis poignantly shows, desegregation is a process—-a very complex historical process— and not all aspects and phases of this process require that ail social spaces and practices be fully integrated to the point of losing all group specificity.’ For this reason, I suggest that the broader and weaker notion of “interaction” is preferable to that of “integration” to characterize what is imperative in a heterogeneous democratic society. The latter notion can be too strong from the point of view of the oppressed and marginalized, that is, when the imperative of integration is understood, not as the duty to share privileges of the better off, but as the obligation of those who have been so far excluded and marginalized to find their place in practices and institutions that have not been traditionally theirs. And it is not clear that the latter can always happen."},{"r":"medina","p":4,"t":"In particular, it is not likely that it will happen immediately after well-entrenched patterns of segregation are first challenged. Therefore, as mainstream practices and official institutions diversify and become progressively accessible to everybody equally, safe havens should be not only allowed but encouraged and protected, so that those who are still struggling to achieve equal status and to enjoy full agency within society can take refuge. In this sense, it is hard to see historically black colleges as a democratic failure and not as a democratic achievement, although their creation and trajectory have been entangled with anti-integrationist attitudes. It is also hard to see institutions bilingual in English and Spanish (e.g., private businesses such as banks, or educational programs in public schools) as a democratic problem (and not as a democratic opportunity) just because they cater primarily to Latinos. Although these institutions may not—at least immediately and directly—serve integration, they facilitate the overall social interaction of the different groups in society, for they advance the educational and financial abilities of the underprivileged so that they can start to interact with members of more privileged groups on a more equal footing. Throughout her book (2011) Anderson talks about integration as the promotion of intergroup contact (see, for example, p."},{"r":"medina","p":4,"t":"21), and she carefully distinguishes integration from assimilation (the former, but not the latter, being ? It is important to note here, though, that this danger does not apply to the weak notion of integration that Anderson defends, which is carefully distinguished from assimilation precisely on this point. Anderson’s notion does not require the loss of group distinctiveness. compatible with the preservation of group distinctiveness), 1 have No aspure with this weak sense of integration and it is also what my Imperative of Epi stemic Interaction tries to capture, But there is a stronger sense of integration often used in the literature, which requires that our institutions and public spaces lose any form of group specificity—the stronger version of this being the melting-pot model of multiculturalism. Integration—in_ its different senses—may or may not be advisable; its advisability has to be carefully con textualized and considered from multiple perspectives. In general, “interac tion” is a weaker and more basic notion—prior to integration—which calls mainly for communication and cooperation, that is, for developing the ability to share social spaces and practices without ignoring each other, but fully taking into account each other’s different experiences, interests, and aspirations."},{"r":"medina","p":4,"t":"The Imperative of Epistemic Interaction calls for the development of communicative and reactive habits that operationalize our responsiveness to diverse and multiple others (no matter how different from ourselves). It calls for the cultivation of sensibilities that open ourselves to diverse others cognitively, affectively, and communicatively and enable us to share spaces responsibly and to engage in joint activities. Democratic sensibilities consist in cognitive-affective attitudes that facilitate and promote the capacity to relate, to listen, to feel concerned, and to care for the interests and aspirations of others. The establishment and maintenance of such attitudes require effective communication among diverse publics. And for such effective communica tion to take place, publics have to be formed and to become able to express themselves; and social sensibilities of openness have to be cultivated for those publics to be listened to and to be responded to properly. Fostering adequate democratic sensibilities involves meeting some minimal requirements on expressibility as well as on receptivity and responsiveness. The expressibility requirement demands that the different groups that a social body can contain have the opportunity to coalesce in a public with expressive capacities, so that they can articulate their shared experiences and perspectives."},{"r":"medina","p":4,"t":"The responsiveness requirement demands that the social and epistemic conditions of communication and interaction be such that the expressions of a public have the proper uptake by other publics and by society as a whole. On the side of expressibility, adequate democratic interaction requires providing spaces and opportunities for group formation, that is, for the development of social movements and the emergence of publics that can articulate their own experiences, interests, and concerns. As Anderson argues, following Dewey, the effective communication about the impact that a social arrangement has on a particular social group “requires that the group organize into an association or party, so that its members can share their experiences and, through discussion, articulate shared complaints and advance proposals to address them” (2006, p. 14). But, as Anderson puts it, “Effective communication of complaints and proposals requires not just that people be free to speak their"},{"r":"medina","p":5,"t":"minds, but that they be open to listening to others” (Ibid.), ‘This takes us to is sues concerning communicative receptivity and uptake, On the side of respon siveness, adequate democratic interaction requires that people take an interest in listening to others, that they develop the requisite sensibility for proper lis tening, and that they respond to what others say concerning their experiences, interests, and problems. As Anderson suggests, we can draw here on Dewey's concept of “freedom and fullness of communication,’ which goes well beyond a purely formal and legalistic notion of freedom of speech, placing demands on our cultural habits, attitudes, and daily interactions.’ Most of the discussions of this book concerning epistemic injustices will revolve around ways of falling short in these minimal requirements on expressibility and responsiveness. As we shall see, in the hermeneutical and testimonial injustices we encounter in our epistemic interactions, we find specific problems and obstacles that disadvantage subjects and limit their capacities to express concerns and demands, and they also limit their interlocutors’ capacities to register, process, and respond to those concerns and demands adequately."},{"r":"medina","p":5,"t":"The democratic sensibilities we need to cultivate to work toward epistemic justice are sensibilities that enable us to appreciate the epistemic value of dissent, sensibilities that encourage us not only to be open to contestation, but to actively search for dissenting viewpoints and to benefit from critical engagements with them. An epistemic model of democracy that gives centrality to the ever-present possibility of dissent and contestation is what I call a resistance model of democracy, which is superior to the consensus model in giving us a powerful rationale for valuing the mutual engagement of diverse perspectives. As Anderson warns us, “Conditioning decisions on the achievement of consensus often leads to undue pressure on and even coercion of dissenting minorities” (2006, p. 16). By valuing agreement over dissent, a consensus model of democratic decision-making runs the risk of suppressing “public airing and responsiveness to the continuing reservations individuals may haye about the decision” agreed upon, for the achievement of a consensus is construed as implying that all objections have been met or have been overridden by more weighty considerations (Ibid.). By contrast, in the resistance model, “minority dissent remains open rather than suppressed, reminding us that any given decision remains beset by unresolved objections” (Ibid.)."},{"r":"medina","p":5,"t":"The orientation toward consensus is certainly important in the life of a democracy, but the resistance model teaches us that epistemic friction among diverse perspectives is something broader and more basic than reaching agreement. Such friction is required prior to the formation of a consensus, at } As Dewey put it in “Creative Democracy: The Task before Us,’ “Merely legal guarantees of the civil liberties of free belief, free expression, and free assembly are of little avail if in daily life freedom of communication, the give and take of ideas, facts, experiences, is choked by mutual suspicion, by abuse, by fear and hatred” (1981, pp. 227-28). the moment of achieving agreement, and after an agreement has been reached ind is implemented. Democratically achieved consensus requires resistance,\" Hut resistance is also at the core of other forms of democratic interaction that do not aim at the production of agreements, From the point of view of the resistance model, democratic interactions involve much more than the ichievement of agreement. But it is important to note also that the resistance odel is not an attempt to value disagreement over consensus, as some ago ‘ilstic views propose. In fact, the resistance model operates at a different con ceptual level than consensus and agonistic views. This model teaches us that democratic interaction is broader and goes deeper than reaching or breaking consensus."},{"r":"medina","p":5,"t":"For democratic interactions are, first and foremost, communica (ive engagements, and the convergence and divergence of perspective: \\mportant episodes in those engagements, but they are ultimately mere tran \\tory moments that need to be revisited. Democratic interaction requires resistance, that is, epistemic friction and (he mutual contestation of perspectives. “We want to walk: so we need friction. Hack to the rough ground!” (1958, $107) As Wittgenstein tells us, in order to properly elucidate our normative activities and to provide normative guidance for our interactions, we should avoid idealizations and go back to the rough ground of our actual practices where we find differently situated knowledges ic perspectives—where there is friction. Idealizations do not provide an ade- {\\iate starting point and a proper level of theorization for philosophical reflection on our practices and social realities. This is carefully avoided in the realstance model I propose. Here too I follow Anderson's epistemic model of democracy, which is a nonideal theory.> Dewey’s experimentalism provides a perfect exemplar of such nonideal normative theorizing of social practices. As | nclerstand it (and as exemplified by Dewey’s social theory), the methodological commitment to the primacy of the nonideal, where there is friction, is a iviple commitment."},{"r":"medina","p":5,"t":"First, it is a commitment to particularism, to giving priority to the specificity of particulars, not to abstractions and generalities that divert our attention away from concrete realities. Idealizations tend to be par- (ial and distorting, obscuring the heterogeneity and complexity of actual expe- ‘lences and concrete practices, which is why they do not provide an adequate tindpoint for the diagnosis of social problems and injustices. As Anderson puts it, “When we assess whether a society is deviating from ideal justice, we can be ' Av Anderson argues, following Westlund (2003), if the consensus of a group is to be consistent i(}) the autonomy of its members, it “requires some resistance at the individual level to anyone else's proposal, so that the eventual object of joint willing is the product of mutual accommodation and ompromise rather than blind subordination” (2006, p. 16). \\y she puts it in The Imperative of Integration, “This is a work in non-ideal theory. | do not advance piluciples and ideals for a perfectly just society, but ones that we need to cope with the injustices in our turvent world, and to move us to something better” (2011, p. 3)"},{"r":"medina","p":6,"t":"still assess it from the standpoint of representative positions 1 the ideally just society” (2011, p. 5). As we will discuss later, when it comes to racial injustices, for example, the color-blindness of idealizations can become an important obstacle for acknowledging their very existence: “'l he principled color-blindness ot ideal theory is epistemologically disabling: it makes us blind to the existence of racebased injustice” (2011, p. 6). In the second place, nonideal theory is founded in a commitment to empiricism and fallibilism, to the test of experience and the conditionality upon future experiential tests. On this theoretical model, there is never final and absolute proof of the correctness of our norms, for our norms can only be backed up by how they impact the actual experiences of those affected by them. This experimentalist approach does not dispense with ideals, but ideals here are conceived differently: not as ahistorical standards of assessment for any society, but as imagined solutions for particular problems, or as hypotheses. If our hypothetical ideals pass experiential tests, they are not validated once and for all—outside of history, as it were—for, as Anderson puts it, “Circumstances change, and new problems and complaints arise, requiring the construction of new ideals” (Ibid.)."},{"r":"medina","p":6,"t":"Finally, in the third place, the commitment to nonideal theory is also a commitment to meliorism, to making things better without being shackled to any particular picture of “the best.” Rather than starting from an ideal picture of a problem-free society, nonideal theory starts from the diagnosis of specific problems and complaints in our society, and it sets out to investigate how to address these particular problems. As Anderson sums it up, Knowledge of the better does not require knowledge of the best. Figuring out how to address a just claim on our conduct now does not require knowing what system of principles of conduct would settle all possible claims on our conduct in all possible worlds, or in the best of all possible worlds. (2011, p. 3) This book will not present or rely on a theory of epistemic justice (for Wittgensteinian reasons, I suspend judgment on whether or not there can be a unified theory of what is just in all our epistemic interactions). Rather, it will offer contextualist elucidations of particular epistemic problems and injustices, some of which are so pervasive to the point of seeming omnipresent. The methodological commitment to the priority of the nonideal is a commitment to the priority of real in-justices over ideal justice."},{"r":"medina","p":6,"t":"If our normative theories should start where we are, in medias res, we should start our theorizing by reflecting on the details of the actual injustices that surround us, rather than by speculating about what perfect justice might be. We need a theory of injustice more than a theory of justice. As Anderson puts it, “We need a theory that begins from a structural account of the systematic disadvantages imposed on people” (2011, p. 6). As I will argue below, when it comes to the epistemic domain, the priority of real injustices over ideal justice is crucial, for idealizations about our epistemic interactions desensitize us about the ubiquitous herme neutical and testimonial injustices we are surrounded by in our everyday practices, minimizing the importance of the epistemic obstacles and prob lems that differently situated subjects are differentially exposed to in their daily activities. It is dangerous to indulge in idealizations for the normative elucidation of epistemic activities: when in such elucidations we postulate an ideal case in which there are no preexisting epistemic obstacles or disadvan- (ues, we assume that the normal conditions are conditions of epistemic juslice, But why should we assume such a thing? Miranda Fricker, for example, hus shown brilliantly that “various degrees of testimonial injustice happen all the time” and, echoing Judith Shklar, she denounces t"},{"r":"medina","p":6,"t":"he misconception of thinking “falsely of justice as the norm and injustice as the aberration” (2007, p. 49). As Shklar puts it, “his normal model of justice does not ignore injusice but it does tend to reduce it to a prelude to or a rejection and breakdown of justice, as if injustice were a surprising abnormality” (1990, p. 17). The noriulization of a presumed justice and the concomitant abnormalization of injustice have important ideological effects: they contribute to the invisibility of everyday injustices, to the formation of active bodies of ignorance that perpetuate the injustices and desensitize us to the suffering they cause. Just as Shklar argued that injustice is the normal social baseline and efforts toward justice tend to be the exception, Fricker argues that “testimonial injustice is a normal part of discursive life” and “cries of resentment are relatively few and {ar between” (p. 39). The resistance model of epistemic interaction that I will defend follows this line of theorizing that starts from actual systematic injusices rather than from justice, and proceeds in a nonideal way, that is, in a particularistic, fallibilistic, and melioristic fashion."},{"r":"medina","p":6,"t":"To further clarify my methodological commitments and my overall theoretical framework, in the ‘ext section I will offer a preliminary analysis of the notion of resistance, highlighting some crucial ideas of key thinkers in the philosophical traditions from which I draw: Jane Addams, Ludwig Wittgenstein, and Michel Foucault. B. Resistance, Perplexity, and Multiperspectivalism Where there is power, there is resistance . . . a multiplicity of points of resistance: these play the role of adversary, target, support, or handle in power relations. These points of resistance are present everywhere in the power network. Hence there is no single locus of great Refusal, no soul of revolt, source of all rebellions, or pure law of the revolutionary. Instead there is a plurality of resistances, each of them a special case... Ave there no great radical departures, massive binary divisions, then? Occasionally, yes. But more often one is dealing with mobile and transitory points of resistance, producing cleavages in a society that shifts"},{"r":"medina","p":7,"t":"14 The Upistemolopy of Resistance about, fracturing unities and effecting regroupings, furrowing, across In dividuals themselves, cutting them up and remolding them, marking off irreducible regions in them, in their bodies and minds. (Foucault: 1978, pp. 95-6; my emphasis) As suggested by Foucault, resistance is a complicated and heterogeneous phenomenon that defies unification and explication according to abstract and rigid principles of subversion. Our cognitive, affective, and political lives are permeated by different forms of conformity and resistance that shape our lives in various (and not always fully coherent) ways. Struggles of resistance should be studied in their specificity, but without thereby renouncing investigation of their connections, intersections, and points of convergence and divergence. This book aims to contribute to a better understanding of how our cognitiveaffective lives become shaped by systems of oppression and by the different forms of resistance that appear within and around them. My goal is to bring a contextualist perspective to bear on the recent debate concerning epistemologies of injustice."},{"r":"medina","p":7,"t":"In particular, I try to offer a contextualist and intersectional analysis of distinctive forms of sensitivity and insensitivity, of lucidity and blindness, as they appear in contexts of oppression, trying to shed light on a host of epistemic issues such as the following: the testimonial and hermeneutical injustices produced by heterosexism and racism, the relationship between epistemic vices and virtues and experiences of privilege and oppression, our epistemic responsibilities with respect to self-knowledge and social knowledge, and the crucial mediation of the social imagination in our cognitiveaffective lives. Gender and sexual ignorance, racial ignorance, and their interrelations are a central focus of the discussions of this book. I propose to investigate how these bodies of ignorance are produced by systems of oppression, what their ramifications in our social and personal lives are, and what we can do to resist them. Although the focus of this book will be the epistemic side of oppression and resistance, the sociopolitical will be omnipresent and will be explicitly discussed in various sections. Drawing on feminist theory, queer theory, and critical race theory, my polyphonic contextualism will be methodologically promiscuous. ‘The epistemology of resistance defended in this book brings together converging and intersecting contextualist views in European and American philosophy, in particular, Foucaultian, Wittgensteinian, and pragmatist approaches."},{"r":"medina","p":7,"t":"I will briefly sketch this productive convergence and the uses to which it will be put in the discussions of this book. Foucault has been widely used in feminist and queer theory. In this Foucaultian literature, we find rich discussions of resistance both as an epistemic strategy and as a political strategy. In Racism and Sexual Oppression in Anglo- America: A Genealogy (2009), Ladelle McWhorter has made productive use of the Foucaultian genealogical method as an epistemic and political strategy to provoke “insurrections of subjugated knowledges” that can open up new fronts Introduction 15 in the battles against racism and heterosexism, And in the now classic Unruly Practices (1989) Nancy Fraser offered a Foucaultian account of the formation of “oppositional discourses” and “counterhegemonic publics.” According to l'raser, needs and experiences are politicized when they become contested across discursive arenas and among resisting publics. Through discursive resistance, distinctive counter-publics have been formed along various axes, such as class, gender, race, sexual orientation, ability, and so on. These counterpublics and their counter-discourses offer resistance against the oppression of hegemonic discursive standpoints by articulating alternative descriptions and interpretations of experiences and needs."},{"r":"medina","p":7,"t":"It is clear that, for Foucault, discursive resistance can be exerted from a multiplicity of social locations in which differently positioned agents can relate to power in different ways. In order to understand the diversity and heterogeneity of forms of resistance, we need to understand the positionality and relationality of social agents in networks of power relations. Foucault insists that “resistance is never in a position of exteriority in relation to power” and that in order to understand how resistance works, we need to understand “the strictly relational character of power relations” (1978, p. 95). Although this may be obscured by the use of oppositional language by Foucaultians such as Fraser, resistance does not in principle require fully differentiated discourses that oppose each other, for it can be exerted even from within hegemonic discourses and by members of privileged publics. Although not without difficulties, as we shall see, resistance can be found (and should be looked for) in the very entrails of privilege and in mainstream practices and perspectives. ‘The ability to exert critical resistance both within and around our discursive practices—at their very center as well as at their periphery—has also been stressed by feminist and queer interpretations of the Wittgensteinian view of language-games."},{"r":"medina","p":7,"t":"As Peg O’Connor (2002) has argued, just like Foucaultian oppositional discourses, Wittgensteinian language-games offer opportunities to subordinated social groups to develop alternative practices where their social identities and perspectives can flourish and they can resist dominant ideologies. As O'Connor puts it in her Wittgensteinian analysis of the queer practices of “coming out” and breaking silences: Wittgenstein says in On Certainty that a group can use their language game as base from which to combat others ($609). The language games of coming out and breaking silence, with all their attendant activities and newly created recognizable meanings are, in many ways, loci from which to fight against the dominant language games we have all played. (2002, p. 445) Using Wittgenstein’s analogy of language as “an ancient city: a maze of little streets and squares surrounded by a multitude of new boroughs with straight regular streets and uniform houses” (1958, $18), O'Connor argues that “oppositional discourses are, in many ways, the boroughs or suburbs of the"},{"r":"medina","p":8,"t":"older city,’ “not completely detached” but “clearly recognizable as different from the city,” “newer” and “more planned” (p. 446). This is indeed one form that resistance can take: from the periphery, and as a well-structured and planned effort to produce alternatives. But besides looking into this particular shape and form that resistance can take in our practices of contestation and activism, we also need to look into other varieties of resistance—more spontaneous, more twisted, less planned and intentional (even unconscious). There are many ways in which ordinary people can resist different forms of domination in their daily lives. We need to look for possibilities of resistance in every discursive practice and every social location—in every neighborhood and every street of this imaginary discursive city—in order to identify the wide spectrum of practices of resistance in which epistemic friction can be found. As Naomi Scheman (1997) and other Wittgensteinians—including myself (2006a)—have argued, Wittgenstein offers other resources for resistance besides inventing new meanings or abandoning existing practices. Linguistic resistance can be internal to the oppressive language-games themselves, and it can aim at the subversion of the very normative core of mainstream practices: what Scheman has called “queering the center” and what I describe as “speaking from elsewhere” while remaining within. Our communities of resistance cannot leave the mainstream critically untouched."},{"r":"medina","p":8,"t":"It is a mistake to think that the forms of exclusion, subordination, and marginalization that we can find in mainstream culture can be resisted only from the outside, and not also from within. The contextualist account of resistance I provide in this book covers cases of internal resistance as well as cases of external resistance, for the multifaceted activity of resisting is conceptualized as contending with, and not exclusively or fundamentally as contending against. Experiences and practices of resistance should not be understood exclusively, or even primarily, in oppositional terms, as if resisting were always a matter of opposing from the outside, of experiencing a clash of wholly distinct opposing forces. Resistance often takes other phenomenological shapes. It can feel more like being pulled in different directions from the inside, like being torn from within. Experiencing resistance can often be like feeling a rupture that one does not know what to do with (at least initially), like feeling perplexity. I am interested in the experiential and phenomenological aspects of resistance, but I am even more interested in its agential and practical aspects, for resistance is not simply something that happens to us, but it is fundamentally something we do (or fail to do) and for which we have to take responsibility. Resistant subjects are active subjects, subjects who exert resistance."},{"r":"medina","p":8,"t":"What are the responsibilities of a resistant subjectivity? And do all subjects have an obligation to resist? One of the most central theses of this book will be that those who live under conditions of oppression—however they happen to inhabit contexts of domination (as victim, as oppressor, as a bystander, as both victim and oppressor, etc.)—have an obligation to resist. And when it comes to spistemic oppression, this obligation to resist leads to many epistemic duties: to fight against ignorance, to know oneself and others in certain respects, to learn and to facilitate the learning of others, to resist epistemic vices and to work oward epistemic virtues, to meliorate epistemic habits and attitudes, and in short, to collaborate in the pursuit of epistemic justice. But I will also argue that is obligation to resist epistemically has to be contextualized, for differently situated subjects have differential epistemic responsibilities (different not only in egree, but also in kind). We all share collective responsibilities in meliorating our epistemic life in common and in fighting against the bodies of ignorance bred by relations of domination. But we have differential obligations to resist 1e forms of epistemic domination that shape our lives depending on how iese forms of domination reach our epistemic trajectory and our location within systems of relations, that is, depending on our social positionality and relationality."},{"r":"medina","p":8,"t":"We should all be alert to avoid possible epistemic vices that arise in contexts of oppression and can vitiate our epistemic interaction, but of course we are differently exposed to those vitiating factors. We should all actively search for opportunities to cultivate epistemic virtues that can meliorate our cognitive-affective habits and attitudes, but of course we have differential access to such opportunities.° My contextualist analysis of the cognitive-affective perspectives afforded by our social positionality and relationality will establish an intimate connection between our sensibilities and our cognitive potential. We develop particular sensibilities as situated agents in social networks who are exposed to specific cognitive-affective structures; and these sensibilities simultaneously constrain and enable our capacities to know ourselves and to know others, and hence our capacities to make distinctive contributions to the melioration of social knowledge and to the fight against ignorance. I will argue that our epistemic sensibilities govern simultaneously our capacities for acquiring self-knowledge and our capacities for acquiring knowledge of others. It will be my contention that our social gaze and our inner gaze work in tandem and deeply affect each other."},{"r":"medina","p":8,"t":"More specifically, I will elucidate the interrelations between self-knowledge and the social knowledge of others as they work for sexual and racial matters and in the context of well-entrenched bodies of sexual and racial ignorance. I will argue that in contexts of sexual and racial oppression there are cognitive-affective deficits that amount to specific forms of epistemic insensitivity: the inability to listen and to learn from others, the inability to call ® And as standpoint theory has suggested and I will argue throughout the book, the socially and epistemically privileged are often epistemically underprivileged in having fewer opportunities to develop certain critical epistemic virtues, But this asymmetry thesis needs to be carefully formulated and qualified in order to avoid mystifications (such as the romanticizing of oppression) and overstatements (such as conferring automatic epistemic privilege to the oppressed). I will offer detailed discussions of this thesis in chapters 1 and 2,"},{"r":"medina","p":9,"t":"hy MWe hp into question one’s perspective and to process epistemic friction exet ted from significantly different perspectives. I will argue that racial and sexual insensi tivities result as much in lack of knowledge of social realities as in lack of self-knowledge (or knowledge of one’s own positionality and relationality with respect to the relevant categories and the relevant forms of oppression). Thus, for example, I will argue that what Charles Mills (2007) has termed white ignorance—the recalcitrant, active ignorance of privileged white subjectivities on racial matters—crucially involves both racial self-ignorance and social ignorance of racialized others. How can we find large-scale systems of oppression in the most familiar and intimate aspects of our epistemic life, within ourselves and our sensibilities? The socio-epistemic analyses of this book draw inspiration from the numerous voices in the women’s movement that taught us that the personal is political and the political is personal. These activist voices both laid the foundations for the argument of this book and also performatively exemplify what it means to resist deficient social sensibilities and their blind spots, triggering a process of social learning that benefits us all, for their activism expanded our sensibilities and taught us to pay attention to the interrelations between our public practices and our most intimate feelings, emotions, desires, and beliefs."},{"r":"medina","p":9,"t":"I will argue that in order to be able to expand and meliorate our social sensibilities, we need to start by exposing ourselves and making ourselves vulnerable, by opening up our perspective to processes of critical scrutiny and resistance, that is, by putting our perspective in communicative interaction with the perspectives of significantly different others so that there can be epistemic friction among perspectives. Hence the crucial importance of the diversity of viewpoints and of their interaction, for only when significantly different perspectives are available and they are allowed to interact so as to learn from each other and to make maximal use of their difference, only then can we have epistemic and political practices that can be self-corrective in a democratic way. Democratic social interaction requires resistance, but resistance begins at home, that is, in the most intimate aspects of our cognitive-affective functioning. Resistance has to begin within ourselves and in the activities in which we feel at home. This is why I will argue that democratic sensibilities that are truly openand responsive to differences, rather than being defensive and self-protecting, must be distrustful and self-questioning."},{"r":"medina","p":9,"t":"Such democratic sensibilities can be established only when subjects make themselves vulnerable to challenges and become exposed (either by choice or by social design) to processes of selfquestioning or self-estrangement, that is, processes of deep self-interrogation in which we become strangers to ourselves. Becoming perplexed about who we are— that is to say, becoming strangers to ourselves in particular areas of our life and looking at ourselves with fresh eyes—affords us opportunities to interrogate what we find in the most intimate corners of our perspective, and to recognize its limitations and the possibilities of correction and improvement, In very different ways, queer theory, feminist standpoint theory, and critical race theory teach us the importance of unmasking and undoing the process of social construction of our perspective, of interrupting the flow of familiarity and obviousness, making the familiar unfamiliar and the obvious bizarre. And this critical exercise s hould not be thought of simply as the quaint activity of some peculiar activists and intellectuals, but rather as a crucial part of the growth and development of critical subjects of knowledge, of subjects who learn how to resist their cognitive-affective limitations and to improve their sensibilities and capacities. We all have a prima facie obligation to undergo a process of self-estrangement, to cultivate openness to perplexity and to interrogate received attitudes and habits."},{"r":"medina","p":9,"t":"If we fail this obligation, the failure of other epistemic responsibilities will ensue and possibilities of critique and resistance will be thwarted. Perplexity and self-estrangement are of the utmost importance for cognitive, affective, ethical, and political learning; democratic sensibilities depend on them. This intuition is the centerpiece of Jane Addams’ plea for a deeply social ethics in Democracy and Social Ethics (2002). The different chapters in this often neglected American philosophical classic are structured around different experiences of perplexity, examining the productive ethical use that we can make of these experiences. But what is the connection between perplexity and ethical learning? As Charlene Seigfried (2002) has emphasized, Addams was a pioneer in taking women’s experiences and oppressive conditions as central for the development of ethical theory, thus giving robust social content to the pragmatist ethical theory that was emerging at the time in the works of William James and John Dewey. As Seigfried argues, Addams’ ethical approach converges with those of Dewey and James in establishing an intimate connection between perplexity and social sympathy in processes of ethical learning."},{"r":"medina","p":9,"t":"As Seigfried puts it, All three [Addams, Dewey, and James] show how social sympathy can be aroused and developed through the perplexities we feel in the normal course of everyday life, specifically those caused by the clashes of belief, habits, and interests inevitable in highly diversified societies. (p. xxiii; my emphasis) ‘The experiential disruptions that arise in interaction with significantly different others are precious opportunities for developing an awareness of our interdependence and a critical consciousness of the limitations of our perspective vis- \\-vis others. By seeking these experiences of perplexity and disruption and using them as a mechanism of learning, we can cultivate a social sensibility that opens our eyes, ears, and hearts to other ways of thinking, feeling, and living. ‘This kind of social learning is, for the pragmatists, the driving force of moral development. As Dewey puts it, “Interest in learning from all the contacts of life is the essential moral interest” (1980, p. 370)."},{"r":"medina","p":10,"t":"As Seigfried explains, for Addams, “a perplexity’ refers to someone's per sonal involvement in a situation that baffles and confuses her, because her usual understanding and responses are inadequate to explain or transform a troubling situation” (pp. xxv-xxvi). The perplexed subject is confronted with a difficult existential choice: to continue to hold on to her assumptions or to begin to call them into question. If she chooses the latter, she must “undergo a painful process of rethinking her presuppositions and values” (p. xxvi). For Addams, perplexity is the kind of existential discomfort that goes to the very roots, to the normative grounding of one’s life, and constitutes the initial stage of ethical inquiry. As Seigfried puts it, in her discussions of perplexity Addams gives a nuanced account of the interplay of personal feelings and objective conditions; of the difficulties involved in responding to other classes, races, and cultures; and of the choice involved in the ways one responds to challenges to accepted beliefs and familiar values.” (Ibid.) Addams explains the productive work and learning processes that can result from the existential disruptions and perplexities experienced by the charity workers she collaborated with in Chicago in the 1920s. Addams criticizes the unexamined racism and classism that distorted the social perceptions of the well-intentioned charity workers."},{"r":"medina","p":10,"t":"She saw, as a constant source of miscommunication and distorted social perception, the failure to reflect critically on the racial and class gaps that existed between the charity workers and the recipients of that charity in destitute inner-city neighborhoods. This is how Addams describes the perplexity of a reflective charity worker: she “is continually surprised to find that the safest platitude may be challenged” (p. 18); and She discovers how incorrigibly bourgeois her standards have been, and it takes but a little time to reach the conclusion that she cannot insist so strenuously upon the conventions of her own class, which fail to fit the bigger, more emotional, and freer lives of working people. (p. 21) Collaborative processes of ethical and political learning can be prompted by experiences of perplexity of this sort. This is how Seigfried summarizes the kind of learning that Addams saw as required by the proper resolution of these experiences: “What is needed to satisfactorily resolve the perplexity is better insight into the social requirements of a genuine democracy and the implementation of a cooperative experimental approach? (p. xxvii). ‘This also summarizes well the proposals of my own social contextualism in this book. The cultivation of perplexity that Addams recommends is the cultivation of our openness to being challenged and affected by other experiential perspectives."},{"r":"medina","p":10,"t":"This critical experiential approach converges with that of Hannah Arendt in Men in Dark Times (1965) where she argues, following Lessing, that one of the greatest intellectual, moral, and political failures is to become “immune to neni aan other experiences in the world.” Arendt argues that trying to attain “a defini tive view of the world” is a vain and dangerous ambition that breeds intolerance and makes social learning processes impossible, for it leads people to “cling firmly to a single possible perspective” and it fosters critical immunity to alter native experiential perspectives. ‘The kind of openness to alternative experien tial standpoints that both Addams and Arendt argued for is at the core of the multiperspectivalism that I will defend in this book: the imperative to renew our perplexities and to reinvigorate our openness to alternative standpoints is the imperative to constantly expand our personal as well as shared perspectives and sensibilities, our individual and collective imaginings. The centerpiece of my polyphonic and kaleidoscopic social contextualism will be a critical account of social perception and its deficits—of social blindness, numbness, or insensitivity,—and of how melioration through the epistemic friction among genuinely different perspectives becomes possible."},{"r":"medina","p":10,"t":"I will draw from black and Latina feminists and activists to explain how social perception undergirds political action and to explain the social conditions of insurrectionary acts of resistance. Bringing together feminists and queer theorists as different as Linda Alcoff, Elizabeth Anderson, Moira Gatens, Maria Lugones, and Ladelle McWhorter, I will also explore the role of the social imagination in aiding or obstructing the formation of pluralistic communities and open publics, and in facilitating or precluding what I call “beneficial epistemic friction” through cri tique, resistance, and the cultivation of open-mindedness. How should we use the social imagination so as to become more adept at communicating across differences, achieving the pluralistic communicative sensibilities that Iris Mar. ion Young has argued are fundamental for a vibrant democratic life? I will argue that a kaleidoscopic social imagination can expand social sensibilities and facilitate pluralistic forms of solidarity. We are interested in practices and habits of resistance because they are the heart and soul of solidarity: “Resistance is connected to solidarity, which is a matter of identifying with, rather than as” (Scheman: 1997, p. 147). It is in and through resistance that relations of solidarity against domination and across different forms of oppression become possible and effective."},{"r":"medina","p":10,"t":"It is in and through resistance that we discover new possibilities of social relationality by paying attention to new forms of social identification—understood, following Naomi Scheman (1997), as ways of identifying-with, not of identifying-as. This is ’ See especially pages 18-19 of the opening essay, “On Humanity in Dark Times: Reflections on Lessing” There Arendt argues that “thinking for oneself” “independent thinking,” is not an activity that ed-off individual is capable of. This is a persuasive argument for what I have called the Impera the s tive of Epistemic Interaction. * Although I will continue to use the visual language of blindness that is often used in this literature and echoes the classics (such as Du Bois), I will supplement it with the auditory language of deafness and [ will also use the more general language of becoming cognitively and affectively numbed or insensitive."},{"r":"medina","p":11,"t":"02 TNC EPIBVeTUIy a yeninrehS much more than a mere attempt to resuscitate old fashioned identity politics. The epistemology of resistance I will defend offers a more complex path for our cognitive-affective and sociopolitical melioration. ‘I hrough practices of resis tance we can learn to go beyond the strictures of inherited cognitive and affective habits, and we can learn to envision new cognitive-affective attitudes and orientations toward others. Both our ability and our inability to relate to others (and to particular aspects of ourselves) is mediated by the social imagination, the kind of imagination that opens our eyes and hearts to certain things and not others, enabling and constraining our social gaze. We all have responsibilities toward the pluralization of this social gaze so that we can collectively produce a kaleidoscopic social imagination, a fluid way of imagining ourselves and others in which patterns of relations are constantly emerging and vanishing, seamlessly and ceaselessly, with some relational possibilities giving way to others, constantly resisting the ossification of our categorizations. Nobody can be exempted from the obligation to resist and to contribute to the formation of a kaleidoscopic social imagination."},{"r":"medina","p":11,"t":"But, interestingly, those subjects who are often better positioned to exert resistance and to pluralize the imagination (because their experiences have been silenced or rendered opaque, abnormal, or unintelligible) are often the most vulnerable, and we cannot overburden their already precarious agency with the task of pluralizing the social imagination for all of us. On the other hand, the privileged subjects who are less inclined and worse equipped to resist inherited habits of social perception, those who find their experiences and perspectives most obvious and unproblematic, are precisely the ones who should bear a heightened responsibility and should make special efforts to resist and undo the exclusions and marginalizations of the social imagination. As feminist theorists and race theorists have argued in the recent literature, privileged subjects should play a special role in the fight against racism and heterosexism, which should start with their own self-problematization, that is, with the problematization of their social gaze and of their privileged perspectives and privileged lives. However, the shared burdens of fighting epistemic injustices should not disproportionately fall on the shoulders of any single group or particular range of subject positions, but on the entire collective social body."},{"r":"medina","p":11,"t":"It is of the utmost importance that there be good relations of communication among social groups so that there can be a collective process of learning, in which the epistemic trajectories of differently situated subjects can enrich each other; and subjects can learn to fulfill their epistemic responsibilities, to benefit from the epistemic contributions of others, and to contribute themselves to the enrichment of others. We need a well communicated social body so that we can. all share experiences, compare and contrast perspectives, learn about the insights and limitations of differently situated social gazes, and engage in the difficult process of social learning across differences, ‘The analyses and discussions of this book hope to make some contribution to a better understanding of our sshd destdhteieahiitnalaieal shared but nonetheless distinct responsibilities in the collective fight against socio-epistemic oppression and the pursuit of epistemic justice. C. Overview ‘The first three chapters of this book articulate and defend the key elements of my view of epistemic injustice: chapter 1 focuses on the epistemic virtues and vices that we can find in contexts of oppression; chapter 2 focuses on issues of epistemic authority, credibility, and testimonial injustice; and chapter 3 focuses on silencing and hermeneutical injustice."},{"r":"medina","p":11,"t":"The last three chapters develop an account of epistemic responsibility, first by analyzing its failures and consequences for ethical and political agency (in chapter 4), but later by exploring what it means to assume responsibility for epistemic justice, and by investigating how we can become progressively more responsible through interactive forms of agency (chained actions—in chapter 5) and through resistant uses of the imagination (in chapter 6). While chapter 4 focuses on epistemic i ponsibility (insensitivity, complicity, and shared responsibility for epistemic injustices), the last two chapters of the book turn to more positive and forward-looking reflections concerning how we can develop epistemically responsible forms of agency that can correct insensitivities and lead to pluralistic democratic sensibilities. In chapters 5 and 6 I argue that the work toward epistemic justice can only be achieved through forms of social interaction that repair neglect and insensitivity, through a sustained social activism that expands people’ capacities for feeling concerned, and through imaginative ways of relating to each other and forging solidarities across differences. In what follows I offer a more detailed summary of the contents of each chapter."},{"r":"medina","p":11,"t":"Focusing on racial and sexual oppression and their interrelation, chapter 1 provides an analysis of active ignorance and of three epistemic vices that support it: epistemic arrogance, laziness, and closed-mindedness (offering an account of how these vices are formed among privileged subjects). I argue that structural active ignorance can be corrected only by developing epistemic virtues such as epistemic humility, curiosity/diligence, and open-mindedness (sketching an account of how these virtues appear among oppressed subjects). | argue that the overcoming of active ignorance requires beneficial epistemic friction in interactions with significantly different epistemic others, and I offer two regulative principles for achieving such friction: the principle of acknowledgment and engagement, and the principle of epistemic equilibrium. In the next chapter I apply these principles and my account of active ignorance to the domain of testimonial injustices. es- In chapter 2 I argue that testimonial injustice involves a lack of proportionality in the appraisals of epistemic qualities such as credibility. According to my proportional view, an epistemic appraisal is always comparative and contrastive"},{"r":"medina","p":12,"t":"bad ——— and, therefore, it always concerns more than the particular subject(s) under consideration given the comparison and contrast classes that support the ap praisal. In my view, epistemic appraisals always contain an element of social systematicity, even when they appear to be quite isolated, because they operate against the background of a system of relations and they involve interpersonal perceptions that are mediated by the social imagination. According to my argument, testimonial injustices concern not only the epistemic deficits that oppressed subjects have to endure, but also the epistemic excesses (excessive authority and credibility, excessive self-confidence, etc.) that privileged subjects enjoy and that spoil their epistemic character. I further argue that the epistemic vices of the privileged tend to produce a particular form of ignorance which I referred to as meta-blindness or meta-insensitivity—a cognitive and affective numbing that can be described as insensitivity to insensitivity. In my view, the problem of meta-blindness calls for a cognitive-affective restructuring, which involves a process with multiple and interrelated normative dimensions: an epistemic, ethical, and political re-education that touches on all aspects of our life. ‘The discussion of meta-insensitivity is continued in chapter 3 through an analysis of social silences and hermeneutical injustices."},{"r":"medina","p":12,"t":"This chapter develops a contextualist approach to hermeneutical injustice that is pluralistic, interactive, and dynamic. First, I offer an expansion of Miranda Fricker’s analysis of silencing, arguing that we need to pay attention to the performative and pragmatic aspects of communicative dynamics to fully appreciate the patterns of silence that are part of epistemic injustice in general and of hermeneutical injustice in particular. In the second place, I argue that a more deeply pluralistic account of hermeneutical justice is needed, one that takes into account the communicative dynamics of a plurality of publics that are internally heterogeneous and contain multiple voices and perspectives. Finally, I use my polyphonic contextualism to expand Fricker’s view of what counts as virtuous interpretative responsiveness and to offer a more robust notion of epistemic responsibility with respect to hermeneutical justice. This notion lays out the foundation of the social connection model of shared epistemic responsibility I develop in the next three chapters. Chapter 4 elucidates the relationship between responsible agency and knowledge. Pace Akeel Bilgrami, I argue that responsible agency requires only minimal self-knowledge that need not include explanatory knowledge of the mental causation of one’s actions."},{"r":"medina","p":12,"t":"But, on the other hand, I also argue that responsible agency requires more than minimal self-knowledge: it requires minimal social knowledge of others and minimal empirical knowledge of the world. I subsume these epistemic implications of responsible agency under what I call the thesis of cognitive minimums: namely, that responsible agency requires that one be minimally knowledgeable about one’s mind, about the social world, and about the empirical realities one encounters. Focusing on the cognitive minimums of self-knowledge and social knowledge, I go on to argue that there are different ways in which we may partake in shared culpable igno rance about nonmainstream subjects, groups, and experiences; and I begin to develop an account of shared responsibility with respect to epistemic justice for the correction of blind spots and social insensitivities associated with racism and (hetero)sexism. Chapter 5 focuses on how to fulfill epistemic responsibilities under conditions of oppression and, in particular, how to develop lucidity precisely where social blind spots exist. In this chapter I analyze a particular kind of lucidity characteristic of oppressed subjectivities: a meta-lucidity produced by epistemic friction. I address the issue of how to promote this kind of meta-lucidity for differently situated subjects, including those in a position of privilege whose life experiences may not have put them in the best position to become lucid."},{"r":"medina","p":12,"t":"In the case of racial oppression and racial ignorance, I discuss how “white ignorance” can be corrected so that racially privileged subjects can also become lucid with respect to race and improve both their self-knowledge and their knowledge of racial others. I connect these issues with the larger and more challenging issue of how to remove epistemic obstacles and achieve cognitive melioration not only for particular individuals and groups, but for the entire social fabric and in a durable way that will affect future generations. | discuss the phenomenon of what I call epistemic heroes, that is, extraordinary subjects who under conditions of epistemic oppression are able to develop epistemic virtues with a tremendous transformative potential. I argue that epistemic heroes should be understood as emblems: figures who become emblematic because they come to epitomize the daily struggles of resistance of ordinary people. According to my contextualism, the transformative impact of performance that we consider heroic is crucially dependent on social networks and daily practices of resistance in which the performance in question is taken up or reenacted (what I call the phenomenon of echoing). Detaching the contributions that epistemic heroes make toward social justice from the social support that precedes and follows their actions is, I suggest, a dangerous trap that the dominant individualism in Western cultures sets up for social movements of resistance."},{"r":"medina","p":12,"t":"I offer two examples of cultural icons of resistance who appear to be “epistemic heroines,’ one from the history of Latina feminism (Sor Juana Inés de la Cruz) and the other from the history of the civil rights movement (Rosa Parks), emphasizing in both cases how the heroic figure becomes part of ongoing daily practices of resistance. Chapter 6 brings together many of the discussions of the book that converge on the key relationship between the imagination and epistemic sensitivity or insensitivity. This chapter examines the role of the imagination both in the production and in the prevention of social harms. Different ways of imagining can sensitize or desensitize people to human experiences; they can make people feel close or distant to others; and they can create or sever social bonds, affective ties, and relations of empathy or antipathy, solidarity or lack"},{"r":"medina","p":13,"t":"of solidarity. Stigmatizing ways of imagining play a crucial role in causing expressive and epistemic harms—and more indirectly other kinds of harm as well—by distorting and excusing the suffering of some, making it appear as if it were tolerable or even necessary. But resistant ways of imagining can contest exclusions and stigmatizations, and they can help us become sensitive to the suffering of excluded and stigmatized subjects. I argue that in order to develop pluralistic democratic sensibilities, we need to cultivate a resistant imagination that is polyphonic and experimentalist. I conclude by developing a conception of network solidarity grounded in a kaleidoscopic social imagination, arguing that we have the shared obligation to exercise resistant ways of imagining that make us sensitive to symbolic exclusions, expressive harms, and epistemic mistreatments. I use the women’s movement as a model for the increasing pluralization of a public which, through the resistant imaginations of its heterogeneous members, has learned to develop a kaleidoscopic social sensibility, 11} Active Ignorance, Epistemic Others, and Epistemic Friction ‘The capacity to give knowledge to others is one side of the many-sided capacity so significant in human beings: namely, the capacity for reason....No wonder ... that in contexts of oppression the powerful will be sure to undermine the powerless in just that capacity, for it provides a direct route to undermining them in their very humanity."},{"r":"medina","p":13,"t":"—FRICKER, EPISTEMIC INJUSTICE, 2007, p. 44 In a situation of oppression, epistemic relations are screwed up. Inequality is the enemy of knowledge: it handicaps our capacity to know and to learn from each other. Social injustices breed epistemic injustices; or rather, these two kinds of injustice are two sides of the same coin, always going together, being mutually supportive and reinforcing each other. This is the premise of this book. It is also a conclusion supported by empirical studies in psychology and in the educational sciences; and it is also an idea amply discussed in the recent philosophical literature on social knowledge, especially in normative epistemology,' feminist theory, and critical race theory. Racist and sexist ideologies make us all cognitively worse off: they instill distrust; they lead people to underestimate or overestimate their cognitive capacities; and they are the breeding ground for all kinds of biases and prejudices that distort perception, judgment, and reasoning. Social injustices typically have a negative impact on our epistemic relations to each other (deteriorating epistemic trust, endangering impartiality, weakening the credibility people ascribe to each other, etc.), and also on our epistemic relations to ourselves (undermining our epistemic confidence, self-trust, and self-reliance; compromising our epistemic goals and projects; weakening our motivation for learning and cognitive improvement, etc.)."},{"r":"medina","p":13,"t":"Members of groups that have been systematically disadvantaged and mistreated (e.g., women and racial minorities) are often unfairly depicted as intellectually inferior, mischaracterized as lacking ' See especially the different essays in Haddoek, Millar, and Pritchard (eds.), Social Epistemology (2010),"},{"r":"medina","p":14,"t":"certain cognitive capacities, or simply given less authority and credibility than members of other groups. And it is not uncommon for members of unjust societies to have distorted images of themselves as knowers: for mem bers of a privileged elite to overestimate their cognitive powers, or for members of underprivileged groups to underestimate their capacities, thus interiorizing a superiority or inferiority complex, with negative epistemic consequences in each case. As a result of social injustices, people are prone to have important epistemic deficits that have ramifications in multiple aspects of their life. In particular, people tend to lack knowledge of themselves and of others around them, and such a lack of personal and interpersonal knowledge affects their capacity to impart knowledge to others and to receive knowledge from others—their capacity to hear and to be heard correctly. People’s participation in cognitive activities is often impaired by epistemic distortions and biases that limit their capacity to learn, to teach, and to engage in joint epistemic projects. In this chapter and the next I will focus especially on a particular kind of epistemic cooperation: testimony. Following the trend in the recent literature,” I will use a very broad definition of testimony, as any kind of telling in and through which the expression and transmission of knowledge becomes possible."},{"r":"medina","p":14,"t":"Testimonial exchanges are those in which communicators participate as knowers and possible epistemic benefits can be obtained. These exchanges can be more or less explicit, more or less formal and structured, and more or less articulated (ranging from silences and inchoate expressions to sophisticated propositional and discursive structures). Testimonial knowledge can be obtained through a wild variety of interactions: speakers engaged in conversation, writers and readers exchanging texts, artists and audiences sharing symbolic constructions, people giving signals to each other in a shared situation or jointly witnessing an event, and so on. This chapter will lay out the general framework I will use to discuss how biases and epistemic distortions created and sustained by oppression affect the production and transmission of knowledge and ignorance, especially through the multifarious forms of testimonial exchanges that we can find in everyday practices. We are all affected by the epistemic obstacles and distortions that arise in situations of oppression. But differently situated groups and subjects have different epistemic predicaments: their epistemic deficits are different, and their resources to overcome these deficits and to resist dominant ideologies are also different. Epistemic oppression is not an equal opportunity institution: it affects all of us, but not all of us equally."},{"r":"medina","p":14,"t":"I will discuss how differently situated subjects and groups accrue different epistemic gains and losses, and how the epistemic advantages and disadvantages become distributed among members of society. Epistemic advantages and disadvantages, fortunately, do not correlate perfectly ’ See Fricker (2007), especially page 60. ee with non-epistemic forms of privilege and oppression, Although it is certainly true that the economically and sociopolitically privileged enjoy epistemic ben efits that more disadvantaged members of society do not, it is not the case that the economically and sociopolitically privileged accumulate only epistemic benefits. The epistemic advantages of the privileged tend to be rather explicit: access to information, access to educational institutions, capacity to dissemi nate knowledge and to command epistemic authority, having a credible voice, and so on. Some of the epistemic disadvantages of the oppressed are equally obvious and well known; they are in fact the mirror image of the advantages just listed (lack of access to information and to educational institutions, obsta cles or prohibitions against the dissemination of knowledge, lack of a credible voice and authority, etc.). But critics in race theory and feminist theory have shown that the situation is more complicated than it may seem, for privileged elites also have epistemic disadvantages, whereas oppressed subjects (or their out-of-the-mainstream standpoints) can enjoy some epistemic advantages."},{"r":"medina","p":14,"t":"Race theorists and feminist theorists have identified the blind spots of those in privileged positions and some important epistemic advantages of those who have been marginalized in, and often excluded from, epistemic practices. In the next two sections I will offer a preliminary analysis of the epistemic disadvantages of the privileged and the epistemic advantages of the oppressed. This analysis will set the stage for my argument for the crucial importance of epi stemic counterpoints and for my proposal of the regulative principles of epi stemic friction, which I develop in the last section of this chapter (section 1.3). Further details of my account of the advantages and disadvantages of differ ently situated subjects and their perspectives will be provided in later chapters where I elucidate positive and negative epistemic resistances (resistances to knowledge and to ignorance) and how they can contribute to maintain epistemic oppression, or to fight against it. ‘The epistemic disadvantages of the privileged that I am interested in identifying are not external or accidental disadvantages that those in a position of power may have, but rather, epistemic flaws that are grounded in the very character of those subjects, being part and parcel of their personality structure and constitutive of the social identity they have acquired."},{"r":"medina","p":14,"t":"It follows from this that for these subjects to overcome these flaws, they have to change themselves; and, as we will see, this complex process of self-transformation (a deep restructuring of the self that requires the development of new habits and the destruction of old ones) requires also a process of social change. An epistemic predicament that is (or becomes) a character flaw is what in virtue epistemology’ would be ’ Virtue epistemology can be traced back to Aristotle's account of intellectual virtues, For an Aris totelian account of epistemic virtues, see Zagzabski (1996). Different approaches to virtue epistemology in the contemporary scene are articulated and defended in Fairweather and Zagzabski (2001),"},{"r":"medina","p":15,"t":"called an epistemic vice: a set of corrupted attitudes and dispositions that get in the way of knowledge. On the other hand, an epistemic virtue is a character trait that constitutes an epistemic advantage for the individual who possesses it and for those who interact with him or her: roughly, a set of attitudes and dispositions that facilitate the acquisition and dissemination of knowledge. Since I am interested in offering a normative elucidation of the cognitive psychology of differently situated subjects and not in a list of all the advantageous or disadvantageous factors that may play a role in their epistemic agency, the advantages and disadvantages that I will discuss will be epistemic virtues and vices. My examination of these virtues and vices will use a developmental approach. What are the epistemic vices that the better-off of society can (or even tend to) develop? And what are the epistemic virtues that the worse-off of society can (or even tend to) develop? My account of the epistemic vices of the privileged and the epistemic virtues of the oppressed will require many qualifications that will be issued piecemeal as the account progresses. Hopefully, these qualifications will succeed in avoiding the romanticizing of oppressed subjects and the demonizing of their oppressors at the epistemic level. Indeed, as we will see, privileged subjects can have epistemic virtues as well as vices, and oppressed subjects epistemic vices as well as virtues."},{"r":"medina","p":15,"t":"Moreover, the epistemic vices of the privileged and the epistemic virtues of the underprivileged are not their exclusive property; differently positioned subjects may have them as well. But, as we will see, these epistemic character traits do have a distinctive sociogenesis for subjects who occupy a particular social position. There are epistemic virtues and vices with distinctive lines of social development, and all of us, from our own social positionality, can learn some lessons from an examination of these epistemic character traits and their formation. 1.1. Active Ignorance and the Epistemic Vices of the Privileged ‘Those in a position of power tend to be better off. Is that also true epistemically? Perhaps. The most powerful classes in society certainly enjoy important cognitive benefits. But could these benefits sometimes be too much? Could the privilege of knowing (or always being presumed to know), of always being heard as a credible speaker, of always commanding cognitive authority, sometimes spoil people? To be conceited (epistemically or otherwise) is not good. To overestimate one’s powers (epistemic or otherwise) can get one in trouble. ‘Those who grow used to carrying with them the presumption of knowing, of speaking authoritatively, of not being cognitively suspect, have but rare opportunities to find out their own limitations."},{"r":"medina","p":15,"t":"Those who are epistemically spoiled have a hard time learning their mistakes, their biases, and the constraints and presuppositions of their position in the world and their perspective. Those who are so spoiled are in danger of becoming know-it-alls, of thinking themselves cognitively superior, This kind of cognitive self-indulgence or cognitive supe riority complex is what | will call epistemic arrogance. Epistemic arrogance is only one of the central vices that can be characteristic of privileged subjects, ‘This is not a flaw that is always present in the cognitive psychology of the pow erful and privileged. But those in a position of power are certainly more at risk of developing this flaw (more on this later). There are other epis
