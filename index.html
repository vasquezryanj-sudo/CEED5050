or shall I argue that moral relativism is the best way to explain the phenomena. Nor do I think that we have some alternative route to moral knowledge that avoids intuition altogether. Rather, if our instruments are flawed, the task before us is to discover ways to improve them. This returns usto the pragmatist strategy of seeking methods for intelligently updating our moral beliefs. We can learn from the history of moral change how we might make progress in improving our practices of moral inquiry. Consider what may be the most dramatic worldwide progressive change in moral beliefs that has ever occurred. Three hundred years ago, few people in the world thought that slavery was morally wrong. Today, almost no one is willing to defend it."},{"r":"anderson15","p":8,"t":"Although still practiced in many parts of the world, slavery is illegal everywhere. In this lecture, I shall take it as a fixed point that this change in moral views is progressive a case of moral learning.16 By studying how we managed to improve our moral beliefs about slavery, we can gain insight into how to improve our moral beliefs more generally. To make this study manageable, I focus on the U.S. case. 2. POWER, MORAL BIAS, AND THE INEFFECTIVENESS OF DOMINANT PHILOSOPHICAL METHODS I have suggested that we can improve our moral beliefs by im our methods for correcting, blocking, or counteracting biases in thinking. Here I shall focus on a specific class of biases, rooted in inequality in the ways power and privilege bias our thought Smith and John Dewey are two philosophers who offered insight such biases. Smith focused on moral biases of observers, when differentially valu the targets of their moral sentiments according to their social statu 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":9,"t":"PROCEEDINGS AND ADDRESSES OF THE APA, VOLUME 89 rather than according to morally relevant features. Much of The Theory of Moral Sentiments investigates such moral biases. Smith claimed that xxthe disposition to admire, and almost to worship, the rich and the powerful, and to despise . . . persons of poor and mean condition, . . . is . . . the great and most universal cause of the corruption of our moral sentiments.\"17 It leads observers to have uten times more compassion\" for the great than for the lowly, when they suffer equally.18 Of those who have *equal degrees of merit,\" xxthe rich and the great\" enjoy more respect from nearly everyone than uthe poor and the humble.\"19 John Dewey and James Tufts considered moral biases of the powerful. They argued that it is difficult for a person ina place of authoritative power to avoid supposing that what he wants is right as long as he has power to enforce his demand. And even with the best will in the world, he is likely to be isolated from the real needs of others, and the perils of ignorance are added to those of selfishness. History reveals the tendency to confusion of private privilege with official status."},{"r":"anderson15","p":9,"t":"The history of the struggle for political liberty is largely a record of attempt to get free from oppressions which were exercised in the name of law and authority, but which in effect identified loyalty with enslavement.20 The applicability of this observation to belief in the justice of slavery, over which a war had been fought in Dewey's lifetime, is evident. Not only slaveholders, but many other whites who identified with them, many of whom expected to own slaves, or at least to hold a superior position to those deemed eligible for slavery, held that slavery was a just institution. The moral bias Smith observed was also pervasive in the antebellum U.S. Not only advocates of slavery, but its opponents, too, despised slaves and free blacks, who occupied a markedly lower social position in both the North and the South to whites. Racism was endemic throughout the U.S. The antebellum conflict over the morality of slavery remains important for moral epistemology because white abolitionists deployed the same methods of moral thinking that are so prominent in moral philosophy today. Their arguments thus offer a pragmatic test a test in practice of the powers of today's methods for correcting or counteracting moral bias. 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":10,"t":"PRESIDENTIAL ADDRESS - CENTRAL DIVISION The first white Anglo-American abolitionists were Quakers. They h that the fundamental principle of morality was the Golden Rule. J Hepburn argued that slavery and the slave trade violated the Golden Rule and led to the violation of every one of the Ten Commandments.21 His tract is a splendid piece of analytic moral philosophy, packed with logically rigorous arguments. David Brion Davis, the great intellectual historian of slavery, writes of Hepburn's pamphlet that it \"anticipated and answered virtually every proslavery argument that would appear in the next century and a half.\"22 Given his commitment to the Golden Rule, Hepburn used table-turning arguments a key method still used to check self-interested bias. He challenged slaveholders to consider whether they would want to be enslaved: *[T[he Tyranizing over and making Slaves of our Fellow Creatures, the Negroes, every one knows, or may know, this is not the way they would be done unto.\"23 Table-turning enables us to see the immorality of the slave trade as well.24 Yet proslavery thinkers had a ready answer to table-turning arguments. Presbyterian preacher James Henley Thornwell argued that the Golden Rule, as interpreted by abolitionists, reduced morality to the \"caprice\" of subjective desire. Of course, slaveholders do not want to be slaves; but criminals don't want to be punished, either."},{"r":"anderson15","p":10,"t":"The Golden Rule must be interpreted in light of the unequal social stations ordained by God and necessary for social order: If I am bound to emancipate my slave because if the tables were turned and our situations reverse, I should covet this boon from him, I should be bound, upon the same principle, to promote my indigent neighbors around me, to an absolute equality with myself. That neither the Jews . . . nor the Apostles . . . ever applied it in the sense of the Abolitionists, is a strong presumption against their mode of interpretation. . . . Our Savior directs us to do unto others what, in their situations, it would be right and reasonable in us to expect from them. . . . The rule then simply requires, in the case of slavery, that we should treat our slaves as we should feel that we had a right to be treated if we were slaves ourselves.25 Thornton Stringfellow, Baptist pastor of Virginia, agreed: the Golden Rule, if interpreted to reject slavery, would require leveling all social inequalities.26 Properly interpreted, it leaves them intact. 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":11,"t":"PROCEEDINGS AND ADDRESSES OF THE APA, VOLUME 89 Abolitionists also used the method of reflective equilibrium against slavery advocates. Yet, for every intuitive wrong charged against slavery, proslavery thinkers pointed to the intuitive permissibility of the same act in other domains. Abolitionist arguments were to little avail in a society where such practices were accepted against other subordinate groups. For example, abolitionists objected to the chaining of runaway slaves. James Hammond, former representative and governor of South Carolina, and soon to be its senator, replied to abolitionist Thomas Clarkson: \"Look to your army and navy.\" Soldiers and sailors, too, were put in manacles if they deserted their posts.27 Abolitionist classics such as Theodore Weld's American Slavery as It Is (1839) stressed the shocking violence of slavery, with its floggings and other physical punishments. But proslavery writers observed that workers, wives, and pupils were subject to violent discipline at the hands of bosses, husbands, and schoolmasters.28 Abolitionists objected that slaveholders forcibly separated husbands from wives and parents from children when they sold their slaves to different plantations. Proslavery thinkers replied that impressed seamen were also torn from their families, as were criminals sentenced to transportation.29 Abolitionists complained of the injustice of forcing slaves to work for no wage."},{"r":"anderson15","p":11,"t":"Proslavery thinkers noted that fathers had the right to force their children to labor for them without pay.30 Abolitionists documented the meager food, ragged clothing, and miserable shelter of slaves. Proslavery thinkers pointed to the misery of wage slaves in England, who were materially worse off, they claimed, than American slaves.31 But what of the fact that slaves, even those of talent, were deprived of all opportunities for advancement? Former senator of South Carolina William Harper replied, \"Females are human and rational beings. They may be found of better faculties, and better qualified to exercise political privileges, and to attain the distinctions of society, than many men; yet who complains of the order of society by which they are excluded from them?\"32 Today we have no difficulty accepting what were then radical implications of abolitionist arguments for other subordinate groups. Many abolitionists, however, were reluctant to carry their arguments so far. Wives suffered many of the same legal disabilities of slaves, lacking the rights to own property, make contracts, sue or be sued, or move about without their husband's permission, and women generally lacked opportunities for advancement, but only a few abolitionists questioned these disadvantages. The patriarch's right to use violence to discipline subordinate members of his family was largely uncontested. No congressional advocate of the Thirteenth Amendment was willing, when challenged, to argue that it overturned a husband's right to his wife's (or a father's right to his children's) labor and wages.33 Of course, slaves 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":12,"t":"PRESIDENTIAL ADDRESS - CENTRAL DIVISION suffered more from the abuses abolitionists objected to than other subordinates. Yet, in their eagerness to point to the genuine distinctions between chattel slaves and wage slaves, abolitionists undercut their stress on the material deprivations of slavery, the very point on which the differences between chattel slaves and the poorest free laborers of Britain were smallest. Abolitionists faced a difficult choice between drawing arbitrary lines in a continuum of abuses against subordinate or laying themselves open to proslavery charges that their argument led to anarchism, in an era where many kinds of severe authority w accepted as necessary for social order.34 Reflective equilibrium also put abolitionists under pressure because both sides accepted the Bible as a source of moral knowledge. Abolitionists such as Hepburn used the Bible to derive abstract moral principles that put slavery in question. Against this, proslavery thinkers focused on close, literal readings of the Bible, showcasing dozens of passages in which God, Jesus, or the Apostles authorized slavery.35 They also stressed the Christian doctrine of original sin, used since Augustine to justify slavery, and to postpone the liberating, egalitarian promise of the Bible to the afterlife.36 Thus, Christian morality exposed difficulties on both sides."},{"r":"anderson15","p":12,"t":"In response to textual evidence that the Bible authorized slavery, William Lloyd Garrison had to argue that the Bible was written not by God, but by many fallible humans, not all inspired by God.37 While most philosophers today would agree with Garrison, his argument sat uncomfortably with the dominant Christian beliefs of the day. Above all, racism profoundly distorted whites' moral intuitions, whether they favored or opposed slavery. Racism plays multiple roles in the conflict over slavery. Here I focus on how ideologies of black inferiority led slavery advocates to a delusional representation of slaveholders as benevolent paternalists toward their slaves, who supposedly would perish, like helpless children, without their masters' support and guidance.38 As preposterous as it seems to us today, and to abolitionists then, letters and diaries of slaveholders and their wives testify to their apparently sincere self-image as dutifully providing for the welfare of their slaves, even at a burden to themselves.39 This led to further delusions that their slaves were happy and loyal, and would stand by them in the event of war against the North,40 and that their slaves didn't mind the deprivations of slavery being denied personal liberty, rights to live with family members, education, even the honor associated with having recognized rights against rape and whipping.41 Less delusionally, proslavery thinkers observed that free blacks in the North were disproportionately represented in the prisons and among the destitute and unemployed.42 They deployed these facts as proof of 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":13,"t":"PROCEEDINGS AND ADDRESSES OF THE APA, VOLUME 89 black inferiority, of their incapacity to manage freedom in competition with whites. This claim was more difficult for white abolitionists to refute, since, affected by their own racism, they were reluctant to blame their own racist practices for these outcomes. Thus, the moral biases of slavery advocates proved largely immune to correction by the dominant methods of moral philosophy, which were deployed by white abolitionists. Ascent to the a priori led to abstract moral principles the Golden Rule, the equality of humans before God that settled nothing because their application to this world was contested. Table-turning exercises were ineffective for similar reasons. Reflective equilibrium did not clearly favor the abolitionists, given authoritarian, Biblical, and racist premises shared by white abolitionists and slavery advocates. No wonder only a handful of Southern whites turned against slavery on the basis of pure moral argument.43 3. PRAGMATIST METHODS OF COUNTERACTING MORAL BIAS: CONTENTION AND INCLUSION Yet, moral beliefs about slavery did change. After the Civil War, Southern whites insisted on white supremacy, most came to accept sharecropping as superior to slavery.44 The practical success of emancipation led them to drop all of the arguments they had previously made in support of the supposed necessity of slavery. The full story of how this change in moral beliefs came about is too complex for this lecture."},{"r":"anderson15","p":13,"t":"Here I stress two major factors. First, to change moral beliefs, slavery had to be challenged not only in pure moral arguments but in practical, collective action. Second, slaves and free blacks had to actively participate in those challenges. In social theory, '\"contention\" refers to practices in which people make claims against others, on behalf of someone's interests. \"Contentious politics\" consists of coordinated contention by groups around a shared agenda, involving governments as \"targets, initiators of claims, or third parties.\"45 Contentious practices span a spectrum from pure moral argument at one end, to riots, war, and other violent acts on the other. Between pure argument and violence is a wide range of contentious activities that are more or less disruptive of habitual ways of life, from petitioning, publicity campaigns, theatrical performances, candlelight vigils, litigation, and political campaigns, to street demonstrations, boycotts, teach-ins, sit-ins, picketing, strikes, building occupations, and other forms of civil disobedience. As people move beyond the pure moral argument pole, they manifest in action and not only words their 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":14,"t":"PRESIDENTIAL ADDRESS - CENTRAL DIVISION refusal to go along with the moral norms they are rejecting. Once it gets beyond pure moral argument, contention consists in the collective, concerted repudiation of morally objectionable practices by means of actions that disrupt the routine functioning of those practices, and that express rejection of the moral authority of people to practice them. Contention aims to secure the satisfaction of claims by eliciting the recognition of those in power of the legitimacy of those claims, and thereby the incorporation into social institutions of an established recognition of those claims.46 It might seem that violent acts, on this definition, could not count as contention, even if they have political aims. To be sure, political violence used simply to get one's way by force, as in cases of genocide and ethnic cleansing, does not address the victims as agents of whom it is demanded that they respond to claims. But other kinds of violence do aim at eliciting the practical recognition from authorities of legitimate claims. For example, the American War of Independence aimed not simply at obtaining de facto independence from Britain but at securing recognition from Britain of the United States as a sovereign nation. The war was a form of violent contention. I claim that, in some circumstances, practical contention brings about collective moral learning learning on the part of societies that pure moral argument cannot."},{"r":"anderson15","p":14,"t":"We have evidence that moral change induced by contention counts as learning as an improvement of moral beliefs if the contention blocks, counteracts, bypasses, or corrects cognitive or moral biases that supported the status quo ante, such that the new moral beliefs embodied in altered practice are not, or at least less, distorted by those biases. In such cases, we have similar grounds for claiming that the new moral beliefs are more reliable as in cases of belief change on the basis of blinded placebo-controlled clinical trials. Practical contention, not just individual moral persuasion, is needed to effect collective moral belief change because collective moral beliefs are embodied in social norms. Social norms are sustained by reciprocal expectations of conditional conformity. They involve tacit or explicit agreements within a society to conform to the norm, on condition that enough others conform. Collective moral beliefs are embodied in social norms of discussion, joint deliberation, and claim-making. A group shares a belief if that belief shapes discourse within the group: the group takes it for granted as a premise for further argument, not needing independent justification; its truth is treated as a settled matter; disputing it is regarded as, if not beyond the pale, requiring a heavy burden of proof; disputants are liable to censure or even social exclusion for calling such convictions into question.47 For belief 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":15,"t":"PROCEEDINGS AND ADDRESSES OF THE APA, VOLUME 89 in a moral principle to be collectively accepted also requires that the principle regulates interpersonal claim-making: members are free to make claims in accordance with the principle and generally do so when they are victimized by violations of it; other members acknowledge the legitimacy of such claims; the principle is widely if not completely obeyed by group members; the group punishes disobedience; members take steps to transmit the principle to future generations.48 Because collective moral beliefs are sustained by reciprocal expectations, an individual can privately dissent while still participating in the practices that sustain the belief for the group. Hence, merely changing an individual's mind through moral argument need not change the collective belief. Furthermore, individuals may resist acting on their personal conclusions because a belief is held collectively. This is not simply because they lack the courage of their convictions. They may wonder whether they have reasoned correctly if they reach conclusions contrary to the group consensus, and think that the group's belief is more reliable than their own reasoning. Pure moral argument may also lack a certain degree of seriousness, insofar as it is advanced in contexts outside of interpersonal claim-making, by people who lack direct stakes in what they are saying. Contentious politics avoids these weaknesses of pure moral argument."},{"r":"anderson15","p":15,"t":"In contentious political practices, people advance moral beliefs in the context of actual claim-making: the stakes are real and serious. Because these practices involve mass action in public repudiation of existing norms, they destabilize the shared expectations that hold those norms in place, casting doubt on the robustness or authenticity of the purported consensus around them. Their mass public nature may give courage to those who privately dissented, proving that their doubts about existing norms were not merely the product of idiosyncratic reasoning. To the extent that contentious politics disrupts the routine operation of challenged norms, it forces genuine practical deliberation about what to do, not mere idle speculation. In refusing to concede legitimacy to the enforcement of challenged norms, contentious politics threatens a loss of honor on the part of those who do enforce them something that may inspire the enforcers to reconsider them.49 Contentious politics thus serves to awaken societies to serious practical reflection on entrenched moral beliefs. More is needed, however, to ensure that the direction their reflection takes is less biased. Many features of contention can play this role. Here I stress one: th participation of the victims of injustice in challenging the norms that oppress them. 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":16,"t":"PRESIDENTIAL ADDRESS - CENTRAL DIVISION So far I have discussed the moral arguments made by white abo such as Hepburn, Clarkson, Weld, and Garrison. As we have see strategies were ineffective against the slaveholding culture of Racism posed powerful obstacles to their efforts. Despite the a commitment of white abolitionists to the equality of blacks before God, and hence their equal moral considerability, racism biased their representation of the evils of slavery. They overwhelmingly represented slaves as victims of cruelty and material deprivation. Weld's American Slavery as It Is (1839) (the inspiration for Harriet Beecher Stowe's Uncle Tom's Cabin , which, with Weld's work, constituted the two most influential white abolitionist publications in the U.S.) documents in exhaustive detail the material deprivations inflicted on slaves and their subjection to cruel tortures. Notably, these wrongs can be suffered equally much by animals."},{"r":"anderson15","p":16,"t":"By contrast, Weld's work passes relatively lightly over slavery's manifold assaults on slaves' specifically human, dignitary interests in their agency and in recognition from others: the deprivation of autonomy, legal rights, education, and opportunities for self-advancement; the theft of the fruits of their labor; the dishonor inflicted on female slaves through slaveholder rape; the dishonor imposed on male slaves by denying them authority over family life, powers to protect their wives and children, and access to avenues for developing and exercising military virtues. White abolitionists thus tended to cast slaves more as objects of pity than as subjects of dignity entitled to command respect. They were notably weak in addressing slaveholders' claims that blacks lacked intelligence, talent, foresight, and capacities for self-governance, and so would be unable to compete with whites in a free labor market, but sink into destitution, vagrancy, and crime if they were freed key elements in slaveholders' patriarchal defense of slavery as necessary for blacks' welfare and social order. Black abolitionists placed greater emphasis on the ways in which slave deprived slaves of dignity, honor, and access to distinctively human rights and achievements. The central theme of Harriet Jacobs's Incidents in the Life of a Slave Girl Written by Herself was the vulnerability of slave women to sexual harassment and rape at the hands of their masters."},{"r":"anderson15","p":16,"t":"The female slave uis not allowed to have any pride of character. It is deemed a crime in her to wish to be virtuous.\" Jacobs rated this injury as far worse than slavery's material deprivations or consignment to a life of drudgery. She hid in a tiny, dark attic for almost seven years to avoid sexual assault, judging this fate better than slavery, even though she had never been whipped, beaten, or overworked as a slave.50 Frederick Douglass agreed with Jacobs's priorities. Worse than the whip was slavery's consignment of slaves to ignorance and incapacity to think for themselves. Indeed, the fundamental point, and greatest injury, 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":17,"t":"PROCEEDINGS AND ADDRESSES OF THE APA, VOLUME 89 of material deprivation and brutal physical punishment was to disable slaves from aspiring to freedom, to the exercise of rational capacities, to any kind of estimable activity.51 From this dignitary perspective, Douglass exposed slaveholders' boasts of the material indulgence they granted their slaves on holidays, when they were encouraged to get drunk and discouraged from any work, as a great fraud, designed only \"to disgust their slaves with freedom, by plunging them into the lowest depths of dissipation/752 Black abolitionists' alternative critique of the evils of slavery led them to advocate a different strategy for bringing about moral change one addressed as much to antislavery Northerners as to advocates of slavery. Their critique identified racism the widespread, deeply entrenched contempt for blacks, based on prejudicial feelings of their being unfit for freedom and equal dignity with whites as the core moral bias upholding slavery. To counteract this prejudice, much more than pure moral argument was required. Blacks needed to demonstrate in action their interest, capacity, and worthiness for freedom and dignity. \"We . . . wish to see the charges of Mr."},{"r":"anderson15","p":17,"t":"Jefferson refuted by the blacks themselves\" for, if blacks fail to try, \"we will only establish them.\"53 As James McCune Smith, the first African-American to earn a medical degree, and editor of Douglass's My Bondage and My Freedom , put the point: The real object ofthat [antislavery] movement is not only to disenthrall, it is, also, to bestow upon the Negro the exercise of all those rights, from the possession of which he has been so long debarred. But this full recognition of the colored man to the right, and the entire admission of the same to the full privileges, political, religious and social, of manhood, requires powerful effort on the part of the enthralled, as well as on the part of those who would disenthrall them. The people at large must feel the conviction, as well as admit the abstract logic, of human equality; the Negro . . . must prove his title first to all that is demanded for him; in the teeth of unequal chances, he must prove himself equal to the mass of those who oppress him . . ..54 Without such effort by blacks themselves \"to disprove their alleged inferiority, and demonstrate their capacity for a more exalted civilization than slavery and prejudice had assigned to them,\" whites would \"reconcile themselves\" to blacks' \"enslavement and oppression, as things inevitable, if not desirable.\"55 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":18,"t":"PRESIDENTIAL ADDRESS - CENTRAL DIVISION This task stood in tension with white abolitionists7 strategy to pre slaves as objects of pity. Douglass grated under their requests th merely \"give us the facts/7 and \"we will take care of the philosoph They implored him to speak to audiences with an uneducated plant accent, lest Northern whites think he wasn't really a fugitive slave. objected to his establishing a paper of his own, preferring that continue to lecture under their sponsorship, oblivious to the impor Douglass saw in demonstrating blacks7 capacities and inspiring, thr his achievements, other blacks to that call.56 In this dispute, black abolitionists proved to be far keener moral psychologists than their white counterparts. White abolitionists, in stressing the pathos of slavery, operated on the assumption that the core moral bias of slavery advocates was heard-heartedness. On that assumption, the key strategy for counteracting that bias should be to highlight those facts about slavery that arouse people's sympathies and to cultivate social practices that encourage sentimentality and openheartedness, so that people feel free to respond appropriately to those facts."},{"r":"anderson15","p":18,"t":"Black abolitionists identified the core weakness of this strategy: \"Human nature is so constituted, that it cannot honor a helpless man, although it can pity him; and even this it cannot do long, if the signs of power do not arise.7757 If the core moral bias of slavery advocates was racist contempt, then this can only be counteracted by resisting subordination and oppression, demanding respect, and seizing it, by force if necessary, from those who withhold it. To demonstrate worthiness of respect, one must conduct oneself as entitled to it. Failing that, the contemptuous will think their targets uninterested in, incapable of, and hence undeserving of respect. On this point, black abolitionists were united. Their writings repeatedly testify to the power of blacks7 standing up for their rights, and the supreme importance of their doing so. Jacobs \"resolved never to be conquered77 and resisted her master's sexual advances. Escaping North, she successfully opposed racial discrimination in hotel service by telling the black servants that they should stand up to oppose it.58 Douglass admired the unbowed resistance of Nelly to overseer Mr."},{"r":"anderson15","p":18,"t":"Servier7s blows, noting that he never whipped her again.59 This incident prefigured his own triumphant struggle against the slavebreaker Covey, from which he drew his central insight into the moral psychology of overcoming oppression: to obtain recognition of one's respectability from others, one must manifest self-respect in action by exacting respect from others. This call to resistance was the core of David Walker's Appeal.60 And resist the slaves did, taking deeds, more than words, as the key to 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":19,"t":"PROCEEDINGS AND ADDRESSES OF THE APA, VOLUME 89 progressive moral change. Slaves exploited the legal codes of the South to extract recognition of rights through innumerable acts of resistance on the plantations, including, in some cases (astonishingly!), the right to kill their masters in self-defense.61 There was no better proof that slaves desired freedom and repudiated enslavement than the steady flow of fugitives North, without regret or reversal. Toward the end of the Civil War, the Confederacy, running out of soldiers, debated whether to draft slaves into the army. Howell Cobb, one of the founders of the Confederacy, answered, xxlf slaves will make good soldiers our whole theory of slavery is wrong/762 But fugitive slaves demonstrated, in their courageous service in the Union Army, that slaves did make good soldiers. They thereby heeded Walker's call for blacks themselves to refute Jefferson's aspersions on their race and shattered the South's \"whole theory of slavery.\" While their actions did not end racism, they did force a momentous retreat of this profound moral bias. Slavery advocates were forced to concede that the case for slavery was spurious, and that blacks were fit at least for the autonomy that the emergent sharecropping economy conceded to them. This was not full freedom by any means, but it was a giant step up from slavery. 4."},{"r":"anderson15","p":19,"t":"SOME PRAGMATIST PATHS FORWARD FOR MORAL PHILOSOPHY Let us step back and draw some lessons from this monumenta of collective moral learning. Recall that pragmatism replaces t for ultimate criteria of moral rightness, true in all possible w least at high levels of abstraction, with methods of intelligent I argued that one important type of intelligent updating i blocking, counteracting, or reducing the influence of mor We have reasons to believe that social power biases moral reasoning in systematic ways. First, as Smith argued, people tend to feel more sympathy, and more esteem, for the rich and powerful relative to the poor and powerless, controlling for equal suffering and equal merit. The latter unjustly suffer contempt. He could have added that such contempt tends to be rationalized by biased notions of group inferiority. Second, as Dewey and Tufts argued, the powerful who shape social institutions to benefit their social groups at others' expense tend to confuse what they want with what is right so long as they have the power to enforce their demands. Faced merely with pure moral argument, we have seen that the powerful and their advocates, typically have substantial resources at their disposal, from the intuitive moral ideas and principles available in their society, to 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":20,"t":"PRESIDENTIAL ADDRESS - CENTRAL DIVISION rationalize their side of the debate. Nor does purely speculative, a p moral argument typically activate real practical reasoning. Henc powers of pure moral argument to dislodge prejudice and bias te be weak. Stronger methods are needed to counteract the biases induced by social power. My case study of a society-wide change in moral belief from proslavery to abolitionist, focused on two such methods. First, contentious politics active, practical, mass resistance to the moral claims embodied in social institutions enforced by and catering to the powerful is needed to activate genuine practical reasoning across al levels of society. The powerful won't really listen to reason that is, to claims from below until they no longer have the power to routinely enforce their desires. Second, the subordinated and oppressed must actively participate in that contention. They must manifest in deed and not only words their own interest, capacity, and worthiness for the rights and privileges they are demanding. For if they meekly submit to oppression, this tends to make observers not only the powerful, but anyone , as Smith held think that the downtrodden have no interest in or capacity for uplift and do not deserve it. The oppressed must show their determination to cast off oppression in order to arouse the esteem and thereby enlist the support or at least the acquiescence of others. Walker, Jacobs, McCune, and Douglass understood this."},{"r":"anderson15","p":20,"t":"Respect is obtained from others not by abstract argument but by dignified exaction. No wonder Douglass lost all patience for abstract moral argument: [W]here all is plain there is nothing to be argued. . . . Must I undertake to prove that the slave is a man? . . . The slaveholders themselves acknowledge it . . . when they punish disobedience on the part of the slave. What is this but the acknowledgement that the slave is a moral, intellectual, and responsible being . . . [I]t is not light that is needed, but fire. . . . The feeling of the nation must be quickened; the conscience of the nation must be roused; . . . the hypocrisy of the nation must be exposed; and its crimes against God and man must be proclaimed and denounced.63 In the language of contemporary moral philosophy, Douglass was calling for a shift from third-person to second-person address, from abstract impersonal argument to interpersonal claim-making, founded on an assertion of authority to demand respect from others.64 To be called to account, to be addressed as a bearer of duties to the addresser, to be 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":21,"t":"PROCEEDINGS AND ADDRESSES OF THE APA, VOLUME 89 upbraided for failure to do what is authoritatively demanded these are essential experiences needed to become a morally responsible being, fit for living with others. And these are the experiences to which slaveholders, holding irresponsible totalitarian power over slaves, were least exposed before the Civil War. Yet, in the perverse corruption of moral sentiments Smith identified, until the enslaved actively repudiated their subjection, it was the slaves, rather than the slaveholders, who were thought unfit for living freely with others. From our current moral perspective, it is easy for us to see the errors of the past, with respect to slavery. A skeptic might wonder whether we are merely begging the question in favor of our current moral beliefs. The pragmatist answers that this change can be seen to be progressive, a case of moral learning, because it was brought about through practices that tend to counteract or reduce known moral biases rooted in human psychology. As clinical conclusions reached on the basis of blinded, placebo-controlled clinical trials are more reliable, due to the ways they check the biases of wishful thinking, moral conclusions reached on the basis of practical methods that counteract the biases of power are similarly more reliable. This pragmatist perspective suggests an alternative research program for moral philosophy, reaching beyond the a priori methods to which we philosophers are so wedded."},{"r":"anderson15","p":21,"t":"My point is to expand the tools we use, and to reduce our excessive reliance on the old tools. Just as a bolt will turn uselessly without a nut to fasten it, or glued joints will be weak if they haven't been clamped, our abstract moral arguments will spin without conclusion or fall apart uselessly unless they are used in conjunction with empirically grounded tools. We can make better progress by working in close conjunction with the social sciences and history to consider empirically how different circumstances, including social relations, shape our moral thinking. If we discover an influence on our moral thinking that we can't justify, or that experience shows us to lead to untoward consequences, we have discovered a moral bias. Then we can seek empirically reliable methods to correct, block, counteract, or bypass those biases, keeping in mind that pure reasoning may not be enough. Some methods may be practical, not just speculative or theoretical, and involve concerted action in the world, sometimes collective political action. This alternative research program does not reject intuitions. They are a basic material of moral thinking; we have no way around them. But we must be alert to the possibility that our intuitions might suffer from bias and would be improved under alternative conditions. 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":22,"t":"PRESIDENTIAL ADDRESS - CENTRAL DIVISION My case study raises an alarm for philosophy as we currently prac it. Without active participation of the oppressed and disadvantaged moral views reached by philosophers are liable to be biased ignora of and unresponsive to the concerns and claims of those not presen Dewey and Tufts identified that problem, too. Morality, understoo what we owe to each other, arises from the need to adjudicate the that everyone makes on everyone else. If the claims of the subordi are suppressed, silenced, ignored, or misunderstood, the conclusions reached on the basis of the subset of claims that are considered are liable to be systematically biased. My case study indicates that purely priori methods of bias correction are unlikely to reliably counteract su biases.66 There is no reason to think that everm o re-el a bo rate explorat of the contours of one's own moral thoughts, or of the thoughts of similar situated persons, will capture everyone's moral concerns. Knowledge o what we owe to each other can only be generated through processes o interpersonal claim-making that include those occupying the full ran of diverse situations in society. For moral philosophy to make progre it must practice inclusion of diverse philosophers. In this lecture, I have focused on bias correction as one basic pragmat method. Another is experiments in living."},{"r":"anderson15","p":22,"t":"The conclusions we reach from real experiments in living are likely to be more reliable than the conclusions we reach from thought experiments. Thought experiments are at best no more reliable than deliberation. We often find that our deliberations have gone astray once we act on them and experience unexpected results some of which may inspire us to revise the initial terms in which we formulated the stakes in our decision.67 Ascent to the a priori offers no protection from such revision. We know from th history of morals that conceptions of value thought to be immutable do in fact, change over time. Just as bias correction requires collaboration with history and the social sciences, so does assessing the results of experiments in living. Pragmatism thereby invites us to naturalize moral inquiry at the same time as expand the range of participants in it. It is high time that we philosophers expand our toolboxes, as well as our collaborators. In doing so, we have nothing to lose but our prejudices. NOTES 1. Thomas Scanlon, What We Owe to Each Other (Cambridge, MA: Harvard Univers Press, 1998). 2. G. A. Cohen, ''Facts and Principles,\" Philosophy and Public Affairs 31, no. 3 (200 211-45. 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":23,"t":"PROCEEDINGS AND ADDRESSES OF THE APA, VOLUME 89 3. John Rawls, A Theory of Justice (Cambridge: Harvard University Press, 1971), §9. 4. Elizabeth Anderson, \"John Stuart Mill and Experiments in Living/' Ethics 102 (1991): 4-26; Elizabeth Anderson, \"The Quest for Free Labor,\" Lecture 9, Amherst Lecture in Philosophy. Amherst College, 2014a, http://www.amherstlecture.org/ anderson2014/index.html. 5. Golden Rule reasoning would also require usto consider the impact of forbidding the agent from performing the action. 6. Rawls, A Theory of Justice, §24. 7. Judith Jarvis Thomson, \"A Defense of Abortion,\" Philosophy and Public Affairs 1 (1971): 47-66. 8. Discussing with others about what shared principles should govern their interaction, when decisions are to be made, counts as joint deliberation. 9. Jonathan Weinberg, Shaun Nichols, and Stephen Stich, \"Normativity and Epistemic Intuitions/' Philosophical Topics 29, nos. 1-2 (2001): 429-60. 10. Donald Kinder and Cindy Kam, Us Against Them: Ethnocentric Foundations of American Opinion (Chicago; London: University of Chicago Press, 2009). 1 1. Anita M. Superson, The Moral Skeptic (Oxford; New York: Oxford University Press, 2009). 12. John Dewey, Democracy and Education: An Introduction to the Philosophy of Education (New York: The Macmillan Company, 1916), ch. 19. 13. Antonio Damasio, Descartes' Error: Emotion , Reason, and the Human Brain (New York: Putnam's Sons, 1994). 14."},{"r":"anderson15","p":23,"t":"Michael Kraus, Paul Piff, and Dacher Keltner, \"Social Class as Culture: The Convergence of Resources and Rank in the Social Realm,\" Current Directions in Psychological Science 20, no. 4 (201 1): 246-50. 1 5. Hastings Rashdall, The Theory of Good and Evil, 2nd ed. (Oxford: Oxford University Press, 1924), 237-38. 1 6. The case for this conclusion is not based on begging the question in favor of our current moral beliefs. Rather, it is vindicated by pragmatist methods themselves, as I argue in \"Social Movements, Experiments in Living, and Moral Progress: Case Studies from Britain's Abolition of Slavery,\" Lindley Lecture, University of Kansas, 2014b, http://kuscholarworks.ku , Jordan, Roll: The World the Slaves Made. New York: Vintage Books, 1976. Gilbert, Margaret. ''Modeling Collective Belief.\" Synthese 73 (1987): 185-204. Hammond, James. \"Letters on Slavery.\" In The Proslavery Argument as Maintained by the Most Distinguished Writers. Charleston: Walker, Richards & Co., 1852. Harper, William. \"Slavery in Light of Social Ethics.\" In Cotton Is King, and Pro-Slavery Arguments, edited by E. N. Elliott. Augusta, GA: Pritchard, Abbott & Loomis, 1860. Hepburn, John. The American Defence of the Christian Golden Rule, or An Essay to Prove the Unlawfulness of Making Slaves of Men. New York(?), 1715. Jacobs, Harriet. Incidents in the Life of a Slave Girl Written by Herself, edited by L. Maria Child. Boston, MA, 1861. Kinder, Donald, and Cindy Kam. Us Against Them: Ethnocentric Foundations of American Opinion. Chicago; London: University of Chicago Press, 2009. Kraus, Michael, Paul Piff, and Dacher Keltner."},{"r":"anderson15","p":27,"t":"\"Social Class as Culture: The Convergence of Resources and Rank in the Social Realm.\" Current Directions in Psychological Science 20, no. 4 (201 1): 246-50. Mills, Charles. The Racial Contract. Ithaca and London: Cornell University Press, 1997. Oakes, James. Slavery and Freedom: An Interpretation of the Old South. New York: Alfred A. Knopf, 1990. Ransom, Roger, and Richard Sutch. One Kind of Freedom: The Economic Consequences of Emancipation, 2nd ed. New York: Cambridge University Press, 2001. Rashdall, Hastings. The Theory of Good and Evil, 2nd ed. Oxford: Oxford University Press, 1924. Rawls, John. A Theory of Justice. Cambridge, MA: Harvard University Press, 1971. Scanlon, Thomas. What We Owe to Each Other. Cambridge, MA: Harvard University Press, 1998. Smith, Adam. The Theory of Moral Sentiments, edited D. D. Raphael and A. L. Macfie. Glasgow Edition of the Works and Correspondence of Adam Smith. Oxford: Oxford University Press, 1759. Stringfellow, Thornton. \"The Bible Argument, or Slavery in the Light of Divine Revelation.\" In Cotton Is King, and Pro-Slavery Arguments, edited by E. N. Elliott. Augusta, GA: Pritchard, Abbott & Loomis, 1860. Superson, Anita M. The Moral Skeptic. Oxford; New York: Oxford University Press, 2009. Thomson, Judith Jarvis. \"A Defense of Abortion.\" Philosophy and Public Affairs 1 (1971): 47-66. Thornwell, James. The Rights and Duties of Masters. Charleston, SC: Steam-Power Press of Walker & James, 1850. 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"anderson15","p":28,"t":"PRESIDENTIAL ADDRESS - CENTRAL DIVISION Tilly, Charles, and Sidney Tarrow. Contentious Politics. New York: Oxford Univ Press, 2006. VanderVelde, Lea. wThe Labor Vision of the Thirteenth Amendment.\" Univer Pennsylvania Law Review 138 (1989-90): 437-504. Walker, David, and Henry Highland Garnet. Walker's Appeal , with a Brief Sketch o Life by Henry Highland Garnet. New York: J. H. Tobitt, 1829. Weinberg, Jonathan, Shaun Nichols, and Stephen Stich. \"Normativity and Ep Intuitions/' Philosophical Topics 29, nos. 1-2 (2001): 429-60. Weld, Theodore Dwight. American Slavery as It Is : Testimony of a Thousand Wi New York: American Anti-Slavery Society, 1839. 150.108.112.14 on Tue, 01 Sep 2026 20:59:38 UTC"},{"r":"shelby","p":1,"t":"Racial Realities and Corrective Justice: A Reply to Charles Mills Author(s): Tommie Shelby Source: Critical Philosophy of Race, Vol. 1, No. 2 (2013), pp. 145-162 Published by: Penn State University Press Accessed: 14/09/2013 11:15 . content in a trusted digital archive. We use information technology and tools to increase productivity and facilitate new forms . Philosophy of Race."},{"r":"shelby","p":2,"t":"racial realities and corrective justice A Reply to Charles Mills tommie shelby Harvard University critical philosophy of race, vol. 1, no. 2, 2013 State University, University Park, PA Abstract I reply to Mills’s critique of my effort to show the relevance of Rawls’s theory of justice for thinking about and responding to ­racial injustices. Contrary to Mills’s claims, my suggestion that the fair equality of opportunity principle can remedy socioeconomic disadvantages caused by the legacy of racial oppression is compatible with Rawls’s framework, does not conflate distributive justice with corrective justice, and does not confuse racial injustice with economic injustice. I also raise doubts about Mills’s project to radically reconstruct contractarian political philosophy. He seeks to displace ideal theory with nonideal theory by foregrounding the realities of past racial domination. Against this approach, I argue that an ideal theory that abstracts away from these realities is not inherently ideological, useless for corrective justice, or too ideal to guide social reform. And I defend the view that ideal theory is indispensible for nonideal theorizing about racial justice. CPR 1.2_01_Shelby.indd 145 08/08/13 3:08 PM"},{"r":"shelby","p":3,"t":"146 ■ critical philosophy of race Introduction Charles Mills initiated his critique of contractarian (or deontological) political philosophy in his influential book The Racial Contract (1997).1 There he charges that the seemingly race-neutral conceptual tools of this tradition actually obscure, marginalize, or ignore the history of racial domination in the world and, as a result, normative prescriptions based on these tools are flawed. Recently, his criticisms have been directed specifically toward John Rawls, the most celebrated contemporary representative of the contractarian tradition.2 Mills calls for a deep revision in the Rawlsian apparatus, for a reinsertion of the excluded history of racial subjugation, so that the framework of contractarian liberalism can be usefully applied to racial injustice. In the inaugural issue of this journal, Mills has attempted to reinforce his position by criticizing an article I wrote defending the value of Rawls’s theoretical framework for thinking about racial justice against his and others’ challenges.3 To highlight what is and isn’t at stake in this debate, I begin with some background remarks. In all these interventions, the main thrust of Mills’s critique is to ­emphasize the need to attend carefully to the realities of racial domination and to deny the value of a normative theory that abstracts away from the actual history of racial injustice."},{"r":"shelby","p":3,"t":"However, this critique has been mainly negative, telling us how not to derive principles of racial justice. Apart from vague suggestions that reparations are due for past racial injustices (e.g., for slavery and land expropriation), the positive normative analysis remains undeveloped. What we get instead is an emphasis on the necessity of getting the historical facts right about white supremacy. Mills does not offer his own positive normative principles for condemning or responding to the history of racial domination that he so forcefully describes. By contrast, Rawls does offer a specific set of normative principles of justice that, I argue, can be usefully applied to racial subordination. Mills, so far as I am aware, does not argue that if we were to follow his methodological approach we would arrive at principles that conflict with the ones that Rawls defends. Nor does he specifically attack or attempt to reformulate Rawls’s principles. So our dispute does not turn on the content of those two principles. Nor do we disagree over the importance of the conceptual distinction between facts and principles—between social realities and the standards we use to evaluate them. And we agree that the concrete facts about racial domination are relevant to the defense and application of the CPR 1.2_01_Shelby.indd 146 08/08/13 3:08 PM"},{"r":"shelby","p":4,"t":"147 ■ tommie shelby principles of social justice. What is at issue, then, is exactly how these racial realities should figure in theorizing about racial injustice. There are also background disagreements between Mills and me with regard to the traditions of political theory we each draw on. Much of my philosophical work, like Mills’s, concerns questions of racial and economic justice. We both investigate how dynamics of racial and class domination interact to produce various forms of oppression and seek to determine how best to respond to these injustices and their legacy. Also like Mills, I often address the thorny race-class problem by drawing on three political traditions—left-liberalism, Marxism, and black radicalism. But, as one might naturally expect, Mills and I don’t always agree on which resources from these three traditions are worth preserving or developing. Nor are we ­always in accord about how best to build on those elements from these traditions that we do agree are fruitful. As I see it, our present disagreement has three main dimensions, each related to one of those political traditions. First, we both agree that Rawlsian left-liberalism can be helpful for thinking through issues of racial justice. But Mills believes that the Rawlsian framework requires a “radical revision” if it is to serve this purpose (1), while I deny that such radical changes are necessary."},{"r":"shelby","p":4,"t":"Second, we both think that the Marxist concept ideology should be central to critical thinking about race. However, Mills thinks that “ideal theory” (as practiced by Rawls and his followers) functions as an ideology when it comes to correcting racial injustices, while I believe ideal theory, properly understood, is indispensible to such corrective justice projects. And finally, we both maintain that the black radical tradition contains wisdom about how to fight for racial justice. However, Mills thinks that the black radical emphasis on reparations for past racial injustice should be central to a theory of corrective justice, while I believe matters of rectificatory justice are less normatively fundamental. Mills’s main charges against me are that I confusedly use Rawls’s fair equality of opportunity principle (FEO) as a principle of rectification to ­address the claims of the victims of racial injustice and that in doing so my approach to racial justice violates the letter and spirit of Rawls’s framework, does not respect the distinction between ideal theory and nonideal theory, conflates principles of distributive justice with principles of corrective justice, and confuses racial injustice with economic injustice. I do not believe these charges have merit, and below I explain why. But I will also identify serious weaknesses in Mills’s overall project to reconstruct contractarian political philosophy. CPR 1.2_01_Shelby.indd 147 08/08/13 3:08 PM"},{"r":"shelby","p":5,"t":"148 ■ critical philosophy of race Ideal Theory: Reject or Supplement? Rawls defends a left-liberal theory of social justice. It is liberal because it emphasizes the familiar liberal values of liberty, equality, and tolerance, prioritizing individual freedom over socioeconomic fairness and perfectionist ideals. Its leftist credentials stem from the fact that it places strict constraints on material inequality (permitting socioeconomic inequalities only when these would benefit the most disadvantaged in society) and that it subjects property claims to substantive (rather than merely formal) standards of fairness, including limiting the impact of material inequality on democratic processes. Rawls’s contributions to theorizing social justice are almost entirely restricted to ideal theory—that part of a theory of justice that explains and justifies the principles that would regulate the basic structure of a perfectly just society. Rawls explicitly states that compensatory justice is a part of non­ ideal theory (or what he sometimes calls “partial compliance theory”) and that he does not address it.4 He recognizes that compensatory justice questions are important and that a fully comprehensive theory of justice would explain how such questions are to be handled. But the incompleteness of his liberal theory of justice does not show that the theory must be revised (radically or otherwise) to adequately address these nonideal questions."},{"r":"shelby","p":5,"t":"The claim that Rawls does not supply principles for the rectification of past racial injustice is not controversial. Indeed, he does not supply rectification principles for any kind of injustice. His theory is not a comprehensive theory of justice, if by that one means a theory that includes an articulation and defense of the principles we are to follow when remedying the injustices that the ideal theory proscribes. These elements must surely be added if we are to have a complete theory of social justice. The dispute between Mills and me is over whether Rawls’s theory must be radically altered to accommodate this addition. Mills’s frequent complaint that Rawlsians generally say little about racial justice in their writings is not the same as the charge that Rawls’s framework is not, without some revision, amenable to theorizing the rectification of racial injustice. There is a big difference between saying that they don’t do it and saying that they can’t do it. I do not see a good reason to think that Rawls’s theory is incompatible with principles of rectification. And I view liberal philosophers such as Bernard Boxill and Howard McGary who (though perhaps not identifying as Rawlsians) have taken up reparations and forgiveness for past racial injustices as ­having supplemented the theory in just this way.5 CPR 1.2_01_Shelby.indd 148 08/08/13 3:08 PM"},{"r":"shelby","p":6,"t":"149 ■ tommie shelby Mills is aware of this type of reply but rejects it as inadequate. He c­ ounters it through three avenues of argument, all of which center on the alleged failures of ideal theory. The first is to argue that ideal theory obscures the realities of white supremacy and thus leads people to ignore or misperceive racial injustices. In other words, ideal theory is “ideological” (in the pejorative Marxist sense). The second is to argue that ideal theory provides no guidance for dealing with racial injustice. It is, he claims, simply unhelpful for theorizing the rectification of racial injustices. And finally, Mills argues that ideal theory is “too ideal” to handle the grim realities of racial injustice. That is to say, the ideal of a “perfectly just” society has no applicability to societies with a history of serious racial injustice. In the next three sections of this article, I will show that these three lines of argument fail, and in the final section, I will reply to Mills’s specific charges against my treatment of the fair equality of opportunity principle. Is Ideal Theory “Ideological”? Mills argues that ideal theory is a “hindrance” to constructing nonideal theory (12)."},{"r":"shelby","p":6,"t":"As he says in another article, “the so-called ideal theory more dominant in mainstream ethics is in crucial respects obfuscatory, and can indeed be thought of as in part ideological, in the pejorative sense of a set of group ideas that reflect, and contribute to perpetuating, illicit group privilege.”6 Indeed, he goes further: “Ideal theory, I would contend, is really an ideology, a distortional complex of ideas, values, norms, and beliefs that reflects the nonrepresentative interests and experiences of a small minority of the national population—middle-to-upper-class white males—who are hugely overrepresented in the professional philosophical population.”7 Mills, extending insights from Marxism, argues that ideal theory obscures the actual conditions of social life, which are rife with racialized forms of domination, exploitation, and brutality. He contends that by abstracting away from the facts of oppression in its search for valid justice principles, ideal theory conceals the need for rectificatory justice, which is, he maintains, where the real action is with respect to racial justice. I believe the Marxist critique of ideology is important for thinking about and addressing racial injustice.8 And I would not deny that moral theories CPR 1.2_01_Shelby.indd 149 08/08/13 3:08 PM"},{"r":"shelby","p":7,"t":"150 ■ critical philosophy of race can be ideological or that philosophers (past and present) have ­contributed to the production of moral ideology. However, I do not think that ideal theory, as Rawls understands this, is ideological in the relevant sense. Rawls explicitly states that his two principles are meant “to guide the course of social reform.”9 He explains that his ideal principles have two main functions: to serve as goals to work toward and as normative standards for judging the overall justice of particular social arrangements (i.e., the “basic structure” of particular societies). In keeping with his liberal outlook, Rawls also argues that we should prioritize establishing social conditions that satisfy the equal liberty principle over conditions that bring about greater socioeconomic equality, as unequal liberty is a more serious and manifest injustice. Rawlsian ideal theory does not therefore “ignore” oppression. It gives us a reasonable standard for judging when social arrangements are, in fact, oppressive—that is, seriously unjust—and a goal to strive for in our resistance to oppression. Mills’s charge can seem plausible because he’s vague about which part of Rawls’s ideal-theory framework is supposed to be ideological. Sometimes by “ideal theory” Mills seems to mean an idealized picture of actual societies and their history, where their racist character has been “whitewashed,” surreptitiously sanitized of all racial domination."},{"r":"shelby","p":7,"t":"I suppose this could be construed as an objection to the thickness of the veil of ignorance in the original position, where the parties are limited to knowledge of general social facts and thus do not know the particular characteristics of the society for which they are choosing principles of association (except that the society falls within the circumstance of justice).10 But that methodological restriction is not a whitewashing of history. It is a way of modeling the impartial point of view of political morality, a way of preventing particular social contingencies—including existing and past injustices—from biasing the chosen principles or undermining their generality. At other times, by “ideal theory” Mills seems to have in mind Rawls’s assumption of strict compliance.11 The parties in the original position are to choose the principles of their association on the assumption that these principles will be fully complied with, i.e., that the institutional structure will be regulated by the principles and that the members of society will support and conform their conduct to institutional requirements. However, this methodological assumption is not a denial of the obvious fact that institutions and individuals often don’t comply with what justice demands. Rather, it is a way of modeling what social justice fully realized would look like. CPR 1.2_01_Shelby.indd 150 08/08/13 3:08 PM"},{"r":"shelby","p":8,"t":"151 ■ tommie shelby Consideration of the historical and current realities of racial injustice does have an indirect role to play in ideal theory through the process of coming to reflective equilibrium. We must inevitably rely on our firmest pre-theoretic moral convictions about particular cases of injustice when evaluating our theoretical conclusions, treating these convictions as fallible and “provisional fixed points” for moral reflection, not as self-evident moral foundations.12 So if the principles chosen from the original position didn’t condemn, for example, slavery, racial segregation, or racial discrimination in employment, then we could be confident that these principles aren’t sound and that we need to revise the conditions of the initial choice situation. Ultimately, we want our general conclusions to cohere with our deepest convictions about particular cases so that philosophical theory and concrete moral judgments mutually support each other. The realities of past racial domination are not therefore to be ignored in ideal theorizing, though we may abstract away from them for purposes of using the contractarian apparatus to justify general principles."},{"r":"shelby","p":8,"t":"Of course, the historically particular facts of social life do figure more directly in nonideal theory, because here the point is to assess the degree to which the actual world diverges from the ideal principles of justice and to chart a feasible course, from where we now stand, to the realization of these principles. But ideal theory is concerned with what these principles are and, just as important, with what justifies them. Rawls’s conceptual apparatus of the original position, along with its veil of ignorance and assumption of strict compliance, is meant to model a fair agreement on political principles of association such that once the agreement is made the resulting principles can be considered just. Admittedly, Rawls’s treatment of social justice operates at a high level of abstraction (including abstraction from time and place), and he does not draw out the implications of his theory for racial justice specifically. Thus in my original article, I sought to articulate some of these implications. I explained how Rawls’s theory could help us understand what institutional racism and racial discrimination are and what makes them unjust (1705–9). And I highlighted that Rawls would have us understand the ideal of racial equality as equal civic standing in a democratic polity, which is grounded in the presumption that all, regardless of race, are capable of fully participating in social life on fair terms (1701–4). My ultimate aim was to explain how the Rawlsian framework could help us understand how racial justice fits within an overall conception of social justice. CPR 1.2_01_Shelby.indd 151 08/08/13 3:08 PM"},{"r":"shelby","p":9,"t":"152 ■ critical philosophy of race Mills ignores this part of my discussion. His justification, I assume, is that he thinks these are not the racial justice issues currently worth theorizing about. As he says at the start, “I should clarify that by racial justice I mean primarily not preemptive measures to prevent racial injustice but corrective measures to rectify injustices that have already occurred” (2; emphasis in original). And he later reminds us, “my primary concern, as noted at the start, is corrective racial justice, which is the really interesting issue, rather than preventive antiracist measures” (5). I am going to assume that Mills would agree that the rectification of past racial injustice is not the only issue of racial justice suitable for philosophical theorizing. The question of what constitutes unjust racial treatment (a question within ideal theory) is clearly an important philosophical question. It is also clear that Mills would agree that, particularly in the United States, there are ongoing racial injustices (e.g., institutional racism, racial profiling, racialized mass incarceration, racist immigration practices, and racial discrimination in employment and housing), and so not all the serious racial injustices were perpetrated in the past.13 Certainly these injustices merit a practical (if not a philosophical) response."},{"r":"shelby","p":9,"t":"In addition, I take it he thinks that Rawls (and numerous others) properly identified the principles that would condemn these ongoing racial injustices, such that this philosophical question is no longer “really interesting” (19–20). Moreover, since the publication of A Theory of Justice (1971), the overwhelming majority of (white, male) political philosophers have followed Rawls in an almost exclusive focus on ideal theory, and thus perhaps Mills thinks we have had enough of that and should now attend to the neglected and more challenging topic of rectificatory justice. So, for Mills, the pressing and unresolved philosophical question about racial justice is what principles we should follow when rectifying grave past racial injustices (e.g., the land expropriation of nonwhite native peoples, racially motivated genocide, racialized slavery, colonial domination over the darker peoples of the globe, and vicious segregation regimes). Perhaps Mills is right that arriving at precisely formulated, systematically developed, and fully compelling answers to the racial questions of ideal theory is not our most critical philosophical need.14 He may also be correct that more political philosophers should devote some of their attention to nonideal theory, particularly with respect to racial injustice (2–3). And he may even be correct in his speculation that the racial, gender, and class demographics of professional philosophy have a lot to do with why CPR 1.2_01_Shelby.indd 152 08/08/13 3:08 PM"},{"r":"shelby","p":10,"t":"153 ■ tommie shelby so little attention has been given to the topics of nonideal theory (21–22). However, even if we were to concede all these claims, they do not show that ideal theory is ideological. In particular, they do not establish that ideal theory necessarily obscures or misrepresents racial injustice, conceals the need for rectificatory justice, or perpetuates the racial status quo. What ideal theory does, among other things, is give us a way to specify and defend racial justice principles that private individuals and state officials can use to evaluate institutional arrangements. Is Ideal Theory “Useless” for Nonideal Theory? Mills says, “Though Shelby does mention the ideal theory/non-ideal theory distinction, he does not really attribute that much weight to it” (10). On the contrary, I think the distinction has great significance.15 In fact, I don’t just mention the distinction but explain its implications for thinking about racial justice and explain why the race concept and racial identities do not figure in ideal theory directly (1698–1704). And not only do I believe that nonideal theory is a vital (if underappreciated) philosophical activity, but most of my writings are instances of it.16 The real disagreement between Mills and me is over how exactly to conceive the relationship between ideal theory and nonideal theory."},{"r":"shelby","p":10,"t":"Mills believes that ideal theory is unnecessary and useless, and political philosophers should simply abandon it and opt for nonideal theory instead. I, however, do not think of ideal theory and nonideal theory as two opposed or separable enterprises. They are rather complementary components of a single comprehensive theory of social justice. In fact, the second part, nonideal theory, logically depends on ideal theory; and the aims of nonideal theory (to respond appropriately to injustice) give ideal theory its practical point. On the Rawlsian view, injustices are conceptualized as deviations from the ideal principles of justice, in much the same way that fallacious reasoning is conceived as a deviation from the rules of logical inference. An injustice is a failure on the part of individuals or social arrangements to satisfy what the ideal principles of justice demand. Thus, charges of injustice presuppose ideals of justice, which particular individuals and institutions can and often do depart from. Such deviations can be small or great, minor or serious, and depending on the size and nature of the gap between ideals and practice (and also on whether these deviations are avoidable CPR 1.2_01_Shelby.indd 153 08/08/13 3:08 PM"},{"r":"shelby","p":11,"t":"154 ■ critical philosophy of race or ­blameworthy), different remedies will be required. Nonideal theory ­specifies and justifies the principles that should guide our responses to such deviations from ideal justice.17 Within nonideal theory (and here I focus on domestic rather than global justice), we should distinguish at least four sets of principles: 1. Principles of reform and revolution: the principles that should guide efforts to bring an unjust institutional arrangement more in line with justice such that the society’s members have a more just (though not necessarily perfectly just) society within which to live. 2. Principles of rectification: the principles that should guide the steps a society takes to remedy or make amends for the injuries and losses the oppressed have suffered as a result of past injustice. 3. Penal principles: the principles that should guide the policies a society relies on when responding to individual noncompliance with what justice requires (e.g., principles for punishment, detention, and deportation). 4. Political ethics: the duties and permissions individuals have under unjust social conditions, that is, the principles that should guide their response to injustice. Rawls’s theory provides some direction for (1) and (4), and some limited guidance for (3). But he provides almost no help with (2). And it is (2)—principles of rectification—that is Mills’s chief concern and the main concern of many black radicals."},{"r":"shelby","p":11,"t":"Most of my work has focused on principles of reform and revolution and political ethics (particularly the political ethics of the oppressed), and on the relationship between the two. Yet I certainly see value in work defending principles of rectification. Indeed, we can view the principles of reform and revolution and the principles of rectification as jointly constituting a theory of corrective justice. Principles of type (1) have to do with altering the basic structure of a society so that it better approximates a well-ordered society. Type (2) principles address the need to make amends to those burdened and harmed by unjust basic structures. Type (1) principles are forward looking, oriented toward establishing a just society. Type (2) principles are backward looking, oriented toward settling unpaid moral debts. To see that (1) and (2) are distinct it is enough to observe that one could fully pay reparations to the victims of past racial injustice and yet their society remain unjust, including racially unjust. Rawls is concerned with corrective justice, but he thinks of it as encompassing more than laying down principles for making amends CPR 1.2_01_Shelby.indd 154 08/08/13 3:08 PM"},{"r":"shelby","p":12,"t":"155 ■ tommie shelby to the ­victims of past injustice. He conceives of it as also including the ­philosophical arm of reform or revolutionary efforts to establish a society regulated by a mutual commitment to justice, a well-ordered society. When the principles of justice function as a goal of reform or revolution, what the reformers and revolutionaries are ultimately aiming at is this: a society in which the principles are fully realized in its institutions and citizens support and comply with institutional rules because these are in accord with their shared conception of justice. It is in this way that ideal theory serves as a guide for nonideal theory. Mills might accept this more expansive conception of corrective justice and even concede that Rawls’s ideal theory can aid us in its development. But I suspect he would still have doubts about ideal theory’s helpfulness in developing the rectificatory dimension of nonideal theory. After all, Rawls’s two principles are supposed to provide a basis for citizens to judge the validity of their claims of justice on their social system. One kind of claim citizens may make (on their own behalf or on behalf of others) is that they or others are due reparations for harms they have incurred as a result of serious injustice. Does Rawls provide any guidance for judging the validity of such claims? Mills is skeptical."},{"r":"shelby","p":12,"t":"He asserts, “Surely forty years is long enough—especially in a society to whose creation racism has been central—for there to be a significant body of work by now showing how one derives principles of rectificatory racial justice (a “pressing and urgent matter” [Rawls, Theory, 9] if ever there was one) from the idealtheory ­principles!” (23, note 6) In reply I would note that serving as a guide for nonideal theory is not the same as serving as a set of axioms from which theorems of rectification can be directly deduced. I doubt that ideal theory could play this latter justificatory role. And it should not surprise us if auxiliary precepts of justice were required for a fully adequate theory of compensatory justice. (The same would presumably be true of penal principles. After all, one cannot strictly derive a principle of proportionality in punishment from the two principles of justice either.)18 What ideal theory can provide, however, are evaluative standards for judging when such rectification is prima facie called for—namely, when culpable violations of the principles of justice have caused serious and identifiable harm. The ideal principles (particularly the equal liberty principle) help to explain what was wrong with, say, Jim Crow and Apartheid and why the damage they did to their victims warrants various corrective measures, perhaps including reparations. CPR 1.2_01_Shelby.indd 155 08/08/13 3:08 PM"},{"r":"shelby","p":13,"t":"156 ■ critical philosophy of race The trouble with Mills’s view is that he regards nonideal theory as independent of ideal theory, indeed as an alternative to it. But nonideal theory—the study of the principles that should guide our responses to injustice—cannot succeed without knowing what the standards of justice are (and perhaps also what justifies these standards). It is not clear how we are to develop a philosophically adequate and complete theory of how to respond to social injustice without first knowing what makes a social scheme unjust. When dealing with gross injustices, such as slavery, we may of course be able to judge correctly that a social arrangement is unjust simply by observing it or having it described to us, relying exclusively on our pre-theoretic moral convictions. We don’t need a theory for that. But with less manifest injustices, or when our political values seem to conflict, or when we’re uncertain about what justice requires, or when there is great but honest disagreement about whether a practice is unjust, we won’t know which aspects of a society should be altered in the absence of a more systematic conception of justice. Without a set of principles that enables us to identify the injustice-making features of a social system, we could not be confident in the direction social change should take, at least not if our aim is to realize a fully just society."},{"r":"shelby","p":13,"t":"In light of these considerations, I have two questions about Mills’s project: If we abandon the framework for ideal theorizing, how do we determine which principles of justice should guide our reform or revolutionary efforts, and how do we justify these principles if we must rely exclusively on nonideal theory? Unless Mills is prepared to relinquish the goal of realizing a fully just society, he owes an answer to these questions. Is Ideal Theory “Too Ideal”? Another reason Mills believes a radical revision is necessary to accommodate principles of rectification is that he thinks Rawls’s ideal theory has no applicability to our world, a world that is full of serious injustices, past and present. On Mills’s interpretation, Rawls is committed to a normative model of society that is “ideally just,” by which Mills means a society that is fully just now and has no injustice in its past. As he says in another article, there is a “crucial ambiguity” in Rawls’s ideal theory: “‘ideally just’ as meaning a society without any previous history of injustice and ‘ideally just’ as meaning a society with an unjust history that has now been ­completely CPR 1.2_01_Shelby.indd 156 08/08/13 3:08 PM"},{"r":"shelby","p":14,"t":"157 ■ tommie shelby corrected for. Rawls means the former, not the latter.”19 Mills argues that because of this methodological choice, Rawls’s principles can help us ­prevent injustices from occurring but cannot help us rectify injustices after they have already o
