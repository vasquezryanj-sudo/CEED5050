the purpose of the imperative of prudence—·namely happiness·—is given for every person. That leaves them the same in this respect: each commands the means to something that the person is assumed to have as a willed purpose, Chapter 2 so each commands the willing of the means to someone who wills the end; and so each is analytic. So there is no difficulty about how such an imperative is possible. [Both here, and at the start (2) of the discussion of imperatives of prudence, Kant makes it pretty clear that such imperatives are not actually analytic because of the indeterminateness about what happiness amounts to, though they would be analytic otherwise. He evidently thinks that if there is only this barrier to their being analytic, their status as nearly analytic (so to speak) makes them unproblematic.] (3) On the other hand, the question of how the imperative of morality is possible does call for an answer, for this imperative is not hypothetical, and so what it presents as objectively necessary can’t be based on any presupposed purpose as in the case of hypothetical imperatives."},{"r":"kant","p":23,"t":"But don’t lose sight of the fact that it can’t be shown empirically—can’t be shown by producing an example—that there are any imperatives of morality; perhaps every imperative that seems to be categorical is tacitly hypothetical. For example, Someone says ‘You oughtn’t to promise anything deceitfully’ and we ·take this to be categorical; we· assume •that an action of this kind must be regarded as in itself bad and thus that the imperative prohibiting it is categorical. (The alternative is to think •that the necessity involved in this prohibition is mere advice about how to avoid something else that is bad, along the lines of ‘You oughtn’t to promise falsely, in case people find out about it and your credit rating is wrecked’.) But we can’t point with certainty to any example in which the will is directed by the law alone without any other action-drivers, ·i.e. in which the will obeys a categorical imperative·. In a given case this may appear to be so, but it’s always possible that a fear of disgrace and perhaps also a dim sense of other dangers may have had a secret influence"},{"r":"kant","p":24,"t":"Groundwork Immanuel Kant on the will. ·We can’t rule this out on empirical grounds·: who can prove by experience that something doesn’t have a cause ·of a certain sort· when experience can only show us that we don’t perceive such a cause? In such a case—·i.e. when other incentives are secretly affecting the will·—the so-called ‘moral imperative’, which appears to be categorical and unconditional, is in fact only a pragmatic injunction that calls on us to attend to our own advantage. it) involves the necessity that we require of a law.) ·I have spoken of one thing we are up against when trying to show the possibility of categorical imperatives, namely that we must do this a priori, without being able to appeal to any empirical evidence that such imperatives do actually exist·. Now for a second point about getting insight into the possibility of a categorical imperative or law of morality, namely: there’s a very solid reason why it will be hard to do this, because this imperative is an a priori synthetic •practical proposition.7 ·We know already that· it is hard to see that •theoretical propositions of this sort—·i.e. ones that are synthetic and known a priori ·—are possible, so we must be prepared for at least as much difficulty when it comes to •practical ones."},{"r":"kant","p":24,"t":"In approaching this task, let us first ask: Doesn’t the mere concept of a categorical imperative provide us with the form of words expressing the proposition—the only ·kind of· proposition—that can be a categorical imperative? ·Don’t think that answering Yes to this ends our task·. For even when we know •how the imperative sounds—·i.e. how it is worded·—the question of •how such an absolute command is possible will require difficult and special labours to answer; I shall get into these in the final chapter. When I have the general thought of a hypothetical imperative, I can’t tell just from this thought what such an imperative will contain. To know that, I have to know what the condition is. But when I have the thought categorical With each of the other two kinds of imperative, experience shows us that imperatives of the kind in question do exist, and the inquiry into their possibility is the search only for •an explanation of them, not for •evidence that they exist. It is not so with categorical imperatives. Our investigation of their possibility will have to proceed purely a priori—starting with no empirical presuppositions, and in particular without the advantage of the premise that such imperatives actually exist. ·That they do exist is one of the things we may hope to establish through our inquiry into their possibility·."},{"r":"kant","p":24,"t":"(In the meantime—·though this is an aside·—this much at least may be seen: the categorical imperative is the only one that can be taken as a practical law, while all other imperatives may be called principles of the will [here = ‘movers of the will’] but not laws. This is because what is merely necessary-for-attainingsome-chosen-end can be regarded as itself contingent, ·as can be seen from the fact that· when we give up the end in question we get rid of the instruction stated in the imperative. In contrast with this, an unconditional command leaves the will no freedom to choose the opposite, so that it (and only Chapter 2 ·When I affirm a categorical imperative·, I connect the action with the will a priori, and hence necessarily, without making this conditional on the person’s preferring to achieve this or that end. (Though I do this objectively, i.e. under the idea of a reason that has complete control over all its subjective motivators.) So this is a practical proposition that doesn’t analytically derive the willing of an action from some other volition already presupposed (for we don’t have the perfect will that would be needed for there always to be such a volition, ·namely a volition to obey the moral law·) Rather, the proposition connects the action directly with the concept of the will of a rational being as something that •isn’t contained in it ·so that the connection •isn’t analytic·."},{"r":"kant","p":25,"t":"Groundwork Immanuel Kant imperative, I know right away what it will contain. For all the imperative contains is the law, and the necessity that the maxim conform to the law; and the law doesn’t contain any condition limiting it (·comparable with the condition that is always part of a hypothetical imperative·). So there is nothing left for the maxim to conform to except the universality of a law as such, and what the imperative represents as necessary is just precisely that conformity of maxim to law.8 So there is only one categorical imperative, and this is it: ·Act only on that maxim through which you can at the same time will that it should become a universal law·. Now if all imperatives of duty can be derived from this one imperative as a principle, we’ll at least be able to show what we understand by the concept of duty, what the concept means, even if we haven’t yet settled whether so-called ‘duty’ is an empty concept or not. The universality of law according to which effects occur constitutes what is properly called nature in the most general sense,. . . .i.e. the existence of things considered as determined by universal laws. So the universal imperative of duty can be expressed as follows: Act as though the maxim of your action were to become, through your will, a universal law of nature."},{"r":"kant","p":25,"t":"I want now to list some duties, adopting the usual division of them into •duties to ourselves and •duties to others, and into •perfect duties and •imperfect duties.9 Chapter 2 (1) A man who has been brought by a series of troubles to the point of despair and of weariness with life still has his reason sufficiently to ask himself: ‘Wouldn’t it be contrary to my duty to myself to take my own life?’ Now he asks: ‘Could the maxim of my action ·in killing myself· become a universal law of nature?’ Well, here is his maxim: For love of myself, I make it my principle to cut my life short when prolonging it threatens to bring more troubles than satisfactions. So the question is whether this principle of self-love could become a universal law of nature. If it did, that would be a nature that had a law according to which a single feeling •created a life-affirming push and also •led to the destruction of life itself; and we can see at a glance that such a ‘nature’ would contradict itself, and so couldn’t be a nature. So the maxim we are discussing couldn’t be a law of nature, and therefore would be utterly in conflict with the supreme principle of duty. (2) Another man sees himself being driven by need to borrow money. He realizes that no-one will lend to him unless he firmly promises to repay it at a certain time, and he is well aware that he wouldn’t be able to keep such a promise."},{"r":"kant","p":25,"t":"He is disposed to make such a promise, but he has enough conscience to ask himself: ‘Isn’t it improper and opposed to duty to relieve one’s needs in that way?’ If he does decide to make the promise, the maxim of his action will run like this: A maxim is a subjective principle of acting, and must be distinguished from the objective principle, which is the practical law. The maxim contains the practical rule that reason comes up with in conformity with the state the person (the subject) is in, including his preferences, his ignorances, and so on; so it is the principle according to which the subject acts. The law, on the other hand, is the objective principle valid for every rational being, and the principle by which the subject ought to act; that is, it is an imperative. Please note that I reserve the ·serious, considered· division of duties for a future metaphysic of morals, and that the present division is merely one I chose as an aid to arranging my examples. . ."},{"r":"kant","p":26,"t":"Groundwork Immanuel Kant Chapter 2 as a rational being, he necessarily wills that all his abilities should be developed, because they serve him and are given to him for all sorts of possible purposes. (4) A fourth man, for whom things are going well, sees that others (whom he could help) have to struggle with great hardships, and he thinks to himself: What concern of mine is it? Let each one be as happy as heaven wills, or as he can make himself; I won’t take anything from him or even envy him; but I have no desire to contribute to his welfare or help him in time of need. If such a way of thinking were a universal law of nature, the human race could certainly survive—and no doubt that state of humanity would be better than one where everyone chatters about sympathy and benevolence and exerts himself occasionally to practice them, while also taking every chance he can to cheat, and to betray or otherwise violate people’s rights. But although it is possible that that maxim should be a universal law of nature, it is impossible to will that it do so. For a will that brought that about would conflict with itself, since instances can often arise in which the person in question would need the love and sympathy of others, and he would have no hope of getting the help he desires, being robbed of it by this law of nature springing from his own will."},{"r":"kant","p":26,"t":"Those are a few of the many duties that we have (or at least think we have) that can clearly be derived from the single principle that I have stated on the preceding page. We must be able to will that a maxim of our action become a universal law; this is the general formula for the moral evaluation of our action. •Some actions are so constituted that their maxim can’t even be thought as a universal law of nature without contradiction, let alone being willed to be such. It’s easy to see that an action of that kind conflicts with stricter or narrower (absolutely obligatory) duty. •With When I think I need money, I will borrow money and promise to repay it, although I know that the repayment won’t ever happen. ·Here he is—for the rest of this paragraph—reflecting on this·: ‘It may be that this principle of self-love or of personal advantage would fit nicely into my whole future welfare, ·so that there is no prudential case against it·. But the question remains: would it be right? ·To answer this·, I change the demand of self-love into a universal law, and then put the question like this: If my maxim became a universal law, then how would things stand? I can see straight off that it could never hold as a universal law of nature, and must contradict itself."},{"r":"kant","p":26,"t":"For if you take a law saying that anyone who thinks he is in need can make any promises he likes without intending to keep them, and make it universal ·so that everyone in need does behave in this way·, that would make the promise and the intended purpose of it impossible—no-one would believe what was promised to him but would only laugh at any such performance as a vain pretence.’ (3) A third finds in himself a talent that could be developed so as to make him in many respects a useful person. But he finds himself in comfortable circumstances, and would rather indulge in pleasure than take the trouble to broaden and improve his fortunate natural gifts. But now he asks whether his maxim of neglecting his gifts, agreeing as it does with his liking for idle amusement, also agrees with what is called ‘duty’. He sees that a system of nature conforming with this law could indeed exist, with everyone behaving like the Islanders of the south Pacific, letting their talents rust and devoting their lives merely to idleness, indulgence, and baby-making—in short, to pleasure. But he can’t possibly will that this should become a universal law of nature or that it should be implanted in us by a natural instinct. For,"},{"r":"kant","p":27,"t":"Groundwork Immanuel Kant other actions, the maxim-made-universal-law is not in that way internally impossible (·self-contradictory·), but it is still something that no-one could possibly will to be a universal law of nature, because such a will would contradict itself. It’s easy to see that an action of that kind conflicts with broader (meritorious) duty. Thinking of duties in terms not of the object of their action but rather of the kind of obligation they involve, what I have given is a complete display of all the kinds of duty, in terms of their dependence on a single principle. Chapter 2 few exceptions—ones that strike us as unimportant and as forced on us. I have thus at least shown that if duty is a concept that is to have significance and actual law-giving authority for our actions, it has to be expressed in categorical imperatives, never in hypothetical ones. And along with that I have made clear—and ready for any use—the content that the categorical imperative must have if it is to contain the principle of all duty (if there is such a thing as duty). This is a substantial result; but I haven’t yet reached the point where I can prove a priori that •this kind of imperative really exists, that •there is a practical law that of itself commands absolutely and without any action-drivers, and that •obedience to this law is duty."},{"r":"kant","p":27,"t":"If we want to reach that point, it is extremely important that we pay heed to this warning: Don’t slip into thinking that the reality of this principle can be derived from the special constitution of human nature! For duty has to be practical-and-unconditional necessity of action; so it has to hold for all rational beings (the only beings to which an imperative has anything to say), and is a law for all human wills only because they are rational beings. In contrast with that, anything that is derived from •the temperament of human beings in particular, from •certain feelings and propensities ·of human beings·, or even from (if this is possible) •a particular tendency of the human reason that might not hold for the will of every rational being, —such a thing can yield a •maxim that is valid for us, but not a •law. That is, it can yield •a subjective principle on which we might act if our desires and dispositions take us that way, but not •an objective principle telling us how to act even if all our dispositions, preferences, and natural tendencies If we attend to what happens in us when we act against duty, we find that we don’t (because we can’t) actually will that our maxim should become a universal law. Rather, we are willing that the opposite of the maxim on which we are acting should remain as a law generally, but we take the liberty of catering to our preferences by making an exception—‘just for me, just this once!’."},{"r":"kant","p":27,"t":"So if we weighed everything from a single standpoint, namely that of reason, we would find a contradiction in our own will: willing that a certain principle •be objectively necessary as a universal law and yet •subjectively not hold universally but rather admit of exceptions. However, ·we don’t consider our actions in this unitary way; rather·, we regard our action ·at one time· from the point of view of a will wholly conformable to reason and then ·at another time· from the point of view of a will affected by preferences; so there is actually no contradiction, but rather the preference’s resisting the command of reason. In this the •universality of the principle is changed into mere •generality—·i.e. the move is made from all to ever so many or almost all ·—so that the practical principle of reason meets the maxim half-way. This procedure, whether or not it can be justified in our own impartial judgment, shows that we really do acknowledge the validity of the categorical imperative and allow ourselves (while keeping a wary eye on it) only a"},{"r":"kant","p":28,"t":"Groundwork Immanuel Kant empirical motives and laws. ·The warning is constantly and urgently needed·, because reason in its weariness is glad to rest on this pillow and dreamily. . . .substitute for •morality a botched-up •bastard assembled from limbs of very different species—it looks like anything you want to see in it, but not like virtue to anyone who has ever beheld her in her true form.10 So this is our question: Is it a necessary law for all rational beings that they should always judge their actions by maxims that they themselves could will to hold good as universal laws? If there is a such a law, it must already be connected—wholly a priori—with the concept of the will of a rational being. But in order to discover this connection, we must, however reluctantly, take a step into metaphysics; but it will be into the metaphysic of morals, not the region of metaphysics involved in •speculative philosophy. [The ‘speculative’/’practical’ contrast is explained on pages 3–4.] A •practical philosophy doesn’t commit itself to explanations of what happens but to laws about what ought to happen even if it never does—i.e. objective-practical laws. [Kant means that they are ‘objective’ at least in the sense that were pulling us in the opposite direction. Indeed, the •fewer subjective causes there are for acting in a certain way and •the more there are against, the more clearly we can see the sublimity and intrinsic dignity of duty’s command to act in that way."},{"r":"kant","p":28,"t":"The pulls in the other direction don’t weaken the constraint of the law or lessen its validity. Here we see philosophy put into a precarious position, which has to be made firm even though there is nothing in heaven or on earth to hang it from or stand it on! Here philosophy has to show its purity as the •sustainer of its own laws, and not as the •herald of laws that are whispered to it by an implanted ‘sense’ or by who knows what guardian ‘nature’! ‘Laws’ of the latter kind may always be better than nothing, but they can’t yield fundamental principles. Such principles can only be dictated by reason: they must have an entirely a priori origin, getting none of their commanding authority from the preferences of mankind and all of it from the supremacy of the law and due respect for it. Otherwise—·that is, if human nature were the only basis for morality·—mankind would be condemned to self-contempt and inner disgust. Thus if anything empirical were brought in as an ingredient in the principle of morality, it would not only •be utterly useless in this role but would also •do terrific harm to the purity of morality ·in practice·—for in morals the proper, priceless value of an absolutely good will consists precisely in action’s being driven by something that is free from all influences from contingent grounds that only experience can make available."},{"r":"kant","p":28,"t":"We can’t too strongly or too often warn against this slack—indeed this low— cast of mind, that looks for its principles [here = ‘the sources of moral energy’] among Chapter 2 they are not ‘subjective’, i.e. don’t have anything to say about what the person, the subject, wants or hopes or prefers or fears or aims at. For another example of this contrast at work, see pages 7–8.] In practical philosophy, therefore, we needn’t inquire into •why something pleases or displeases, •how merely sensory pleasure differs from taste, •whether taste is different from a general satisfaction of reason, •what the feelings of pleasure and unpleasure depend on, To behold virtue in its proper form is simply to present morality with •nothing sensuous stirred into the mixture and •every spurious adornment of reward or self-love stripped off. Viewed in that way, it outshines everything that appears charming to the senses, as can easily be seen by anyone whose reason hasn’t been spoiled for all abstraction."},{"r":"kant","p":29,"t":"Groundwork Immanuel Kant •how such feelings give rise to desires and inclinations. •how desires and preferences, with the co-operation of Chapter 2 sets before himself as things to be achieved through his conduct are merely •relative, for their value comes solely from how they •relate to the particular way in which the subject’s faculty of desire is constituted; and from this we can’t get any practical laws, i.e. any universal and necessary principles that hold for all rational beings and for every act of the will. So the only imperatives that these relative ends support are hypothetical ones. But suppose there were something whose existence in itself had absolute value, something which as an end in itself could support determinate laws. That would be a basis—indeed the only basis—for a possible categorical imperative, i.e. of a practical law. ·There is such a thing! It is a human being!· I maintain that man—and in general every rational being—exists as an end in himself and not merely as a means to be used by this or that will at its discretion. Whenever he acts in ways directed towards himself or towards other rational beings, ·a person serves as a means to whatever end his action aims at; but· he must always be regarded as also an end. Things that are preferred have only conditional value, for if the preferences (and the needs arising from them) didn’t exist, their object would be worthless."},{"r":"kant","p":29,"t":"·That wouldn’t count against the ‘objects’ in question if the desires on which they depend did themselves have unconditional value, but they don’t·! If the preferences themselves, as the sources of needs, did have absolute value, one would want to have them; but that is so far from the case that every rational being must wish he were altogether free of them. So the value of any objects to be obtained through our actions is always conditional. Beings whose existence depends not on our will but on nature, if they are not rational beings, have only relative value as means, and are therefore called ‘things’ [Sachen ]; whereas rational beings are called ‘persons’, because their nature reason, give rise to maxims. All of that belongs ·not to practical philosophy but· to empirical psychology. (If we think of natural science as the philosophy of nature based on empirical laws, then empirical psychology is the second part of it, ·empirical physics being the first·.) In contrast with that, our present concern is with objectively-practical laws and thus with how a will relates to itself when it determines itself only by reason, and ·in that inquiry· every empirical consideration automatically falls away. Why? Because if unaided reason determines conduct, it must necessarily do so a priori, ·and thus without bringing in anything empirical·. Can reason determine conduct in this way? That is what we are now to investigate."},{"r":"kant","p":29,"t":"The will is thought of as someone’s capacity ·or ability· to control how he behaves in conformity with the representation of certain laws. [Slightly correcting what Kant wrote, which literally means: ‘The will is thought of as a capacity to control itself. . . ’.] Such a capacity can be found only in rational beings. Now, what serves the will as the objective ground for its action upon itself is an end, and if it is given by reason alone it must be an end for all rational beings. On the other hand, what contains the ground of the possibility of the action that leads to the end is called the means. The subjective ground of desire is the action-driver, while the objective ground of volition is the motive. And so we have a distinction between •subjective ends resting on action-drivers, and •objective ends depending on motives that are valid for every rational being. Practical principles are formal when they abstract from all subjective ends; they are material when they are based on subjective ends and thus on certain action-drivers. All of the ends—material ends—that a rational being voluntarily"},{"r":"kant","p":30,"t":"Groundwork Immanuel Kant already marks them out as ends in themselves (i.e. as not to be used merely as means)—which makes such a being •an object of respect, and •something that sets limits to what anyone can choose to do. Such beings are not merely subjective ends whose existence as a result of our action has value for us, but are objective ends, i.e. things [Dinge] whose existence is an end in itself. It is indeed an irreplaceable end: you can’t substitute for it something else to which it would be merely a means. If there were no such ends in themselves, nothing of absolute value could be found, and if all value were conditional and thus contingent, no supreme practical principle for reason could be found anywhere. To return to our previous examples: (1) Someone thinking of committing suicide will, if he is guided by the concept of necessary duty to oneself, ask himself •Could my suicide be reconciled with the idea of humanity as an end in itself ? ·And his answer to this should be No·. If he escapes from his burdensome situation by destroying himself, he is using a person merely as a means to keeping himself in a tolerable condition up to the end of his life. But a man is not a thing [Sache ], so he isn’t something to be used merely as a means, and must always be regarded in all his actions as an end in himself. So I can’t dispose of a man by maiming, damaging or killing him—and that includes the case where the man is myself."},{"r":"kant","p":30,"t":"(This basic principle needs to be refined so as to deal properly with questions such as ‘May I have one of my limbs amputated to save my life?’ and ‘May I expose my life to danger in order to save it?’ I shan’t go into these matters here; they belong to morals and not to the metaphysic of morals.) So if there is to be a supreme practical principle, and a categorical imperative for the human will, it must be an objective principle of the will that can serve as a universal law. Why must it? Because it has to be drawn from the conception of something that is an end in itself and therefore an end for everyone. The basis for this principle is: rational nature exists as an end in itself. Human beings necessarily think of their own existence in this way, which means that the principle holds as a subjective principle of human actions. But every other rational being also thinks of his existence on the same rational ground that holds also for myself;11 and so it is at the same time an objective principle—·one that doesn’t depend on contingent facts about this or that subject ·—a supreme practical ground from which it must be possible to derive all the laws of the will. So here is the practical imperative: Act in such a way as to treat humanity, whether in your own person or in that of anyone else, always as an end and never merely as a means. Let us now see whether this can be carried out."},{"r":"kant","p":30,"t":"Chapter 2 (2) [Three times in this next paragraph, and nowhere else in this work, Kant writes of someone’s ‘containing’ the end of an action by someone else. Presumably for B to ‘contain’ the end of A’s action is for B to have A’s end as his end also, to seek what A seeks.] As concerns necessary. . . .duties to others, when someone A has it in mind to make someone else B a deceitful promise, he sees immediately that he intends to use B merely as a means, without B’s containing in himself the end of the action. For B can’t possibly assent to A’s acting against him in this way, so he can’t contain in himself the end of this action. This conflict with the principle about treating others as ends is even easier to see in examples of attacks on people’s freedom Here I put this proposition forward as a postulate. The reasons for it will be given in the last chapter."},{"r":"kant","p":31,"t":"Groundwork Immanuel Kant and property; for in those cases it’s obvious that someone who violates the rights of men intends to make use of the person of others merely as means, without considering that as rational beings they should always be valued at the same time as ends, i.e. as beings who can contain in themselves the end of the very same action.12 (3) With regard to contingent (meritorious) duty to oneself [for ‘meritorious’ see page 26], it isn’t sufficient that the action not conflict with humanity in our person as an end in itself; it must also harmonize with it. In human nature there are predispositions to greater perfection that are part of nature’s purpose for humanity. . . .; to neglect these might perhaps be consistent with the preservation of humanity as an end in itself but not with the furtherance of that end. (4) With regard to meritorious duty to others: Humanity might survive even if •no-one contributed to the happiness of others, but also •no-one intentionally took anything away from the happiness of others; ·and this is a likely enough state of affairs, because· the end or purpose that all men naturally have is their own happiness. This would put human conduct into harmony with humanity as an end in itself, but only in a negative manner. For a positive harmony with humanity as an end in itself, what is required is that everyone ·positively· tries to further the ends of others as far as he can."},{"r":"kant","p":31,"t":"For the ends of any person, who is an end in himself, must as far as possible be also my ends, if that thought ·of him as an end in himself· Chapter 2 is to have its full effect on me. This principle concerning the status of each human being—and more generally of each rational creature—as an end in himself is the supreme limiting condition on the freedom of action of each man. (·Supreme in the sense that it trumps everything else, e.g. prudential considerations·.) It isn’t drawn from experience; ·there are two reasons why it can’t be·. •One reason is the principle’s universality: it applies to absolutely all rational beings, and experience doesn’t stretch out that far. •The other is the fact that the principle isn’t about humanity considered subjectively, as something that men do take to be an end, i.e. do choose to aim at, but rather about humanity considered as the objective end that ought to constitute the supreme limiting condition of all subjective ends, whatever they may be. ·Experience can inform us about what subjective ends men do set before themselves, but not about what non-subjective end ought to trump every subjective end·. So this principle ·can’t arise from experience, and· must arise from pure reason. According to the first principle, the •objective basis for all practical legislation lies in •the rule and the form of universality, which makes it capable of being a natural law [bold type on page 24]."},{"r":"kant","p":31,"t":"Its •subjective basis is •the end; and according to the second principle the subject of all ends is every rational being as an end in itself. From this we now derive the third practical principle of the will, as the supreme condition of its harmony with universal practical reason, namely, the idea of the will of every rational being as a will laying down universal law. Don’t think that the banal ‘Don’t do to anyone else what you wouldn’t want done to you’ could serve here as a guide or principle. It is only a consequence of the real principle, and a restricted and limited consequence at that. It can’t ·as it stands· be a universal law, because it doesn’t provide a basis for •duties to oneself, or •benevolent duties to others (for many a man would gladly consent to not receiving benefits from others if that would let him off from showing benevolence to them!), or •duties to mete out just punishments to others (for the criminal would argue on this ground against the judge who sentences him). And so on."},{"r":"kant","p":32,"t":"Groundwork Immanuel Kant By this ·third· principle, any maxim is rejected if it isn’t consistent with the will’s role as a giver of universal law. Hence the will is not merely subject to the law, but subject to it in such a way that it must be viewed as •prescribing the law to itself, and for just that reason as •being subject to the law, the law of which it sees itself as the author. I have presented two kinds of ·categorical· imperative: one kind tells us to act in a manner that is lawful, like the lawfulness of the natural order; the other lays down that rational beings are in themselves supreme ends; and just because both of these are categorical, their commanding authority owes nothing to any action-driver involving one’s interests. But so far I have been assuming them to be categorical—an assumption I had to make if I was to explain the concept of duty. But are there any such imperatives, practical propositions that command categorically? Back there I couldn’t prove independently that there are, any more than I can prove it in this present chapter. But there’s something that I could have done—namely to point out an inherent feature of an imperative that specifically marks it off as categorical rather than hypothetical. The feature I have in mind is the renunciation of all one’s interests when one wills from duty."},{"r":"kant","p":32,"t":"And now we have an example of this in the formulation of the principle ·of morality· that is now before us, the third, which involves the idea of the will of every rational being as a will that gives ·or legislates· universal law. A will that is subject to laws can be bound to them by some interest that it has; but a will that is itself the supreme law-giver can’t depend upon any interest for this role. Why Chapter 2 can’t it? Because if it did, it would need another law saying that its interests could be satisfied only if the first law were universally valid; ·in which case the first law wouldn’t be supreme, after all·. Thus the principle of every human will as a will giving universal law in all its maxims,13 provided it is otherwise correct, is very well suited to being a categorical imperative because of this feature: it involves the idea of giving universal law, so it isn’t based on any interest, and thus it is the only possible imperative that can be unconditional. . . . Look back on all the previous attempts to discover the principle of morality—no wonder they all failed! The searchers saw that •man is bound by his duty to laws; but it didn’t occur to them that •all man is subject to are laws—universal laws— legislated by himself, and that •all he bound to is to act in accordance with his own will, a will designed by nature to be a giver of universal law."},{"r":"kant","p":32,"t":"The thought of him only as subject to some law or other brings with it the need for some interest that will pull or push him to obey the law—his will has to be constrained to act thus and so by something else—because the law hasn’t arisen from his will. This strictly valid inference means that all the work of looking for a supreme ground for duty was wasted labour; it never brought them to duty but only to the necessity for acting from a certain interest. It might be the person’s own interest or someone else’s; either way, the imperative always had to be conditional, and couldn’t serve as a moral command. I shall call this principle— ·the third of I needn’t clarify this principle with fresh examples, because the ones I have already used to illustrate the categorical imperative and its formulation can here serve the same purpose."},{"r":"kant","p":33,"t":"Groundwork Immanuel Kant my three·—the principle of autonomy of the will in contrast with every others, which I accordingly count as heteronomy. Chapter 2 is possible only through the freedom of the will, and this holds whether he belongs to the realm as a member or as sovereign. Being sovereign in the realm of ends isn’t a matter of choice; to be sovereign a rational being must •be completely independent ·of everything else·, •have no needs, and •have unlimited power adequate to his will. So the morality of any action is constituted by how the action relates to the law-giving that is indispensable if there is to be a realm of ends. But this law-giving must be found in every rational being, being able to arise from his will. So the principle that drives his will is: •never to act on a maxim that couldn’t consistently be a universal law, and thus •to act only so that the will could regard itself as giving universal law through its maxim. In the case of a rational being whose maxims don’t by their nature already necessarily conform to this objective principle, the necessity of acting according to that principle is called practical compulsion ·or constraint·, i.e. duty. The sovereign in the realm of ends doesn’t have duties; all the mere members have duties, and are indeed burdened by duty to the same extent. [From Greek: auto/hetero = self/other, and nomos = law."},{"r":"kant","p":33,"t":"So Kant’s terminology distinguishes self-governed from other-governed.] The concept of •every rational being as one who must regard himself as giving universal law through all the maxims of its will, so as to judge himself and his actions from this standpoint, leads to thje fruitful concept of •a realm of ends. [The German Reich mainly means ‘kingdom’ or ‘empire’, but the less highly charged ‘realm’ seems to fit well enough here.] By ‘realm’ I understand the systematic union of different rational beings through shared laws. (The next sentence presents a thought-experiment; in conducting it, we have to abstract from personal differences of rational beings, and thus from all content of their private ends or purposes.) Because laws determine which ends have universal validity, we can think of a ·unified· whole of all ends in systematic connection—a whole composed of •rational beings who are ends in themselves and of •ends that they may individually set for themselves. This is a realm of ends, which is possible on the principles stated above. That is because all rational beings stand under the law that each of them should treat himself and all others never merely as a means but always also as an end in himself. This gives rise to a systematic union of rational beings through shared objective laws, i.e. a realm; and it may be called a realm of ends because what these laws have as their purpose is just the relation of these beings to each other as ends and means."},{"r":"kant","p":33,"t":"(Admittedly this realm of ends is only an ideal.) A rational being is a member of the realm of ends if he gives universal laws in it while also being subject to those laws. He is sovereign in the realm of ends if, as law-giving, he isn’t subject to anyone else’s will. A rational being must always regard himself as law-giving in a realm of ends that [Of the two versions of the end of this next sentence, the first fits Kant’s thought better: the only things he has called ends in themselves are rational beings. The second doctrinally drops out of the blue. But it is what Kant wrote; to get the first reading we must replace Kant’s sie by sich.] The •practical necessity of acting in accordance with this principle, i.e. •duty, doesn’t rest at all on feelings, impulses, and preferences; its sole basis is the way rational beings relate to one another—a relationship in which the will of a rational being must always be regarded as law-giving,"},{"r":"kant","p":34,"t":"Groundwork Immanuel Kant plausible reading: otherwise it couldn’t think of itself as an Chapter 2 So morality, and humanity so far as it is capable of morality, are the only things that have dignity. Skill and diligence in work have a •market price; wit, lively imagination, and humour have a •luxury price; but fidelity in promises and benevolence on principle (not benevolence from instinct) have •intrinsic value ·which I have called dignity·. If you don’t have these, neither nature nor art can supply anything that would make up for that lack in you; for their value doesn’t lie in the effects that flow from them—their usefulness, the advantages they bring—but only in the attitudes, i.e. the maxims of the will, that are ready to express themselves in this manner through actions, even if the actions don’t meet with success. For us to look on these actions with immediate favour and pleasure, we don’t have to bring in any of our subjective states, any immediate liking for or attraction to such actions. The actions exhibit the will that generates them as the object of an immediate respect, since nothing but reason is required to get the will to act like that."},{"r":"kant","p":34,"t":"(Note that reason imposes these actions on the will; it doesn’t coax it into performing them, for that would flatly contradict the notion of duty.) This esteem lets the value of such a turn of mind be recognized as dignity ·or intrinsic value ·, and puts it infinitely above any price; to compare it with, or weigh it against, things that have price would be to violate its holiness, as it were. end in itself. literal reading: otherwise it couldn’t think of duty as an end in itself. Reason accordingly checks out every maxim of your will, ·in its role· as giver of laws, to see how it relates to everyone else’s will and also to every action towards yourself. It doesn’t do this from any external practical motive or future advantage, but rather from the idea of the dignity of a rational being who obeys no law except one that he himself gives while obeying it. In the realm of ends everything has either a price or an intrinsic value. Anything with a price can be replaced by something else as its equivalent, whereas anything that is above all price and therefore admits of no equivalent has intrinsic value. [In this paragraph, ‘intrinsic value’ translates Würde, which is usually translated—here and in the Kantian literature generally—by ‘dignity’. At the end of the next paragraph Kant explicitly equates those two meanings.] Something that involves general human desires and needs has a market price."},{"r":"kant","p":34,"t":"Something that doesn’t involve anyone’s needing anything but accords with a certain taste (i.e. with pleasure in the purposeless play of our feelings) has a luxury price [Affektionspreis = ‘price related to the feelings’]. But if something makes it possible—and is the only thing that makes it possible—for something to be an end in itself, then it doesn’t have mere relative value (a price) but has intrinsic value (i.e. dignity). [Kant wrote: hat. . . einen innern Wert, And what is it, then, that justifies virtue, or a morally good frame of mind, in making such lofty claims ·for itself·? It is its enabling the rational being to have a share in the giving of universal laws and thus to become fit to be a member in a possible realm of ends. (His nature has already marked him out for this role, as an end in himself and therefore as a law-giver in the realm of ends.). . . . For a rational being has no value except what the law confers on it. The law-giving that confers all value must therefore have dignity (i.e. an d. i. Würde.] Now, it is only through morality that •a rational being can be a law-giving member in the realm of ends; so it is only through morality that •a rational being can be an end in himself."},{"r":"kant","p":35,"t":"Groundwork Immanuel Kant choose, must be restricted by ·and subordinated to· the status of rational beings, which are ·not chosen as ends but are· ends by their very nature, and are therefore ends in themselves. (3) A complete fixing of all maxims through this formulation: all the maxims that come from your own law-giving should harmonize with a possible realm of ends as with a realm of nature.14 Moving through these three items is like moving through the Categories ·of Quantity, as set forth in my Critique of Pure Reason ·: the •Unity of the form of the will (its universality), the •Plurality of the matter (the objects, ends), and the •Totality of the system of ends. In arriving at moral judgments one does better ·to go by just one of the three formulations, specifically· to follow the strict method and base one’s thinking on the universal formulation of the categorical imperative: Act in accordance with a maxim that can at the same time make itself a universal law. But if one wants to enable the moral law to have access to a mind, it is very useful to bring one and the same action under the three concepts I have listed, and thus, so far as possible, to bring it nearer to intuition. We can now end where we started, with the concept of an unconditionally good will. A will is absolutely good if it can’t be bad, and thus never adopts maxims that conflict with themselves when they are generalized into universal laws."},{"r":"kant","p":35,"t":"So this principle is also its supreme law: Always act on maxims whose universality as laws you can at the same time will. That’s the only way a will can avoid ever coming into conflict with itself, and such an imperative is categorical. unconditional and incomparable value); and the •esteem that a rational being must have for this is best described as ‘respect’ [Achtung; some of Kant’s uses of this suggest that ‘reverence’ would be a better translation]. Autonomy is thus the basis for the dignity of human nature and of every rational nature. ·I remind you that I have presented the principle of morality in three ways: •Act as though the maxim of your action were to become, through your will, a universal law of nature. [page 24] •Act in such a way as to treat humanity, whether in your own person or in that of anyone else, always as an end and never merely as a means. [page 29] •Act only so that your will could regard itself as giving universal law through its maxim. [page 32] · The above three ways of presenting the principle of morality are basically only so many different formulations of the very same law, and any two of them come together in the third. They do differ in a certain way, but the difference is subjective rather than objective—·i.e. the three formulations don’t express different moral principles, but they offer different ways for our minds to come at morality·."},{"r":"kant","p":35,"t":"This difference is intended to introduce a certain analogy that will bring an idea of reason closer to intuition and thus nearer to feeling. All maxims have: (1) A form; specifically, they are all universal. That leads to this formulation of the moral imperative: maxims must be chosen as if they were to hold as universal laws of nature. (2) A matter ·or content·, i.e. an end. That leads to this formulation: all merely relative ends, ones that people Chapter 2 •Teleology considers nature as a realm of ends; •morals regards a possible realm of ends as a realm of nature. In the •former the realm of ends is a theoretical idea for explaining what exists. In the •latter it is a practical idea for bringing about something that doesn’t yet exist but will become real through our conduct, in conformity with this very idea."},{"r":"kant","p":36,"t":"Groundwork Immanuel Kant Because the •validity of the will as a universal law for possible actions has an analogy with the •way existing things are inter-connected under universal laws, this being the formal aspect of nature in general, the categorical imperative can be put like this: ·Act on maxims that can at the same time have themselves as universal laws of nature as their object·. That gives us the formula for an absolutely good will. Rational nature is distinguished from the rest of nature in that it sets for itself an end. This end would be the material of every good will, but ·its relation to the absolutely good will involves a little wrinkle which I shall now explain·. The idea of an absolutely good will doesn’t have anything to do with this or that end that the will seeks to •bring about; the ends that a will aims to •bring about can only make it relatively good, not absolutely good; so we must understand the end of an absolutely good will not as an end to be •brought about but as an independently existing end which connects with the absolutely good will negatively—it is an end which must never be acted against, which implies that it must never, in any act of the will, be valued merely as a means but always also as an end. . . ."},{"r":"kant","p":36,"t":".The principle: ·Act in relation to every •rational being (whether yourself or another) so that in your maxim •he is an end in himself· is thus basically identical with the principle: Act on a maxim that involves its own universal validity for every rational being. That’s because the statement ‘In my use of means to any end I should restrict my maxim to the condition of its universal validity as a law for every subject’ is equivalent to the statement ‘The subject of ends (i.e. the rational being itself) must be made the basis of every maxim of action and thus be treated never as a mere means but as Chapter 2 the supreme limiting condition in the use of all means—i.e. also as an end. It •follows from this—no-one could question that it follows—that every rational being, as an end in himself, must be able to regard himself as a giver of universal laws that include any laws to which he may be subject. For what marks him off as an end in himself is just this fitness of his maxims for universal law-giving. It also •follows that this dignity that he has, his prerogative over all merely natural beings, involves his having to take his maxims from the point of view of himself and every other rational being as law-givers—which is why they are called ‘persons’. In this way, a world of rational beings. . . .is possible as a realm of ends, through the law-giving activities of all the persons who are its members."},{"r":"kant","p":36,"t":"Consequently every rational being must act as if his maxims made him at all times a law-giving member of the universal realm of ends. The formal principle of these maxims is: Act as though your maxims were also to serve as universal law for all rational beings. A realm of ends is thus possible only by analogy with a realm of nature. The realm of ends is possible only through •maxims, i.e. rules imposed on oneself, while the realm of nature is possible only through •laws governing how things are acted on by other things. Despite this difference, nature as a whole, though looked on as a machine, is given the name ‘realm of nature’—to the extent that, and because, it has reference to rational beings as its ends. [This is one of the places where ‘kingdom’ might be better than ‘realm’.] Such a realm of ends would actually come into existence through maxims whose rule is prescribed to all rational beings by the categorical imperative, if every rational being followed them all the time. A rational being who scrupulously follows this maxim can’t expect every other"},{"r":"kant","p":37,"t":"Groundwork Immanuel Kant Chapter 2 is thus the relation of actions ·not to anything external to the person, but· to the autonomy of the will. . . . ·Now here are definitions, in terms of the autonomy of the will, of five key terms in morality·. •An action that can co-exist with the autonomy of the will is permitted. •One that clashes with autonomy of the will is forbidden. •A will whose maxims are necessarily in harmony with the laws of autonomy is a holy or absolutely good will. •If a will is not absolutely good, it is morally constrained by the principle of autonomy and its relation to that principle is obligation (so a holy will can’t have obligations). •The objective necessity of an action from obligation is called duty. From what I have been saying, it is easy to understand how this happens: although in thinking of duty we think of subjection to law, we nevertheless also ascribe a certain sublimity and dignity to the person who fulfils all his duties. There is nothing sublime about being subject to the moral law, but this person is also a giver of the law—that’s why he is subject to it, and only to that extent is he sublime. Also, I have shown above how the only action-driver that can give an action moral value is respect for the law, not any kind of fear or desire."},{"r":"kant","p":37,"t":"The proper object of •respect is our own will to the extent that it tries to act only on maxims that could contribute to a system of universal legislation (such a will is ideally possible for us), and the •dignity of humanity consists just in its capacity to give universal laws to which it is also subject. rational being to follow suit; nor can he expect the realm of nature. . . .to favour his expectation of happiness. Despite that, the law: Act in accordance with the maxims of a universal-lawgiving member of a merely possible realm of ends remains in full force because it commands categorically. And just here lies the ·two-part· paradox: (1) the will is subject to an inflexible rule ·concerning the place of humanity in its deliberations·, simply because of the dignity of humanity as rational nature without any end or advantage to be gained by being human, and thus out of respect for a mere idea; and (2) what makes some maxims sublime, and makes every rational subject worthy to be a law-giver in the realm of ends, is just precisely this independence of his maxims from all such action-drivers ·as chosen ends and possible advantages·. If it weren’t for this independence, the rational being would have to be seen as subject only to the natural law of his needs."},{"r":"kant","p":37,"t":"Even if the realm of nature and the realm of ends were thought of as united under one sovereign, so that the realm of ends •moved from being a mere •idea to becoming a reality and •gained reinforcement from a strong action-driver, still there would be no increase in its intrinsic value. For when we think about this possibility ·of a world in which a unique sovereign brings it about that principled actions do always lead to good consequences·, we have to think of the sole absolute law-giver as judging the value of rational beings only on the strength of the disinterested conduct that they prescribe to themselves merely from the •idea. The essence of things isn’t changed by their external relations, and the absolute [= ‘non-relational’] value of a man doesn’t involve his relations to other things either; so whoever is estimating a man’s absolute worth must set aside his external-relational properties—and this holds for anyone doing such an estimation, even the supreme being. Morality The autonomy of the will as the supreme principle of morality A will’s autonomy is that property of it by which it is a law to itself, independently of any property of the objects of its volition. So the principle of autonomy is:"},{"r":"kant","p":38,"t":"Groundwork Immanuel Kant Chapter 2 Always choose in such a way that the maxims of your choice are incorporated as universal law in the same volition. That this practical rule is an imperative, i.e. that the will of every rational being is necessarily bound to it as a constraint, can’t be proved by a mere analysis of the concepts occurring in it, because it is a synthetic proposition. This synthetic proposition presents a command, and presents it as necessary; so it must be able to be known a priori. To prove it, then, we would have to go beyond knowledge of •objects to a critical examination of the •subject (i.e. to a critique of pure practical reason). But that is not the business of the present chapter. But mere analysis of moral concepts can show something to our present purpose, namely that the principle of autonomy that we are discussing is the sole principle of morals. This is easy to show, because conceptual analysis shows us •that morality’s principle must be a categorical imperative and •that the imperative ·in question· commands neither more nor less than this very autonomy. [See note on says that •I should do x whether or not I want anything else. For example, the hypothetical says that •I shouldn’t lie if I want to keep my reputation. The categorical says that •I shouldn’t lie even if lying wouldn’t bring the slightest harm to me."},{"r":"kant","p":38,"t":"So the categorical imperative must abstract from every object thoroughly enough so that no object has any influence on the will; so that practical reason (the will), rather than catering to interests that are not its own, shows its commanding authority as supreme law-giving. Thus, for instance, I ought to try to further the happiness of others, but not in the spirit of ‘it matters to me that these people should be happier, because. . . ’ with the blank filled by a reference to some preference of mine, whether directly for the happiness of the people in question or indirectly via some satisfaction that is related to their happiness through reason. Rather, I should to try to further the happiness of others solely because a maxim that excludes this can’t be included as a universal law in one and the same volition. page 32 for ‘autonomy’ and ‘heteronomy’.] Classification of all possible principles of morality that you’ll get if you take heteronomy as the basic concept The heteronomy of the will as the source of all spurious principles of morality ·Why the interest in all possible principles that come from this underlying mistake? Because· in the absence of a critical examination of the pure use of reason, human reason always—including here—tries every possible wrong way before it succeeds in finding the one true way! If you start with the idea of heteronomy—i.e."},{"r":"kant","p":38,"t":"of how the will can be directed from outside itself —you will be led to principles of one of two kinds: empirical and rational. (1) The empirical ones have to do with happiness, and are based on ·the thought of the will as being influenced by· either (1a) physical feelings ·concerning one’s own happiness· or (1b) moral feelings. (2) The rational ones have to do with A will is looking for a law that will tell it what to do: if it looks anywhere except in the fitness of its maxims to be given as universal law, going outside itself and looking for the law in the property of any of its objects, heteronomy always results. For in that case the law is not something the will gives to itself, but rather something that the ·external· object gives to the will through its relation to it. This relation, whether it rests on preference or on conceptions of reason, admits of only hypothetical imperatives: •I should do x because I want y. The moral or categorical imperative, on the other hand,"},{"r":"kant","p":39,"t":"Groundwork Immanuel Kant perfection and are based on the thought of the will as being influenced by either (2a) the rational concept of perfection as a possible result ·of our activities· or (2b) the concept of an independently existing perfection (the will of God). ·You can see that all four of these have the will being influenced from outside itself. Let us now look into them in detail·. that feelings can’t give us a uniform standard of good and bad; and anyway one can’t validly judge for others by means of one’s own feeling. So the appeal to moral feelings is superficial. Those who believe that feelings can help them to grasp universal laws are people who can’t think! Despite all this, the moral-feeling approach is nearer to morality and the dignity of morality, because it honours virtue by ascribing immediately to her the satisfaction and esteem we have for her, and does not, as it were, (1a) tell her to her face that what attaches us to her is not her beauty but only our advantage! [The use of ‘her’ to refer to virtue is based not on Kant’s (1) Empirical principles are not at all fit to serve as the basis of moral laws."},{"r":"kant","p":39,"t":"For moral laws should be universal, valid for all rational beings without distinction, that being what makes them unconditionally practically necessary; but this universality is lost if moral laws are derived from the specific constitution of human beings—·a constitution that may not be shared by other rational beings·—or the particular circumstance in which human beings happen to live. (1a) But the principle of one’s own happiness is the most objectionable of the empirical bases for morality. ·There are at least three reasons for this, of which the third is the weightiest·. •This basis for morality is just false: experience contradicts the allegation that well-being is always proportional to good conduct. •The principle contributes nothing to the establishment of morality, because making a man happy is very different from making him good, and making him prudent and sharp in seeing what is to his own advantage is far from making him virtuous. •Above all: this principle supports morality with action-drivers that undermine it and destroy all its sublimity, for it puts the motives to virtue and those to vice in the same class, obliterating the difference of kind between them, and teaching us merely to make a better job of calculating ·what will make us happy·."},{"r":"kant","p":39,"t":"(1b) Now for the supposed special sense, moral feeling.15 There are endless differences in degree between different kinds of feeling, so Chapter 2 using a personal pronoun (German doesn’t have them) but just on the content of the metaphor that he uses.] (2) Among the rational principles of morality—the ones based on reason—there is (2a) the ontological concept of perfection. It is empty, indefinite, and consequently useless for finding in the immeasurable field of possible reality the greatest possible sum ·of perfections· that is suitable to us. Also, when we try to say what marks off this reality— ·perfection·—from all other realities, we inevitably tend to move in a circle and can’t avoid tacitly •presupposing the morality that we are trying to •explain. Nevertheless, this is better than (2b) the theological concept, which derives morality from a most perfect divine will. ·There are two reasons for the inferiority of the theological concept; or, more accurately, they are two halves of a single reason which constitutes a dilemma confronting the theological approach to morality·. The perfection of the divine will is not something that is given to us in intuition ·analogous to how items are given to us through the senses·; so we have to derive it from our own concepts. •Foremost among these is our concept I bring moral feeling under the heading of happiness because every empirical interest promises to contribute to our well-being by the agreeableness that a thing affords, either (1a) indirectly, through the thing’s contributing to our happiness, or (1b) directly, through our finding the thing itself agreeable without any thought of our own future advantage. . . ."},{"r":"kant","p":40,"t":"Groundwork Immanuel Kant of morality; if we let this generate our concept of God’s perfection, and then use the latter as a basis for morality, we are guilty of a flagrantly circular explanation. •And if we don’t get at God’s perfection in that way, our only remaining concept of it is made up of the attributes of desire for glory and dominion, combined with the awe-inspiring conceptions of power and vengefulness; and any system of ethics based on these would be directly opposed to morality. The (1b) concept of the moral sense and (2a) that of perfection in general have this to be said for them, that they don’t weaken morality; but neither is capable of serving as its foundation. Still, if I had to choose between them, I would opt for (2a) perfection in general, because it takes the decision ·about the basis for morality· away from the realm of sensibility and submits it to the court of pure reason. It doesn’t get a decision there, but at least it preserves the indefinite idea of a will that is good in itself, without falsifying it—·saving a place for it· until it can be more narrowly defined. You won’t mind if I don’t grind through a long refutation of all these doctrines. There’s no need for me to do that, because it is so easy to do and so well understood—even by those whose official positions require them to declare for one of these theories because their hearers wouldn’t tolerate suspension of judgment."},{"r":"kant","p":40,"t":"What matters more to us here is to know this: All these principles try to base morality purely on heteronomy of the will, so they are bound to fail. Chapter 2 the imperative is conditional— If or because you want such and such an object, you ought to act thus and so —so it can’t command morally, i.e. categorically. The object’s influence on what my will does may go through my preference (as in the principle of my own happiness) or through my reason directed to objects of my possible volitions (as in the principle of perfection); but the will in these cases never determines itself directly by the conception of the action itself. It is always directed ·by an object through something other than the will, namely· through the action-driver that is stirred up in the will by the prospect of getting a certain result: I ought to do x because I will y; and then another law must be planted in me, a law saying that I must will y; and this law in its turn would require an imperative to restrict this maxim—*i.e. an imperative of the form I ought to will y if I want z. Why? Because if instead we had simply I ought to will y, that involves no appeal to anything outside the will; it is a categorical imperative, and doesn’t involve heteronomy of the will. But that puts it outside the scope of the present discussion, which is of the consequences of trying to base morality on heteronomy, i.e. on the influence on the will of factors outside it."},{"r":"kant","p":40,"t":"Relying on heteronomy has one bad consequence that I haven’t yet mentioned*. With a hypothetical imperative such as we get with heteronomy of the will, the aim is for •the thought of a result to be obtained by one’s own powers to stir up in the will •an impulse of a certain kind (·the thought of achieving y is to stir up an impulse to do x·); but whether and how that thought generates that impulse depends on the natural constitution of the person [An addition to this paragraph is marked by * rather than ·, because Whenever an object of the will has to be laid down as prescribing the rule that is to tell the will what to do, the rule is none other than heteronomy. In such a case of its length.]"},{"r":"kant","p":41,"t":"Groundwork Immanuel Kant concerned—i.e. depends either on his sensibility (preference and taste) or on his understanding and reason. Now, what the person’s sensibility or intellect makes of any intended upshot—e.g. whether it takes pleasure in it—depends on the details of what kind of sensibility or intellect nature has endowed the person with; which implies that strictly speaking the source of this law is nature. As a law of nature, this would have to be known and proved by experience, which means that it would be contingent and therefore unfit to be a necessary practical rule such as the moral rule must be. This is still heteronomy of the will: the law is given to the will not by •the will itself but by •an impulse from outside it, an impulse that influences the will because the person’s nature makes him susceptible to it. So an absolutely good will, the principle of which must be a categorical imperative, doesn’t specify any object, and contains only the form of volition as such, and this form is autonomy. That is, •the sole law that the will of every rational being imposes on itself is just •the fitness of the maxims of every good will to turn themselves into universal laws; Chapter 2 and there is no need for this to be supported by any actiondriver associated with an interest."},{"r":"kant","p":41,"t":"How can there be such a synthetic practical a priori proposition, and why it is necessary? The solution of that problem doesn’t lie within the boundaries of the metaphysic of morals; and I haven’t here affirmed its truth, let alone claimed to have a proof of it in my power. All I have done is to show, by spelling out the generally accepted concept of morality, that an autonomy of the will is unavoidably connected with morality—is indeed its foundation. So anyone who holds that morality is something and not a chimerical idea without truth must accept, along with morality, the principle that I have derived here. Consequently, this chapter like the first was merely analytic; ·it reached its conclusions by analysing, spelling out the content of, the generally accepted concept of morality·. If the categorical imperative, and with it the autonomy of the will, is true and absolutely necessary as an a priori principle, it follows that morality isn’t a phantom; but to prove that it isn’t we must be able to make a synthetic use of pure practical reason. But we mustn’t venture on this use without first making a critique of this faculty of reason. In this next chapter—the last—I shall give the chief features of such a critique, in enough detail for our purpose."},{"r":"kant","p":42,"t":"Groundwork Immanuel Kant Chapter 3 Chapter 3: Moving from the metaphysic of morals to the critique of pure practical reason The concept of freedom is the key to explaining the autonomy of the will exercise its causality. What can the freedom of the will be, then, but •autonomy, i.e. the will’s property of •itself being a law? However, the proposition: •The will itself is a law in all its actions only expresses the principle: •Act only on a maxim that can also have itself as a universal law for its object. And this is just the formula of the categorical imperative and is the principle of morality. Therefore a •free will and a •will under moral laws are identical. [Earlier in this paragraph Kant Will is a kind of causality that living beings exert if they are rational, and when the will can be effective independent of outside causes acting on it, that would involve this causality’s property of freedom; just as natural necessity is the property of the causality of all non-rational beings, through which they are caused to act in specific ways by the influence of outside causes. The account of freedom I have just given is negative (·it says there is freedom when the active will does not have external causes acting on it·), and so it isn’t fruitful for insight into what freedom is; but there flows from it a concept of freedom that is positive, and accordingly richer and more fruitful."},{"r":"kant","p":42,"t":"Although freedom is not a property of the will according to •laws of nature, it doesn’t follow that freedom is lawless! It must in fact be a causality according to immutable •laws of a special kind. The ‘concept’ of lawless free-will would be an absurdity, because the concept of causality brings with it the concept of laws according to which if something we call a cause is given then something else, the effect, must occur. ·And since freedom conceptually involves causality, and causality conceptually involves law, it follows that freedom conceptually involves law . We saw that· natural necessity is a •heteronomy of effective causes, because each effect can come about only through a law according to which •something else gets the cause to said that all causality involves an effect’s being caused by something else. What he is now treating as the mark not of causality as such but of heteronomous causality in particular is the cause’s being stirred into action by something else. In the next paragraph, ‘something else’ occurs again in a manner that does seem to conflict with what Kant first said about causality in general.] So if we start with freedom of the will, we get morality (together with its principle) from it merely by •analysing its concept."},{"r":"kant","p":42,"t":"But the principle of morality: An absolutely good will is one whose maxim can always include itself regarded as a universal law, • is a synthetic proposition, because that property of the maxim can’t be found by analysis of the concept of an absolutely good will. What makes such a synthetic proposition possible is there being two cognitions [= ‘items of knowledge’] that are connected with each other through their both being contained in some third cognition. In the case of physical causes, the ‘third cognition’ that ties the cause to the effect is the •nature of the sensible world; but the concept of that conjoins the two concepts of something as cause in relation"},{"r":"kant","p":43,"t":"Groundwork Immanuel Kant to something else as effect; so it doesn’t meet our present needs. In our present context, the ‘third cognition’ that does the job is the •positive concept of freedom. Two tasks present themselves: (1) To show what this third cognition is to which freedom directs us and of which we have an a priori idea, and (2) To make comprehensible the deduction of the concept of freedom from pure practical reason, and along with that the possibility of a categorical imperative. But I can’t do either of these right here and now; first, some further preparation is needed. with freedom hold for him just as if his will were validly pronounced free in itself as a matter of theoretical philosophy.16 Now I maintain this: We must necessarily equip every rational being who has a will with the idea of freedom, this being an idea under which he must act. For the thought of such a being includes the thought of a reason that is practical, i.e. has causality with respect to its object. Now we can’t conceive of a reason that would consciously take direction (about how to judge) from outside itself, for then the person ·whose reason it was· would think that what settled how he judged was not his reason but some ·external· impulse. Reason must regard itself as the author of its principles, owing nothing to external influences; so it must—as practical reason, or as the will of a rational being—regard itself as free."},{"r":"kant","p":43,"t":"That is to say, the will of a rational being can be his will only under the idea of freedom, so that from a practical point of view such a will must be ascribed to all rational beings. Freedom must be presupposed as a property of the will of all rational beings It isn’t enough to ascribe freedom to •our will, on whatever grounds, if we don’t also have sufficient grounds for attributing it to •all rational beings. For morality serves as a law for us only because we are rational beings, so it must hold for all rational beings; and morality must be derived solely from the property of freedom; so freedom must be shown to be a property of the will of all rational beings. And it doesn’t suffice to do this on the basis of certain supposed empirical facts concerning human nature: we need an a priori proof (·which empirical facts can’t provide·), and we need a result concerning absolutely all rational beings endowed with a will (·and not merely concerning human beings·). Now I say this: Any being who can’t act otherwise than under the idea of freedom is, just for that reason, really free in his conduct—i.e. all laws that are inseparably bound up Chapter 3 Why should I be moral? We have finally traced the determinate concept of morality back to the idea of freedom, but we couldn’t prove freedom to be actual in ourselves and in human nature."},{"r":"kant","p":43,"t":"We saw only that we must presuppose it if we want to think of a being as rational and as conscious of himself as the cause of his own actions, i.e. as endowed with a will; and so we find that on just those same grounds we must ascribe to each being I start in a way that is sufficient for my purposes, with freedom as something posited by all rational beings merely in idea as the basis for their actions. I go about things in this way so as to avoid having to prove freedom also in its theoretical respect. Even if the latter—·actual, factual, theoretical freedom·—is left unproved, ·it makes no difference, because· the laws that would hold for a being who was really free hold also for a being who cannot act except under the idea of his own freedom. Thus we escape the burden ·of proof· that the theoretical assertion of freedom would impose upon us."},{"r":"kant","p":44,"t":"Groundwork Immanuel Kant Chapter 3 •Why do our actions have to be based on maxims that endowed with reason and will this property of settling for himself how he will act, doing this under the idea of freedom. From the presupposition of this idea ·of freedom· there flowed also the consciousness of a law of action: The subjective principles of actions (i.e. maxims) must always be adopted in such a way that they can hold also as objective, i.e. hold as universal principles, thereby serving as universal laws that we give to ourselves. But why ought I, just because I am a rational being, subject myself to this law? And why should all other beings endowed with reason do so? Admittedly no interest impels me to do this, for that wouldn’t yield a categorical imperative; but I must still take an interest in it, and have insight into how it comes about. For this ‘ought’ is really a ‘shall’ that holds for every rational being whose reason isn’t hindered in its generating of actions. For beings like ourselves, that necessity of action is expressed only as ‘ought’, and the subjective necessity is thus distinguished from the objective. By ‘beings like ourselves’ I mean ones who are affected not only by reason but also by action-drivers that come from the senses—beings who don’t always do what reason would have done if left to itself. So it seems that all we have done with respect to the moral law (i.e."},{"r":"kant","p":44,"t":"the principle of the autonomy of the will) is to presuppose it in the idea of freedom, as though we couldn’t independently prove its reality and objective necessity. Even that would bring some gain, because in doing it we would at least have defined the genuine principle more accurately than had been done before; but we wouldn’t have made any progress regarding the validity of the moral law or the practical necessity of subjecting ourselves to it. If anyone asked: could be universally valid as laws? •What is the ba
