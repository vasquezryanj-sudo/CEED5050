sis for the value that we ascribe to this way of acting—a value so great that no interest, anywhere, can outweigh it? •How does it come about that a man believes that it is only through this that he feels his own personal value, in contrast to which that of a pleasant or unpleasant state is to be regarded as nothing? we couldn’t give him any satisfactory answer. We do indeed find that we can take an interest in a personal quality that makes us fit to enjoy some condition if reason were to allot that condition to us, even though the personal quality doesn’t automatically bring the condition with it. ·An example might be: taking an interest in being the sort of person who would be a good spouse, this being distinct from taking an interest in being married·. That is, we can take an interest in being worthy of happiness without having being happy as a motive."},{"r":"kant","p":44,"t":"But this judgment ·about value—this taking of an interest·—is in fact only the effect of the importance we have already ascribed to the moral law (when through the idea of freedom we detach ourselves from every empirical interest). But ·we are confronted by the proposition that· We ought to detach ourselves from every empirical interest, to regard ourselves as free in acting and yet as subject to certain laws, in order to find right there within ourselves a value that would compensate for the loss of everything that could make our situation desirable. How this is possible, and hence on what grounds the moral law is binding, can’t be grasped through my procedure up to here."},{"r":"kant","p":45,"t":"Groundwork Immanuel Kant It has to be admitted that there is a kind of circle here from which there seems to be no escape. We take ourselves to be free in the order of effective causes so that we can think of ourselves as subject to moral laws in the order of ends; and then we think of ourselves as subject to these laws because we have ascribed to ourselves freedom of the will. This is circular because •freedom and •self-legislation by the will are both •autonomy; so they are equivalent concepts, which is why neither of them can be used to explain or support the other. At most they can be used for the logical purpose of bringing apparently different representations of the same object under a single concept (like reducing the both of the fractions 51 68 and 92 to 4 ). There remains open to us, however, one way out ·of the circle·, namely, to pursue an inquiry into these: that come to us involuntarily (as do those of the senses) enable us to know objects only •as they affect us, which leaves us still ignorant of what they are •in themselves; and therefore representations of this kind, however closely and sharply we attend to them, can give us only knowledge of appearances, never knowledge of things in themselves. This distinction may be made just by noticing the difference between •representations that we passively receive from somewhere else and •ones that we actively produce out of ourselves."},{"r":"kant","p":45,"t":"Once the distinction has been made ·somehow·, it automatically follows that we must admit and assume behind the appearances something else that is not appearance, namely things in themselves. But we have to accept that we can’t get any closer to them, and can’t ever know what they are in themselves, because all we can know of them is how they affect us. This must yield a distinction, though a rough one, between •a sensible world, which can be very different to various observers, because of differences in their sensibilities, and •an intelligible world, which underlies the sensible world, and remains always the same. A man shouldn’t claim to know even himself as he really is by knowing himself through inner sensation—·i.e. by introspection·. For since he doesn’t produce himself (so to speak) or get his concept of himself a priori but only empirically, it is natural that he gets his knowledge of himself through inner sense and consequently only through how his nature appears and how his consciousness is affected. But beyond the character of his own subject, which is made up out of these mere appearances, he necessarily assumes something else underlying it, namely his I as it is in itself."},{"r":"kant","p":45,"t":"Thus in respect to mere perception and receptivity to sensations he must count himself as belonging to the sensible world; •thinking of ourselves as causes that are effective a priori through freedom, and •thinking of ourselves in terms of our actions considered as empirically observable effects. ·For example: •thinking of myself as voluntarily raising my arm, and •thinking of myself as seeing my arm go up·. The question is: Don’t these involve different standpoints? [In this next paragraph and later on, Kant refers to a certain ‘world’ that he calls Verstandeswelt = ‘world of understanding’. Evidently this ‘world’ has at least as much to do with •reason as with •understanding, and we shall see on the next page that Kant distinguishes these from one another. Chapter 3 So ‘world of understanding’ would be a misleading label, and ‘intelligible world’ is used instead. In some places where Verstandeswelt would be especially misleading, Kant instead uses intelligibel Welt.] What I am about to say requires no subtle reflection, and presumably even the most ordinary intellect could arrive at it (doing so in its own way, through an obscure exercise of judgment that it calls ‘feeling’!). All mental representations"},{"r":"kant","p":46,"t":"Groundwork Immanuel Kant but in respect to whatever pure activity there may be in himself (which reaches his consciousness •directly and not •by affecting the ·inner or outer· senses) he must count himself as belonging to the intellectual world—though he doesn’t know anything more about it. A thoughtful person must come to some such conclusion as this about all the things that present themselves to him. Even someone with a very ordinary mind is likely to have this thought, because we know that such people are strongly inclined to expect something invisibly active at work behind the objects of the senses; but they don’t learn anything from this because they soon spoil it by trying to make the ‘invisible something’ perceptible, i.e. to make it an object of intuition. ·They do this by wondering ‘What is it like, this unknown something that lurks behind the appearances of things?’, when their only concept of what a thing can be like is made from the concept of how things appear to them·. Now a human being really finds within himself a capacity by which he distinguishes •himself from •all other things, and that includes distinguishing •himself ·as something active· from •himself considered as affected by objects. This capacity or faculty is reason. Its pure, spontaneously active nature puts reason on a higher level even than understanding, ·and here is why·."},{"r":"kant","p":46,"t":"Understanding ·is like reason in this: it· is spontaneously active, and does not—like the faculty of sense—merely contain representations that come from our being passively affected by things. But ·it is unlike reason in that· the only concepts it can produce through its activity are ones whose only role is to bring the representations of sense under rules. . . . ·The intellectual management of the data of the senses is the understanding’s only task·. Without this use of sensibility the understanding Chapter 3 wouldn’t have any thoughts at all. In contrast with this, reason shows in its ideas, as we call them (·ideas relating to reason as concepts do to the understanding·), a spontaneity so pure that it goes far beyond anything that sensibility can come up with. The highest occupation of reason is to distinguish the sensible world from the intellectual world, thereby marking out limits for the understanding itself. Because of this, a rational being must regard himself—in his role as an intelligence, setting aside his lower faculties— as belonging not to the sensible world but to the intelligible world. So he has two standpoints from which he can •consider himself and •recognize the laws for the use of his powers and hence for all his actions. (1) As belonging to the sensible world, ·he falls· under the laws of nature (heteronomy)."},{"r":"kant","p":46,"t":"(2) As belonging to the intelligible world, ·he is· under ·the moral authority of· laws that are independent of nature, and so are not empirical but based entirely on reason. As a rational being and thus as belonging to the intelligible world, a human being can never think of the causality of his own will except under the idea of freedom; because reason must always take itself to be independent of the determining causes of the sensible world, and that independence is what freedom is. Now we have the idea of freedom inseparably connected with the concept of autonomy, which is bound up with the universal principle of morality, which is ideally the ground of all actions of rational beings, just as the law of nature is the ground of all appearances. That allays the suspicion (the one that I stirred up earlier) that there might be a hidden circle in our reasoning from •freedom to •autonomy and from •that to •the moral law—that we might have laid down the idea of freedom for the sake of the moral law so that we could later derive the law from freedom! That would have made us unable to give"},{"r":"kant","p":47,"t":"Groundwork Immanuel Kant Chapter 3 is contained in the idea of freedom, and •as subject to the autonomy of the will. Therefore the laws of the intelligible world must be regarded as imperatives for me, and actions that conform to them must be regarded as duties. All this holds, despite the fact that on the other side I am a being that belongs to the sensible world. So this is how categorical imperatives are possible: The idea of freedom makes me a member of an intelligible world; if I were a member only of that world, all my actions would always conform to the autonomy of the will; but since I confront myself also as a member of the world of sense, my actions ought to conform to it. This categorical ‘ought’ presents a priori a synthetic proposition. ·It is synthetic· because ·in it· (1) my will affected by my sensuous desires has added to it the idea of (2) something that reason says contains its supreme condition, namely •that very same will considered as pure, self-sufficiently practical, and belonging to the intelligible world. ·It is a genuine addition; there’s no way you could extract (2) from (1) by sheer analysis·. [Kant any basis for the law. . . ."},{"r":"kant","p":47,"t":"But now we see that when we think of ourselves as free, we carry ourselves into the intelligible world as members of it and recognize •the autonomy of the will and •the morality that autonomy brings with it; whereas when we think of ourselves as under an obligation, we regard ourselves as belonging to the sensible world and at the same time also to the intelligible world. How is a categorical imperative possible? A rational being counts himself, as an intelligence, as belonging to the intelligible world, and only as an effective cause belonging to this world does he call his causality a ‘will’. On the other side, though, he is conscious of himself as a bit of the sensible world in which his actions are encountered as mere appearances of that causality ·of his will·. But we aren’t acquainted with that causality ·of his will·, so there’s no way we can grasp how these actions can arise from it; and so they must instead be regarded as caused by other appearances, namely, desires and preferences belonging to the sensible world. Considered only as a member of the intelligible world, my behaviour would completely accord with the principle of the autonomy of the pure will; considered as a bit of the sensible world, my behaviour would have to be assumed to conform wholly to the natural law of desires and preferences and thus to the heteronomy of nature."},{"r":"kant","p":47,"t":"(The former behaviour would rest on the supreme principle of morality, and the latter on that of happiness.) But the intelligible world contains the ground or basis of the sensible world and therefore of its laws, and so the intelligible world is (and must be conceived as) directly law-giving for my will, which belongs wholly to the intelligible world. Therefore I see myself, in my status as an intelligence, •as subject to the law of the intelligible world, i.e. the law of reason which adds a not very helpful comparison of this with his doctrine, expounded in his Critique of Pure Reason, about a priori synthetic propositions that are essential to our knowledge of any system of nature.] The practical application of common-sense confirms the correctness of this deduction. When we present examples of honesty of purpose, of steadfastness in following good maxims, and of sympathy and general benevolence (even with great sacrifices of advantage and comfort), there is no man, not even the most malicious villain (provided he is otherwise accustomed to using his reason), who doesn’t wish that he also might have these qualities. It’s merely because of his preferences and impulses that he can’t make himself be like this; but he would like to be free of the burden of such preferences. He thus shows himself as having a thought in which he, with a will free from all impulses of sensibility,"},{"r":"kant","p":48,"t":"Groundwork Immanuel Kant Chapter 3 •necessary that everything that happens should be inextransfers himself into an order of things altogether different from that of his desires in the field of sensibility. In this thought he doesn’t look for any gratification of desires or any state of affairs that would satisfy any desire that he has or can imagine having; for if that were his aim, the very idea that elicits this wish from him would lose its pre-eminence. All he can be looking for is a greater intrinsic value as a person. He believes himself to be this better person when he shifts himself to the standpoint of a member of the intelligible world, to which he is automatically taken by the idea of freedom (i.e. of not being acted on by causes in the sensible world). And in this standpoint he is conscious of a •good will which on his own confession constitutes the law for his •bad will as a member of the sensible world. He recognizes the status of the law even while he breaks it. The moral ‘ought’ is therefore his own necessary will as a member of the intelligible world, and it is conceived by him as an ‘ought’ only because he regards himself at the same time as a member of the sensible world. orably caused in accordance with natural laws; and this natural necessity [a single word in German] is also not ·something of which we have· an experiential concept, because it brings with it the concept of necessity and thus of something that can be known a priori, ·i.e."},{"r":"kant","p":48,"t":"without consulting experience·. But this concept of a ·system of· nature is confirmed by experience, and it has to be presupposed if experience is to be possible—experience being knowledge of the objects of the senses interconnected by universal laws. So •freedom is only an idea of reason, whose objective reality in itself is doubtful, whereas •nature is a concept of the understanding, which does and necessarily must exhibit its reality in examples drawn from experience. From this there arises a dialectic of reason—·a seeming conflict of reason with itself·—because the freedom ascribed to the will seems to contradict natural necessity, ·and reason finds itself drawn to each side of the apparent conflict· at this parting of the ways. •For speculative purposes ·such as the pursuit of scientific theories·, reason finds the road of •natural necessity more well-trodden and usable than that of freedom. •But for practical purposes—thinking about what to do and what not to do—the only way of bringing reason to bear is along the path of •freedom; which is why even the subtlest philosophy can’t argue freedom away, any more than the most ordinary common-sense can. So philosophy has to assume that no real contradiction will be found between freedom and natural necessity as applied to the very same human actions, for it can’t give up the concept of nature any more than it can that of freedom."},{"r":"kant","p":48,"t":"We’ll never be able to grasp how freedom is possible, but in the meantime we should at least eradicate in a convincing way this apparent contradiction. For if the very thought of freedom contradicted itself or contradicted nature (which is Concerning the outermost boundary of all practical philosophy All human beings think of themselves as having free will. That is the source of all judgments that acts that weren’t performed ought to have been performed. But this freedom isn’t ·something of which we have· an experiential concept; it can’t be, because even when experience shows the opposite of things that are represented as •necessary on the supposition of freedom, freedom still remains, ·which shows that it can’t be defeated by facts of experience because it isn’t in the same arena, so to speak, as they are·. On the other hand it is equally"},{"r":"kant","p":49,"t":"Groundwork Immanuel Kant equally necessary), freedom would have to be surrendered in favour of natural necessity. But this contradiction couldn’t be escaped if the subject who seems to himself to be free were thinking of himself in the same sense or in the same relationship when he •calls himself free as when he •takes himself to be subject to natural law with respect to the very same action. So speculative philosophy can’t be excused from its task of showing at least this much: •that ·the ways of talking that produce· the illusion of contradiction come from our thinking of the person in a different sense and relationship when we call him free from that in which we consider him as a part of nature and subject to its laws; and •that these two ·standpoints· not only can very well coexist but must be thought of as necessarily united in one and the same subject. If this much is not shown, we are left with no basis for burdening reason with an idea ·as troublesome as that of freedom·—an idea which, though it can without contradiction be united with the well-established concept ·of natural necessity·, nevertheless entangles us in troubles that sorely embarrass reason in its theoretical use. It is only theoretical philosophy that has this duty; its purpose is to clear the way for practical philosophy."},{"r":"kant","p":49,"t":"So it isn’t up to the philosopher to decide whether to remove the apparent contradiction or rather to leave it untouched; for if he doesn’t remove it, the theory about it would be a no-man’s-land which the fatalist would be entitled to take over, as a squatter, driving all morality out. But we still haven’t reached the boundary of •practical philosophy. For the settling of the controversy ·over freedom· doesn’t belong to •it. The situation is just that practical philosophy demands that theoretical reason put an end to the discord in which •it entangles itself in theoretical questions, so that practical reason may have peace and security from outward attacks that could put into dispute Chapter 3 the land on which it wants to build. The common-sense claim to have freedom of the will is based on the person’s consciousness of something that has also been conceded as a presupposition, namely that •reason is independent of causes that determine a person’s psychological state—causes that are all of the sort that sensation can inform us about, and that can be brought under the general name ‘sensibility’."},{"r":"kant","p":49,"t":"A human being, who in this way regards himself as an intelligence, •when he thinks of himself as an intelligence with a will, and consequently with causality, puts himself in a different order of things and in a relationship to determining grounds of an altogether different kind from what comes into play •when he perceives himself as a phenomenon in the world of sense (as he really is also), and subjects his causality to external causal factors according to natural laws. Now he soon realizes that both can exist together—indeed, that they must. For there is not the slightest contradiction between (1) a thing in appearance (belonging to the sensible world) being subject to certain laws from which as (2) a thing in itself it is independent. That he must think of himself in this twofold way rests on (1) his consciousness of himself as an object affected through the senses, and (2) his consciousness of himself as an intelligence (i.e. as independent of sensible impressions in the use of reason), and thus as belonging to the intelligible world. [The indented portion of this paragraph is a first-person rendition of something that Kant writes using ‘he’ rather than ‘I’.] That’s how it comes about that a human being •claims to have a will that doesn’t make him accountable for what belongs only to his desires and preferences, but •thinks of this same"},{"r":"kant","p":50,"t":"Groundwork Immanuel Kant will as making possible—indeed necessary—actions that he can perform only by disregarding all his desires and sensuous attractions. The causality of these actions lies in •him as an intelligence and in •an intelligible world’s principles concerning effects and actions. All he knows about this intelligible world is this: In this sensible world the law is given only by reason, and indeed pure reason independent of sensibility. Moreover, since it is only as an •intelligence that I am a genuine self (as a •human being I am only an appearance of myself ), those laws apply to me immediately and categorically; so that nothing that I am pushed into doing by preferences or impulses—thus, nothing caused by the sensible world—can count against the laws of my volition as an intelligence. Indeed, he doesn’t hold himself responsible for those ·preferences and impulses· or attribute them to his genuine self (i.e. to his will); though when he •allows them to influence his maxims in ways that go against the rational laws of his will, he holds his will to account for •that. By thinking itself into an intelligible world, practical reason doesn’t at all step across that world’s boundaries, but it would do so if it tried to see or feel its way into it. The ·thought of the· intelligible world is only a negative thought with respect to the sensible world; it doesn’t give reason any laws for determining the will."},{"r":"kant","p":50,"t":"The only positive thing about it is this: Freedom as a negative determination—·i.e. as something that involves not being interfered with by sensible causes·—is also connected with a positive power and even a causality of reason, a causality that we call a ‘will’. . . . .But if practical reason were to borrow an object of the will (i.e. a motive) from the intelligible world, it would be Chapter 3 overstepping its boundaries and pretending to be acquainted with something of which it knows nothing. So the concept of an intelligible world is only a standpoint that reason sees itself as having to take, outside appearances, in order to think of itself as practical. Reason couldn’t be practical if the influences of sensibility settled how the human being behaved, but it must be practical unless his consciousness of himself as an intelligence, and thus as a rational and rationally active cause (i.e. a cause acting in freedom), is to be contradicted. This thought certainly brings with it the idea of an order and a law-giving different from that of the mechanism of nature, which has to do with the sensible world; and it necessitates the concept of an intelligible world, i.e. the totality of rational beings as things in themselves; but without the slightest pretence to have any thoughts about it that go beyond its formal condition—i.e. the universality of the maxim of the will as law, and thus the will’s autonomy which is required for its freedom."},{"r":"kant","p":50,"t":"All laws that are fixed on an object make for heteronomy, which belongs only to natural laws and can apply only to the sensible world. We can explain things only by bringing them under laws governing things that could be confronted in experience. But freedom is only an idea ·of reason·; there is no way its objective reality could be shown through natural laws or, therefore, through any experience. Because it can’t be illustrated even in an analogical way with examples, we can’t ever grasp it or even see into it a little. It holds only as a necessary presupposition of reason in a being who believes himself conscious of having a will, i.e. a faculty or capacity different from that of mere desire—a capacity to get himself to act as an intelligence, and thus to act according to laws of reason and independently of natural instincts. But when we come to an end of causation according to"},{"r":"kant","p":51,"t":"Groundwork Immanuel Kant feeling but· from reason. If a sensuously affected rational being is to will an action that reason alone prescribes as what he ought to do, reason must of course be able to instil a feeling of pleasure or satisfaction in the fulfilment of duty, and hence must have a causal power to affect sensibility in accordance with its own principles. But it is wholly impossible to conceive a priori how a mere thought with nothing sensuous in it produces a sensation of pleasure or unpleasure. For that is one particular kind of causality which, like every kind of causality, we can learn about only by consulting experience, not a priori . But ·we can’t understand this causality through experience either, because· we can do that only for cause-effect pairs where both items are objects of experience, whereas here the effect •does lie within experience but the cause—namely, reason acting through mere ideas, which furnish no object for experience—•does not. So it is completely impossible for us human beings to explain how and why we have an interest in the universality of the maxim as law and thus an interest in morality."},{"r":"kant","p":51,"t":"Only this much is certain: (1) It is not the case that the law holds for us because we have an interest in it (for that would be heteronomy, making practical reason depend on sensibility in the form of an underlying feeling, which could never yield a moral law); and (2) It is the case that we have an interest in the moral law because it holds for us as human beings, because it has arisen from our will as intelligence, and hence from our genuine self. That source for the moral law is what gives it its authority, what natural laws, we are at an end of all explanation, and all that is left for us to do is to defend—i.e. to refute objections from those who purport to have seen more deeply into the essence of things and who boldly declare freedom to be impossible. We can only show them that the supposed contradiction they have discovered in the idea of freedom lies simply in this: They have to regard a human being as •appearance in order to bring natural laws to bear on his actions; and now when we require them to think of him-asintelligence as a •thing in itself, they still persist regarding considering him as appearance."},{"r":"kant","p":51,"t":"Separating his causality (his will) from all natural laws of the sensible world does indeed involve a contradiction if this is the very same subject that we previously brought under natural laws; but the contradiction will disappear if they will think again, and admit that behind appearances things in themselves must stand as their hidden ground, and that we can’t insist that the laws of operation of these grounds must be the same as those that govern their appearances. The subjective impossibility of explaining the freedom of the will is the same as the impossibility of discovering and making graspable an interest which a human being can take in moral laws.17 Yet he does actually take an interest in them, and our name for the foundation of this is ‘moral feeling’. Some have wrongly offered this moral feeling as our standard for moral judgment, whereas really it should be seen as the subjective effect that the law has on the will; the objective grounds ·for moral judgment· come ·not from Chapter 3 It is by interest that reason becomes practical, i.e. becomes a cause acting on the will. That is why it is only of a being with reason that we say ‘He takes an interest in’ something; non-rational creatures don’t have interests—only sensuous impulses. Reason takes an •immediate interest in actions only in cases where what has moved the will in that direction is the universal validity of the action’s maxim. That’s the only kind of interest that is pure [= ‘non-empirical’]."},{"r":"kant","p":51,"t":"In contrast with that, reason takes an indirect or •mediated interest in an action if it acts on the will only through the intervention or •mediation of another object of desire or under the supposition of some particular feeling that the subject has; and since such objects of desire and particular feelings can’t be found out by reason itself, unaided by experience, this mediated kind of interest is only empirical and not a pure interest of reason. . . ."},{"r":"kant","p":52,"t":"Groundwork Immanuel Kant Chapter 3 drift around in that; but ·it couldn’t supply the desired explanation, because· although I have a well-founded idea of that world I don’t have the least knowledge of it—and I can’t have such knowledge, however hard I exercise my natural faculty of reason. This intelligible world signifies only a something—·a whatever-it-is·—that is left after I have excluded from the factors acting on my will everything belonging to the sensible world, which I did merely so as to shut the principle of motives out of field of sensibility. I did this by limiting this field and showing that it doesn’t contain absolutely everything, and that outside it there is still more; but that’s all I know about this ‘more’, ·namely that it lies outside the sensible world·. It is pure reason that has this ·idea, that is· the thought of this ideal entity, ·the intelligible world·; it has been deprived of all matter (i.e. all knowledge of objects); so all that I am left with ·in trying to make sense of pure reason· is •the form, namely the practical law of the universal validity of maxims, and •the possible role of pure reason as an effective cause acting on the will in accordance with that form. There is no room here for any ·external· action-driver. If we insist on there being one, then the action-driver—i.e. that in which reason directly takes an interest—would have to be this idea of an intelligible world."},{"r":"kant","p":52,"t":"But to understand how this could drive action is precisely the problem we can’t solve. Here, then, is the outermost boundary of all moral inquiry [assuming that Kant wrote oberste = ‘highest’ when he meant to write äußerste = ‘outermost’, as in the heading on page 47]. It’s very important to locate it accurately, because if we don’t, ·either of two disasters may occur·. On the one hand, •reason may search for the supreme ·moral· motive in the sensible world, in a way harmful to morals. . . . On the other hand, •reason may impotently flap its wings in the space—so far as reason makes it hold for us, because reason necessarily makes what belongs to mere •appearance subordinate to the character of the •thing in itself. So the question How is a categorical imperative possible? can be answered to this extent: We can •cite the only presupposition under which it is possible, namely the idea of freedom; and we can •have insight into the necessity of this presupposition. That is all we need for the practical use of reason (i.e. to be convinced of the categorical imperative’s validity and hence also of the moral law). But how this presupposition itself is possible can never be grasped by any human reason. However,. . . .the presupposition of the freedom of the will is quite •possible, as speculative philosophy can prove, for it doesn’t involve itself in a contradiction with the principle that natural necessity interconnects all the appearances in the sensible world."},{"r":"kant","p":52,"t":"More than that, it is unconditionally •necessary for any rational being. I mean that it is practically necessary for him, meaning that he needs it for his consciousness of his causality through reason,. . . .needs the idea of it as the fundamental condition of all his voluntary acts. But the question still stands: How can pure reason, all by itself without any outside help from other action-drivers, be practical? How can the mere principle of the universal validity of its maxims as laws. . . .create, unaided, an action-driver and produce an interest that would be called ‘purely moral’? In short: How can pure reason be practical? All human reason is wholly incompetent to explain this, and it is a waste of trouble and labour to try. It is just the same as if I tried to find out how freedom itself as the causality of a will is possible, for in making that attempt I would be leaving the philosophical basis of explanation behind, and I have no other. I would still have the intelligible world, the world of intelligences, and I could"},{"r":"kant","p":53,"t":"Groundwork Immanuel Kant is concerned it’s an empty space!—of. . . .the intelligible world, without being able to move from its starting point and so losing itself among phantoms. For the rest, the idea of a pure intelligible world, as a whole of all intelligences to which we ourselves belong as rational beings (though on the other side we also belong to the sensible world), is always a useful and permissible idea for the purpose of a rational •belief, even though all •knowledge terminates at that world’s boundary. Its service is that of awakening in us a lively interest in the moral law through the noble ideal of a universal realm of ends in themselves (rational beings) to which we can belong as members only when we scrupulously conduct ourselves by maxims of freedom as if they were laws of nature. Chapter 3 necessarily x exists or y happens, or necessarily z ought to happen, except on the basis of some condition that applies to x or y or z. ·But the obtaining of a condition won’t make something necessary unless the condition itself is necessary; and so· if reason keeps searching for conditions it only pushes its satisfaction further and further into the future. So reason, restlessly seeking the unconditionally necessary, sees itself as having to assume it, though it has no way of making it comprehensible to itself; it is happy enough if it can merely discover the concept that is compatible with this presupposition."},{"r":"kant","p":53,"t":"According to my account of the supreme principles of morality, reason can’t render comprehensible the absolute necessity of an unconditional practical law (such as the categorical imperative must be). If you want to complain about this, don’t blame my account—blame reason! ·Not that blame is appropriate·: reason can’t be blamed for being unwilling to explain the moral law through a condition—i.e. by making some interest its basis—for a law explained in that way would no longer be if it did, the law would cease to be moral and would no longer be the supreme law of freedom. So we truly don’t comprehend the unconditional practical necessity of the moral imperative; but we do comprehend its incomprehensibility, which is all that can fairly be demanded of a philosophy that in its principles forces its way out to the boundaries of human reason. Concluding remark The speculative use of reason with respect to nature leads to the absolute necessity of some supreme cause of the world. The practical use of reason with regard to freedom leads also to an absolute necessity, but only of the laws of actions of a rational being as such. Now, it is an essential principle of all use of our reason to push its knowledge to an awareness of its necessity, for otherwise it wouldn’t be rational knowledge. But it is also an equally essential limitation of this very same reason that it can’t see that"},{"r":"grimke","p":1,"t":"HUMAN RIGHTS NOT FOUNDED ON SEX. Dear Friend: In my last, I made a sort of running commentary upon thy views of the appropriate sphere of woman, with something like a promise, that in my next, I would give thee my own. The investigation of the rights of the slave has led me to a better understanding of my own. I have found the Anti-Slavery cause to be the high school of morals in our land—the school in which human rights are more fully investigated, and better understood and taught, than in any other. Here a great fundamental principle is uplifted and illuminated, and from this central light, rays innumerable stream all around. Human beings have rights, because they are moral beings: the rights of all men grow out of their moral nature; and as all men have the same moral nature, they have essentially the same rights. These rights may be wrested from the slave, but they cannot be alienated: his title to himself is as perfect now, as is that of Lyman Beecher: it is stamped on his moral being, and is, like it, imperishable. Now [115] if rights are founded in the nature of our moral being, then the mere circumstance of sex does not give to man higher rights and responsibilities, than to woman."},{"r":"grimke","p":1,"t":"To suppose that it does, would be to deny the self-evident truth, that the ‘physical constitution is the mere instrument of the moral nature.’ To suppose that it does, would be to break up utterly the relations, of the two natures, and to reverse their functions, exalting the animal nature into a monarch, and humbling the moral into a slave; making the former a proprietor, and the latter its property. When human beings are regarded as moral beings, sex, instead of being enthroned upon the summit, administering upon rights and responsibilities, sinks into insigni cance and nothingness. My doctrine then is, that whatever it is morally right for man to do, it is morally right for woman to do. Our duties originate, not from difference of sex, but from the diversity of our relations in life, the various gifts and talents committed to our care, and the different eras in which we live. This regulation of duty by the mere circumstance of sex, rather than by the fundamental principle of moral being, has led to all that multifarious train of evils owing out of the anti-christian doctrine of masculine and feminine virtues."},{"r":"grimke","p":1,"t":"By this doctrine, man has been converted into the warrior, and clothed with sternness, and those other kindred qualities, which in common estimation belong to his character as a man; whilst woman has been taught to lean upon an arm of esh, to sit as a doll arrayed in ‘gold, and pearls, and costly array,’ to be admired for her [116] fi fl fi fi fi personal charms, and caressed and humored like a spoiled child, or converted into a mere drudge to suit the convenience of her lord and master. Thus have all the diversi ed relations of life been lled with ‘confusion and every evil work.’ This principle has given to man a charter for the exercise of tyranny and sel shness, pride and arrogance, lust and brutal violence. It has robbed woman of essential rights, the right to think and speak and act on all great moral questions, just as men think and speak and act; the right to share their responsibilities, perils and toils; the right to ful l the great end of her being, as a moral, intellectual and immortal creature, and of glorifying God in her body and her spirit which are His. Hitherto, instead of being a help meet to man, in the highest, noblest sense of the term, as a companion, a co-worker, an equal; she has been a mere appendage of his being, an instrument of his convenience and pleasure, the pretty fl fi LETTER XII."},{"r":"grimke","p":2,"t":"toy with which he wiled away his leisure moments, or the pet animal whom he humored into playfulness and submission. Woman, instead of being regarded as the equal of man, has uniformly been looked down upon as his inferior, a mere gift to ll up the measure of his happiness. In ‘the poetry of romantic gallantry,’ it is true, she has been called ‘the last best gift of God to man;’ but I believe I speak forth the words of truth and soberness when I af rm, that woman never was given to man. She was created, like him, in the image of God, and crowned with glory and honor; created only a little lower than the angels,—not, as is almost universally assumed, a little [117] lower than man; on her brow, as well as on his, was placed the ‘diadem of beauty,’ and in her hand the sceptre of universal dominion. Gen: i. 27, 28. ‘The last best gift of God to man!’ Where is the scripture warrant for this ‘rhetorical ourish, this splendid absurdity?’ Let us examine the account of her creation. ‘And the rib which the Lord God had taken from man, made he a woman, and brought her unto the man.’ Not as a gift—for Adam immediately recognized her as a part of himself—(‘this is now bone of my bone, and esh of my esh’)—a companion and equal, not one hair’s breadth beneath him in the majesty and glory of her moral being; not placed under his authority as a subject, but by his side, on the same platform of human rights, under the government of God only."},{"r":"grimke","p":2,"t":"This idea of woman’s being ‘the last best gift of God to man,’ however pretty it may sound to the ears of those who love to discourse upon ‘the poetry of romantic gallantry, and the generous promptings of chivalry,’ has nevertheless been the means of sinking her from an end into a mere means—of turning her into an appendage to man, instead of recognizing her as a part of man—of destroying her individuality, and rights, and responsibilities, and merging her moral being in that of man. Instead of Jehovah being her king, her lawgiver, and her judge, she has been taken out of the exalted scale of existence in which He placed her, and subjected to the despotic control of man. I have often been amused at the vain efforts made to de ne the rights and responsibilities of immortal beings as men and women. No one has yet found [118] fi fi fi fl fi fi fl fi fl fl out just where the line of separation between them should be drawn, and for this simple reason, that no one knows just how far below man woman is, whether she be a head shorter in her moral responsibilities, or head and shoulders, or the full length of his noble stature, below him, i.e. under his feet."},{"r":"grimke","p":2,"t":"Confusion, uncertainty, and great inconsistencies, must exist on this point, so long as woman is regarded in the least degree inferior to man; but place her where her Maker placed her, on the same high level of human rights with man, side by side with him, and dif culties vanish, the mountains of perplexity ow down at the presence of this grand equalizing principle. Measure her rights and duties by the unerring standard of moral being, not by the false weights and measures of a mere circumstance of her human existence, and then the truth will be selfevident, that whatever it is morally right for a man to do, it is morally right for a woman to do. I recognize no rights but human rights—I know nothing of men’s rights and women’s rights; for in Christ Jesus, there is neither male nor female. It is my solemn conviction, that, until this principle of equality is recognised and embodied in practice, the church can do nothing effectual for the permanent reformation of the world. Woman was the rst transgressor, and the rst victim of power. In all heathen nations, she has been the slave of man, and Christian nations have never acknowledged her rights. Nay more, no Christian denomination or Society has ever"},{"r":"grimke","p":3,"t":"acknowledged them on the broad basis of humanity. I know that in some denominations, she is permitted to preach the gospel; not from a conviction [119] of her rights, nor upon the ground of her equality as a human being, but of her equality in spiritual gifts—for we nd that woman, even in these Societies, is allowed no voice in framing the Discipline by which she is to be governed. Now, I believe it is woman’s right to have a voice in all the laws and regulations by which she is to be governed, whether in Church or State; and that the present arrangements of society, on these points, are a violation of human rights, a rank usurpation of power, a violent seizure and con scation of what is sacredly and inalienably hers —thus in icting upon woman outrageous wrongs, working mischief incalculable in the social circle, and in its in uence on the world producing only evil, and that continually. If Ecclesiastical and Civil governments are ordained of God, then I contend that woman has just as much right to sit in solemn counsel in Conventions, Conferences, Associations and General Assemblies, as man—just as much right to sit upon the throne of England, or in the Presidential chair of the United States. Dost thou ask me, if I would wish to see woman engaged in the contention and strife of sectarian controversy, or in the intrigues of political partizans? I say no! never—never."},{"r":"grimke","p":3,"t":"I rejoice that she does not stand on the same platform which man now occupies in these respects; but I mourn, also, that he should thus prostitute his higher nature, and vilely cast away his birthright. I prize the purity of his character as highly as I do that of hers. As a moral being, whatever it is morally wrong for her to do, it is morally wrong for him to do. The fallacious doctrine [120] of male and female virtues has well nigh ruined all that is morally great and lovely in his character: he has been quite as deep a sufferer by it as woman, though mostly in different respects and by other processes. As my time is engrossed by the pressing responsibilities of daily public duty, I have no leisure for that minute detail which would be required for the illustration and defence of these principles. Thou wilt nd a wide eld opened before thee, in the investigation of which, I doubt not, thou wilt be instructed. Enter this eld, and explore it: thou wilt nd in it a hid treasure, more precious than rubies—a fund, a mine of principles, as new as they are great and glorious. Thou sayest, ‘an ignorant, a narrow-minded, or a stupid woman, cannot feel nor understand the rationality, the propriety, or the beauty of this relation’—i.e. subordination to man. Now, verily, it does appear to me, that nothing but a narrow-minded view of the subject of human rights and responsibilities can induce any one to believe in this subordination to a fallible being."},{"r":"grimke","p":3,"t":"Sure I am, that the signs of the times clearly indicate a vast and rapid change in public sentiment, on this subject. Sure I am that she is not to be, as she has been, ‘a mere second-hand agent’ in the regeneration of a fallen world, but the acknowledged equal and co-worker with man in this glorious work. Not that ‘she will carry her measures by tormenting when she cannot please, or by petulant complaints or obtrusive interference, in matters which are out of her sphere, and which she cannot comprehend.’ But just in proportion as her moral and intellectual [121] fi fi fi fi fi fl fl fi capacities become enlarged, she will rise higher and higher in the scale of creation, until she reaches that elevation prepared for her by her Maker, and upon whose summit she was originally stationed, only ‘a little lower than the angels.’ Then will it be seen that nothing which concerns"},{"r":"grimke","p":4,"t":"the well-being of mankind is either beyond her sphere, or above her comprehension: Then will it be seen ‘that America will be distinguished above all other nations for well educated women, and for the in uence they will exert on the general interests of society.’ fl But I must close with recommending to thy perusal, my sister’s Letters on the Province of Woman, published in the New England Spectator, and republished by Isaac Knapp of Boston. As she has taken up this subject so fully, I have only glanced at it. That thou and all my countrywomen may better understand the true dignity of woman, is the sincere desire of"},{"r":"omelas","p":1,"t":"“The Ones Who Walk Away From Omelas” by Ursula K LeGuin from The Wind's Twelve Quarters With a clamor of bells that set the swallows soaring, the Festival of Summer came to the city Omelas, bright-towered by the sea. The ringing of the boats in harbor sparkled with flags. In the streets between houses with red roofs and painted walls, between old moss-grown gardens and under avenues of trees, past great parks and public buildings, processions moved. Some were decorous: old people in long stiff robes of mauve and gray, grave master workmen, quiet, merry women carrying their babies and chatting as they walked. In other streets the music beat faster, a shimmering of gong and tambourine, and the people went dancing, the procession was a dance. Children dodged in and out, their high calls rising like the swallows' crossing flights over the music and the singing. All the processions wound towards the north side of the city, where on the great water-meadow called the Green Fields boys and girls, naked in the bright air, with mud-stained feet and ankles and long, lithe arms,exercised their restive horses before the race. The horses wore no gear at all but a halter without bit. Their manes were braided with streamers of silver, gold, and green. They flared their nostrils and pranced and boasted to one another; they were vastly excited, the horse being the only animal who has adopted our ceremonies as his own."},{"r":"omelas","p":1,"t":"Far off to the north and west the mountains stood up half encircling Omelas on her bay. The air of morning was so clear that the snow still crowning the Eighteen Peaks burned with white-gold fire across the miles of sunlit air, under the dark blue of the sky. There was just enough wind to make the banners that marked the racecourse snap and flutter now and then. In the silence of the broad green meadows one could hear the music winding throughout the city streets, farther and nearer and ever approaching, a cheerful faint sweetness of the air from time to time trembled and gathered together and broke out into the great joyous clanging of the bells. Joyous! How is one to tell about joy? How describe the citizens of Omelas? They were not simple folk, you see, though they were happy. But we do not say the words of cheer much any more. All smiles have become archaic. Given a description such as this one tends to make certain assumptions. Given a description such as this one tends to look next for the King, mounted on a splendid stallion and surrounded by his noble knights, or perhaps in a golden litter borne by great-muscled slaves. But there was no king. They did not use swords, or keep slaves. They were not barbarians, I do not know the rules and laws of their society, but I suspect that they were singularly few. As they did without monarchy and slavery, so they also got on without the stock exchange, the advertisement, the secret police, and the bomb."},{"r":"omelas","p":1,"t":"Yet I repeat that these were not simple folk, not dulcet shepherds, noble savages, bland utopians. There were not less complex than us. The trouble is that we have a bad habit, encouraged by pedants and sophisticates, of considering happiness as something rather stupid. Only pain is intellectual, only evil interesting. This is the treason of the artist: a refusal to admit the banality of evil and the terrible boredom of"},{"r":"omelas","p":2,"t":"pain. If you can't lick 'em, join 'em. If it hurts, repeat it. But to praise despair is to condemn delight, to embrace violence is to lose hold of everything else. We have almost lost hold; we can no longer describe happy man, nor make any celebration of joy. How can I tell you about the people of Omelas? They were not naive and happy children--though their children were, in fact, happy. They were mature, intelligent, passionate adults whose lives were not wretched. O miracle! But I wish I could describe it better. I wish I could convince you. Omelas sounds in my words like a city in a fairy tale, long ago and far away, once upon a time. Perhaps it would be best if you imagined it as your own fancy bids, assuming it will rise to the occasion, for certainly I cannot suit you all. For instance, how about technology? I think that there would be no cars or helicopters in and above the streets; this follows from the fact that the people of Omelas are happy people. Happiness is based on a just discrimination of what is necessary, what is neither necessary nor destructive, and what is destructive. In the middle category, however--that of the unnecessary but undestructive, that of comfort, luxury, exuberance, etc.-they could perfectly well have central heating, subway trains, washing machines, and all kinds of marvelous devices not yet invented here, floating light-sources, fuelless power, a cure for the common cold. Or they could have none of that: it doesn't matter."},{"r":"omelas","p":2,"t":"As you like it. I incline to think that people from towns up and down the coast have been coming to to Omelas during the last days before the Festival on very fast little trains and double-decked trams, and that the trains station of Omelas is actually the handsomest building in town, though plainer than the magnificent Farmers' Market. But even granted trains, I fear that Omelas so far strikes some of you as goody-goody. Smiles, bells, parades, horses, bleh. If so, please add an orgy. If an orgy would help, don't hesitate. Let us not, however, have temples from which issue beautiful nude priests and priestesses already half in ecstasy and ready to copulate with any man or woman, lover or stranger, who desires union with the deep godhead of the blood, although that was my first idea. But really it would be better not to have any temples in Omelas--at least, not manned temples. Religion yes, clergy no. Surely the beautiful nudes can just wander about, offering themselves like divine souffles to the hunger of the needy and the rapture of the flesh. Let them join the processions. Let tambourines be struck above the copulations, and the gory of desire be proclaimed upon the gongs, and (a not unimportant point) let the offspring of these delightful rituals be beloved and looked after by all. One thing I know there is none of in Omelas is guilt. But what else should there be? I thought at first there were no drugs, but that is puritanical."},{"r":"omelas","p":2,"t":"For those who like it, the faint insistent sweetness of drooz may perfume the ways of the city, drooz which first brings a great lightness and brilliance to the mind and limbs, and then after some hours a dreamy languor, and wonderful visions at last of the very arcane and inmost secrets of the Universe, as well as exciting the pleasure of sex beyond all belief; and it is not habit-forming. For more modest tastes I think there ought to be beer. What else, what else belongs in the joyous city? The sense of victory, surely, the celebration of courage. But as we did without clergy, let us do without soldiers. The joy built upon successful slaughter is not the right kind of joy; it will not do; it is fearful and it is trivial. A boundless and generous contentment, a magnanimous triumph felt not against some outer enemy but in communion with the finest and fairest in the souls of all men everywhere and the splendor of the world's summer: This is what swells the hearts of the people of Omelas, and the victory they celebrate is that of life. I don't think many of them need to take drooz."},{"r":"omelas","p":3,"t":"Most of the processions have reached the Green Fields by now. A marvelous smell of cooking goes forth from the red and blue tents of the provisioners. The faces of small children are amiably sticky; in the benign gray beard of a man a couple of crumbs of rich pastry are entangled. The youths and girls have mounted their horses and are beginning to group around the starting line of the course. An old woman, small, fat, and laughing, is passing out flowers from a basket, and tall young men wear her flowers in their shining hair. A child of nine or ten sits at the edge of the crowd alone, playing on a wooden flute. People pause to listen, and they smile, but they do not speak to him, for he never ceases playing and never sees them, his dark eyes wholly rapt in the sweet, thing magic of the tune. He finishes, and slowly lowers his hands holding the wooden flute. As if that little private silence were the signal, all at once a trumpet sounds from the pavilion near the starting line: imperious, melancholy, piercing. The horses rear on their slender legs, and some of them neigh in answer. Sober-faced, the young riders stroke the horses' necks and soothe them, whispering. \"Quiet, quiet, there my beauty, my hope...\" They begin to form in rank along the starting line. The crowds along the racecourse are like a field of grass and flowers in the wind. The Festival of Summer has begun. Do you believe? Do you accept the festival, the city, the joy? No? Then let me describe one more thing."},{"r":"omelas","p":3,"t":"In a basement under one of the beautiful public buildings of Omelas, or perhaps in the cellar of one of its spacious private homes, there is a room. It has one locked door, and no window. A little light seeps in dustily between cracks in the boards, secondhand from a cobwebbed window somewhere across the cellar. In one corner of the little room a couple of mops, with stiff, clotted, foul-smelling heads, stand near a rusty bucket. The floor is dirt, a little damp to the touch, as cellar dirt usually is. The room is about three paces long and two wide: a mere broom closet or disused tool room. In the room, a child is sitting. It could be a boy or a girl. It looks about six, but actually is nearly ten. It is feeble-minded. Perhaps it was born defective, or perhaps it has become imbecile through fear, malnutrition, and neglect. It picks its nose and occasionally fumbles vaguely with its toes or genitals, as it sits hunched in the corner farthest from the bucket and the two mops. It is afraid of the mops. It finds them horrible. It shuts its eyes, but it knows the mops are still standing there; and the door is locked; and nobody will come. The door is always locked; and nobody ever comes, except that sometimes--the child has no understanding of time or interval--sometimes the door rattles terribly and opens, and a person, or several people, are there. One of them may come in and kick the child to make it stand up."},{"r":"omelas","p":3,"t":"The others never come close, but peer in at it with frightened, disgusted eyes. The food bowl and the water jug are hastily filled, the door is locked; the eyes disappear. The people at the door never say anything, but the child, who has not always lived in the tool room, and can remember sunlight and its mother's voice, sometimes speaks. \"I will be good, \" it says. \"Please let me out. I will be good!\" They never answer. The"},{"r":"omelas","p":4,"t":"child used to scream for help at night, and cry a good deal, but now it only makes a kind of whining, \"eh-haa, eh-haa,\" and it speaks less and less often. It is so thin there are no calves to its legs; its belly protrudes; it lives on a half-bowl of corn meal and grease a day. It is naked. Its buttocks and thighs are a mass of festered sores, as it sits in its own excrement continually. They all know it is there, all the people of Omelas. Some of them have come to see it, others are content merely to know it is there. They all know that it has to be there. Some of them understand why, and some do not, but they all understand that their happiness, the beauty of their city, the tenderness of their friendships, the health of their children, the wisdom of their scholars, the skill of their makers, even the abundance of their harvest and the kindly weathers of their skies, depend wholly on this child's abominable misery. This is usually explained to children when they are between eight and twelve, whenever they seem capable of understanding; and most of those who come to see the child are young people, though often enough an adult comes, or comes back, to see the child. No matter how well the matter has been explained to them, these young spectators are always shocked and sickened at the sight. They feel disgust, which they had thought themselves superior to. They feel anger, outrage, impotence, despite all the explanations. They would like to do something for the child."},{"r":"omelas","p":4,"t":"But there is nothing they can do. If the child were brought up into the sunlight out of that vile place, if it were cleaned and fed and comforted, that would be a good thing, indeed; but if it were done, in that day and hour all the prosperity and beauty and delight of Omelas would wither and be destroyed. Those are the terms. To exchange all the goodness and grace of every life in Omelas for that single, small improvement: to throw away the happiness of thousands for the chance of happiness of one: that would be to let guilt within the walls indeed. The terms are strict and absolute; there may not even be a kind word spoken to the child. Often the young people go home in tears, or in a tearless rage, when they have seen the child and faced this terrible paradox. They may brood over it for weeks or years. But as time goes on they begin to realize that even if the child could be released, it would not get much good of its freedom: a little vague pleasure of warmth and food, no real doubt, but little more. It is too degraded and imbecile to know any real joy. It has been afraid too long ever to be free of fear. Its habits are too uncouth for it to respond to humane treatment. Indeed, after so long it would probably be wretched without walls about it to protect it, and darkness for its eyes, and its own excrement to sit in. Their tears at the bitter injustice dry when they begin to perceive the terrible justice of reality, and to accept it."},{"r":"omelas","p":4,"t":"Yet it is their tears and anger, the trying of their generosity and the acceptance of their helplessness, which are perhaps the true source of the splendor of their lives. Theirs is no vapid, irresponsible happiness. They know that they, like the child, are not free. They know compassion. It is the existence of the child, and their knowledge of its existence, that makes possible the nobility of their architecture, the poignancy of their music, the profundity of their science. It is because of the child that they are so gentle with children. They know that if the wretched one were not there sniveling in the dark, the other one, the flute-player, could make no joyful music as the young riders line up in their beauty for the race in the sunlight of the first morning of summer."},{"r":"omelas","p":5,"t":"Now do you believe them? Are they not more credible? But there is one more thing to tell, and this is quite incredible. At times one of the adolescent girls or boys who go see the child does not go home to weep or rage, does not, in fact, go home at all. Sometimes also a man or a woman much older falls silent for a day or two, then leaves home. These people go out into the street, and walk down the street alone. They keep walking, and walk straight out of the city of Omelas, through the beautiful gates. They keep walking across the farmlands of Omelas. Each one goes alone, youth or girl, man or woman. Night falls; the traveler must pass down village streets, between the houses with yellowlit windows, and on out into the darkness of the fields. Each alone, they go west or north, towards the mountains. They go on. They leave Omelas, they walk ahead into the darkness, and they do not come back. The place they go towards is a place even less imaginable to most of us than the city of happiness. I cannot describe it at all. It is possible that it does not exist. But they seem to know where they are going, the ones who walk away from Omelas."}];

const tok=s=>s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)).map(w=>w.replace(/(ings|ing|ies|ed|es|s)$/,""));
const DOCS=CHUNKS.map(c=>{const t=tok(c.t);const tf=new Map();t.forEach(w=>tf.set(w,(tf.get(w)||0)+1));return {tf,len:t.length}});
const DF=new Map();DOCS.forEach(d=>d.tf.forEach((_,w)=>DF.set(w,(DF.get(w)||0)+1)));
const AVG=DOCS.reduce((a,d)=>a+d.len,0)/DOCS.length, N=DOCS.length;
function search(query, readings, k=5){
  const q=[...new Set(tok(query))];
  const scored=[];
  CHUNKS.forEach((c,i)=>{
    if(readings&&readings.length&&!readings.includes(c.r))return;
    const d=DOCS[i];let s=0;
    for(const w of q){const f=d.tf.get(w);if(!f)continue;const idf=Math.log(1+(N-DF.get(w)+.5)/(DF.get(w)+.5));s+=idf*(f*2.2)/(f+1.2*(1-.75+.75*d.len/AVG))}
    if(s>0)scored.push([s,i]);
  });
  scored.sort((a,b)=>b[0]-a[0]);
  return scored.slice(0,k).map(([s,i])=>({reading:READING_NAME[CHUNKS[i].r]||CHUNKS[i].r,passage:CHUNKS[i].t}));
}

function systemPrompt(ids,deep){

- Stay relevant. Use only the parts of a thinker's view that actually bear on this situation. If a thinker has little to say about it, say so plainly in the assessment and keep the points modest. Do not stretch a thinker to fit.
- For Mill, the assessment always includes one sentence placing his view against Bentham's utilitarianism.

- Write for a beginner. Short sentences. Everyday words. Like a friendly teaching assistant explaining it out loud.
- Never use em dashes. Use periods or commas.
- Bad: "A publicly known rule with a defined exception set is what Harsanyi recommends over case-by-case calculation."

FORMAT FOR A NEW SITUATION

{"situation":"the situation restated in under 12 words",
 "thinkers":[{"id":"thinker id",

   "points":["${many?"Exactly 3":"3 or 4"} items. Each item starts with one bolded term from this thinker's Vocabulary list, then 1-2 plain sentences applying it to the facts. Use a different term in each item, and pick the most relevant terms."]}],
 "intersections":[{"a":"thinker id","b":"thinker id","type":"agree|clash|mixed","title":"under 7 words","text":"2-3 plain sentences on how these two meet or clash in this situation. Bold only terms from these two thinkers' lists."}]}
- Thinker ids: ${ids.map(i=>`${i} (${BY[i].name})`).join(", ")}. Include every selected thinker, in that order.
- Inside strings, the only formatting allowed is **double asterisks** around vocabulary terms.
- Intersections: only if more than one thinker is selected. Include pairs that genuinely connect in this situation, guided by the known connections; give every selected thinker at least one; at most ${many?8:6} in total.
- If the student asks a general question instead of describing a situation, answer in short plain Markdown instead of JSON.
${deep?`

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function md(src){
  const lines=src.replace(/\r/g,"").split("\n");let html="",list=false,para=[];
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>").replace(/—/g,", ");
  const flush=()=>{if(para.length){html+=`<p>${inline(para.join(" "))}</p>`;para=[]}};
  const endList=()=>{if(list){html+="</ul>";list=false}};
  for(const l of lines){
    const t=l.trim();
    if(!t){flush();endList();continue}
    let m;
    if(m=t.match(/^#{1,2}\s+(.*)/)){flush();endList();html+=`<h2>${inline(m[1])}</h2>`}
    else if(m=t.match(/^#{3,6}\s+(.*)/)){flush();endList();html+=`<h3>${inline(m[1])}</h3>`}
    else if(m=t.match(/^[-*•]\s+(.*)/)){flush();if(!list){html+="<ul>";list=true}html+=`<li>${inline(m[1])}</li>`}
    else if(m=t.match(/^>\s?(.*)/)){flush();endList();html+=`<blockquote>${inline(m[1])}</blockquote>`}
    else{endList();para.push(t)}
  }
  flush();endList();return html;
}

function salvage(txt){ // rebuild JSON from a cut-off answer: keep every thinker that finished
  const s=txt.indexOf("{");if(s<0)return null;const t=txt.slice(s);
  const k=t.indexOf('"thinkers"');if(k<0)return null;
  let depth=0,inStr=false,esc=false,lastThinker=-1,lastInter=-1,interStart=t.indexOf('"intersections"');
  for(let i=0;i<t.length;i++){const c=t[i];
    if(inStr){if(esc)esc=false;else if(c==="\\")esc=true;else if(c==='"')inStr=false;continue}
    if(c==='"'){inStr=true;continue}
    if(c==="{"||c==="[")depth++;
    else if(c==="}"||c==="]"){depth--;if(c==="}"&&depth===2){if(interStart>0&&i>interStart)lastInter=i;else if(i>k)lastThinker=i}}
  }
  try{
    if(lastInter>0)return {o:clean(JSON.parse(t.slice(0,lastInter+1)+"]}")),cut:true};
    if(lastThinker>0)return {o:clean(JSON.parse(t.slice(0,lastThinker+1)+"]}")),cut:true};
  }catch(e){}
  return null;
}

    if(j.error?.type==="access_code")throw askForCode(code?"That access code wasn't accepted. Re-enter it in Settings.":"This site needs an access code. Enter it in Settings, then ask again.");
    if(j.error?.type==="server_config")throw new Error(m);
    if(/workspace/i.test(m))throw new Error("The API key on the server needs a workspace. Add ANTHROPIC_WORKSPACE_ID in Vercel, or use a key created inside a workspace.");
    const map={401:"The API key stored in Vercel wasn't accepted"+(m?" (Anthropic says: "+m+")":"")+". Check ANTHROPIC_API_KEY in Vercel, then redeploy.",403:"The API key doesn't have permission for that model.",404:"That model isn't available to the key. Try another in Settings.",429:"Rate limit reached. Wait a minute and try again.",529:"Anthropic's API is overloaded right now. Try again shortly.",504:"The request took too long. Try again, or switch to a faster model in Settings."};
    throw new Error(map[r.status]||`Error ${r.status}${m?": "+m:""}`)}
  return r.json();
}

async function ask(){
  const text=input.value.trim();
  if(busy||!text)return;
  const ids=ORDER.filter(i=>sel.has(i));if(!ids.length){updateHint();openPop("thinkBtn");return}
  closePops();
  if(msgs.querySelector(".empty"))msgs.replaceChildren();
  input.value="";autosize();addUser(text,ids);
  const bot=addBot();busy=true;send.disabled=true;ctl=new AbortController();
  const userTurn={role:"user",content:`[Selected thinkers: ${ids.map(i=>BY[i].name).join(", ")}]\n\n${text}`};
  const working=[...history,userTurn];
  const deep=history.length>0;
  try{
    let final="",stop="";
    for(let step=0;step<8;step++){
      const res=await callAPI({model:model.value,max_tokens:16000,system:systemPrompt(ids,deep),tools:deep?TOOLS:undefined,messages:working});
      working.push({role:"assistant",content:res.content});
      const uses=res.content.filter(b=>b.type==="tool_use");
      if(res.stop_reason!=="tool_use"||!uses.length){final=res.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");stop=res.stop_reason;break}
      const results=uses.map(u=>{
        const rs=(u.input.readings||[]).filter(x=>READING_NAME[x]);
        setStatus(bot,`Searching ${rs.length?rs.map(x=>BY[x]?.short||"Omelas").join(", "):"the readings"} for "${u.input.query}"...`);
        return {type:"tool_result",tool_use_id:u.id,content:JSON.stringify(search(u.input.query,rs,5))};
      });
      working.push({role:"user",content:results});
      setStatus(bot,"Writing the analysis...");
    }
    if(!final)final="I ran out of steps before finishing. Try asking again, or check fewer thinkers.";
    history=working;
    const pa=parseAnalysis(final);
    let copyText=final;
    if(pa){const o=pa.o;renderMatrix(bot,o);copyText=analysisText(o);
      const missing=ids.filter(i=>!o.thinkers.some(t=>t.id===i));
      if(pa.cut||missing.length){const n=el("p","note",`The answer got cut off${missing.length?` before ${missing.map(i=>BY[i].short).join(", ")}`:""}. Ask again with fewer thinkers checked to see ${missing.length?"the rest":"everything"}.`);n.style.margin="0 0 10px";bot.insertBefore(n,bot.querySelector(".matrix"))}}
    else if(final.trim().startsWith("{")){bot.replaceChildren(el("p","err",stop==="max_tokens"?"The answer ran too long and got cut off. Try again with fewer thinkers checked.":"The answer came back in a broken format. Try asking again."))}
    else{bot.innerHTML=md(final);bot.querySelectorAll("strong").forEach(st=>{const f=findTerm(st.textContent,ids);if(f){const b=el("button","term");b.type="button";b.dataset.tid=f.id;b.dataset.tk=f.k;b.textContent=st.textContent;st.replaceWith(b)}})}
    const tools=document.createElement("div");tools.className="tools";
    const cp=document.createElement("button");cp.className="btn ghost";cp.textContent="Copy";
    cp.onclick=async()=>{try{await navigator.clipboard.writeText(copyText);cp.textContent="Copied"}catch(e){cp.textContent="Copy failed"}setTimeout(()=>cp.textContent="Copy",1500)};
    tools.append(cp);bot.append(tools);
  }catch(e){
    bot.innerHTML="";const p=document.createElement("p");p.className="err";p.textContent=e.name==="AbortError"?"Stopped.":(e.message==="Failed to fetch"?"Couldn't reach Anthropic's API. Check your internet connection.":e.message);bot.append(p);
  }finally{busy=false;send.disabled=false;scroll();input.focus()}
}
send.onclick=ask;
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask()}});
function autosize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,200)+"px"}
input.addEventListener("input",autosize);
document.getElementById("newChat").onclick=e=>{e.stopPropagation();closePops();if(busy)ctl?.abort();history=[];renderEmpty();input.focus()};

thread.addEventListener("scroll",()=>{if(tipEl)hideTip()},{passive:true});
addEventListener("resize",hideTip);
renderThinkers();keyState();renderEmpty();
</script>
</body>
